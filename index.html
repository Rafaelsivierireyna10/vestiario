<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b14"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Vestiário">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230B6B45%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2216%22 fill=%22%23fff%22/%3E%3Cpath d=%22M32 20l8 6-3 10H27l-3-10z%22 fill=%22%230f1b14%22/%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<title>Vestiário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --ground:#E9EDE8; --surface:#FFFFFF; --surface2:#F2F6F1; --raise:#FFFFFF;
  --ink:#0E1712; --ink2:#33443B; --muted:#63736A; --line:#D2DAD2; --line2:#E3E9E2;
  --pitch:#0B6B45; --pitch-soft:#DCEDE3; --led:#C77A05; --led-soft:#FBEDD3;
  --ok:#15803D; --warn:#B45309; --danger:#B3261E; --danger-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(14,23,18,.07), 0 6px 20px -12px rgba(14,23,18,.28);
  --board:#0B1410; --board-ink:#FFC233; --board-dim:#6A7A6E;
  --acc:#0B6B45; --acc-soft:#DCEDE3; --acc-ink:#FFFFFF;
  --clube1:#0B6B45; --clube2:#FFFFFF;
  --r:12px; --r-sm:8px;
  --fx:'Barlow Condensed',"Arial Narrow",system-ui,sans-serif;
  --fb:'Barlow',system-ui,-apple-system,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#08100C; --surface:#111A15; --surface2:#16211B; --raise:#1A261F;
    --ink:#E7EEE8; --ink2:#B9C7BE; --muted:#87988D; --line:#22322A; --line2:#1B2822;
    --pitch:#35B478; --pitch-soft:#123024; --led:#FFC233; --led-soft:#2E2308;
    --ok:#43BE7B; --warn:#E0A02E; --danger:#F0685C; --danger-soft:#341613;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.8);
    --acc:#35B478; --acc-soft:#123024;
  }
}
:root[data-theme="dark"]{
  --acc:#35B478; --acc-soft:#123024;
  --ground:#08100C; --surface:#111A15; --surface2:#16211B; --raise:#1A261F;
  --ink:#E7EEE8; --ink2:#B9C7BE; --muted:#87988D; --line:#22322A; --line2:#1B2822;
  --pitch:#35B478; --pitch-soft:#123024; --led:#FFC233; --led-soft:#2E2308;
  --ok:#43BE7B; --warn:#E0A02E; --danger:#F0685C; --danger-soft:#341613;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--fb);
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4{margin:0;font-family:var(--fx);font-weight:700;line-height:1.1;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--ground);
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 0 0 1px var(--line2);}
.scr{flex:1;padding:12px 14px 96px;display:none;flex-direction:column;gap:14px}
.scr.on{display:flex}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  padding:10px 14px;}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:linear-gradient(90deg,var(--clube1) 0 50%,var(--clube2) 50% 100%)}
.crest{width:30px;height:30px;border-radius:7px;flex:none;display:grid;place-items:center;
  font-family:var(--fx);font-weight:700;font-size:13px;letter-spacing:.02em;color:#fff}
.top-mid{min-width:0;flex:1}
.top-club{font-family:var(--fx);font-weight:700;font-size:17px;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.top-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-cash{font-family:var(--fm);font-size:12.5px;font-weight:500;text-align:right;flex:none;
  font-variant-numeric:tabular-nums}
.top-cash small{display:block;font-family:var(--fb);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:600}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;gap:3px;
  background:var(--surface);border-top:2px solid var(--acc);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  max-width:560px;margin:0 auto;box-shadow:0 -6px 18px -12px rgba(0,0,0,.5)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
  padding:7px 2px 5px;border-radius:11px;color:var(--ink2);min-height:52px;justify-content:center}
.nav button svg{width:21px;height:21px;stroke-width:1.8}
.nav button span{font-family:var(--fx);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.nav button[aria-current="true"]{color:var(--acc-ink);background:var(--acc);
  box-shadow:0 4px 12px -4px var(--acc)}
.nav button[aria-current="true"] svg{stroke-width:2.4}
.nav button[aria-current="true"] span{font-weight:700}
.dotk{display:none}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card.flat{background:var(--surface2);border-color:var(--line2)}
.eyebrow{font-family:var(--fx);font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.chalk{border:0;border-top:1px dashed var(--line);margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.sm{font-size:12.5px}
.xs{font-size:11px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 15px;border-radius:10px;background:var(--surface2);
  border:1px solid var(--line);font-family:var(--fx);font-weight:600;font-size:15px;
  letter-spacing:.04em;text-transform:uppercase;min-height:44px;}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);
  box-shadow:0 3px 0 0 rgba(0,0,0,.18)}
.btn.pri:active{box-shadow:0 1px 0 0 rgba(0,0,0,.18)}
.btn.led{background:var(--led);border-color:var(--led);color:#1A1204}
.btn.wide{width:100%}
.btn.sm{padding:7px 11px;min-height:34px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.ghost{background:transparent}

.seg{display:flex;background:var(--surface2);border:1px solid var(--line);
  border-radius:10px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:8px 7px;border-radius:7px;
  font-family:var(--fx);font-weight:600;font-size:13px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);
  border-bottom:2px solid var(--acc)}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;
  font-family:var(--fx);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.pill.g{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.pill.a{background:var(--led-soft);border-color:transparent;color:var(--led)}
.pill.r{background:var(--danger-soft);border-color:transparent;color:var(--danger)}

/* position tag */
.pos{font-family:var(--fx);font-size:10.5px;font-weight:700;letter-spacing:.06em;
  width:32px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none;color:#fff}
.pos.GOL{background:#9A6B00}.pos.ZAG{background:#1F5FA8}.pos.LAT{background:#2E7FBE}
.pos.VOL{background:#1E7A5A}.pos.MEI{background:#2C9A6E}.pos.PON{background:#8B5CC7}
.pos.ATA{background:#C0392B}

/* meters */
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:1;min-width:26px}
.meter i{display:block;height:100%;border-radius:2px;background:var(--pitch)}
.meter.low i{background:var(--danger)}
.meter.mid i{background:var(--warn)}

/* player row */
.plr{display:flex;align-items:center;gap:9px;padding:9px 4px;width:100%;text-align:left;
  border-bottom:1px solid var(--line2)}
.plr:last-child{border-bottom:0}
.plr-n{flex:1;min-width:0}
.plr-n b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plr-n span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovr{font-family:var(--fm);font-weight:600;font-size:15px;width:26px;text-align:right;flex:none}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--fx);font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 3px;
  border-bottom:1px solid var(--line)}
.tbl th:nth-child(2){text-align:left}
.tbl td{padding:7px 3px;text-align:right;border-bottom:1px solid var(--line2);
  font-family:var(--fm);font-variant-numeric:tabular-nums;font-size:12.5px}
.tbl td:nth-child(2){text-align:left;font-family:var(--fb);font-size:13.5px}
.tbl tr.me td{background:var(--acc-soft)}
.tbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.tbl tr.me td:nth-child(2){font-weight:700}
.zn{display:inline-block;width:3px;height:15px;border-radius:2px;margin-right:6px;
  vertical-align:-3px;background:transparent}
.zn.lib{background:var(--pitch)}.zn.sul{background:#2E7FBE}.zn.reb{background:var(--danger)}
.tbl-wrap{overflow-x:auto}

/* scoreboard (committed dark component, both themes) */
.board{background:var(--board);border-radius:var(--r);padding:12px 14px;position:relative;
  overflow:hidden;border:1px solid #1D2A22}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.board::before{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;
  background:
   radial-gradient(28px 14px at 14% 100%, rgba(255,194,51,.14), transparent 70%),
   radial-gradient(28px 14px at 50% 100%, rgba(255,194,51,.10), transparent 70%),
   radial-gradient(28px 14px at 86% 100%, rgba(255,194,51,.14), transparent 70%)}
.board-row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.board-team{flex:1;min-width:0;font-family:var(--fx);font-weight:700;font-size:14.5px;
  letter-spacing:.02em;text-transform:uppercase;color:#DCE6DE;line-height:1.06;
  overflow-wrap:normal;word-break:normal;hyphens:none;max-height:2.2em;overflow:hidden}
.board-team.r{text-align:right}
.board-score{font-family:var(--fm);font-weight:600;font-size:30px;color:var(--board-ink);
  letter-spacing:.04em;flex:none;font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px rgba(255,194,51,.35)}
.board-clock{position:relative;z-index:1;text-align:center;font-family:var(--fm);font-size:12px;
  color:var(--board-dim);letter-spacing:.1em;margin-top:5px}

/* match screen */
#match{position:fixed;inset:0;z-index:60;background:var(--ground);display:none;
  flex-direction:column;max-width:560px;margin:0 auto}
#match.on{display:flex}
.m-top{padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.m-feed{flex:1;overflow-y:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:0}
.ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line2);
  animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ev-min{font-family:var(--fm);font-size:12px;color:var(--muted);width:34px;flex:none;
  font-variant-numeric:tabular-nums;padding-top:1px}
.ev-tx{flex:1;font-size:13.5px;min-width:0}
.ev.goal .ev-tx{font-weight:600}
.ev.goal{background:var(--pitch-soft);margin:2px -8px;padding:8px;border-radius:8px;border-bottom:0;
  box-shadow:inset 3px 0 0 var(--pitch)}
.ev.goal.rival{background:var(--danger-soft);box-shadow:inset 3px 0 0 var(--danger)}
.ev.big .ev-tx{font-family:var(--fx);font-size:17px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.ev.card-y{border-left:3px solid #E0A02E;padding-left:8px;margin-left:-8px}
.ev.card-r{border-left:3px solid var(--danger);padding-left:8px;margin-left:-8px}
.ev.sys .ev-tx{color:var(--muted);font-size:12.5px;font-style:italic}
.m-bar{padding:9px 12px calc(9px + env(safe-area-inset-bottom,0px));background:var(--surface);
  border-top:1px solid var(--line);display:flex;gap:7px;align-items:center}
.m-bar .btn{flex:1;padding:10px 8px;font-size:13px}

/* modal */
.sheet{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;
  background:rgba(6,14,10,.55);backdrop-filter:blur(2px)}
.sheet.on{display:flex}
.sheet-in{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow-y:auto;
  border-top:1px solid var(--line);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.sheet-h h3{font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.x{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
  background:var(--surface2);font-size:19px;color:var(--muted);flex:none}

/* pitch view */
.pitch{position:relative;background:
   linear-gradient(180deg,#0d5c3c,#0a4a30);
  border-radius:var(--r);aspect-ratio:3/4;padding:8px;overflow:hidden;border:1px solid #0a3d28}
.pitch::before{content:"";position:absolute;inset:8px;border:1.5px solid rgba(255,255,255,.26);border-radius:4px}
.pitch::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:0;
  border-top:1.5px solid rgba(255,255,255,.26)}
.pitch .circ{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);
  border:1.5px solid rgba(255,255,255,.26);border-radius:50%}
.spot{position:absolute;transform:translate(-50%,-50%);width:66px;text-align:center;z-index:2}
.spot b{display:block;width:34px;height:34px;margin:0 auto 3px;border-radius:50%;
  background:rgba(255,255,255,.94);color:#0a3d28;font-family:var(--fm);font-weight:600;
  font-size:13px;line-height:34px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.spot.warn .camisa{filter:drop-shadow(0 0 3px #FFD98A) drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.spot.bad .camisa{filter:drop-shadow(0 0 3px #F3A79E) drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.spot span{display:block;font-size:10.5px;color:#fff;font-weight:600;line-height:1.15;
  text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot.warn b{background:#FFD98A}
.spot.bad b{background:#F3A79E}

/* inputs */
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface2);font-size:15px;min-height:44px}
label.fld{display:flex;flex-direction:column;gap:5px}
label.fld>span{font-family:var(--fx);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.check{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line2)}
.check input{width:20px;height:20px;flex:none;accent-color:var(--pitch)}

/* estádio da tela inicial */
.hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  margin:0 0 4px;background:#0A1420}
.estadio{display:block;width:100%;height:250px}
.hero-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:16px;background:linear-gradient(180deg,rgba(8,16,26,0) 26%,rgba(6,12,18,.55) 58%,rgba(5,10,15,.93) 100%)}
.hero-in .eyebrow{color:#A9BEB2;letter-spacing:.16em}
.hero-in h1{font-size:42px;letter-spacing:-.005em;color:#fff;text-transform:uppercase;
  text-shadow:0 3px 18px rgba(0,0,0,.75);margin:1px 0 5px;line-height:.95}
.hero-in p{color:#CBD8D0;font-size:12.5px;max-width:34ch;line-height:1.35}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--line);font-size:11px;color:var(--ink2)}
.chip b{font-family:var(--fm);font-weight:600;color:var(--acc)}

/* sala de troféus */
.trofeus{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.trof{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:10px 8px;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.trof b{font-family:var(--fx);font-size:12px;font-weight:700;line-height:1.1;text-transform:uppercase}
.trof span{font-family:var(--fm);font-size:10.5px;color:var(--muted)}

/* faixa colorida por competição */
.compcard{border-left:4px solid var(--cc,var(--acc));padding-left:9px}

/* comemoração de gol e clube na tabela */
.board.gol{animation:golf .9s ease-out}
@keyframes golf{0%{box-shadow:0 0 0 0 rgba(255,194,51,.7)}100%{box-shadow:0 0 0 22px rgba(255,194,51,0)}}
.tb-cl{display:inline-flex;align-items:center;gap:6px}
.tbl .jgo-c{width:8px;height:15px;flex:none}
.jgo-t{display:flex;align-items:center;gap:5px}
.jgo-t.r{justify-content:flex-end}

/* escudos, camisas e cards */
.escudo{flex:none;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.camisa{display:block;margin:0 auto 1px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.pcard{display:flex;gap:12px;border-radius:14px;padding:12px;margin-bottom:12px;
  background:linear-gradient(135deg,var(--c1),var(--c2));border:1px solid var(--line);
  --c1:var(--surface2);--c2:var(--surface)}
.pcard.ouro{--c1:#F3D98B;--c2:#C79A2E;color:#2A1E05}
.pcard.prata{--c1:#DFE4E6;--c2:#A8B2B8;color:#1A2124}
.pcard.bronze{--c1:#E3C4A4;--c2:#B07E4E;color:#2A1B0C}
.pcard-l{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:56px}
.pcard-ovr{font-size:30px;font-weight:600;line-height:1}
.pcard-pos{width:38px;height:19px;font-size:10px}
.pcard-r{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px}

function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return (h>>>0);}

function rng(seed){let a=typeof seed==='number'?seed>>>0:hashStr(String(seed));
  return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

  const pos = posForce || pick(ELENCO_BASE);

  let base = 50 + clubRep*3.7;                     // 53.7 .. 68.5

  if(idade<21) ovr = clamp(ovr - ri(3,9), 36, 78);
  if(idade>33) ovr = clamp(ovr - ri(0,4), 36, 88);
  const pot = clamp(ovr + (idade<24 ? ri(3,16) : idade<28 ? ri(0,5) : 0), ovr, 92);

function gerarElenco(clubRep){

function gerarCalendario(ids){
  const t = ids.slice();
  if(t.length%2) t.push(null);
  const n = t.length, rodadas = [];
  let arr = t.slice();
  for(let r=0;r<n-1;r++){
    const jogos=[];
    for(let i=0;i<n/2;i++){
      const a=arr[i], b=arr[n-1-i];
      if(a===null||b===null) continue;
      jogos.push(r%2===0?{h:a,a:b}:{h:b,a:a});
    }
    rodadas.push(jogos);
    arr = [arr[0]].concat([arr[n-1]], arr.slice(1,n-1));
  }
  const returno = rodadas.map(j=>j.map(g=>({h:g.a,a:g.h})));
  return rodadas.concat(returno);
}

function _clubesDaLiga(k){
  const L2=LIGAS_EUROPA[k];
  return L2.tab.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split('|');
    return {id:p[0], n:p[1], s:p[2], c:p[3], uf:L2.pais, cor:p[4], cor2:p[5],
            niv:parseInt(p[6],10), est:parseInt(p[7],10), tor:parseInt(p[8],10),
            comp:'inter', liga:k};
  });
}

const EUROPEUS = Object.keys(LIGAS_EUROPA).reduce((a,k)=>a.concat(_clubesDaLiga(k)), []);

const LIGA_DO_CLUBE = {};
EUROPEUS.forEach(c=>{ LIGA_DO_CLUBE[c.id]=c.liga; });

function clubesDaLigaEuropeia(k){ return EUROPEUS.filter(c=>c.liga===k).map(c=>c.id); }

let _poolCache={};

function _pool(r, campo){
  const k=r+campo;
  if(!_poolCache[k]) _poolCache[k]=POOL_NOMES[r][campo].split(' ').filter(Boolean);
  return _poolCache[k];
}

function nomeRegional(uf){
  const r=REGIAO_UF[uf];
  if(!r) return nomeAleatorio();                 // clube brasileiro: banco daqui
  const n=_pool(r,'n'), s=_pool(r,'s');
  const x=rnd();
  if(r==='hi' && x<0.16) return pick(n)+' '+pick(s)+' '+pick(s);
  if(r==='pt' && x<0.12) return pick(n)+' '+pick(s)+' '+pick(s);
  return pick(n)+' '+pick(s);
}

function elencoGerado(clubId, niv, seed){
  const r0 = R.r; R.r = rng(seed+'-'+clubId);
  const c = (typeof CLUBE_POR_ID!=='undefined') ? CLUBE_POR_ID[clubId] : null;
  const uf = c ? c.uf : '';
  const usados = {};
  const arr = ELENCO_BASE.map(pos=>{
    const idade = clamp(Math.round(gauss(25.8,4.3)),17,38);
    let ovr = clamp(Math.round(gauss(niv, 4.0)), 42, Math.min(90, niv+7));
    if(idade<21) ovr = clamp(ovr-ri(2,7), 42, 84);
    if(idade>34) ovr = clamp(ovr-ri(0,3), 42, 90);
    let nome = nomeRegional(uf); let g=0;
    while(usados[nome] && g++<12) nome = nomeRegional(uf);
    usados[nome]=1;
    const pot = clamp(ovr + (idade<20?ri(8,20):idade<22?ri(6,15):idade<25?ri(3,9):idade<28?ri(0,4):0), ovr, 91);
    return {id:'p'+(_pid++), nome, pos, idade, ovr, pot, ovrF:ovr,
      forma:ri(45,72), moral:ri(55,80), energia:100,
      salario:salarioDe(ovr,idade), valor:valorDeMercado(ovr,idade),
      contrato:ri(2,5), gols:0,assist:0,jogos:0,ca:0,cv:0,notaSoma:0,lesao:0,aVenda:false};
  });
  const d = pick(arr.filter(p=>p.pos!=='GOL'));
  if(d){ d.ovr = clamp(d.ovr+ri(3,7), 45, Math.min(90, niv+10)); d.ovrF=d.ovr; d.pot=Math.max(d.pot,d.ovr);

  R.r = r0;
  return arr;
}

function divisoesIniciais(){

const TABELA_REAL = {
  fla:[2.08, 1],  pal:[2.04, 2],  cap:[1.73, 3],  flu:[1.73, 4],  bah:[1.65, 5],
  cru:[1.62, 6],  cfc:[1.42, 7],  cam:[1.44, 8],  bra:[1.40, 9],  sao:[1.32,10],
  cor:[1.28,11],  san:[1.28,12],  bot:[1.24,13],  vit:[1.16,14],  gre:[1.17,15],
  mir:[1.08,16],  vas:[1.00,17],  int:[0.96,18],  rem:[0.88,19],  cha:[0.58,20]
};

function forcaAlvo(ppg){ return 68.5 + (ppg - 0.58) * 8.0; }

function calibrarPelaTabela(L2){
  if(!L2 || !L2.squads) return;
  L2._calib = L2._calib || {};
  Object.keys(TABELA_REAL).forEach(cid=>{
    if(L2._calib[cid]) return;
    const el = L2.squads[cid];
    if(!el || el.length < 11) return;
    L2._calib[cid] = 1;
    const [ppg, pos] = TABELA_REAL[cid];
    const ord = el.slice().sort((a,b)=>b.ovr-a.ovr);
    const atual = ord.slice(0,11).reduce((s,x)=>s+x.ovr,0)/11;
    const alvo = forcaAlvo(ppg);
    const ajuste = Math.round(clamp(alvo - atual, -3, 3));
    const c = L2.clubs.find(x=>x.id===cid);
    if(c){ c.niv = Math.round(alvo) - 1; c.posReal = pos; }
    if(!ajuste) return;
    el.forEach(p=>{
      p.ovr = clamp(p.ovr + ajuste, 40, 93);
      p.pot = clamp(Math.max(p.pot + ajuste, p.ovr), p.ovr, 93);
      p.ovrF = p.ovr;
      if(typeof valorDeMercado==='function') p.valor = valorDeMercado(p.ovr, p.idade);
      if(typeof salarioDe==='function')      p.salario = Math.max(30000, Math.round(salarioDe(p.ovr, p.idade)*((c&&c.escSal)||1)/1000)*1000);
    });
  });
}

function metaDiretoriaReal(c){
  // na Série B a cobrança é uma só: subir
  if(c && typeof divisaoDe==='function' && divisaoDe(c.id)==='B'){
    const meta = (c.niv||62)>=66 ? 2 : (c.niv||62)>=62 ? 4 : 8;
    return {meta, paciencia:100, avisos:0, serieB:true};
  }
  const pos = c && c.posReal;
  if(pos){
    const meta = pos<=2 ? 2 : pos<=6 ? Math.max(3, pos-2)
               : pos<=12 ? Math.max(6, pos-3) : Math.max(10, pos-4);
    return {meta: clamp(meta,1,17), paciencia:100, avisos:0};
  }
  const meta = c.niv>=78?3 : c.niv>=75?6 : c.niv>=73?10 : c.niv>=70?14 : 16;
  return {meta, paciencia:100, avisos:0};
}

function escalarAuto(elenco, formacao){
  const slots = FORMACOES[formacao] || FORMACOES['4-4-2'];
  const livres = elenco.filter(p=>p.lesao<=0).slice();
  const tit=[];
  slots.forEach(slot=>{
    let melhor=null, melhorV=-1;
    livres.forEach(p=>{
      if(tit.includes(p.id)) return;
      const v = p.ovr*fit(p.pos,slot)*(0.92+0.08*p.forma/100)*(0.74+0.26*clamp(p.energia,0,100)/100);
      if(v>melhorV){melhorV=v;melhor=p;}
    });
    if(melhor) tit.push(melhor.id);
  });
  const banco = livres.filter(p=>!tit.includes(p.id))
    .sort((a,b)=>b.ovr-a.ovr).slice(0,7).map(p=>p.id);
  return {titulares:tit, banco};
}

function forcasBase(S){
  let gk=0, def=[], mid=[], atk=[];
  S.emCampo.forEach(u=>{
    if(u.fora) return;
    const p=u.p, f=fit(p.pos,u.slot);
    const eff = p.ovr*f*(.70+.30*clamp(u.energia,0,100)/100)*(.92+.16*p.forma/100)*(.94+.12*p.moral/100);
    if(u.slot==='GOL') gk=eff;
    else if(u.slot==='ZAG'||u.slot==='LAT') def.push(eff);
    else if(u.slot==='ATA') atk.push(eff);
    else mid.push(eff);
  });
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:48;
  const m=MENT[S.tac.mentalidade]||MENT.equilibrado;
  const pr=PRESS[S.tac.pressao]||PRESS.media;
  const es=ESTILO[S.tac.estilo]||ESTILO.lados;
  const nCampo = S.emCampo.filter(u=>!u.fora).length;
  const penalN = nCampo>=11?1:0.90+0.10*(nCampo-10);   // 10 homens ≈ -10%
  let D = (gk?gk*.30:14) + avg(def)*.70;
  let M = avg(mid), A = avg(atk)*.78 + avg(mid)*.22;
  // formações densas no meio
  const slots=FORMACOES[S.tac.formacao]||[];
  const nMid = slots.filter(s=>s==='VOL'||s==='MEI'||s==='PON').length;
  M *= (0.94 + 0.02*nMid);
  const nDef = slots.filter(s=>s==='ZAG'||s==='LAT').length;
  D *= (0.95 + 0.0165*nDef*2);
  return {
    def: D*m.def*pr.def*penalN,
    mid: M*m.mid*pr.mid*es.mid*penalN,
    atk: A*m.atk*penalN,
    shot: es.shot, conv: es.conv, dre:m.dre*pr.dre, falta:pr.falta, risco:m.risco
  };
}

function criarPartida(L, h, a, liveSide){
  const M = {

    hg:0, ag:0, eventos:[], liveSide: liveSide||null,
    publico: 0, historia:[]
  };
  const hc=M.h.clube;
  M.publico = Math.round(clamp(hc.estadio*(0.35+0.09*hc.rep+rnd()*0.25),3000,hc.estadio));
  M.h.ao_vivo = liveSide==='h'; M.a.ao_vivo = liveSide==='a';

function ev(M, t, side, txt, cls){
  const e={min:M.min>K.DUR?K.DUR:M.min, add:M.min>K.DUR?M.min-K.DUR:0, t, side, txt, cls:cls||''};
  M.eventos.push(e); return e;

function escolheAtacante(S){
  const cands = S.emCampo.filter(u=>!u.fora && u.slot!=='GOL');
  const peso = cands.map(u=>{
    const b = u.slot==='ATA'?10 : u.slot==='PON'?6 : u.slot==='MEI'?5.2 : u.slot==='VOL'?1.8 : 1;
    return b*Math.pow(u.p.ovr/62, 2.2);
  });
  const tot=peso.reduce((a,b)=>a+b,0); let r=rnd()*tot;
  for(let i=0;i<cands.length;i++){ r-=peso[i]; if(r<=0) return cands[i]; }
  return cands[cands.length-1];
}

function escolheAssist(S, exceto){
  const cands=S.emCampo.filter(u=>!u.fora&&u.slot!=='GOL'&&u!==exceto);
  if(!cands.length||rnd()<.25) return null;
  const peso=cands.map(u=>u.slot==='MEI'?7:u.slot==='PON'?7:u.slot==='ATA'?4:u.slot==='LAT'?3:1.5);
  const tot=peso.reduce((a,b)=>a+b,0); let r=rnd()*tot;
  for(let i=0;i<cands.length;i++){ r-=peso[i]; if(r<=0) return cands[i]; }
  return null;
}

function marcarGol(M, S, O, u, tipo){
  S.gols++; if(S===M.h) M.hg++; else M.ag++;
  u.p.gols++; u.gols++; u.nota+=1.1;
  let ass=null;
  if(tipo!=='penalti'){ ass=escolheAssist(S,u); if(ass){ass.p.assist++;ass.assist++;ass.nota+=.5;} }
  const txt = tipo==='penalti' ? `GOL! ${nome(u)} converte o pênalti.`
            : tipo==='falta'   ? `GOL! ${nome(u)} na cobrança de falta, no ângulo!`
            : `GOL! ${pick(F_GOL).replace('{A}',nome(u))}` + (ass?` Assistência de ${nome(ass)}.`:'');
  const _e=ev(M,'gol',S===M.h?'h':'a', txt, 'goal');
  _e.i=u.idx; _e.ia=ass?ass.idx:null; _e.q=nome(u); _e.tipo=tipo;

function cobrarPenalti(M, S, O, batedor){
  const gk=goleiro(O);
  const chance = clamp(.78 + (batedor.p.ovr-60)*.004 - (gk?(gk.p.ovr-60)*.003:0), .55, .93);
  if(rnd()<chance) marcarGol(M,S,O,batedor,'penalti');
  else { const _e=ev(M,'defesa',S===M.h?'h':'a', `${gk?nome(gk):'O goleiro'} defende o pênalti de ${nome(batedor)}!`,'');
         _e.i=batedor.idx; _e.q=gk?nome(gk):'';
         batedor.nota-=.8; if(gk) gk.nota+=1; }
}

function aplicaCartao(M, S, u, vermelho){
  if(vermelho || u.ca>=1){
    u.cv=1; u.fora=true; u.p.cv++; u.nota-=1.6;
    const _ec=ev(M,'cv',S===M.h?'h':'a', `VERMELHO! ${nome(u)} está expulso. ${S.clube.sigla} fica com ${S.emCampo.filter(x=>!x.fora).length} em campo.`,'card-r');
  } else {
    u.ca=1; u.p.ca++; u.nota-=.35;
    const _ea=ev(M,'ca',S===M.h?'h':'a', `Amarelo para ${nome(u)}.`,'card-y'); _ea.i=u.idx; _ea.q=nome(u);
  }
}


/* ---------- Momentos do jogo: duas decisões que mudam a partida ----------
   O técnico deixa as duas escolhas armadas (uma por situação: perdendo,
   empatando, ganhando). Na liga online a partida roda igual em todo celular,
   então o plano é o que vale. Na carreira, se você estiver assistindo,
   o jogo pausa e pergunta — com o plano já selecionado. */
const ACOES_MOMENTO = {
  manter:   {n:'Manter o plano',       d:'Nada muda. O time segue como está.'},
  pressao:  {n:'Subir a marcação',     d:'Pressão alta: rouba mais bola e cria mais, mas cansa e dá falta.'},
  recuar:   {n:'Recuar as linhas',     d:'Pressão baixa e time cauteloso: sofre menos, cria menos.'},
  curto:    {n:'Segurar a bola',       d:'Toque curto: menos finalizações, mas de melhor qualidade.'},
  direto:   {n:'Jogo direto',          d:'Bola pra frente: muito mais chute, menos capricho.'},
  lados:    {n:'Abrir pelos lados',    d:'Jogo pelas pontas, equilíbrio entre volume e qualidade.'},
  ofensivo: {n:'Adiantar o time',      d:'Mentalidade ofensiva: mais ataque, mais espaço atrás.'},
  total:    {n:'Tudo pra frente',      d:'Time todo no ataque. Ou empata, ou toma o terceiro.'},
  segurar:  {n:'Fechar o jogo',        d:'Retranca: segura o resultado e aceita o sufoco.'},
  atacante: {n:'Botar mais um atacante', d:'Entra o melhor atacante do banco no lugar do mais cansado da defesa.'},
  zagueiro: {n:'Botar mais um zagueiro', d:'Entra um defensor no lugar de um homem de frente.'}
};

function momentosPadrao(){
  return [
    {min:30, perdendo:'pressao', empatando:'manter',  ganhando:'manter'},
    {min:70, perdendo:'ofensivo',empatando:'atacante',ganhando:'segurar'}
  ];
}

function situacaoDe(M,S){
  const meu = S===M.h?M.hg:M.ag, dele = S===M.h?M.ag:M.hg;
  return meu<dele ? 'perdendo' : meu>dele ? 'ganhando' : 'empatando';
}

function acaoDoMomento(M,S,k){
  const ms=(S.instr&&S.instr.momentos)||momentosPadrao();
  const m=ms[k]||momentosPadrao()[k];
  return m[situacaoDe(M,S)]||'manter';
}

function entraDoBanco(S, posQuer){
  const ordem = posQuer==='ATA' ? ['ATA','PON','MEI'] : ['ZAG','LAT','VOL'];
  for(const pos of ordem){
    const c=S.banco.filter(p=>p.pos===pos&&p.lesao<=0).sort((a,b)=>b.ovr-a.ovr||(a.id<b.id?-1:1))[0];
    if(c) return c;
  }
  return null;
}

function saiDoCampo(S, defensivo){
  const grupos = defensivo ? ['VOL','ZAG','LAT'] : ['ATA','PON','MEI'];
  const cands=S.emCampo.filter(u=>!u.fora&&u.slot!=='GOL'&&grupos.includes(u.slot));
  if(!cands.length) return null;
  return cands.slice().sort((a,b)=>a.energia-b.energia||(a.p.id<b.p.id?-1:1))[0];
}

function aplicarAcaoMomento(M,S,acao){
  const sig = S===M.h?'h':'a';
  const sg = S.clube.sigla;
  if(!acao||acao==='manter') return null;
  if(acao==='pressao'){ S.tac.pressao='alta'; return `${sg} sobe a marcação e aperta no campo do adversário.`; }
  if(acao==='recuar'){ S.tac.pressao='baixa'; S.tac.mentalidade='cauteloso'; return `${sg} recua as linhas e fecha os espaços.`; }
  if(acao==='curto'){ S.tac.estilo='curto'; return `${sg} passa a segurar a bola e trocar passes.`; }
  if(acao==='direto'){ S.tac.estilo='direto'; return `${sg} parte pro jogo direto, bola na frente.`; }
  if(acao==='lados'){ S.tac.estilo='lados'; return `${sg} abre o jogo pelos lados.`; }
  if(acao==='ofensivo'){ S.tac.mentalidade='ofensivo'; return `${sg} adianta o time no campo de ataque.`; }
  if(acao==='total'){ S.tac.mentalidade='total'; return `${sg} joga tudo pra frente.`; }
  if(acao==='segurar'){ S.tac.mentalidade='retranca'; return `${sg} fecha o jogo pra segurar o resultado.`; }
  if(acao==='atacante'||acao==='zagueiro'){
    if(S.subs>=MAX_SUBS) return null;
    const entra=entraDoBanco(S, acao==='atacante'?'ATA':'ZAG');
    const sai=saiDoCampo(S, acao==='atacante');
    if(!entra||!sai) return null;
    const nomeSai=sai.p.nome, nomeEntra=entra.nome;
    fazerSub(M,S,sai,entra);
    return acao==='atacante'
      ? `${sg} vai com mais um atacante: ${nomeEntra} no lugar de ${nomeSai}.`
      : `${sg} reforça a defesa: ${nomeEntra} entra no lugar de ${nomeSai}.`;
  }
  return null;
}

/* A força do time muda devagar dentro do jogo: recalcular a cada minuto é o
   que mais custa numa semana com 70 partidas. Recalculamos a cada 5 minutos e
   sempre que algo muda de verdade (troca, cartão, mudança de postura). */
function invalidarForcas(S){ if(S) S._fCache=null; }

function forcasCache(M, S){
  const t=S.tac||{};
  const marca = (S.subs||0)+'|'+t.mentalidade+'|'+t.pressao+'|'+t.estilo+'|'+
                S.emCampo.reduce((n,u)=>n+(u.fora?1:0),0);
  if(S._fCache && S._fMarca===marca && (M.min - S._fMin) < 5) return S._fCache;
  S._fCache = forcas(S); S._fMarca = marca; S._fMin = M.min;
  return S._fCache;
}

function aplicaMomentos(M,S,O){
  const ms=(S.instr&&S.instr.momentos)||momentosPadrao();
  for(let k=0;k<2;k++){
    const m=ms[k]||momentosPadrao()[k];
    if(S.jaAplicou['m'+k]) continue;
    if(M.min < (m.min||(k?70:30))) continue;
    S.jaAplicou['m'+k]=1;
    if(S.ao_vivo && M.liveSide){ M.pausa={tipo:'momento', side:S===M.h?'h':'a', k}; return; }
    const txt=aplicarAcaoMomento(M,S,acaoDoMomento(M,S,k));
    if(txt) ev(M,'sys',S===M.h?'h':'a','Banco: '+txt,'sys');
  }
}

function aplicaInstrucoes(M, S, O){
  const i=S.instr; if(!i) return;
  const meu = S===M.h?M.hg:M.ag, dele = S===M.h?M.ag:M.hg;
  if(i.perdendo && i.perdendo.on && !S.jaAplicou.perdendo && M.min>=i.perdendo.min && meu<dele){
    S.tac.mentalidade=i.perdendo.ment; S.jaAplicou.perdendo=1;
    ev(M,'sys',S===M.h?'h':'a',`${S.clube.sigla} muda para ${MENT[i.perdendo.ment].n.toLowerCase()} atrás do resultado.`,'sys');
  }
  if(i.ganhando && i.ganhando.on && !S.jaAplicou.ganhando && M.min>=i.ganhando.min && meu>dele){
    S.tac.mentalidade=i.ganhando.ment; S.jaAplicou.ganhando=1;
    ev(M,'sys',S===M.h?'h':'a',`${S.clube.sigla} recua para segurar o resultado.`,'sys');
  }
  (i.subs||[]).forEach((r,k)=>{
    if(!r.on || S.jaAplicou['s'+k] || S.subs>=MAX_SUBS || M.min<46) return;
    let disparo=false;
    if(r.quando==='minuto') disparo = M.min>=r.valor;
    else if(r.quando==='energia') disparo = S.emCampo.some(u=>!u.fora&&u.slot!=='GOL'&&u.energia<r.valor);
    else if(r.quando==='perdendo') disparo = M.min>=r.valor && meu<dele;
    if(!disparo) return;
    const entra = r.entra ? S.banco.find(p=>p.id===r.entra) : melhorReserva(S);
    if(!entra) { S.jaAplicou['s'+k]=1; return; }
    const sai = maisCansado(S, entra.pos);
    if(!sai) { S.jaAplicou['s'+k]=1; return; }
    fazerSub(M,S,sai,entra); S.jaAplicou['s'+k]=1;
  });
}

function melhorReserva(S){ return S.banco.slice().sort((a,b)=>b.ovr-a.ovr)[0]||null; }

function maisCansado(S, posEntra){
  const cands=S.emCampo.filter(u=>!u.fora&&u.slot!=='GOL');
  if(!cands.length) return null;
  const scored=cands.map(u=>({u, v:u.energia - (posEntra&&fit(posEntra,u.slot)>=.9?12:0)}));
  scored.sort((a,b)=>a.v-b.v); return scored[0].u;
}

function fazerSub(M,S,sai,entra){
  if(S.subs>=MAX_SUBS) return false;
  const idx=S.emCampo.indexOf(sai); if(idx<0) return false;
  S.banco = S.banco.filter(p=>p.id!==entra.id);
  S.emCampo[idx] = {id:entra.id,p:entra,slot:sai.slot,idx:sai.idx,energia:entra.energia,ca:0,cv:0,nota:6,gols:0,assist:0,fora:false};
  sai.fora=true; sai.substituido=true; S.subs++;
  (S.sairam=S.sairam||[]).push(sai);
  S.emCampo[idx].entrouMin = M.min; S.emCampo[idx].energiaInicio = entra.energia;
  (S.subsLog=S.subsLog||[]).push({min:M.min, sai:nome(sai), slot:sai.slot, nota:sai.nota, entra:entra.nome,
    gols:sai.gols||0, assist:sai.assist||0, ca:sai.ca||0, cv:sai.cv||0});
  const _es=ev(M,'sub',S===M.h?'h':'a',`Substituição no ${S.clube.nome}: sai ${nome(sai)}, entra ${entra.nome}.`,'sys'); _es.i=sai.idx; _es.q=entra.nome;
  return true;
}

function passoMinuto(M){
  M.min++;
  const H=M.h, A=M.a;
  if(!H.ao_vivo) aplicaInstrucoes(M,H,A);
  if(!A.ao_vivo) aplicaInstrucoes(M,A,H);

  aplicaMomentos(M,H,A);
  if(!M.pausa) aplicaMomentos(M,A,H);
  if(M.pausa) { M.min--; return; }

  const fh=forcasCache(M,H), fa=forcasCache(M,A);
  const mH=fh.mid*K.HOME, aH=fh.atk*K.HOME, dH=fh.def*(1+(K.HOME-1)*.5);
  const pH = Math.pow(mH,1.35)/(Math.pow(mH,1.35)+Math.pow(fa.mid,1.35));
  H.posse+=pH; A.posse+=(1-pH);

  // desgaste: a barra do jogo (rende menos no fim) e o custo que fica para a semana seguinte
  const drenoH=.42*fh.dre, drenoA=.42*fa.dre;
  const desg=(S,dreno)=>S.emCampo.forEach(u=>{ if(u.fora) return;
    const f=fatorDesgaste(u.p, u.slot)*(.85+rnd()*.3);
    u.energia=clamp(u.energia-dreno*f,0,100);
    u.gasto=(u.gasto||0)+ (CUSTO_JOGO/90)*f*dreno/.42;
  });
  desg(H,drenoH); desg(A,drenoA);

  const lado=(S,O,f,fo,poss,atkV,defO)=>{
    const sig = S===M.h?'h':'a';
    // falta / cartão
    if(rnd() < K.FOUL*fo.falta){
      const alvo=pick(O.emCampo.filter(u=>!u.fora))||null;
      S.faltas++;
      if(alvo && rnd()<.20) aplicaCartao(M,O,alvo,rnd()<.014);
      // falta perigosa
      if(rnd()<.10){
        const bat=(typeof batedorFalta==='function') ? batedorFalta(S) : escolheAtacante(S);
        const ch=(typeof chanceFalta==='function') ? chanceFalta(bat) : .09;
        if(bat && rnd()<ch){ marcarGol(M,S,O,bat,'falta'); return; }
      }
    }
    // lesão
    if(rnd()<.0012){
      const u=pick(S.emCampo.filter(x=>!x.fora&&x.slot!=='GOL'));
      if(u){ const sem=ri(1,6); u.p.lesao=sem; u.lesionado=true;
        ev(M,'lesao',sig,`${nome(u)} sentiu e pede substituição. Deve ficar fora por ${sem} ${sem===1?'semana':'semanas'}.`,'sys');
        const e=melhorReserva(S); if(e&&S.subs<3) fazerSub(M,S,u,e); else {u.fora=true;}
      }
    }
    // chance
    // a diferença entre os times conta, mas satura: gigante x pequeno não vira 12x0
    const razao = clamp(atkV/defO, 0.70, 1.44);
    // goleada encaminhada: quem está ganhando tira o pé, quem perde se joga
    const dif = (S===M.h ? M.hg-M.ag : M.ag-M.hg);
    let ritmo = dif>=4 ? 0.42 : dif>=3 ? 0.58 : dif>=2 ? 0.82
              : dif<=-3 ? 1.18 : dif<=-2 ? 1.10 : 1;
    // reta final apertada: quem perde por um se joga, quem ganha por um se fecha
    if(M.min>=70){
      if(dif===-1) ritmo *= 1.22;
      else if(dif===1) ritmo *= 0.86;
    }
    const pChute = clamp(K.SHOT*poss*Math.pow(razao,K.EXP_S)*f.shot*ritmo, 0, 0.42);
    if(rnd()<pChute){
      S.chutes++;
      const atac=escolheAtacante(S);
      if(!atac) return;
      // pênalti?
      if(rnd()<K.PEN){
        { const _e=ev(M,'penalti',sig,`PÊNALTI para o ${S.clube.nome}! ${nome(atac)} foi derrubado na área.`,'big'); _e.i=atac.idx; _e.q=nome(atac); }
        if(S.ao_vivo){ M.pausa={tipo:'penalti', side:sig}; return; }
        const bat = S.instr && S.instr.penalti ? (S.emCampo.find(u=>u.id===S.instr.penalti&&!u.fora)||atac) : atac;
        cobrarPenalti(M,S,O,bat); return;
      }
      const pGol = clamp(K.CONV*Math.pow(razao,K.EXP_C)*f.conv, .03, .34);
      if(rnd()<pGol){ S.noAlvo++; marcarGol(M,S,O,atac,'jogada'); }
      else{
        const r=rnd();
        if(r<.42){ S.noAlvo++; const g=goleiro(O);
          { const _e=ev(M,'defesa',sig,pick(F_DEF).replace('{A}',nome(atac)).replace('{G}',g?nome(g):'o goleiro'),''); _e.i=atac.idx; _e.q=g?nome(g):''; }
          if(g) g.nota+=.12; }
        else if(r<.52){ const _e=ev(M,'trave',sig,pick(F_TRAVE).replace('{A}',nome(atac)),'big'); _e.i=atac.idx; _e.q=nome(atac); }
        else if(r<.72){ S.escanteios++; const _e=ev(M,'fora',sig,pick(F_FORA).replace('{A}',nome(atac)),''); _e.i=atac.idx; _e.q=nome(atac); }
        else { const _e=ev(M,'chance',sig,pick(F_CHANCE).replace('{A}',nome(atac))+' a defesa afasta.',''); _e.i=atac.idx; }
      }
    }
  };
  lado(H,A,fh,fh,pH,aH,fa.def);
  if(!M.pausa) lado(A,H,fa,fa,1-pH,fa.atk,dH);

  if(M.min===45 && M.half===1){
    M.half=1.5;
    ev(M,'apito',null,`Fim do primeiro tempo. ${M.h.clube.sigla} ${M.hg} x ${M.ag} ${M.a.clube.sigla}`,'big');
    // recuperação do intervalo
    [H,A].forEach(S=>S.emCampo.forEach(u=>{if(!u.fora)u.energia=clamp(u.energia+8,0,100);}));
    if(M.liveSide) M.pausa={tipo:'intervalo'};
  }
  if(M.min>=K.DUR && !M.extraSorteado){ M.extraSorteado=true; M.extra=ri(1,5); M.dur=K.DUR+M.extra;
    ev(M,'sys',null,`${M.extra} minutos de acréscimo.`,'sys'); }
  if(M.min>=M.dur){ M.fim=true; finalizar(M); }
}

/* Súmula compacta: o que a tela de fim de jogo mostra e o que fica guardado
   nos MEUS jogos (escalação com notas, gols, cartões, trocas, números). */
function sumulaDe(M){
  const lado=S=>{
    const j = S.emCampo.map(u=>[u.p.nome, u.slot, Math.round((u.nota||6)*10), u.gols||0, u.assist||0, u.ca||0, u.cv||0, u.entrouMin||0]);
    const sub = (S.subsLog||[]).map(x=>[x.min, x.sai, x.entra, Math.round((x.nota||6)*10), x.slot, x.gols, x.assist, x.ca, x.cv]);
    return {j, sub};
  };
  const min=Math.max(1, M.min);
  const gols=M.eventos.filter(e=>e.t==='gol').map(e=>[e.side, e.q||'', e.min+(e.add||0), e.tipo==='penalti'?'p':e.tipo==='falta'?'f':(e.tipo==='contra'?'c':'')]);
  const cart=M.eventos.filter(e=>e.t==='ca'||e.t==='cv').map(e=>[e.side, e.q||(e.txt||'').replace(/^(Amarelo para |VERMELHO! )/,'').split(/[ .]/).slice(0,2).join(' '), e.min+(e.add||0), e.t==='cv'?'v':'a']);
  return {
    h: lado(M.h), a: lado(M.a),
    st: [Math.round(100*M.h.posse/min), Math.round(100*M.a.posse/min), M.h.chutes||0, M.a.chutes||0,
         M.h.noAlvo||0, M.a.noAlvo||0, M.h.faltas||0, M.a.faltas||0, M.h.escanteios||0, M.a.escanteios||0],
    gols, cart, pub: M.publico||0
  };
}

function golsDe(M){
  return M.eventos.filter(e=>e.t==='gol').map(e=>[e.side, e.q||'', e.min+(e.add||0)]);
}

function finalizar(M){
  ev(M,'apito',null,`FIM DE JOGO. ${M.h.clube.nome} ${M.hg} x ${M.ag} ${M.a.clube.nome}`,'big');
  const res = M.hg>M.ag?1:M.hg===M.ag?0:-1;
  [[M.h,res],[M.a,-res]].forEach(([S,r])=>{
    S.emCampo.concat(S.sairam||[]).forEach(u=>{
      u.nota = clamp(u.nota + r*0.45 + (u.slot==='GOL'? (S===M.h?-M.ag:-M.hg)*0.28 : 0) + (rnd()-.5)*.6, 3, 10);
      u.p.jogos++; u.p.notaSoma += u.nota;
      u.p.energia = clamp((u.energiaInicio!=null?u.energiaInicio:u.p.energia) - (u.gasto||0), 3, 100);
      u.p.moral = clamp(u.p.moral + r*4 + (u.nota-6)*1.6, 5, 100);
      u.p.forma = clamp(u.p.forma*0.72 + (u.nota*10)*0.28, 20, 99);
    });
    S.banco.forEach(p=>{ p.energia=clamp(p.energia+5,0,100); });
  });
}

function simularTudo(M){
  let guard=0;
  while(!M.fim && guard++<400){
    if(M.pausa){ resolverPausaAuto(M); }
    passoMinuto(M);
  }
  return M;
}

function resolverPausaAuto(M){
  const p=M.pausa; M.pausa=null;
  if(!p) return;
  if(p.tipo==='penalti'){
    const S=p.side==='h'?M.h:M.a, O=p.side==='h'?M.a:M.h;
    const bat=(S.instr&&S.instr.penalti&&S.emCampo.find(u=>u.id===S.instr.penalti&&!u.fora))||escolheAtacante(S);
    cobrarPenalti(M,S,O,bat);
  } else if(p.tipo==='lesao'){
    const S=p.side==='h'?M.h:M.a; const u=S.emCampo.find(x=>x.id===p.uid);
    const e=melhorReserva(S);
    if(u&&e&&S.subs<3) fazerSub(M,S,u,e); else if(u) u.fora=true;
  }
}

function avisoContratos(L){
  if(!L || L.modo==='amigos' || !L.meuClube) return;
  const fim = (typeof fimSlot==='function') ? fimSlot(L) : SLOTS_TOTAL;
  const marcos = [fim-14, fim-6];
  if(marcos.indexOf(L.slot)<0) return;
  const el=(L.squads[L.meuClube]||[]).filter(p=>p.contrato<=1).sort((a,b)=>b.ovr-a.ovr);
  if(!el.length) return;
  L.noticias = L.noticias.filter(n=>!n.contratos);
  L.noticias.unshift({t:'bad', contratos:true,
    txt:`${el.length===1?'Fim de contrato':'Fins de contrato'}: ${el.slice(0,4).map(p=>p.nome+' ('+p.ovr+')').join(', ')}${el.length>4?` e mais ${el.length-4}`:''} — sem renovação, saem de graça na virada.`});
}

/* Recuperação semanal: quanto mais cansado, mais o corpo repõe.
   Quem joga os 90 minutos toda rodada estabiliza perto de 78% — dá pra segurar,
   mas rodar o elenco rende. Quem fica de fora uma rodada volta zerado. */
/* Energia entre jogos (no espírito do Brasfoot): um jogo inteiro custa uns 24
   pontos para um jogador no auge; laterais, volantes e pontas gastam mais,
   zagueiros menos, goleiros quase nada; a partir dos 30 o custo sobe e a
   recuperação cai. Um titular no auge aguenta 4-5 jogos seguidos com energia
   decente jogando uma vez por semana; com dois jogos na semana precisa de rodízio. */
const CUSTO_JOGO = 22;
const CUSTO_POS = {GOL:.35, ZAG:.85, LAT:1.15, VOL:1.10, MEI:1.05, PON:1.10, ATA:.95};
function fatorIdade(idade){
  if(idade>=35) return 1.5;
  if(idade>=33) return 1.32;
  if(idade>=30) return 1.12;
  if(idade<=23) return .85;
  return 1;
}
function fatorDesgaste(p, slot){
  return (CUSTO_POS[slot||p.pos]||1) * fatorIdade(p.idade);
}
function recuperaSemana(p, treino){
  const falta = 100 - clamp(p.energia,0,100);
  let base = 9 + 0.28*falta;
  if(treino==='fisico') base *= 1.20;
  else if(treino==='finalizacao') base *= 0.85;
  if(p.idade>=33) base *= 0.78;
  else if(p.idade>=30) base *= 0.90;
  else if(p.idade<=23) base *= 1.12;
  return Math.round(base*(0.88+rnd()*0.24));
}

function tacticsPadrao(){
  return {formacao:'4-4-2', mentalidade:'equilibrado', pressao:'media', estilo:'lados',
          titulares:[], banco:[], auto:true, rodizio:true, instr:instrPadrao()};
}

function garanteTactics(L, clubId){
  let c = L.clubs.find(x=>x.id===clubId);
  if(!c){ c = (typeof clube==='function') ? clube(clubId) : null; }
  if(!c) return tacticsPadrao();
  if(!L.squads[clubId] || !L.squads[clubId].length){
    if(typeof garanteElenco==='function') garanteElenco(L, clubId);
  }
  if(!L.squads[clubId] || !L.squads[clubId].length) return tacticsPadrao();
  if(!c.tactics) c.tactics = tacticsPadrao();
  const t = c.tactics;
  if(!t.instr) t.instr = instrPadrao();
  const elenco = L.squads[clubId];
  const limite = t.auto ? 62 : (t.rodizio===false ? 0 : 46);
  const ok = t.titulares && t.titulares.length===11 &&
             t.titulares.every(id=>{const p=elenco.find(x=>x.id===id);return p && p.lesao<=0;}) &&
             !(limite && t.titulares.some(id=>{const p=elenco.find(x=>x.id===id);return p && p.energia<limite;}));
  if(!ok){ const e=escalarAuto(elenco,t.formacao); t.titulares=e.titulares; t.banco=e.banco; }
  else {
    t.banco = (t.banco||[]).filter(id=>{const p=elenco.find(x=>x.id===id);return p&&p.lesao<=0&&!t.titulares.includes(id);});
    if(t.banco.length<5){
      const extra = elenco.filter(p=>p.lesao<=0&&!t.titulares.includes(p.id)&&!t.banco.includes(p.id))
        .sort((a,b)=>b.ovr-a.ovr).slice(0,7-t.banco.length).map(p=>p.id);
      t.banco = t.banco.concat(extra);
    }
  }
  return t;
}

function avancarRodada(){
  const r=L.rodada;
  // finanças
  L.clubs.forEach(c=>{
    const el=elenco(c.id);
    const folha=el.reduce((s,p)=>s+p.salario,0);
    c.caixa -= Math.round(folha/4.3);
    c.caixa += Math.round(180000 + c.rep*140000);            // patrocínio/TV por rodada
    const jogo=(L.fixtures[r-1]||[]).find(g=>g.h===c.id);
    if(jogo){ const res=L.resultados[`r${r}_${jogo.h}_${jogo.a}`];
      const pub=res&&res.publico?res.publico:Math.round(c.estadio*.45);
      c.caixa += Math.round(pub*(18+c.rep*6)); }
  });
  // recuperação, treino, lesões, moral
  L.clubs.forEach(c=>{
    const meu = c.id===L.meuClube;
    const treino = meu?L.treino:'equilibrado';
    elenco(c.id).forEach(p=>{
      let rec = treino==='fisico'?ri(26,38):treino==='finalizacao'?ri(14,24):ri(19,30);
      p.energia=clamp(p.energia+rec,0,100);
      if(p.lesao>0) p.lesao=Math.max(0,p.lesao-1);
      // evolução
      const jovem=p.idade<=23, velho=p.idade>=32;
      let ganho=0;
      if(p.ovr<p.pot){
        ganho = (jovem?0.10:0.045) * (treino==='tatico'?1.25:treino==='finalizacao'&&['ATA','PON','MEI'].includes(p.pos)?1.4:1);
        if(p.jogos>0) ganho*=1.25;
      }
      if(velho) ganho -= 0.055*(p.idade-31);
      p.ovrF = (p.ovrF||p.ovr) + ganho;
      p.ovr = clamp(Math.round(p.ovrF), 36, 92);
      p.valor = Math.round(Math.pow(p.ovr/10,3.4)*(p.idade<27?1.25:p.idade<31?.9:.5)*1000)*100;
      if(p.jogos===0) p.moral=clamp(p.moral-1.1,5,100);
    });
  });
  // mercado da IA + propostas pelos meus listados
  if(r%3===0) mercadoIA();
  propostasPorMeus();
  // notícias
  const tb=tabela(L);
  if(r%4===0){ const lider=clube(tb[0].id);
    L.noticias.unshift({t:'', txt:`${lider.nome} lidera com ${tb[0].p} pontos após ${tb[0].j} jogos.`}); }
  const art=artilharia(L)[0];
  if(art && r%5===0) L.noticias.unshift({t:'led', txt:`${art.nome} (${clube(art.clubId).sigla}) é o artilheiro com ${art.gols} gols.`});
  L.noticias=L.noticias.slice(0,14);
  // diretoria
  avaliarDiretoria();
  L.rodada++;
  rodadaVista=null;
  if(L.rodada>L.fixtures.length) fecharTemporada();
  salvar(true);
}

function avaliarDiretoria(){
  if(!L.diretoria||L.modo==='amigos') return;
  const tb=tabela(L), pos=tb.findIndex(x=>x.id===L.meuClube)+1;
  const meta=L.diretoria.meta;
  if(L.rodada<8) return;
  if(pos>meta+4){ L.diretoria.paciencia-=6; }
  else if(pos>meta){ L.diretoria.paciencia-=2; }
  else { L.diretoria.paciencia=clamp(L.diretoria.paciencia+3,0,100); }
  if(L.diretoria.paciencia<40 && L.diretoria.avisos===0){
    L.diretoria.avisos=1;
    L.noticias.unshift({t:'bad',txt:`A diretoria do ${meuClube().nome} soltou nota de "confiança no trabalho". Você conhece o significado disso.`});
  }
  if(L.diretoria.paciencia<=0) demitido();
}

/* ---------- finanças (escala ≈ metade dos valores reais do futebol brasileiro) ---------- */
const FIN = {
  TV:    [0, 30, 45, 65, 95, 165],      // R$ mi/ano por tamanho de torcida (1..5): cota de TV
  PATRO: [0, 15, 30, 55, 110, 290],     // patrocínio + marketing + sócio-torcedor
  ESTRUTURA: 0.40,                      // fatia da receita fixa que vai em estrutura (CT, funcionários, estádio)
  TETO: 0.52,                           // folha anual sustentável = 52% da receita fixa
  CAIXA0: 0.25,                         // caixa inicial = 1/4 da receita fixa anual
  ESTOURO: 0.30                         // multa semanal sobre o que passa do teto
};

function torcidaDe(c){ return clamp(Math.round((c&&c.torcida)||1),1,5); }

function receitaFixaAnual(c){
  const t=torcidaDe(c);
  const divB = (typeof divisaoDe==='function') && divisaoDe(c.id)==='B';
  return (FIN.TV[t]+FIN.PATRO[t])*1e6*(divB?0.42:1);
}

function tetoFolhaDe(c){ return Math.round(receitaFixaAnual(c)*FIN.TETO/12/1000)*1000; }

function caixaInicial(c){ return Math.round(receitaFixaAnual(c)*FIN.CAIXA0/1e5)*1e5; }

function ingressoMedio(c, compId){ return 22 + torcidaDe(c)*5 + (compId==='continental'?10:compId==='copa'?4:0); }

function premioPosicao(pos){ return pos>=1 && pos<=16 ? Math.round((24-(pos-1)*1.2)*1e6) : 0; }

function extratoSemanal(c, jogosCasa){
  const fixa=receitaFixaAnual(c)/52;
  const estrutura=fixa*FIN.ESTRUTURA;
  const folha=folhaDe(c.id)/4.33;
  const teto=(c.tetoFolha||tetoFolhaDe(c))/4.33;
  const estouro = folha>teto ? (folha-teto)*FIN.ESTOURO : 0;
  let bilheteria=0;
  (jogosCasa||[]).forEach(g=>{ if(g&&g.publico) bilheteria += g.publico*ingressoMedio(c, g.compId); });
  const total = fixa + bilheteria - estrutura - folha - estouro;
  return {tv:FIN.TV[torcidaDe(c)]*1e6/52, patro:FIN.PATRO[torcidaDe(c)]*1e6/52, bilheteria, estrutura, folha, estouro, total};
}

function semanaFinanceira(c, jogosCasa){
  const e=extratoSemanal(c, jogosCasa);
  c.caixa += Math.round(e.total);
  c.ultimoExtrato = {tv:e.tv, patro:e.patro, bilheteria:e.bilheteria, estrutura:e.estrutura, folha:e.folha, estouro:e.estouro, total:e.total};
  return e;
}

  L.clubs.forEach(c=>{

    const el=L.squads[c.id]||[]; if(!el.length) return;
    const divB = (typeof divisaoDe==='function') && divisaoDe(c.id, L)==='B';
    const teto=Math.round(tetoFolhaDe(c)*(divB?0.45:1));
    const folha=el.reduce((s,p)=>s+p.salario,0);
    const esc=clamp(teto*0.95/Math.max(1,folha), 0.30, 1.25);
    c.escSal=Math.round(esc*100)/100; c.tetoFolha=teto;
    el.forEach(p=>{ p.salario=Math.max(30000, Math.round(p.salario*esc/1000)*1000); });
    c.caixa=caixaInicial(c);
  });
}

function valorDeMercado(ovr, idade){
  // escala EA FC: 70 ≈ R$ 6 mi, 80 ≈ R$ 55 mi, 85 ≈ R$ 130 mi
  const base = Math.pow(1.19, ovr-58) * 900000;
  const f = idade<=21?1.35 : idade<=25?1.25 : idade<=28?1.0 : idade<=31?0.72 : idade<=34?0.42 : 0.20;
  return Math.max(300000, Math.round(base*f/100000)*100000);
}

function salarioDe(ovr, idade){
  const v = valorDeMercado(ovr, idade);
  return Math.max(60000, Math.round(v*0.040/1000)*1000);
}

function novoJogadorReal(seed, nome, pos, idade, ovr){

            : idade<=24 ? clamp(ovr+Math.round(r()*8)+2, ovr, 90)

    id:'p'+(_pid++), nome, pos, idade, ovr, pot, ovrF:ovr,

    contrato: 2+Math.floor(r()*4),

  };
}

    caixa: Math.round(Math.pow(1.22, c.niv-58)*2400000 + 6000000),
    tactics:null, titulos:[]};

function roundRobin(ids, turnos){
  const t=ids.slice(); if(t.length%2) t.push(null);
  const n=t.length, base=[];
  let arr=t.slice();
  for(let r=0;r<n-1;r++){
    const jogos=[];
    for(let i=0;i<n/2;i++){
      const a=arr[i], b=arr[n-1-i];
      if(a===null||b===null) continue;
      jogos.push(r%2===0?{h:a,a:b}:{h:b,a:a});
    }
    base.push(jogos);
    arr=[arr[0]].concat([arr[n-1]],arr.slice(1,n-1));
  }
  let out=base;
  if(turnos===2) out=base.concat(base.map(j=>j.map(g=>({h:g.a,a:g.h}))));
  return out;
}

function cruzado(ids, seed){
  const r=rng(seed); const emb=ids.slice();
  for(let i=emb.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[emb[i],emb[j]]=[emb[j],emb[i]];}
  const meio=Math.ceil(emb.length/2);
  const A=emb.slice(0,meio), B=emb.slice(meio);
  const rodadas=[];
  for(let k=0;k<B.length;k++){
    const jogos=[];
    for(let i=0;i<A.length;i++){
      const b=B[(i+k)%B.length];
      if(!b) continue;
      jogos.push((i+k)%2===0?{h:A[i],a:b}:{h:b,a:A[i]});
    }
    rodadas.push(jogos);
  }
  return {rodadas, grupos:{A,B}};
}

const SLOTS_TOTAL = 49;

const AGENDA = {
  estadual:     {grupo:[1,2,3,4,5,6,7,8], quartas:[9], semi:[10], final:[11]},
  brasileirao:  (()=>{const a=[];for(let i=0;i<38;i++)a.push(12+i);return a;})(),
  copabr:       {f1:[13,15], oitavas:[19,21], quartas:[26,28], semi:[33,35], final:[40,42]},
  continental:  {grupo:[12,14,16,18,20,22], oitavas:[26,28], quartas:[33,35], semi:[40,42], final:[45]},
  intercont:    {semi:[47], final:[49]}
};

const NOME_FASE = {grupo:'Fase de grupos', f1:'Terceira fase', f2:'Quarta fase', trintadois:'Trinta e dois avos',
  oitavas:'Oitavas de final', quartas:'Quartas de final', semi:'Semifinal', final:'Final'};

function criarComp(id, nome, tipo, clubes, extra){
  return Object.assign({id, nome, tipo, clubes, fase:null, rodada:0,
    fixtures:[], resultados:{}, chave:{}, campeao:null, meuStatus:'ativo'}, extra||{});
}

function montarTemporada(L){
  // Carreira solo usa o mesmo calendário do mundo da liga com amigos (42 semanas,
  // sem estadual): Brasileirão A e B, Copa do Brasil, Libertadores, Sul-Americana,
  // as cinco ligas da Europa, Champions e Mundial.
  if(typeof montarTemporadaAmigos==='function'){
    if(!L.divisoes) L.divisoes = divisoesIniciais();
    L.divisoes.A.concat(L.divisoes.B).forEach(id=>garanteElenco(L,id));
    if(typeof SULAMERICANOS!=='undefined') SULAMERICANOS.forEach(c=>garanteElenco(L,c.id));
    if(typeof carregarEuropa==='function' && !L.clubs.some(c=>typeof ehEuropeu==='function' && ehEuropeu(c.id))) carregarEuropa(L);
    montarTemporadaAmigos(L);
    L.fimSlot = SEMANAS_AMIGOS;
    return;
  }
  const meu = CLUBE_POR_ID[L.meuClube];
  L.comps = {};

  /* estadual */
  const est = ESTADUAIS[meu.uf];
  if(est){
    const c = criarComp('estadual', est.nome, 'grupo+mata', est.ids.slice());
    const cr = cruzado(est.ids, L.seed+'-est');
    c.fixtures = cr.rodadas; c.grupos = cr.grupos;
    c.slots = AGENDA.estadual;
    c.ordemFases = ['quartas','semi','final'];
    c.semeadura = 'cruzado8'; c.classificados = 8; c.mandoTipo = 'unico';
    L.comps.estadual = c;
  }
  /* brasileirão: as duas divisões, com acesso e rebaixamento na virada */
  if(!L.divisoes) L.divisoes = divisoesIniciais();
  const bra = criarComp('brasileirao','Brasileirão Série A','liga', divisoes(L).A.slice());
  bra.fixtures = roundRobin(bra.clubes, 2);
  bra.slots = AGENDA.brasileirao; bra.div='A';
  L.comps.brasileirao = bra;
  const serb = criarComp('serieb','Brasileirão Série B','liga', divisoes(L).B.slice());
  serb.fixtures = roundRobin(serb.clubes, 2);
  serb.slots = AGENDA.brasileirao.slice(); serb.div='B';
  L.comps.serieb = serb;
  divisoes(L).B.forEach(id=>garanteElenco(L,id));

  /* as cinco ligas da Europa e a Champions rodam junto */
  Object.keys(LIGAS_EUROPA).forEach(k=>{
    const C=criarComp(k, LIGAS_EUROPA[k].nome, 'liga', clubesDaLigaEuropeia(k));
    C.fixtures=roundRobin(C.clubes,2); C.slots=AGENDA.brasileirao.slice();
    L.comps[k]=C;
  });
  (function(){
    const champ=[];
    Object.keys(LIGAS_EUROPA).forEach(k=>{
      const ids=clubesDaLigaEuropeia(k).slice()
        .sort((x,y)=>(CLUBE_POR_ID[y].niv||0)-(CLUBE_POR_ID[x].niv||0) || (x<y?-1:1));
      const ant = L.ligaAnterior && L.ligaAnterior[k];
      (ant && ant.length>=6 ? ant.slice(0,6) : ids.slice(0,6)).forEach(id=>champ.push(id));
    });
    const CH=montarCopaGrupos(L,'champions','Champions League', champ.slice(0,32),
      AGENDA.continental, '-chs'+L.temporada);
    L.comps.champions=CH;
  })();

  /* copa do brasil — 32 clubes a partir da terceira fase */
  const poolCopa = []
    .concat(SERIE_A.map(c=>c.id))
    .concat(['spo','cea','for','goi','cui','atg','vil','crb','ama','nau','ame','juv','cri']);
  const cb = criarComp('copabr','Copa do Brasil','mata', sorteia(poolCopa, 32, L.seed+'-cb'));
  cb.slots = AGENDA.copabr;
  cb.ordemFases = ['f1','oitavas','quartas','semi','final'];
  cb.mandoTipo = 'copa';
  L.comps.copabr = cb;

  /* continental */
  if(meu.cont==='lib' || meu.cont==='sul'){
    const ehLib = meu.cont==='lib';
    const brasil = SERIE_A.filter(c=>c.cont===meu.cont).map(c=>c.id);
    const estr = SULAMERICANOS.filter(c=>c.comp===meu.cont).map(c=>c.id);
    let pool = brasil.concat(estr);
    const alvo = 32;
    if(pool.length<alvo){
      const extras = SULAMERICANOS.filter(c=>!pool.includes(c.id)).map(c=>c.id)
        .concat(OUTROS_BR.filter(c=>c.niv>=60).map(c=>c.id));
      pool = pool.concat(extras.slice(0, alvo-pool.length));
    }
    pool = pool.slice(0,alvo);
    if(!pool.includes(L.meuClube)) pool[0]=L.meuClube;
    const co = criarComp('continental', ehLib?'Copa Libertadores':'Copa Sul-Americana','grupos+mata', pool);
    co.grupos = fazerGrupos(pool, 8, L.seed+'-co', L.meuClube);
    co.fixtures = gruposFixtures(co.grupos);
    co.slots = AGENDA.continental;
    co.ordemFases = ['oitavas','quartas','semi','final'];
    co.semeadura = 'grupo'; co.porGrupo = 2; co.mandoTipo = 'conti';
    L.comps.continental = co;
  }
  L.slot = 1;
  L.agendaMeu = montarAgendaMeu(L);
}


/* ---------- calendário da liga com amigos ----------
   42 semanas, sem estadual. Meio de semana de copa nunca cai junto com meio de
   semana de continental, então ninguém joga três vezes na mesma semana. */
const SEMANAS_AMIGOS = 42;
const SEM_RODADA = [14, 22, 30, 38];          // semanas só de copa

const AGENDA_MUNDO = {
  liga:        (()=>{ const a=[]; for(let s=1;s<=SEMANAS_AMIGOS;s++) if(SEM_RODADA.indexOf(s)<0) a.push(s); return a; })(),
  copabr:      {f1:[3,5], oitavas:[9,11], quartas:[17,19], semi:[25,27], final:[33,35]},
  continental: {grupo:[2,4,6,8,10,12], oitavas:[16,18], quartas:[20,22], semi:[28,30], final:[36]},
  sula:        {grupo:[2,4,6,8,10,12], oitavas:[16,18], quartas:[20,22], semi:[28,30], final:[34]},
  champions:   {grupo:[2,4,6,8,10,12], oitavas:[16,18], quartas:[20,22], semi:[28,30], final:[38]},
  intercont:   {semi:[40], final:[42]}
};

/* Quem vai para a Libertadores e para a Sul-Americana: a tabela da temporada
   passada. Na primeira, o que o clube era na vida real. */
function vagasContinentais(L){
  const A = divisoes(L).A;
  const ant = L.classificacaoAnterior;
  if(ant && ant.length>=12){
    const naA = ant.filter(id=>A.indexOf(id)>=0);
    return {lib: naA.slice(0,6), sul: naA.slice(6,14)};
  }
  const lib = A.filter(id=>(CLUBE_POR_ID[id]||{}).cont==='lib');
  const sul = A.filter(id=>(CLUBE_POR_ID[id]||{}).cont==='sul');
  const resto = A.filter(id=>lib.indexOf(id)<0 && sul.indexOf(id)<0);
  return {lib: lib.concat(resto.slice(0, Math.max(0,6-lib.length))).slice(0,6),
          sul: sul.concat(resto.slice(Math.max(0,6-lib.length))).slice(0,8)};
}

function montarCopaGrupos(L, id, nome, pool, agenda, seed){
  const C = criarComp(id, nome, 'grupos+mata', pool.slice(0,32));
  C.grupos = fazerGrupos(C.clubes, 8, L.seed+seed);
  C.fixtures = gruposFixtures(C.grupos);
  C.slots = agenda;
  C.ordemFases = ['oitavas','quartas','semi','final'];
  C.semeadura = 'grupo'; C.porGrupo = 2; C.mandoTipo = 'conti';
  return C;
}

/* Monta a temporada inteira da liga com amigos: dois Brasileirões, Copa do
   Brasil, Libertadores, Sul-Americana, as cinco ligas da Europa, a Champions
   e o Mundial. Tudo semeado pelo código da liga — igual em todo aparelho. */
function montarTemporadaAmigos(L){
  L.comps = {};
  const d = divisoes(L);
  const slots = AGENDA_MUNDO.liga;

  const mkLiga=(id,nome,ids,div)=>{
    const C=criarComp(id, nome, 'liga', ids.slice());
    C.fixtures=roundRobin(C.clubes,2); C.slots=slots.slice(); if(div) C.div=div;
    return C;
  };
  L.comps.brasileirao = mkLiga('brasileirao','Brasileirão Série A', d.A, 'A');
  L.comps.serieb      = mkLiga('serieb','Brasileirão Série B', d.B, 'B');
  Object.keys(LIGAS_EUROPA).forEach(k=>{
    L.comps[k] = mkLiga(k, LIGAS_EUROPA[k].nome, clubesDaLigaEuropeia(k));
  });

  /* Copa do Brasil: 32 clubes das duas divisões */
  const poolCopa = sorteia(d.A.concat(d.B), 32, L.seed+'-cb'+L.temporada);
  const cb = criarComp('copabr','Copa do Brasil','mata', poolCopa);
  cb.slots = AGENDA_MUNDO.copabr;
  cb.ordemFases = ['f1','oitavas','quartas','semi','final'];
  cb.mandoTipo = 'copa';
  L.comps.copabr = cb;

  /* Libertadores e Sul-Americana */
  const vg = vagasContinentais(L);
  const sulEstr = SULAMERICANOS.filter(c=>c.comp==='lib').map(c=>c.id);
  const sulEstr2 = SULAMERICANOS.filter(c=>c.comp!=='lib').map(c=>c.id);
  const completa=(base, extras, n)=>{
    const out=base.slice();
    extras.forEach(id=>{ if(out.length<n && out.indexOf(id)<0) out.push(id); });
    SULAMERICANOS.forEach(c=>{ if(out.length<n && out.indexOf(c.id)<0) out.push(c.id); });
    return out.slice(0,n);
  };
  L.comps.libertadores = montarCopaGrupos(L,'libertadores','Copa Libertadores',
    completa(vg.lib, sulEstr, 32), AGENDA_MUNDO.continental, '-lib'+L.temporada);
  L.comps.sulamericana = montarCopaGrupos(L,'sulamericana','Copa Sul-Americana',
    completa(vg.sul, sulEstr2, 32), AGENDA_MUNDO.sula, '-sul'+L.temporada);

  /* Champions: os melhores colocados das cinco ligas europeias */
  const champ = [];
  Object.keys(LIGAS_EUROPA).forEach(k=>{
    const ids = clubesDaLigaEuropeia(k).slice()
      .sort((a,b)=>(CLUBE_POR_ID[b].niv||0)-(CLUBE_POR_ID[a].niv||0) || (a<b?-1:1));
    const ant = L.ligaAnterior && L.ligaAnterior[k];
    (ant && ant.length>=6 ? ant.slice(0,6) : ids.slice(0,6)).forEach(id=>champ.push(id));
  });
  L.comps.champions = montarCopaGrupos(L,'champions','Champions League',
    champ.slice(0,32), AGENDA_MUNDO.champions, '-ch'+L.temporada);

  L.slot = 1;
}

/* Mundial: campeão da Libertadores x campeão da Champions, mais dois convidados. */
function prepararMundial(L, slot){
  const A=AGENDA_MUNDO.intercont;
  if(slot < A.semi[0]) return;
  const lib = L.comps.libertadores && L.comps.libertadores.campeao;
  const ch  = L.comps.champions && L.comps.champions.campeao;
  if(!L.comps.intercont){
    if(!lib && !ch) return;
    const ic = criarComp('intercont','Mundial de Clubes','mata', []);
    ic.slots = A; ic.ordemFases = ['semi','final']; ic.mandoTipo = 'unico';
    const convidados = INTERCONT.map(c=>c.id);
    const sul = (L.comps.sulamericana && L.comps.sulamericana.campeao) || null;
    const lista = [lib, ch, sul, convidados[0], convidados[1]].filter(Boolean);
    while(lista.length<4) lista.push(convidados[lista.length%convidados.length]);
    ic.clubes = lista.slice(0,4);
    ic.chave.semi = [
      {h:ic.clubes[0], a:ic.clubes[3], legs:[], venc:null},
      {h:ic.clubes[1], a:ic.clubes[2], legs:[], venc:null}
    ];
    L.comps.intercont = ic;
  }
  const IC=L.comps.intercont;
  if(slot>=A.final[0] && IC.chave.semi && !IC.chave.final){
    const v=IC.chave.semi.map(m=>m.venc).filter(Boolean);
    if(v.length===2) IC.chave.final=[{h:v[0],a:v[1],legs:[],venc:null}];
  }
}

function sorteia(arr, n, seed){
  const r=rng(seed), a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a.slice(0,n);
}

function fazerGrupos(ids, n, seed, forcar){
  const r=rng(seed); const a=ids.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  if(forcar){ const k=a.indexOf(forcar); if(k>0){ [a[0],a[k]]=[a[k],a[0]]; } }
  const g=[]; for(let i=0;i<n;i++) g.push([]);
  a.forEach((id,i)=>g[i%n].push(id));
  return g;
}

function gruposFixtures(grupos){
  // 6 rodadas: ida e volta dentro de cada grupo de 4
  const rodadas=[[],[],[],[],[],[]];
  grupos.forEach(g=>{
    if(g.length<4) return;
    const rr = roundRobin(g,2);
    rr.forEach((jogos,i)=>{ rodadas[i]=rodadas[i].concat(jogos); });
  });
  return rodadas;
}

function montarAgendaMeu(L){
  const ag=[];
  const push=(slot,comp,fase,rodada)=>ag.push({slot,comp,fase,rodada});
  const c=L.comps;
  if(c.estadual) c.estadual.slots.grupo.forEach((s,i)=>{ if(c.estadual.fixtures[i]) push(s,'estadual','grupo',i); });
  c.brasileirao.slots.forEach((s,i)=>push(s,'brasileirao','liga',i));
  if(c.continental) c.continental.slots.grupo.forEach((s,i)=>push(s,'continental','grupo',i));
  ag.sort((a,b)=>a.slot-b.slot);
  return ag;
}

function tabelaComp(L, comp, filtroIds){
  const ids = filtroIds || comp.clubes;
  const t={}; ids.forEach(id=>t[id]={id,j:0,v:0,e:0,d:0,gp:0,gc:0,p:0,forma:[]});
  Object.keys(comp.resultados).forEach(k=>{
    const res=comp.resultados[k]; if(!res||res.mata) return;
    const [,h,a]=k.split('_');
    if(!t[h]||!t[a]) return;
    const H=t[h],A=t[a];
    H.j++;A.j++;H.gp+=res.hg;H.gc+=res.ag;A.gp+=res.ag;A.gc+=res.hg;
    if(res.hg>res.ag){H.v++;A.d++;H.p+=3;H.forma.push('V');A.forma.push('D');}
    else if(res.hg<res.ag){A.v++;H.d++;A.p+=3;A.forma.push('V');H.forma.push('D');}
    else {H.e++;A.e++;H.p++;A.p++;H.forma.push('E');A.forma.push('E');}
  });
  const arr=Object.values(t).map(x=>({...x,sg:x.gp-x.gc}));
  arr.sort((a,b)=>b.p-a.p||b.v-a.v||b.sg-a.sg||b.gp-a.gp||(a.id<b.id?-1:1));
  return arr;
}

function artilhariaGeral(L){
  const arr=[];
  Object.keys(L.squads).forEach(cid=>L.squads[cid].forEach(p=>{ if(p.gols>0) arr.push({...p,clubId:cid}); }));
  arr.sort((a,b)=>b.gols-a.gols||b.assist-a.assist||a.jogos-b.jogos);
  return arr.slice(0,30);
}

function compsAtivas(L){ return Object.keys(L.comps).map(k=>L.comps[k]); }

function chave(comp, fase, rodada, h, a){ return `${fase}${rodada}_${h}_${a}`; }

/* Ordem fixa das competições: o mesmo em todo aparelho, senão os sorteios
   e as simulações saem diferentes entre os celulares da liga. */
const ORDEM_COMPS = ['brasileirao','serieb','copabr','libertadores','sulamericana',
                     'continental','intercont','champions',
                     'inglesa','espanhola','italiana','alema','francesa','estadual'];

function compsNaOrdem(L){
  const ids=Object.keys(L.comps||{});
  ids.sort((a,b)=>{
    const ia=ORDEM_COMPS.indexOf(a), ib=ORDEM_COMPS.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || (a<b?-1:1);
  });
  return ids.map(id=>L.comps[id]).filter(Boolean);
}

/* Quem manda no jogo de volta depende da competição:
   copa  → segundo jogo na casa de quem visitou primeiro
   conti → igual, mas a final é jogo único na ordem sorteada
   unico → sempre o mando do sorteio */
function mandoDoJogo(C, f, k, m){
  const t = C.mandoTipo || 'copa';
  if(t==='unico') return {h:m.h, a:m.a};
  if(t==='conti' && f==='final') return {h:m.h, a:m.a};
  return k===0 ? {h:m.h, a:m.a} : {h:m.a, a:m.h};
}

function fixturesDoSlot(L, slot){
  const out=[];
  compsNaOrdem(L).forEach(C=>{
    if(Array.isArray(C.slots)){                       // liga de pontos corridos
      const i=C.slots.indexOf(slot);
      if(i>=0 && C.fixtures[i]) out.push({comp:C, fase:'liga', rodada:i, jogos:C.fixtures[i]});
      return;
    }
    if(!C.slots) return;
    if(C.slots.grupo){
      const gi=C.slots.grupo.indexOf(slot);
      if(gi>=0 && C.fixtures[gi]) out.push({comp:C, fase:'grupo', rodada:gi, jogos:C.fixtures[gi]});
    }
    (C.ordemFases||[]).forEach(f=>{
      const k=C.slots[f]?C.slots[f].indexOf(slot):-1;
      if(k>=0 && C.chave[f]) out.push({comp:C, fase:f, rodada:k,
        jogos:C.chave[f].map(m=>mandoDoJogo(C,f,k,m))});
    });
  });
  return out;
}

function meusCompromissos(L, slot){
  const out=[];
  fixturesDoSlot(L, slot).forEach(bl=>{
    bl.jogos.forEach(g=>{
      if(!g||!g.h||!g.a) return;
      if(g.h===L.meuClube||g.a===L.meuClube){
        const k=chave(bl.comp, bl.fase, bl.rodada, g.h, g.a);
        if(!bl.comp.resultados[k]) out.push({comp:bl.comp, fase:bl.fase, rodada:bl.rodada, jogo:g, chave:k});
      }
    });
  });
  return out;
}

function proximoCompromisso(L){
  for(let s=L.slot; s<=fimSlot(L); s++){
    prepararSlot(L, s);
    const m=meusCompromissos(L, s);
    if(m.length) return Object.assign(m[0], {slot:s});
    if(s>L.slot) { /* nada a fazer neste slot para mim */ }
  }
  return null;
}

function prepararSlot(L, slot){
  compsNaOrdem(L).forEach(C=>prepararComp(L, C, slot));
  if(L.comps.champions) prepararMundial(L, slot);
  else if(L.comps.continental) prepararIntercont(L, slot);
}

/* Monta os confrontos de mata-mata de qualquer competição:
   quem se classifica da fase de grupos (ou da tabela) e quem avança de fase. */
function paresDaChave(cls, semeadura){
  const mk=(h,a)=>({h, a, legs:[], venc:null});
  if(semeadura==='cruzado8' && cls.length>=8){
    return [[0,7],[3,4],[1,6],[2,5]].map(([i,j])=>mk(cls[i], cls[j]));
  }
  if(semeadura==='grupo'){
    // primeiros e segundos de grupos diferentes; o primeiro decide em casa
    const n=cls.length/2, pri=[], seg=[];
    for(let i=0;i<cls.length;i+=2){ pri.push(cls[i]); seg.push(cls[i+1]); }
    const out=[];
    for(let i=0;i<n;i++) out.push(mk(seg[(i+1)%n], pri[i]));
    return out;
  }
  const out=[];
  for(let i=0;i+1<cls.length;i+=2) out.push(mk(cls[i], cls[i+1]));
  return out;
}

function classificadosDaComp(L, C){
  if(C.tipo==='mata') return C.clubes.slice();
  if(Array.isArray(C.grupos)){
    const cls=[], n=C.porGrupo||2;
    C.grupos.forEach(g=>{ const tb=tabelaComp(L,C,g); for(let k=0;k<n;k++) if(tb[k]) cls.push(tb[k].id); });
    return cls;
  }
  const tb=tabelaComp(L,C);
  return tb.slice(0, C.classificados||8).map(x=>x.id);
}

function prepararComp(L, C, slot){
  if(!C || C.campeao || Array.isArray(C.slots) || !C.slots) return;
  const seq=C.ordemFases||[];
  if(!seq.length) return;
  const prim=seq[0];
  if(!C.chave[prim] && C.slots[prim] && slot>=C.slots[prim][0]){
    const cls=classificadosDaComp(L, C);
    if(cls.length>=2){
      C.chave[prim]=paresDaChave(cls, C.semeadura);
      if(L.meuClube && C.tipo!=='mata' && cls.indexOf(L.meuClube)<0)
        C.meuStatus='eliminado na fase de grupos';
    }
  }
  for(let i=1;i<seq.length;i++){
    const f=seq[i], ant=seq[i-1];
    if(C.slots[f] && slot>=C.slots[f][0] && C.chave[ant] && !C.chave[f]){
      const v=C.chave[ant].map(m=>m.venc).filter(Boolean);
      if(v.length===C.chave[ant].length && v.length>=2){
        C.chave[f]=[];
        for(let k=0;k+1<v.length;k+=2) C.chave[f].push({h:v[k],a:v[k+1],legs:[],venc:null});
      }
    }
  }
}

function prepararIntercont(L, slot){
  if(slot<AGENDA.intercont.semi[0]) return;
  const CO=L.comps.continental;
  const campeaoLib = CO && CO.id==='continental' && CO.nome.indexOf('Libertadores')>=0 ? CO.campeao : null;
  if(!campeaoLib) return;
  if(!L.comps.intercont){
    const ic=criarComp('intercont','Copa Intercontinental','mata',[]);
    ic.slots=AGENDA.intercont; ic.ordemFases=['semi','final'];
    ic.mandoTipo='unico';
    const outros = INTERCONT.filter(c=>c.niv>=70).map(c=>c.id);
    ic.chave.semi=[{h:campeaoLib, a:pick(outros), legs:[], venc:null}];
    ic.clubes=[campeaoLib].concat(outros);
    L.comps.intercont=ic;
  }
  const IC=L.comps.intercont;
  if(slot>=IC.slots.final[0] && IC.chave.semi && !IC.chave.final){
    const v=IC.chave.semi[0].venc;
    if(v){ const eur=pick(EUROPEUS.map(c=>c.id));
      IC.chave.final=[{h:eur,a:v,legs:[],venc:null}]; IC.clubes.push(eur); }
  }
}

function registrarResultado(L, comp, fase, rodada, h, a, hg, ag, publico, eventos, extra){
  const k=chave(comp,fase,rodada,h,a);
  const mata = fase!=='liga' && fase!=='grupo';
  const r={hg,ag,publico,eventos,mata};
  if(extra){ if(extra.gs) r.gs=extra.gs; if(extra.sm) r.sm=extra.sm; }
  comp.resultados[k]=r;
  if(mata && comp.chave[fase]){
    const m=comp.chave[fase].find(x=>(x.h===h&&x.a===a)||(x.h===a&&x.a===h));
    if(m){ m.legs.push({h,a,hg,ag}); resolverConfronto(L, comp, fase, m); }
  }
}

function resolverConfrontoBase(L, comp, fase, m){
  const jogosNaFase = (comp.slots[fase]||[]).length;
  if(m.legs.length < jogosNaFase) return;
  let g1=0,g2=0;
  m.legs.forEach(l=>{ if(l.h===m.h){g1+=l.hg;g2+=l.ag;} else {g2+=l.hg;g1+=l.ag;} });
  if(g1>g2) m.venc=m.h;
  else if(g2>g1) m.venc=m.a;
  else { const p1=ri(3,6), p2=ri(3,6);
    m.penaltis = p1===p2 ? [p1+1,p2] : [p1,p2];
    m.venc = m.penaltis[0]>m.penaltis[1] ? m.h : m.a; }
  m.perd = m.venc===m.h?m.a:m.h;
  if(typeof premiar==='function') premiar(L, comp, m.venc, fase);
  if(fase==='final'){
    comp.campeao=m.venc;
    const cl=L.clubs.find(c=>c.id===m.venc);
    if(cl){ cl.titulos=cl.titulos||[]; cl.titulos.push({comp:comp.nome, ano:L.temporada}); }
    if(m.venc===L.meuClube){
      L.titulos=L.titulos||[]; L.titulos.push({comp:comp.nome, ano:L.temporada});
      L.noticias.unshift({t:'led', txt:`🏆 ${clube(L.meuClube).nome} campeão — ${comp.nome} ${L.temporada}!`});
    } else {
      L.noticias.unshift({t:'', txt:`${clube(m.venc).nome} campeão — ${comp.nome} ${L.temporada}.`});
    }
  }
  if(m.perd===L.meuClube) comp.meuStatus='eliminado — '+(NOME_FASE[fase]||fase).toLowerCase();
}

function simularJogo(L, comp, fase, rodada, g){
  if(!g||!g.h||!g.a) return null;
  garanteElenco(L,g.h); garanteElenco(L,g.a);
  [g.h,g.a].forEach(id=>{ if(id!==L.meuClube){ const cl=L.clubs.find(x=>x.id===id);
    if(cl){ if(!cl.tactics) cl.tactics=tacticsPadrao(); cl.tactics.auto=true; } } });
  const P=criarPartida(L,g.h,g.a,null);
  if(typeof ajustarAtmosfera==='function') ajustarAtmosfera(P, comp, fase, rodada);
  simularTudo(P);
  const humano = g.h===L.meuClube||g.a===L.meuClube;
  registrarResultado(L, comp, fase, rodada, g.h, g.a, P.hg, P.ag, P.publico,
    humano?compactar(P.eventos):null, extraDoJogo(L, comp, P, humano));
  return P;
}

/* O que fica guardado além do placar: autores dos gols nos jogos brasileiros e
   nas copas (é o que a tela da rodada mostra), e a súmula inteira nos meus. */
function extraDoJogo(L, comp, P, meu){
  const euro = !!(typeof LIGAS_EUROPA!=='undefined' && LIGAS_EUROPA[comp.id]);
  const out={};
  if(!euro || meu) out.gs = golsDe(P);
  if(meu) out.sm = sumulaDe(P);
  return out;
}

function simularRestoDoSlot(L, slot){
  fixturesDoSlot(L, slot).forEach(bl=>{
    bl.jogos.forEach(g=>{
      if(!g||!g.h||!g.a) return;
      const k=chave(bl.comp, bl.fase, bl.rodada, g.h, g.a);
      if(bl.comp.resultados[k]) return;
      simularJogo(L, bl.comp, bl.fase, bl.rodada, g);
    });
  });
}

function noticiaRodada(L){

function fecharTemporadaNovaBase(L){
  const tb=tabelaComp(L,L.comps.brasileirao);
  const minhaTb = (typeof tabela==='function') ? tabela(L) : tb;
  const pos = minhaTb.findIndex(x=>x.id===L.meuClube)+1;
  const minha = minhaTb[pos-1] || {p:0};
  L.temporadaFim=true;
  if(typeof registrarGaleria==='function') registrarGaleria(L);
  tb.forEach((x,i)=>{ const cl=L.clubs.find(c=>c.id===x.id); if(cl) cl.caixa+=premioPosicao(i+1); });
  if(L.comps.serieb){
    const tbB=tabelaComp(L,L.comps.serieb);
    tbB.forEach((x,i)=>{ const cl=L.clubs.find(c=>c.id===x.id); if(cl) cl.caixa+=Math.round(premioPosicao(i+1)*0.32); });
    L.balanco={ temporada:L.temporada, campeaoA:tb[0]?tb[0].id:null, campeaoB:tbB[0]?tbB[0].id:null,
      sobem:tbB.slice(0,4).map(x=>x.id), caem:tb.slice(-4).map(x=>x.id),
      minhaPos:pos||20, minhaDiv:(divisaoDe(L.meuClube,L)||'A'),
      pts:minha.p||0 };
    L.noticias.unshift({t:'', txt:`${clube(tbB[0].id).nome} é campeão da Série B e sobe para a elite.`});
  }
  const campeao=clube(tb[0].id);
  if(tb[0].id===L.meuClube){ L.titulos=L.titulos||[]; L.titulos.push({comp:'Brasileirão Série A',ano:L.temporada}); }
  L.historico.unshift({ano:L.temporada, campeao:campeao.nome, minhaPos:pos||20, pts:minha.p||0,
    div:(divisaoDe(L.meuClube,L)||'A'),
    titulos:(L.titulos||[]).filter(t=>t.ano===L.temporada).map(t=>t.comp)});
  L.noticias.unshift({t:'led',txt:`${campeao.nome} é campeão brasileiro de ${L.temporada}.`});
}

function jogosDoSlotComResultado(L, slot){
  const out=[];
  fixturesDoSlot(L, slot).forEach(bl=>{
    bl.jogos.forEach(g=>{
      if(!g||!g.h||!g.a) return;
      const k=chave(bl.comp,bl.fase,bl.rodada,g.h,g.a);
      const r=bl.comp.resultados[k];
      out.push({comp:bl.comp, fase:bl.fase, rodada:bl.rodada, h:g.h, a:g.a,
        hg:r?r.hg:null, ag:r?r.ag:null, temEventos:!!(r&&r.eventos), chave:k, slot});
    });
  });
  return out;
}

function ultimoSlotJogado(L){
  const fim=fimSlot(L);
  for(let s=Math.min(L.slot,fim); s>=1; s--){
    const j=jogosDoSlotComResultado(L,s);
    if(j.length && j.some(x=>x.hg!==null)) return s;
  }
  return 1;
}

    <button class="btn pri wide" style="margin-top:12px" onclick="fecharSheet()">Continuar</button>`);
