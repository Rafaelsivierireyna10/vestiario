function aplicarSemana(L){
  const c=meuClube();
  const folha=folhaDe(c.id);
  const teto=tetoFolha(c);
  // finanças de todos os clubes brasileiros (TV, patrocínio, bilheteria, folha, estrutura)
  L.clubs.forEach(cl=>{
    if(typeof ehEuropeu==='function' && ehEuropeu(cl.id)) return;
    semanaFinanceira(cl, jogosEmCasaDoSlot(L, cl.id, L.slot));
  });
  if(folha>teto && L.slot%6===0) L.noticias.unshift({t:'bad',txt:`A diretoria cobrou pelo estouro da folha salarial (${dinheiro(folha)} contra teto de ${dinheiro(teto)}).`});
  // recuperação, evolução
  Object.keys(L.squads).forEach(cid=>{
    const meu = cid===L.meuClube;
    const treino = meu?L.treino:'equilibrado';
    L.squads[cid].forEach(p=>{
      p.energia=clamp(p.energia+recuperaSemana(p, treino),0,100);
      if(p.lesao>0) p.lesao=Math.max(0,p.lesao-1);
      let ganho=0;
      if(p.ovr<p.pot){
        ganho=(p.idade<=19?0.185:p.idade<=21?0.155:p.idade<=23?0.115:p.idade<=26?0.058:p.idade<=29?0.028:0.014)*(treino==='tatico'?1.3:treino==='finalizacao'&&['ATA','PON','MEI'].includes(p.pos)?1.4:1);
        ganho *= fatorDesempenho(p);
      }
      // temporada ruim faz veterano cair mais rápido
      if(p.jogos>=6 && p.idade>=29){
        const nota=p.notaSoma/p.jogos;
        if(nota<6.0) ganho -= (6.0-nota)*0.010;
      }
      // declínio: goleiro envelhece bem mais devagar; alvo é perda anual, não semanal
      const SEM=49, gol=p.pos==='GOL';
      const limiar = gol?33:30, taxa = gol?0.22:0.36, teto = gol?3.0:4.0;
      if(p.idade>=limiar) ganho -= Math.min(teto, taxa*(p.idade-limiar+1))/SEM;
      p.ovrF=(p.ovrF||p.ovr)+ganho;
      p.ovr=clamp(Math.round(p.ovrF),45,92);
      p.valor=valorDeMercado(p.ovr,p.idade);
      if(p.jogos===0) p.moral=clamp(p.moral-0.8,5,100);
      if(p.ovr0===undefined) p.ovr0=p.ovr;
    });
  });
  if(L.slot%3===0) mercadoIA();
  propostasPorMeus();
  if(L.slot%3===0) noticiaRodada(L);
  avisoContratos(L);
  L.noticias=L.noticias.slice(0,16);
}

function fatorDesempenho(p){
  if(!p.jogos) return 0.22;                       // encostado quase não evolui
  const nota = p.notaSoma/p.jogos;
  let f = clamp(0.5 + (nota-5.7)*0.62, 0.3, 1.95);  // nota 6,4 ≈ 1,0 · nota 7,5 ≈ 1,6
  if(['ATA','PON','MEI'].includes(p.pos)){
    const part = (p.gols + p.assist*0.6) / Math.max(5, p.jogos);
    f *= 1 + clamp(part, 0, 0.85)*0.6;             // artilheiro evolui bem mais rápido
  }
  if(['GOL','ZAG','LAT','VOL'].includes(p.pos) && nota>=7) f *= 1.12;
  const ritmo = p.jogos / Math.max(1, L.slot-1);
  if(ritmo >= 0.75) f *= 1.12;                     // titular absoluto
  else if(ritmo < 0.3) f *= 0.7;
  return f;
}

function premiar(L, comp, clubId, fase){
  if(clubId!==L.meuClube) return;
  const base = comp.id==='continental'?4200000 : comp.id==='copabr'?3000000 : comp.id==='estadual'?900000 : 0;
  const mult = {oitavas:1, quartas:1.6, semi:2.4, final:4}[fase]||1;
  const v=Math.round(base*mult);
  if(v>0){ meuClube().caixa+=v;
    L.noticias = L.noticias.filter(n=>n.premio!==comp.id);
    L.noticias.unshift({t:'good', premio:comp.id,
      txt:`${dinheiro(v)} de premiação pela vaga ${fase==='final'?'na final':'nas '+(NOME_FASE[fase]||fase).toLowerCase()} — ${comp.nome}.`}); }
}

}

function demissaoNoFimDaTemporada(pos){
  if(!L.diretoria) return false;
  if(pos <= L.diretoria.meta+6) return false;
  demitido();
  return true;
}

function demitido(){
  if(L.demitido) return;
  const tb=tabela(L), pos=tb.findIndex(x=>x.id===L.meuClube)+1;
  L.demitido={de:L.meuClube, pos, temporada:L.temporada, slot:L.slot};
  L.noticias.unshift({t:'bad', txt:`O ${clube(L.meuClube).nome} demitiu você. ${pos}º lugar, meta era ${L.diretoria?ordinal(L.diretoria.meta):'—'}.`});
  salvar(true);
  telaRecolocacao();
}

function clubesQueChamam(){
  const antigo = clube(L.demitido.de) || meuClube();
  const base = (antigo.niv||70) - 5 - Math.min(6, Math.max(0, (L.demitido.pos||10)-8));
  const tb = tabela(L);
  const naLiga = (typeof divisoes==='function') ? divisoes(L).A.concat(divisoes(L).B) : null;
  const brasileiros = L.clubs.filter(c=>!ehEuropeu(c.id) && c.id!==L.demitido.de
    && (naLiga ? naLiga.indexOf(c.id)>=0
               : (L.comps.brasileirao ? L.comps.brasileirao.clubes.includes(c.id) : true)));
  const r = rng((L.seed||'x')+'#recol'+L.temporada+'_'+L.demitido.pos);
  const ord = brasileiros
    .map(c=>{
      const i = tb.findIndex(x=>x.id===c.id);
      return {c, dist: Math.abs((c.niv||70)-base), pos: i>=0?i+1:null};
    })
    .sort((a,b)=>a.dist-b.dist);
  const perto = ord.slice(0, 8);
  const escolhidos=[];
  while(escolhidos.length<3 && perto.length){
    escolhidos.push(perto.splice(Math.floor(r()*perto.length),1)[0]);
  }
  return escolhidos;
}

function telaRecolocacao(){
  if(!L.demitido) return;
  const ofertas = clubesQueChamam();
  const antigo = clube(L.demitido.de);
  sheet('Você foi demitido', `
    <p class="sm" style="margin-bottom:10px">O <b>${esc(antigo?antigo.nome:'clube')}</b> encerrou seu ciclo — ${ordinal(L.demitido.pos)} lugar${L.diretoria?`, com meta de ${ordinal(L.diretoria.meta)}`:''}.</p>
    <p class="xs mut" style="margin-bottom:12px">Técnico bom não fica muito tempo parado. Três clubes ligaram:</p>
    <div class="stack" style="margin-bottom:12px">
      ${ofertas.map(o=>`<button class="plr" onclick="assumirNovoClube('${o.c.id}')">
        ${escudoSVG(o.c,26)}
        <span class="plr-n"><b>${esc(o.c.nome)}</b>
          <span>${esc(o.c.cidade)} · Série ${(typeof divisaoDe==='function'&&divisaoDe(o.c.id,L))||'A'}${o.pos?' · '+ordinal(o.pos)+'º na tabela':''} · elenco nível ${o.c.niv}</span></span>
        <span class="pill">Assumir</span></button>`).join('')}
    </div>
    <hr class="chalk" style="margin:12px 0">
    <button class="btn ghost wide" onclick="recomecarDoZero()">Apagar tudo e começar outra carreira</button>`);
}

function assumirNovoClube(cid){
  const c = clube(cid); if(!c) return;
  const antes = L.demitido ? L.demitido.de : null;
  L.meuClube = cid;
  L.demitido = null;
  L.propostas = [];

  L.diretoria.paciencia = 100; L.diretoria.avisos = 0;
  garanteElenco(L, cid); garanteTactics(L, cid);
  if(typeof aplicarTemaClube==='function') aplicarTemaClube(c);

    txt:`Você é o novo técnico do ${c.nome}. A diretoria quer ${ordinal(L.diretoria.meta)} lugar.`});

  // se a demissão veio no fim da temporada, agora dá pra virar o ano
  if(L.temporadaFim && typeof novaTemporadaBase==='function'){
    try{ novaTemporadaBase(); }catch(e){}
    fecharSheet();
  }
  render(); irPara('home');
  toast('Bem-vindo ao '+c.nome+'.');
}

function renderHome(){

function limparElencosOrfaos(L2){
  if(!L2 || !L2.squads) return 0;
  const vivos = {};
  vivos[L2.meuClube]=1;
  Object.values(L2.comps||{}).forEach(c=>(c.clubes||[]).forEach(id=>vivos[id]=1));
  L2.clubs.forEach(c=>{ if(typeof ehEuropeu==='function' && ehEuropeu(c.id)) vivos[c.id]=1; });
  let n=0;
  Object.keys(L2.squads).forEach(cid=>{ if(!vivos[cid]){ delete L2.squads[cid]; n++; } });
  L2.clubs = L2.clubs.filter(c=>vivos[c.id]);
  return n;
}

function novaTemporada(){

  try{ limparElencosOrfaos(L); }catch(e){}
  return r;
}

let _filaFesta=[];

function festa(titulo, subtitulo, cor1, cor2){
  // nunca por cima de uma decisão: se tem janela aberta, a taça espera
  const sh=document.getElementById('sheet');
  if(document.querySelector('.festa') || (sh && sh.classList.contains('on'))){
    _filaFesta.push([titulo,subtitulo,cor1,cor2]);
    if(!document.querySelector('.festa')) setTimeout(()=>{ const n=_filaFesta.shift(); if(n) festa.apply(null,n); }, 1500);
    return;
  }
  const el=document.createElement('div');
  el.className='festa';
  const papel=[];
  for(let i=0;i<70;i++){
    const x=(i*13.7)%100, d=(i%9)*0.13, dur=2.6+((i%7)*0.28), w=5+(i%4)*2;
    const cor=[cor1, cor2, '#FFC233', '#fff'][i%4];
    papel.push(`<i style="left:${x.toFixed(1)}%;background:${cor};animation-delay:${d.toFixed(2)}s;animation-duration:${dur.toFixed(2)}s;width:${w}px;height:${w+3}px;transform:rotate(${(i*47)%360}deg)"></i>`);
  }
  el.innerHTML=`<div class="festa-papel">${papel.join('')}</div>
    <div class="festa-in">
      <div class="festa-luz"></div>
      <div class="festa-trofeu">${trofeuSVG('#FFC233',104)}</div>

'use strict';

const JANELAS = [[1,6],[22,28]];

function janelaAberta(L){ return JANELAS.some(([a,b])=>L.slot>=a&&L.slot<=b); }

function proximaJanela(L){
  for(const [a,b] of JANELAS){ if(L.slot<a) return a; }
  return null;
}

function donoDe(pid){
  for(const cid in L.squads){ if(L.squads[cid].some(p=>p.id===pid)) return cid; }
  return null;
}

function importancia(cid, p){
  const el=L.squads[cid]||[]; if(!el.length) return .5;
  const melhores=el.slice().sort((a,b)=>b.ovr-a.ovr);
  const i=melhores.findIndex(x=>x.id===p.id);
  if(i<0) return .5;
  if(i<11) return 1;
  if(i<16) return .78;
  return .55;
}

function precoPedido(cid, p){
  if(p.pedido && cid===L.meuClube) return p.pedido;
  const imp=importancia(cid,p);
  const contrato = p.contrato<=1 ? .62 : p.contrato===2 ? .85 : 1.05;
  const listado = p.aVenda ? .82 : 1;
  const jovem = p.idade<=22 && p.pot-p.ovr>=6 ? 1.25 : 1;
  return Math.max(300000, Math.round(p.valor*(0.75+imp*0.75)*contrato*listado*jovem/100000)*100000);
}

function salarioPedido(p, meuClube){
  const c=clube(meuClube);
  const esc = c && c.escSal ? c.escSal : 1;
  const premio = 1.05 + (p.ovr>=78?0.20:p.ovr>=72?0.10:0.04);
  const base = Math.max(p.salario*1.05, salarioDe(p.ovr,p.idade)*esc);
  return Math.round(base*premio/1000)*1000;
}

function folhaDe(cid){ return (L.squads[cid]||[]).reduce((s,p)=>s+p.salario,0); }

function avaliarProposta(cid, p, oferta, ofSalario){
  const pedido=precoPedido(cid,p);
  const imp=importancia(cid,p);
  const el=L.squads[cid]||[];
  const mesmaPos=el.filter(x=>x.pos===p.pos&&x.id!==p.id).length;
  const euro = ehEuropeu(cid);
  if(el.length<=17) return {ok:false, motivo:'O elenco já está no limite mínimo.'};
  if(euro && p.ovr>=87) return {ok:false, motivo:'Intocável. O clube nem senta para conversar.'};
  if(mesmaPos<1 && imp===1) return {ok:false, motivo:`É o único ${p.pos} de nível no elenco.`};
  const exigido = euro ? 1.35 : 1.0;
  const razao=oferta/pedido;
  if(razao>=exigido) return {ok:true};
  if(!euro && razao>=0.82 && rnd()<0.55) return {ok:true};
  if(razao>=exigido*0.7) return {ok:false, contra:Math.round(pedido*exigido), motivo:euro?'Na Europa, só saem por muito mais.':'A diretoria quer mais.'};
  return {ok:false, motivo:'Proposta muito abaixo do que pedem.'};
}

function enviarProposta(pid, sal){
  const p=jog(pid), dono=donoDe(pid), c=meuClube();
  const oferta=Math.max(0, Math.round(+($('of-valor').value||0)));
  if(oferta>c.caixa){ toast('Caixa insuficiente: falta '+dinheiro(oferta-c.caixa)); return; }
  if(elenco(c.id).length>=40){ toast('Elenco cheio (máximo de 40).'); return; }
  const r=avaliarProposta(dono,p,oferta,sal);
  if(!r.ok){
    sheet('Proposta recusada', `<p class="sm" style="margin-bottom:12px">O <b>${esc(clube(dono).nome)}</b> recusou. ${esc(r.motivo||'')}</p>
      ${r.contra?`<div class="card flat" style="margin-bottom:12px"><div class="between sm">
        <span class="mut">Aceitam por</span><span class="mono">${dinheiro(r.contra)}</span></div></div>
        <button class="btn pri wide" ${r.contra>c.caixa?'disabled':''} onclick="fecharNegocio('${pid}',${r.contra},${sal})">
          ${r.contra>c.caixa?'Caixa insuficiente':'Aceitar contraproposta'}</button>`:''}
      <button class="btn ghost wide" style="margin-top:8px" onclick="fecharSheet()">Desistir</button>`);
    return;
  }
  // agora o jogador decide
  const folhaNova=folhaDe(c.id)+sal;
  const euro=ehEuropeu(dono);
  const titulos=(L.titulos||[]).length;
  const quer = folhaNova<=tetoFolha(c)*1.35
    && (euro ? (c.torcida>=4 && (p.ovr<=82 || titulos>0) && rnd()<0.72)
             : (c.torcida>=clube(dono).torcida-1 || rnd()<.5));
  if(!quer){
    sheet('Jogador recusou', `<p class="sm" style="margin-bottom:12px"><b>${esc(p.nome)}</b> não se convenceu do projeto${euro?' — sair da Europa para o Brasil pesa muito na conversa':' — o salário oferecido não cobre o que ele pede'}.</p>
      <button class="btn wide" onclick="fecharSheet()">Entendi</button>`);
    return;
  }
  fecharNegocio(pid, oferta, sal);
}

function fecharNegocio(pid, valor, sal){
  const p=jog(pid), dono=donoDe(pid), c=meuClube(), o=clube(dono);
  c.caixa-=valor; o.caixa+=valor;
  L.squads[dono]=L.squads[dono].filter(x=>x.id!==pid);
  p.aVenda=false; p.salario=sal; p.contrato=Math.max(3,p.contrato); p.moral=clamp(p.moral+10,0,100);
  L.squads[c.id].push(p);
  L.noticias.unshift({t:'good',txt:`${p.nome} (${p.pos}, ${p.ovr}) assina com o ${c.nome} por ${dinheiro(valor)}.`});

function propostasPorMeus(){
  const c=meuClube(); if(!c||!janelaAberta(L)) return;
  const alvos=elenco(c.id).filter(p=>p.aVenda||(p.ovr>=74&&rnd()<.12));
  alvos.forEach(p=>{
    const pedido=precoPedido(c.id,p);
    const justo = p.valor>0 ? clamp(1.6 - pedido/(p.valor*1.5), 0.15, 1.25) : 1;
    const chance = (p.aVenda ? .52*justo : .22);
    if(rnd()>chance) return;
    const compradores=L.clubs.filter(o=>o.id!==c.id&&o.caixa>pedido*0.9&&(L.squads[o.id]||[]).length<30);
    if(!compradores.length) return;
    const o=pick(compradores);
    const oferta=Math.round(pedido*(0.78+rnd()*0.42));
    L.propostas=L.propostas||[];
    L.propostas.push({pid:p.id, clubId:o.id, valor:oferta});
  });
  if(L.propostas&&L.propostas.length) enfileirar(mostrarProposta);
}

function mercadoIA(){
  if(!janelaAberta(L)) return;
  L.clubs.forEach(c=>{
    if(c.id===L.meuClube || ehEuropeu(c.id)) return;
    const el=L.squads[c.id]; if(!el) return;
    if(el.length>26 && rnd()<.4){ const fraco=el.slice().sort((a,b)=>a.ovr-b.ovr)[0]; if(fraco) fraco.aVenda=true; }
    if(rnd()<.10 && c.caixa>12000000){
      const alvos=[];
      L.clubs.forEach(o=>{ if(o.id===c.id||o.id===L.meuClube||ehEuropeu(o.id)) return;
        (L.squads[o.id]||[]).forEach(p=>{ if(p.aVenda&&precoPedido(o.id,p)<c.caixa*.35) alvos.push({p,o}); }); });
      if(alvos.length){
        const x=pick(alvos), preco=precoPedido(x.o.id,x.p);
        if((L.squads[x.o.id]||[]).length>18){
          c.caixa-=preco; x.o.caixa+=preco;
          L.squads[x.o.id]=L.squads[x.o.id].filter(y=>y.id!==x.p.id);
          x.p.aVenda=false; L.squads[c.id].push(x.p);
          garanteTactics(L,c.id); garanteTactics(L,x.o.id);
        }
      }
    }
  });
}

const JANELAS_AMIGOS = [[1,6],[19,24]];

function janelaAmigos(L){ return !L.temporadaFim && JANELAS_AMIGOS.some(([a,b])=>L.slot>=a&&L.slot<=b); }

function proxJanelaAmigos(L){ for(const [a] of JANELAS_AMIGOS){ if(L.slot<a) return a; } return null; }

function meusLances(){ L.lances=L.lances||{}; const k=chaveOrdem(L.meuClube); return (L.lances[k]=L.lances[k]||[]); }

function lanceDe(pid){ return meusLances().find(x=>x.pid===pid); }

function totalLances(){ return meusLances().reduce((s,x)=>s+x.valor,0); }

function minhasVendas(){ L.vendas=L.vendas||{}; return (L.vendas[L.meuClube]=L.vendas[L.meuClube]||{}); }

function precoListado(pid){ const d=donoDe(pid); const v=(L.vendas||{})[d]; return v?v[pid]:undefined; }

function ehHumano(cid){ return !!(L.managers&&L.managers[cid]); }

  const atual=lanceDe(pid);

  sheet('Lance por '+esc(p.nome), `

        ? `<div class="between sm"><span class="mut">${humano?'Mínimo pedido':'Preço pedido'}</span><span class="mono" style="color:var(--led)">${dinheiro(pedido)}</span></div>`

      <div class="between sm"><span class="mut">Seu caixa</span><span class="mono">${dinheiro(c.caixa)}</span></div>
      ${totalLances()?`<div class="between sm"><span class="mut">Já comprometido em lances</span><span class="mono">${dinheiro(totalLances())}</span></div>`:''}
    </div>
    ${humano&&pedido===null?`<p class="sm mut" style="margin-bottom:12px">O técnico do ${esc(clube(dono).nome)} ainda não colocou esse jogador na lista de negociação. Você pode deixar o lance mesmo assim — se ele listar antes de a rodada rodar, o lance vale.</p>`:''}
    <label class="fld" style="margin-bottom:10px"><span>Seu lance pelo passe</span>
      <input class="inp mono" id="lc-valor" type="number" step="100000" value="${atual?atual.valor:sug}"></label>

    </div>

    ${atual?`<button class="btn ghost wide" style="margin-top:8px" onclick="tirarLance('${pid}')">Retirar lance</button>`:''}`);
}

function setLance(v){ const el=$('lc-valor'); if(el) el.value=v; }

function confirmarLance(pid){
  const v=Math.max(0,Math.round(+(($('lc-valor')||{}).value||0)));
  const c=meuClube();
  if(v<=0){ toast('Coloque um valor.'); return; }
  const outros=totalLances()-(lanceDe(pid)?lanceDe(pid).valor:0);
  if(v+outros>c.caixa){ toast('Seus lances passam do caixa: sobra '+dinheiro(Math.max(0,c.caixa-outros))); return; }
  if(elenco(c.id).length>=40){ toast('Elenco cheio (máximo de 40).'); return; }
  const a=lanceDe(pid);
  if(a) a.valor=v; else meusLances().push({pid, valor:v});
  fecharSheet(); salvar(true); toast('Lance registrado.'); render();
  if(L.online){ if(meuOkOnline()) setTimeout(avisoCodigo,300); else publicarMercadoVivo(); }
  else if(L.ordens[chaveOrdem(L.meuClube)]) setTimeout(avisoCodigo,300);
}

function tirarLance(pid){
  const k=chaveOrdem(L.meuClube);
  L.lances[k]=meusLances().filter(x=>x.pid!==pid);
  fecharSheet(); salvar(true); render(); if(L.online) publicarMercadoVivo();
}

function avisoCodigo(){
  if(L.online){ toast('Você mudou depois do OK — dê OK de novo pra valer.'); publicarMercadoVivo(); return; }
  toast('Mande o código de novo para seus amigos.');
}

function publicarMercadoVivo(){
  if(!L||!L.online||!ON||!FB.uid||!L.meuClube) return;
  const lc={}; meusLances().forEach(x=>{ lc[x.pid]=x.valor; });
  const up={}; up['vendas/'+L.meuClube]=minhasVendas(); up['lances/'+L.meuClube]=lc;
  try{ fbRef().update(up).catch(()=>{}); }catch(e){}
}

function confirmarLista(pid){
  const v=Math.max(0,Math.round(+(($('vd-valor')||{}).value||0)));
  if(v<=0){ toast('Coloque um preço.'); return; }
  minhasVendas()[pid]=v;

function retirarLista(pid){
  delete minhasVendas()[pid];

function resolverMercadoAmigos(slot){
  const out=[];
  if(!L.lances) L.lances={};
  if(!L.vendas) L.vendas={};
  if(!janelaAmigos(L)){ mercadoIAAmigos(); return out; }

  const porPid={};
  Object.keys(L.managers).sort().forEach(cid=>{
    (L.lances['r'+slot+'_'+cid]||[]).forEach(x=>{
      if(!x||!x.pid||!(x.valor>0)) return;
      const p=jog(x.pid); if(!p) return;
      const dono=donoDe(x.pid); if(!dono||dono===cid) return;
      (porPid[x.pid]=porPid[x.pid]||[]).push({cid, valor:Math.round(x.valor), ia:false});
    });
  });
  lancesDaIA(slot, porPid);
  const maxDe=pid=>porPid[pid].reduce((m,x)=>Math.max(m,x.valor),0);
  const pids=Object.keys(porPid).sort((a,b)=> maxDe(b)-maxDe(a) || (a<b?-1:1));

  pids.forEach(pid=>{
    const p=jog(pid); if(!p) return;
    const dono=donoDe(pid); if(!dono) return;
    const humano=ehHumano(dono);
    const minimo = humano ? vendasNoSlot(dono, slot)[pid] : null;
    const bids=porPid[pid].slice().sort((x,y)=> y.valor-x.valor || (x.cid<y.cid?-1:1));
    let fechado=false;
    bids.forEach(b=>{
      if(fechado) return;
      const comp=clube(b.cid), vend=clube(dono);
      if(!comp||!vend) return;
      const elC=L.squads[b.cid]||[], elD=L.squads[dono]||[];
      if(elC.length>=40){ out.push({t:'x',pid,nome:p.nome,cid:b.cid,motivo:'elenco cheio'}); return; }
      if(elD.length<=17){ out.push({t:'x',pid,nome:p.nome,cid:b.cid,motivo:'o elenco do vendedor está no limite'}); return; }
      if(comp.caixa<b.valor){ out.push({t:'x',pid,nome:p.nome,cid:b.cid,motivo:'caixa insuficiente'}); return; }
      let aceita;
      if(humano) aceita = (minimo!==undefined && minimo!==null && b.valor>=minimo);
      else aceita = avaliarProposta(dono,p,b.valor,salarioPedido(p,b.cid)).ok;
      if(!aceita){
        out.push({t:'x',pid,nome:p.nome,cid:b.cid,
          motivo: humano ? (minimo===undefined||minimo===null?'não está na lista de negociação':'lance abaixo do mínimo pedido')
                         : 'o clube recusou'});
        return;
      }
      comp.caixa-=b.valor; vend.caixa+=b.valor;
      L.squads[dono]=L.squads[dono].filter(x=>x.id!==pid);
      p.aVenda=false; p.salario=salarioPedido(p,b.cid);
      p.contrato=Math.max(3,p.contrato||3); p.moral=clamp(p.moral+10,0,100);
      L.squads[b.cid].push(p);
      if(L.vendas[dono]) delete L.vendas[dono][pid];
      if(L.vendasSlot && L.vendasSlot['r'+slot+'_'+dono]) delete L.vendasSlot['r'+slot+'_'+dono][pid];
      garanteTactics(L,b.cid); garanteTactics(L,dono);
      fechado=true;
      const rivais=bids.filter(x=>x.cid!==b.cid).length;
      out.push({t:'ok',pid,nome:p.nome,pos:p.pos,ovr:p.ovr,cid:b.cid,de:dono,valor:b.valor,rivais,ia:!!b.ia});
      L.noticias.unshift({t:'good',
        txt:`${p.nome} (${p.pos} ${p.ovr}) sai do ${vend.nome} para o ${comp.nome} por ${dinheiro(b.valor)}.`});
    });
  });

  // os lances ficam guardados: é o que permite recalcular a rodada se alguém
  // rodou com um código velho (ver ressincronizar)
  mercadoIAAmigos();
  return out;
}


/* ---------- competição de mercado ----------
   Os clubes da máquina também disputam quem está na lista de negociação.
   Tudo sorteado pelo gerador semeado da rodada, então dá igual em todo celular. */
function precisaDe(cid, pos){
  const el=L.squads[cid]||[];
  const bons=el.filter(x=>x.pos===pos && x.ovr>=nivelClube(cid)-3).length;
  return bons<=1 ? 1.25 : bons<=2 ? 1.0 : 0.7;
}

function nivelClube(cid){
  const el=(L.squads[cid]||[]).slice().sort((a,b)=>b.ovr-a.ovr).slice(0,11);
  return el.length ? el.reduce((s,x)=>s+x.ovr,0)/el.length : 60;
}

/* Só o que os técnicos humanos colocaram na lista daquela rodada — lido do
   retrato da rodada, nunca do estado ao vivo, senão cada celular veria uma
   lista diferente e os resultados deixariam de bater. */
function listadosDaRodada(slot){
  const out=[];
  Object.keys(L.managers||{}).sort().forEach(dono=>{
    const v = (L.vendasSlot||{})['r'+slot+'_'+dono] || {};
    Object.keys(v).sort().forEach(pid=>{
      const p=jog(pid); if(!p) return;
      if(donoDe(pid)!==dono) return;
      if(!(v[pid]>0)) return;
      out.push({pid, dono, minimo:v[pid]});
    });
  });
  return out.sort((a,b)=> (jog(b.pid).ovr - jog(a.pid).ovr) || (a.pid<b.pid?-1:1));
}

function lancesDaIA(slot, porPid){
  const compradores = clubesDaLiga().filter(c=>!ehHumano(c.id));
  if(!compradores.length) return;
  listadosDaRodada(slot).forEach(item=>{
    const p=jog(item.pid); if(!p) return;
    const dono=item.dono;
    const nivelP=p.ovr;
    // quem tem caixa, vaga e precisa da posição entra na disputa
    const cands = compradores.filter(c=>{
      if(c.id===dono) return false;
      const el=L.squads[c.id]||[];
      if(el.length>=38) return false;
      if(nivelClube(c.id) > nivelP + 4) return false;          // não compra quem é pior que o elenco
      if(nivelClube(c.id) < nivelP - 9) return false;          // nem quem é longe demais
      return c.caixa >= item.minimo*1.05;
    });
    if(!cands.length) return;
    cands.sort((a,b)=> b.caixa-a.caixa || (a.id<b.id?-1:1));
    const quantos = Math.min(cands.length, rnd()<0.55 ? 1 : rnd()<0.85 ? 2 : 3);
    for(let k=0;k<quantos;k++){
      const c = cands[Math.floor(rnd()*Math.min(6,cands.length))];
      if(!c) continue;
      const fome = precisaDe(c.id, p.pos);
      const disposto = Math.min(c.caixa*0.55, p.valor * (0.92 + rnd()*0.42) * fome);
      if(disposto < item.minimo) continue;
      const valor = Math.round(Math.max(item.minimo, item.minimo*(1 + rnd()*0.12))/100000)*100000;
      const lista = (porPid[item.pid]=porPid[item.pid]||[]);
      if(lista.some(x=>x.cid===c.id)) continue;
      lista.push({cid:c.id, valor, ia:true});
    }
  });
}

/* Quantos clubes estão de olho num jogador que você listou — aparece na tela
   de mercado antes de a rodada rodar, pra dar peso à decisão de vender. */
function sondagensPor(pid){
  const p=jog(pid); if(!p) return [];
  const dono=donoDe(pid);
  const minimo=(L.vendas&&L.vendas[dono])?L.vendas[dono][pid]:undefined;
  if(minimo===undefined) return [];
  const amigos = Object.keys(L.managers||{}).filter(cid=>{
    if(cid===dono) return false;
    const lc=(typeof ON!=='undefined'&&ON&&ON.lances)?(ON.lances[cid]||{}):null;
    return lc && lc[pid]!==undefined;
  }).map(cid=>({cid, humano:true}));
  const maq = clubesDaLiga().filter(c=>{
    if(c.id===dono || ehHumano(c.id)) return false;
    const el=L.squads[c.id]||[];
    if(el.length>=38 || c.caixa < minimo*1.05) return false;
    const n=nivelClube(c.id);
    return n <= p.ovr+4 && n >= p.ovr-9;
  }).sort((a,b)=>b.caixa-a.caixa).slice(0,4).map(c=>({cid:c.id, humano:false}));
  return amigos.concat(maq);
}

function vendasNoSlot(cid, slot){
  return (L.vendasSlot && L.vendasSlot['r'+slot+'_'+cid]) || (L.vendas && L.vendas[cid]) || {};
}

function mercadoIAAmigos(){
  if(!janelaAmigos(L)) return;
  const livres=clubesDaLiga().filter(c=>!ehHumano(c.id));
  livres.forEach(c=>{
    const el=L.squads[c.id]; if(!el) return;
    if(el.length>26 && rnd()<.30){ const fraco=el.slice().sort((a,b)=>a.ovr-b.ovr)[0]; if(fraco) fraco.aVenda=true; }
    if(rnd()<.09 && c.caixa>15000000){
      const alvos=[];
      livres.forEach(o=>{ if(o.id===c.id) return;
        (L.squads[o.id]||[]).forEach(p=>{ if(p.aVenda&&precoPedido(o.id,p)<c.caixa*.35) alvos.push({p,o}); }); });
      if(alvos.length){
        alvos.sort((a,b)=> b.p.ovr-a.p.ovr || (a.p.id<b.p.id?-1:1));
        const x=alvos[Math.floor(rnd()*Math.min(5,alvos.length))];
        const preco=precoPedido(x.o.id,x.p);
        if((L.squads[x.o.id]||[]).length>18 && (L.squads[c.id]||[]).length<38){
          c.caixa-=preco; x.o.caixa+=preco;
          L.squads[x.o.id]=L.squads[x.o.id].filter(y=>y.id!==x.p.id);
          x.p.aVenda=false; L.squads[c.id].push(x.p);
          garanteTactics(L,c.id); garanteTactics(L,x.o.id);
        }
      }
    }
  });
}

function seloRodada(slot){
  if(!L.comps || !L.comps.brasileirao) return '----';
  const partes=[];
  fixturesDoSlot(L, slot).forEach(bl=>{
    (bl.jogos||[]).forEach(g=>{
      if(!g||!g.h||!g.a) return;
      const r=bl.comp.resultados[chave(bl.comp,bl.fase,bl.rodada,g.h,g.a)];
      partes.push(bl.comp.id+g.h+g.a+(r?r.hg+'-'+r.ag:'x'));
    });
  });
  if(!partes.length) return '----';
  const s=partes.join('|');
  const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let h=hashStr(s), out='';
  for(let i=0;i<4;i++){ out+=AL[h%32]; h=Math.floor(h/32); }
  return out;
}

function ultimaRodadaJogada(){ return Math.max(1, Math.min(L.slot-1, fimSlot(L))); }

function ressincronizar(){
  const alvo=L.slot;
  const guardado={ ordens:L.ordens, lances:L.lances, vendas:L.vendas, vendasSlot:L.vendasSlot,
    managers:L.managers, meuClube:L.meuClube, nome:L.nome, seed:L.seed, code:L.code,
    treino:L.treino };
  montarLigaAmigos(guardado.seed, guardado.code, guardado.nome);
  L.ordens=guardado.ordens; L.lances=guardado.lances; L.vendas=guardado.vendas;
  L.vendasSlot=guardado.vendasSlot; L.managers=guardado.managers;
  L.meuClube=guardado.meuClube; L.treino=guardado.treino;
  Object.keys(L.managers).forEach(cid=>garanteTactics(L,cid));
  let g=0;
  while(L.slot<alvo && L.slot<=fimSlot(L) && g++<80) rodarUmaRodadaAmigos();
  if(L.slot>fimSlot(L)) fecharTemporadaAmigos();
  // devolve os marcadores de "à venda" do que ainda está listado
  Object.keys(L.vendas||{}).forEach(cid=>Object.keys(L.vendas[cid]||{}).forEach(pid=>{
    const p=jog(pid); if(p) p.aVenda=true; }));
  aplicarTemaClube(meuClube());
  salvar(true); fecharSheet(); render();
  sheet('Liga recalculada', `
    <p class="sm" style="margin-bottom:12px">Refiz da rodada 1 até a ${ultimaRodadaJogada()}. Compare os selos com seus amigos:</p>
    <div class="card flat" style="margin-bottom:12px">
      ${(()=>{const ate=ultimaRodadaJogada(), o=[];
        for(let r=Math.max(1,ate-4); r<=ate; r++) o.push(`<div class="between sm"><span class="mut">Rodada ${r}</span>
          <span class="mono" style="font-size:16px;font-weight:600;letter-spacing:.12em">${seloRodada(r)}</span></div>`);
        return o.join('');})()}
    </div>
    <button class="btn pri wide" onclick="fecharSheet()">Beleza</button>`);
}

function rodarUmaRodadaAmigos(){
  const slot=L.slot, transfs=[];
  R.r = rng(L.seed+'#m'+slot);
  resolverMercadoAmigos(slot).forEach(t=>transfs.push(t));
  R.r=Math.random;
  Object.keys(L.managers).forEach(cid=>{
    const o=L.ordens[chaveOrdem(cid, slot)];
    if(o&&o.tac){ const cl=clube(cid); cl.tactics=JSON.parse(JSON.stringify(o.tac));
      cl.tactics.auto=false; cl.tactics.rodizio=false; normalizarBanco(cid, cl.tactics); }
  });
  if(typeof aplicarAcoesDaSemana==='function') aplicarAcoesDaSemana(slot);
  R.r = rng(L.seed+'#r'+slot);
  simularSemanaAmigos(L, slot);
  R.r = rng(L.seed+'#s'+slot);
  aplicarSemanaAmigos();
  L.slot++;
  R.r = rng(L.seed+'#p'+L.slot);
  prepararSlot(L, L.slot);
  R.r=Math.random;
  return transfs;
}

/* Todos os jogos da semana, em todas as competições, sempre na mesma ordem. */
function simularSemanaAmigos(L2, slot){
  fixturesDoSlot(L2, slot).forEach(bl=>{
    (bl.jogos||[]).forEach(g=>{
      if(!g||!g.h||!g.a) return;
      const ch=chave(bl.comp, bl.fase, bl.rodada, g.h, g.a);
      if(bl.comp.resultados[ch]) return;
      garanteElenco(L2, g.h); garanteElenco(L2, g.a);
      // a narração só é guardada para os MEUS jogos: é o único replay que este
      // aparelho vai abrir, e guardar a de todo mundo estoura o espaço do celular
      const meu = (g.h===L2.meuClube || g.a===L2.meuClube);
      const P=criarPartida(L2,g.h,g.a,null);
      if(typeof ajustarAtmosfera==='function') ajustarAtmosfera(P, bl.comp, bl.fase, bl.rodada);
      simularTudo(P);
      registrarResultado(L2,bl.comp,bl.fase,bl.rodada,g.h,g.a,P.hg,P.ag,
        P.publico, meu?compactar(P.eventos):null, extraDoJogo(L2, bl.comp, P, meu));
    });
  });
}

function confirmarVenda(pid){
  const p=jog(pid); if(!p) return;
  const v=Math.max(300000, Math.round((parseInt(($('pedido-in')||{}).value,10)||p.valor)/100000)*100000);
  p.pedido=v; p.aVenda=true;
  if(L.modo==='amigos'){
    L.vendas=L.vendas||{}; L.vendas[L.meuClube]=L.vendas[L.meuClube]||{};
    L.vendas[L.meuClube][pid]=v;
  }
  fecharSheet(); salvar(); toast(p.nome+' à venda por '+dinheiro(v)); render();
  if(L.online){ publicarMercadoVivo(); if(meuOkOnline()) setTimeout(avisoCodigo,300); }
}

function tirarDaVenda(pid){
  const p=jog(pid); if(!p) return;
  p.aVenda=false; delete p.pedido;
  if(L.modo==='amigos' && L.vendas && L.vendas[L.meuClube]) delete L.vendas[L.meuClube][pid];
  fecharSheet(); salvar(); toast(p.nome+' saiu da lista.'); render();

}

function batedorFalta(S){
  if(S.instr && S.instr.falta){
    const b=S.emCampo.find(u=>u.id===S.instr.falta && !u.fora);
    if(b) return b;
  }
  const cands=S.emCampo.filter(u=>!u.fora && u.slot!=='GOL');
  if(!cands.length) return null;
  const nota=u=>u.p.ovr*( {MEI:1.12, PON:1.06, ATA:1.02, VOL:0.98, LAT:0.94, ZAG:0.88}[u.slot] || 1 )
             + (u.p.estrela==='falta'?14:0);
  return cands.sort((a,b)=>nota(b)-nota(a))[0];
}

function chanceFalta(bat){
  if(!bat) return 0.05;
  let c = 0.045 + (bat.p.ovr-70)*0.0042;
  if(bat.p.estrela==='falta') c += 0.075;
  return clamp(c, 0.02, 0.22);
}

function semAcento(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

function marcarEstrelas(L){
  if(!L || !L.squads) return;
  L._estClubes = L._estClubes || {};
  if(L._estClubes.__reais) return;
  L._estClubes.__reais = 1;
  // limpa qualquer estrela sorteada de versões antigas
  Object.keys(L.squads).forEach(cid=>(L.squads[cid]||[]).forEach(p=>{ if(p.estrela && !p.estrelaReal) delete p.estrela; }));
  CRAQUES_REAIS.forEach(([nome, cidPref, tipo])=>{
    const alvo=semAcento(nome);
    // sem clube fixo: só procura nos clubes da Europa (evita homônimos brasileiros)
    const cids = cidPref ? [cidPref] : Object.keys(L.squads).filter(cid=>typeof ehEuropeu==='function' && ehEuropeu(cid));
    for(const cid of cids){
      const el=L.squads[cid]||[];
      // nome inteiro igual, ou nome do jogo terminando com o nome buscado (ex.: "Giorgian de Arrascaeta")
      const p=el.find(x=>{ const n=semAcento(x.nome); return n===alvo || n.endsWith(' '+alvo) || (alvo.indexOf(' ')<0 && n.split(' ')[0]===alvo && !cidPref && false); });
      if(p){ p.estrela=tipo; p.estrelaReal=true;
        if(tipo==='faro'||tipo==='paredao'||tipo==='muralha') p.ovr=Math.min(93, p.ovr+1);
        p.valor=Math.round(p.valor*1.22/100000)*100000; break; }
    }
  });
}

function estrelaSelo(p){

  return `<i class="selo-estrela" title="${esc(ESTRELAS[p.estrela].n)}">★</i>`;
}

function craqueCls(p){ return (p && p.estrela && ESTRELAS[p.estrela]) ? ' craque' : ''; }

function estrelaTexto(p){
  if(!p || !p.estrela || !ESTRELAS[p.estrela]) return '';
  const e=ESTRELAS[p.estrela];
  return `<div class="craque-lin"><i>${e.i}</i><span><b>${esc(e.n)}</b>${esc(e.d)}</span></div>`;
}

function forcas(S){
  const f = forcasBase(S);
  let atk=0, mid=0, def=0;
  S.emCampo.forEach(u=>{
    if(u.fora || !u.p.estrela) return;
    if(u.p.estrela==='faro')    atk+=1.6;
    if(u.p.estrela==='veloz')   { atk+=0.9; mid+=0.5; }
    if(u.p.estrela==='maestro') { mid+=1.6; atk+=0.5; }
    if(u.p.estrela==='muralha') def+=1.5;
    if(u.p.estrela==='paredao') def+=1.8;
  });
  return Object.assign({}, f, {def:f.def+def, mid:f.mid+mid, atk:f.atk+atk});
}

async function baixarLiga(code){
  if(!DB) return false;
  try{
    const snap=await DB.doc(P.info(code)).get();
    if(!snap.exists) return false;
    const d=snap.data();
    const L2 = {v:1, code, modo:'amigos', nome:d.nome, seed:d.seed, size:d.size,
      temporada:d.temporada, rodada:d.rodada, fixtures:d.fixtures, clubs:d.clubs,
      squads:{}, resultados:{}, managers:{}, ordens:{}, noticias:d.noticias||[],
      historico:d.historico||[], treino:d.treino||'equilibrado', meuClube:null,
      diretoria:null, temporadaFim:!!d.temporadaFim};
    const sq=await Promise.all(L2.clubs.map(c=>DB.doc(P.squad(code,c.id)).get()));
    sq.forEach((s,i)=>{ L2.squads[L2.clubs[i].id] = s.exists?s.data().js:[]; });
    const rs=await DB.doc(P.res(code)).get();
    if(rs.exists) L2.resultados=rs.data().r||{};
    const mg=await DB.collection(P.mgr(code)).get();
    (mg.docs||[]).forEach(x=>{ L2.managers[x.id]=x.data(); });
    const or=await DB.collection(P.ord(code)).get();
    (or.docs||[]).forEach(x=>{ L2.ordens[x.id]=x.data(); });
    L=L2; salvarComEspaco('vest_liga_'+code,L);
    return true;
  }catch(e){ return false; }
}

function assinarLiga(){
  if(!DB||!L||!L.code) return;
  if(unsub){try{unsub()}catch(e){}}
  try{
    const u1=DB.doc(P.info(L.code)).onSnapshot(s=>{

      const d=s.data();
      if(d.rodada>L.rodada){ toast('Rodada '+(d.rodada-1)+' encerrada!'); baixarLiga(L.code).then(()=>{
        const meu=Object.keys(L.managers).find(cid=>L.managers[cid].id===ME.id); if(meu)L.meuClube=meu; render(); }); }
    },()=>{});
    const u2=DB.collection(P.ord(L.code)).onSnapshot(s=>{
      if(!L) return; (s.docs||[]).forEach(x=>{L.ordens[x.id]=x.data();});
      if(TELA==='home') render();
    },()=>{});
    const u3=DB.collection(P.mgr(L.code)).onSnapshot(s=>{

      if(TELA==='home'||TELA==='league') render();
    },()=>{});
    unsub=()=>{[u1,u2,u3].forEach(f=>{try{f&&f()}catch(e){}});};
  }catch(e){}
}

function coberturaAte(cid){
  if(L.online&&ON) return coberturaOnline(cid);
  let r=L.slot-1;
  while(L.ordens[chaveOrdem(cid, r+1)] && r+1<=fimSlot(L)) r++;
  return r;
}

function rodadasProntas(){
  const ids=Object.keys(L.managers);
  if(!ids.length) return 0;
  return Math.max(0, Math.min.apply(null, ids.map(coberturaAte)) - L.slot + 1);
}

function enviarOrdens(n){
  if(L.online&&ON) return enviarOrdensOnline(n);

  L.vendasSlot=L.vendasSlot||{};

function resumoPeriodo(de, ate, posAntes){
  const tb=tabela(L);
  const pos=tb.findIndex(x=>x.id===L.meuClube)+1;
  const meus=[];
  for(let r=de;r<=ate;r++){
    const B=L.comps.brasileirao, idx=B.slots.indexOf(r);
    (B.fixtures[idx]||[]).forEach(g=>{
      if(g.h!==L.meuClube&&g.a!==L.meuClube) return;
      const res=B.resultados[chave(B,'liga',idx,g.h,g.a)];
      if(res) meus.push({r,h:g.h,a:g.a,hg:res.hg,ag:res.ag});
    });
  }
  let v=0,e=0,d=0,gp=0,gc=0;
  meus.forEach(m=>{ const casa=m.h===L.meuClube; const meu=casa?m.hg:m.ag, del=casa?m.ag:m.hg;
    gp+=meu; gc+=del; if(meu>del)v++; else if(meu===del)e++; else d++; });
  const dif = posAntes-pos;
  sheet(`Rodadas ${de} a ${ate}`, `
    <div class="grid2" style="margin-bottom:12px">
      <div class="card flat" style="text-align:center"><div class="eyebrow">Aproveitamento</div>
        <div class="mono" style="font-size:24px;font-weight:600">${v}V ${e}E ${d}D</div>
        <div class="xs mut">${gp} gols pró · ${gc} contra</div></div>
      <div class="card flat" style="text-align:center"><div class="eyebrow">Posição</div>
        <div class="mono" style="font-size:24px;font-weight:600">${pos}º</div>
        <div class="xs" style="color:${dif>0?'var(--ok)':dif<0?'var(--danger)':'var(--muted)'}">
          ${dif>0?'▲ subiu '+dif:dif<0?'▼ caiu '+(-dif):'manteve'}</div></div>
    </div>
    <div class="eyebrow" style="margin-bottom:4px">Seus jogos</div>
    ${meus.map(m=>linhaJogo(m.h,m.a,m.hg,m.ag,true)).join('')}
    <hr class="chalk" style="margin:12px 0">
    <div class="eyebrow" style="margin-bottom:4px">Classificação</div>
    <table class="tbl"><tbody>${tb.slice(0,6).map((x,i)=>`<tr class="${x.id===L.meuClube?'me':''}">
      <td style="text-align:left;width:18px">${i+1}</td>
      <td><span class="tb-cl">${barraClube(clube(x.id))}${esc(clube(x.id).nome)}</span></td>
      <td>${x.j}</td><td><b>${x.p}</b></td></tr>`).join('')}</tbody></table>
    <button class="btn pri wide" style="margin-top:12px" onclick="fecharSheet()">Continuar</button>`);
}

function aplicarSemanaAmigos(){
  // economia: todo clube da liga fatura e paga folha (igual em todos os aparelhos)
  clubesDaLiga().forEach(c=>{ semanaFinanceira(c, jogosEmCasaDoSlot(L, c.id, L.slot)); });
  Object.keys(L.squads).forEach(cid=>{
    L.squads[cid].forEach(p=>{
      p.energia=clamp(p.energia+recuperaSemana(p, L.treino),0,100);
      if(p.lesao>0) p.lesao=Math.max(0,p.lesao-1);
      let ganho=0;
      if(p.ovr<p.pot) ganho=(p.idade<=19?0.185:p.idade<=21?0.155:p.idade<=23?0.115:p.idade<=26?0.058:p.idade<=29?0.028:0.014)*fatorDesempenho(p);
      const SEM=38, gol=p.pos==='GOL';
      const limiar=gol?33:30, taxa=gol?0.22:0.36, teto=gol?3.0:4.0;
      if(p.idade>=limiar) ganho -= Math.min(teto, taxa*(p.idade-limiar+1))/SEM;
      p.ovrF=(p.ovrF||p.ovr)+ganho;
      p.ovr=clamp(Math.round(p.ovrF),45,92);
      p.valor=valorDeMercado(p.ovr,p.idade);
      if(p.ovr0===undefined) p.ovr0=p.ovr;
    });
  });
  if(L.slot%6===0) noticiaRodada(L);
  L.noticias=L.noticias.slice(0,12);
}

function lerCodigoEntrada(txt){
  const p=String(txt||'').trim().split('|');
  if(p[0]!=='J1'||p.length<2) return null;
  return {clubId:p[1], nome:(p[2]||'Técnico').trim()};
}

function registrarTecnico(cid, nome){
  if(!cid || !L.clubs.find(c=>c.id===cid)) return false;
  if(cid===L.meuClube) return true;
  if(!L.managers[cid]) L.managers[cid]={id:'r'+cid, nome:nome||'Técnico', local:false};
  else if(nome && nome!=='Técnico') L.managers[cid].nome=nome;
  garanteTactics(L,cid);
  return true;
}

function aplicarCodigoOrdens(txt){
  const ent=lerCodigoEntrada(txt);
  if(ent){
    const ok=registrarTecnico(ent.clubId, ent.nome);
    if(ok){ L.noticias.unshift({t:'led', txt:`${ent.nome} assume o ${clube(ent.clubId).nome} na ${L.nome}.`}); salvar(true); }
    return ok;
  }
  const o=lerCodigoOrdens(txt);
  if(!o) return false;
  if(!L.clubs.find(c=>c.id===o.clubId)) return false;
  registrarTecnico(o.clubId, (o.nome||'').trim());     // quem manda escalação é técnico
  L.lances=L.lances||{}; L.vendas=L.vendas||{}; L.vendasSlot=L.vendasSlot||{};
  if(o.lances) L.lances['r'+o.slot+'_'+o.clubId]=o.lances.filter(x=>jog(x.pid));
  if(o.vendas){
    const v={}; o.vendas.forEach(x=>{ if((L.squads[o.clubId]||[]).some(p=>p.id===x.pid)) v[x.pid]=x.valor; });
    L.vendas[o.clubId]=v;
    for(let r=o.slot; r<=Math.min(o.ate, fimSlot(L)); r++) L.vendasSlot['r'+r+'_'+o.clubId]=v;
  }
  // garotos da base sobem na hora em que o código chega (antes de conferir a escalação)
  if(o.acoes && o.acoes.base && typeof promoverDaBase==='function') o.acoes.base.forEach(i=>promoverDaBase(o.clubId, i, true));
  const el=L.squads[o.clubId]||[];
  o.tac.titulares=o.tac.titulares.filter(id=>el.some(p=>p.id===id));
  if(o.tac.titulares.length!==11) return false;
  o.tac.banco=el.filter(p=>!o.tac.titulares.includes(p.id)&&p.lesao<=0)
    .sort((a,b)=>b.ovr-a.ovr).slice(0,7).map(p=>p.id);
  for(let r=o.slot; r<=Math.min(o.ate, fimSlot(L)); r++)
    L.ordens['r'+r+'_'+o.clubId]={tac:o.tac, ts:Date.now(), acoes:(r===o.slot&&o.acoes)?o.acoes:null};
  return true;
}

/* Momento de decisão: o jogo para e você escolhe. A opção do seu plano
   vem marcada — é só confirmar se estiver de acordo. */
const OPCOES_MOMENTO = [
  ['manter','pressao','recuar','curto','direto','lados'],
  ['manter','ofensivo','total','segurar','atacante','zagueiro']
];

function sheetMomento(side, k){
  const S = side==='h'?M.h:M.a, O = side==='h'?M.a:M.h;
  const meu = side==='h'?M.hg:M.ag, dele = side==='h'?M.ag:M.hg;
  const sit = situacaoDe(M,S);
  const plano = acaoDoMomento(M,S,k);
  const eu=S.emCampo.filter(u=>!u.fora);
  const cansados=eu.filter(u=>u.energia<62).length;
  const posse=Math.round(100*S.posse/Math.max(1,M.min));
  const bancoAta=entraDoBanco(S,'ATA'), bancoZag=entraDoBanco(S,'ZAG');
  const opcoes=OPCOES_MOMENTO[k].filter(a=>{
    if(a==='atacante') return !!bancoAta && S.subs<3;
    if(a==='zagueiro') return !!bancoZag && S.subs<3;
    return true;
  });
  sheet(`${M.min}' · sua decisão`, `
    <div class="board" style="margin-bottom:10px"><div class="board-row">
      <span class="board-team">${esc(M.h.clube.sigla)}</span><span class="board-score">${M.hg}</span>
      <span class="board-score" style="opacity:.3;font-size:20px">:</span><span class="board-score">${M.ag}</span>
      <span class="board-team r">${esc(M.a.clube.sigla)}</span></div>
      <div class="board-clock">${k===0?'LEITURA DO JOGO':'RETA FINAL'} · ${M.min}'</div></div>
    <div class="barrinha" style="margin-bottom:10px">
      <span><b>${posse}%</b>posse</span>
      <span><b>${S.chutes}</b>chutes</span>
      <span class="${cansados?'al':''}"><b>${cansados}</b>no limite</span>

function conversa(tipo, ficar){

  if(tipo==='cobrar'){ d = sit<0?7:sit===0?3:-5; txt = sit<0?'A bronca acertou o tom, o time voltou ligado.':sit===0?'O time voltou mais ligado.':'Cobrança com o jogo ganho soou injusta.'; }
  if(tipo==='acalmar'){ d = sit===0?5:2; txt='Discurso calmo, o time volta organizado.'; }
  eu.emCampo.forEach(u=>{ if(!u.fora) u.p.moral=clamp(u.p.moral+d,5,100); });
  M.eventos.push({min:45,add:0,t:'sys',side:M.liveSide,txt:'Vestiário: '+txt,cls:'sys'});

function campanhaDoClube(L, cid){
  const B=L.comps&&L.comps.brasileirao;
  if(!B) return {pos:10, ppj:1.3, forma:[]};
  const tb=tabelaComp(L,B);
  const i=tb.findIndex(x=>x.id===cid);
  if(i<0) return {pos:10, ppj:1.3, forma:[]};
  const x=tb[i];
  return {pos:i+1, ppj: x.j? x.p/x.j : 1.3, forma:x.forma.slice(-5), total:tb.length};
}

function ehClassico(h, a){
  const A=clube(h), B=clube(a); if(!A||!B) return false;
  if(A.cidade && A.cidade===B.cidade) return true;
  return A.uf===B.uf && (A.torcida||0)>=3 && (B.torcida||0)>=3;
}

function publicoDoJogo(L, h, a, comp, fase, rodada){
  const c=clube(h), v=clube(a);
  if(!c) return {publico:5000, pct:.5, atmosfera:1, motivo:''};
  const cap=c.estadio||20000;
  const camp=campanhaDoClube(L,h);
  let pct = 0.30 + 0.055*(c.torcida||1);              // 0,36 a 0,58 de base
  const motivos=[];                                    // {t:texto, p:prioridade}
  const mot=(t,pr)=>motivos.push({t, p:pr});

  // campanha: aproveitamento e posição
  pct += clamp((camp.ppj-1.35)*0.16, -0.13, 0.17);
  const ult=camp.forma;
  if(ult.length>=3){
    const v3=ult.filter(x=>x==='V').length, d3=ult.filter(x=>x==='D').length;
    pct += v3*0.028 - d3*0.030;
    if(v3>=4) mot('time embalado', 2);
    if(d3>=4) mot('clima pesado', 2);
  }
  if(camp.pos<=4 && camp.ppj>1.5){ pct+=0.07; mot(camp.pos===1?'líder do Brasileirão':'time no G4', 4); }
  if(camp.pos>=17 && camp.total>=20){ pct-=0.05; }

  // tamanho do jogo
  const compId=comp?comp.id:'brasileirao';
  if(compId==='estadual'){ pct-=0.14; }
  else if(compId==='continental'){ pct+=0.13; mot('noite de Libertadores', 7); }
  else if(compId==='copabr'){ pct+=0.05; }
  else if(compId==='intercont'){ pct+=0.22; mot('jogo de Mundial', 9); }
  const mult={oitavas:1.02, quartas:1.05, semi:1.10, final:1.18}[fase];
  if(mult){ pct*=mult; mot(fase==='final'?'decisão':fase==='semi'?'semifinal':'mata-mata', fase==='final'?10:fase==='semi'?8:6); }

  // adversário: torcida grande e clássico enchem
  pct += 0.022*Math.max(0,(v?v.torcida:1)-2);
  if(ehClassico(h,a)){ pct+=0.16; mot('clássico', 8); }

  // reta final com o campeonato em jogo
  if(compId==='brasileirao' && rodada>=30){
    if(camp.pos<=6 || camp.pos>=16){ pct+=0.06; mot(camp.pos<=6?'briga pelo título':'fuga do rebaixamento', 5); }
  }

  pct = clamp(pct*(0.96+rnd()*0.08), 0.18, 1);
  // estádio maior só enche se a torcida acompanha
  const demanda = (typeof demandaTorcida==='function') ? demandaTorcida(c) : cap;
  const publico = Math.round(clamp(Math.min(cap, demanda)*pct, 900, cap));
  // atmosfera: o quanto a casa empurra (1,02 a 1,13)
  const atmosfera = 1 + 0.035 + 0.075*Math.pow(clamp((pct-0.25)/0.75,0,1), 1.15);
  motivos.sort((x,y)=>y.p-x.p);
  return {publico, pct, atmosfera, motivo:(motivos[0]||{}).t||''};
}

function ajustarAtmosfera(M, comp, fase, rodada){
  if(!M||!M.h||!M.a) return M;
  const r=publicoDoJogo(M.L||L, M.h.clubId, M.a.clubId, comp, fase, rodada);
  M.publico=r.publico; M.lotacao=r.pct; M.motivoJogo=r.motivo;
  K.HOME = r.atmosfera;                 // vale só para esta simulação
  return M;
}

function descricaoCasa(pct){
  if(pct>=0.95) return 'lotação máxima';
  if(pct>=0.82) return 'casa cheia';
  if(pct>=0.62) return 'boa presença';
  if(pct>=0.42) return 'público mediano';
  if(pct>=0.26) return 'arquibancada vazia';
  return 'estádio às moscas';
}

function estadioFaixaSVG(c, pct, sigla){
  const dens = clamp(pct||0.5, 0, 1);
  const n = Math.round(150 + dens*470);
  let torcida='';
  for(let i=0;i<n;i++){
    const x=((i*37.7)%100), y=3.4+((i*23.3)%16.6);
    const cor = i%3===0 ? (c.cor2||'#fff') : (c.cor||'#0B6B45');
    torcida += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i%6===0?0.75:0.5}" fill="${cor}" opacity="${(0.3+((i%4)*0.17)).toFixed(2)}"/>`;
  }
  const luzes=[16,50,84].map(x=>`<g><rect x="${x-2.6}" y="0.6" width="5.2" height="2.6" rx=".8" fill="#F5D98A"/>
    <path d="M${x-13} 24 L${x-2.6} 2.4 L${x+2.6} 2.4 L${x+13} 24 Z" fill="url(#fx)" opacity=".42"/></g>`).join('');
  return `<svg class="est-faixa" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="fx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9AE" stop-opacity=".5"/><stop offset="1" stop-color="#FFE9AE" stop-opacity="0"/></linearGradient>
      <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1B7A4C"/><stop offset="1" stop-color="#0C4C2E"/></linearGradient></defs>
    <rect width="100" height="30" fill="#0A1420"/>
    ${luzes}
    <rect y="2.4" width="100" height="18" fill="#16202B"/>
    <rect y="2.4" width="100" height="1" fill="#0E1720"/>
    ${torcida}
    <rect y="20.4" width="100" height="1.4" fill="#0A1119"/>
    <rect y="21.8" width="100" height="8.2" fill="url(#gr)"/>
    ${[0,1,2,3,4,5].map(i=>`<rect x="${i*17}" y="21.8" width="8.5" height="8.2" fill="#fff" opacity="${i%2?0.055:0}"/>`).join('')}
    <rect x="34" y="24.4" width="32" height="5.6" fill="none" stroke="rgba(255,255,255,.22)" stroke-width=".35"/>
  </svg>`;
}

function momentoBarra(M){
  // pressão dos últimos 12 minutos, pelas finalizações
  const desde=Math.max(0,M.min-12);
  let ch={h:0,a:0};
  M.eventos.forEach(e=>{ if(e.min<desde||!e.side) return;
    if(['gol','defesa','trave','fora','chance','penalti'].includes(e.t)) ch[e.side]+= (e.t==='gol'?2.2:e.t==='penalti'?2:1); });
  const tot=ch.h+ch.a;
  const p = tot? ch.h/tot : 0.5;
  return Math.round(p*100);
}

function fecharTemporadaAmigos(){
  const A=tabelaComp(L,L.comps.brasileirao);
  const B=L.comps.serieb ? tabelaComp(L,L.comps.serieb) : [];
  const minha=tabela(L);
  L.temporadaFim=true;
  A.forEach((x,i)=>{ const cl=clube(x.id); if(cl) cl.caixa+=premioPosicao(i+1); });
  B.forEach((x,i)=>{ const cl=clube(x.id); if(cl) cl.caixa+=Math.round(premioPosicao(i+1)*0.32); });
  L.noticias.unshift({t:'led',txt:`${clube(A[0].id).nome} é campeão do Brasileirão ${L.temporada}.`});
  if(B.length) L.noticias.unshift({t:'',txt:`${clube(B[0].id).nome} é campeão da Série B e sobe.`});
  if(typeof registrarGaleria==='function') registrarGaleria(L);
  L.balanco = {
    temporada:L.temporada,
    campeaoA:A[0]?A[0].id:null, campeaoB:B[0]?B[0].id:null,
    sobem:B.slice(0,4).map(x=>x.id), caem:A.slice(-4).map(x=>x.id),
    minhaPos: minha.findIndex(x=>x.id===L.meuClube)+1, minhaDiv: minhaDivisao(),
    pts: (minha.find(x=>x.id===L.meuClube)||{}).p||0
  };
  if(minha[0] && minha[0].id===L.meuClube){
    const c=meuClube();
    festa(minhaDivisao()==='B'?'Série B':L.nome, `${c.nome} · campeão com ${minha[0].p} pontos`, c.cor||'#0B6B45', c.cor2||'#FFFFFF');
  }
}

/* Vira a temporada da liga com amigos: acesso, rebaixamento, elencos.
   Tudo semeado pelo seed da liga, então sai igual em todos os celulares. */
function viradaTemporadaAmigos(){
  const bal = L.balanco || {sobem:[], caem:[]};
  R.r = rng(L.seed+'#v'+L.temporada);
  const d = divisoes(L);
  const caem = bal.caem.slice(), sobem = bal.sobem.slice();
  d.A = d.A.filter(id=>caem.indexOf(id)<0).concat(sobem);
  d.B = d.B.filter(id=>sobem.indexOf(id)<0).concat(caem);
  L.classificacaoAnterior = tabelaComp(L, L.comps.brasileirao).map(x=>x.id);
  L.ligaAnterior = {};
  Object.keys(LIGAS_EUROPA).forEach(k=>{
    if(L.comps[k]) L.ligaAnterior[k] = tabelaComp(L, L.comps[k]).map(x=>x.id);
  });
  L.temporada++; L.slot=1; L.temporadaFim=false; L.balanco=null;
  envelhecerElencos(L);
  L.clubs.forEach(c=>{ c.titulos=c.titulos||[]; });
  montarTemporadaAmigos(L);
  prepararSlot(L, 1);
  // dinheiro da divisão: quem sobe fatura mais, quem cai aperta o cinto
  d.A.concat(d.B).forEach(id=>{
    const c=clube(id); if(!c) return;
    c.tetoFolha = tetoFolhaDe(c) * (divisaoDe(id)==='B' ? 0.45 : 1);
    c.tetoFolha = Math.round(c.tetoFolha);
  });
  L.lances={}; L.vendas={}; L.vendasSlot={}; L.ordens={}; L.propostas=[];
  L.noticias.unshift({t:'led', txt:`Temporada ${L.temporada}. ${sobem.map(id=>clube(id).sigla).join(', ')} sobem; ${caem.map(id=>clube(id).sigla).join(', ')} caem.`});
  L.noticias=L.noticias.slice(0,12);
  R.r = Math.random;
}

function nomeCampo(p){

    const primeiro=partes[0];
    out = (ult.length>=4 && ult.length<=11) ? ult : (primeiro.length<=11 ? primeiro : ult);
  }
  if(out.length>11) out=out.slice(0,10)+'.';
  return out;
}

function _rgb(h){h=String(h||'#000').replace('#','');
  if(h.length===3)h=h.split('').map(x=>x+x).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}

function _dist(x,y){const a=_rgb(x),b=_rgb(y);
  return Math.sqrt((a[0]-b[0])**2*0.9+(a[1]-b[1])**2*1.2+(a[2]-b[2])**2*0.7);}

function _escurece(h,f){const c=_rgb(h);
  return '#'+c.map(v=>('0'+Math.round(clamp(v*f,0,255)).toString(16)).slice(-2)).join('');}

function coresDoJogo(){
  if(M && M._cores) return M._cores;
  const BOLA='#FFFFFF';
  const H=corBotao(M.h.clube);
  let A=corBotao(M.a.clube);
  const okAway=(cand)=> _dist(H.a,cand)>=120 && _dist(BOLA,cand)>=150;
  if(!okAway(A.a)){
    // 1) segundo uniforme do visitante
    const alt=corBotao({cor:M.a.clube.cor2, cor2:M.a.clube.cor});
    if(okAway(alt.a)) A={a:alt.a, b:(_rgb(alt.a).reduce((s,v)=>s+v,0)/765)<0.45?'#FFFFFF':'#12181D'};
    else {
      // 2) terceiro uniforme: o mais distante da casa e da bola
      const banco=['#101A22','#1E63A8','#D98B12','#7B3FA8','#0F6B4B','#B0322A'];
      let melhor=banco[0], d0=-1;
      banco.forEach(c=>{ const d=Math.min(_dist(H.a,c), _dist(BOLA,c)*0.7);
        if(d>d0){ d0=d; melhor=c; } });
      A={a:melhor, b:'#FFFFFF'};
    }
  }
  const res={h:H, a:A};
  if(M) M._cores=res;
  return res;
}

function corBotao(c){
  const lum=h=>{h=String(h||'#000').replace('#','');
    if(h.length===3)h=h.split('').map(x=>x+x).join('');
    return (parseInt(h.slice(0,2),16)*0.299+parseInt(h.slice(2,4),16)*0.587+parseInt(h.slice(4,6),16)*0.114)/255;};
  let a=c.cor||'#0B6B45', b=c.cor2||'#FFFFFF';
  if(lum(a)>0.72){ const t=a; a=b; b=t; }
  if(lum(a)>0.72){ a='#31404A'; }
  return {a, b};
}

let BOLA_POS={x:CAMPO_W/2, y:CAMPO_H/2};
function moverBola(p, ms){
  const b=$('bola'); if(!b) return;
  // sem tempo dado, a bola anda numa velocidade constante: passe curto rápido, lançamento demora
  if(ms==null){ const d=Math.hypot(p.x-BOLA_POS.x, p.y-BOLA_POS.y); ms=Math.max(200, d*16*velFator()); }
  // rastro do passe: uma linha que some, para o olho seguir a bola
  const tr=$('passe'); if(tr && Math.hypot(p.x-BOLA_POS.x, p.y-BOLA_POS.y)>5){
    tr.setAttribute('x1',BOLA_POS.x.toFixed(1)); tr.setAttribute('y1',BOLA_POS.y.toFixed(1));
    tr.setAttribute('x2',p.x.toFixed(1)); tr.setAttribute('y2',p.y.toFixed(1));
    tr.style.animation='none'; void tr.getBoundingClientRect(); tr.style.animation=`passeSome ${Math.max(.35,(ms/1000)+.25).toFixed(2)}s linear forwards`;
  }
  BOLA_POS={x:p.x, y:p.y};
  b.style.transitionDuration=(ms/1000).toFixed(2)+'s';
  b.style.transform=`translate(${p.x.toFixed(2)}px,${p.y.toFixed(2)}px)`;
}
function distBola(p){ return Math.hypot(p.x-BOLA_POS.x, p.y-BOLA_POS.y); }

/* Todos os meus jogos da semana que têm narração guardada — pode ser um
   (só o Brasileirão) ou dois (rodada + copa na mesma semana). */
function meusJogosDoSlot(slot){
  const out=[];
  fixturesDoSlot(L, slot).forEach(bl=>{
    (bl.jogos||[]).forEach(g=>{
      if(!g||(g.h!==L.meuClube && g.a!==L.meuClube)) return;
      const k=chave(bl.comp, bl.fase, bl.rodada, g.h, g.a);
      const res=bl.comp.resultados[k];
      if(!res || !res.eventos || !res.eventos.length) return;
      out.push({comp:bl.comp, fase:bl.fase, rodada:bl.rodada, h:g.h, a:g.a, res});
    });
  });
  return out;
}

function pularReplay(){

    if(e.t==='gol'){ if(e.side==='h') M.hg++; else M.ag++; }

function rodarRodadaAmigos(n){
  if(L.online){ toast('Na liga online a rodada roda sozinha quando todos derem OK.'); return; }
  if(L.temporadaFim && typeof viradaTemporadaAmigos==='function'){ viradaTemporadaAmigos(); salvar(true); render(); }
  const outros=Object.keys(L.managers).filter(c=>c!==L.meuClube);
  if(!outros.length && !L.rodarSozinho){
    sheet('Falta o código do seu amigo', `
      <div class="card" style="border-color:var(--danger);margin-bottom:12px">
        <p class="sm">Neste aparelho só existe <b>você</b> como técnico. Se rodar agora, o clube do seu amigo vira time da máquina e os resultados de vocês <b>não vão bater</b>.</p>
      </div>
      <p class="sm mut" style="margin-bottom:12px">Peça pra ele o código que começa com <b>J1</b> (aparece quando ele escolhe o clube) ou o código de escalação dele, e cole aqui.</p>
      <div class="stack">
        <button class="btn pri wide" onclick="fecharSheet();colarOrdens()">Colar o código dele</button>
        <button class="btn ghost wide" onclick="fecharSheet();L.rodarSozinho=true;salvar(true);toast('Ok, seguindo sozinho.')">Vou jogar sozinho mesmo</button>
      </div>`);
    return;
  }
  n = Math.max(1, n||1);
  const prontas = rodadasProntas();
  if(prontas<1){
    const falta=ordensPendentes().filter(c=>c!==L.meuClube).map(c=>clube(c).nome);
    toast(falta.length?('Falta a escalação de: '+falta.join(', ')):'Mande sua escalação primeiro.');
    return;
  }
  n = Math.min(n, prontas);
  const inicio=L.slot;
  const antes = tabela(L).findIndex(x=>x.id===L.meuClube)+1;
  const transfs=[];
  for(let k=0;k<n;k++){
    if(L.slot>fimSlot(L)) break;
    rodarUmaRodadaAmigos().forEach(t=>transfs.push(t));
  }
  const ultima=L.slot-1;
  if(L.slot>fimSlot(L)) fecharTemporadaAmigos();
  salvar(true); render();
  const resumo = ()=>{
    if(transfs.length) filaSheets.push(()=>resumoMercadoAmigos(transfs));
    if(n===1) resumoDaRodada(inicio);
    else resumoPeriodo(inicio, ultima, antes);
  };
  // assistir ao jogo da última rodada rodada
  if(meuJogoDoSlot(n===1?inicio:ultima)) assistirJogo(n===1?inicio:ultima, resumo);
  else resumo();
}

function verReplaySlot(k, compId, h, a){
  const comp=L.comps[compId]; if(!comp) return;
  const r=comp.resultados[k]; if(!r) return;
  const meu = (h===L.meuClube||a===L.meuClube);
  if(meu && L.modo==='amigos' && r.eventos && r.eventos.length){
    const B=L.comps.brasileirao;
    const idx=(B.fixtures||[]).findIndex(rod=>(rod||[]).some(g=>(g.h===h&&g.a===a)));
    const slot = idx>=0 ? B.slots[idx] : null;
    if(slot){ fecharSheet(); assistirJogo(slot, null); return; }
  }
  const meuLado = h===L.meuClube?'h':a===L.meuClube?'a':null;
  sheet(`${clube(h).sigla} ${r.hg} × ${r.ag} ${clube(a).sigla}`,
    r.eventos&&r.eventos.length
      ? `<div>${r.eventos.map(e=>`<div class="ev ${e.c||''} ${e.t==='gol'?'goal':''} ${e.t==='gol'&&meuLado&&e.s!==meuLado?'rival':''}">
          <span class="ev-min">${e.m}${e.a?'+'+e.a:''}'</span><span class="ev-tx">${esc(e.x)}</span></div>`).join('')}</div>`
      : '<p class="empty">Sem narração guardada para este jogo.</p>');
}

function minutosDeGol(ch, n){
  const r = rng('gm'+ch);
  const out=[];
  for(let i=0;i<n;i++) out.push(4+Math.floor(r()*86));
  return out.sort((a,b)=>a-b);
}

/* Assiste aos meus jogos em sequência. O botão de pular está na barra da
   partida; pular vai direto pro próximo, e no último cai no resumo. */
let FILA_JOGOS=null;

function assistirSequencia(lista, depois){
  FILA_JOGOS = {lista:lista.slice(), i:0, depois:depois||null};
  proximoDaFila();
}

function proximoDaFila(){
  if(!FILA_JOGOS){ return; }
  const f=FILA_JOGOS;
  if(f.i>=f.lista.length){ const d=f.depois; FILA_JOGOS=null; if(d) d(); return; }
  const item=f.lista[f.i++];
  const ok = assistirJogo(item.slot, proximoDaFila, item.i);
  if(!ok) proximoDaFila();
}

function pularJogosDaFila(){
  if(FILA_JOGOS){ const d=FILA_JOGOS.depois; FILA_JOGOS=null;
    if(REPLAY) REPLAY.depois=null;
    fecharReplay(); if(d) setTimeout(d,200); return; }
  fecharReplay();
}

function assistirJogo(slot, depois, indice){
  const lista = meusJogosDoSlot(slot);
  const j = lista[indice||0] || lista[0];
  if(!j){ if(!FILA_JOGOS && depois) depois(); return false; }
  garanteElenco(L,j.h); garanteElenco(L,j.a);
  const lado = j.h===L.meuClube?'h':'a';
  R.r=Math.random;
  M = criarPartida(L, j.h, j.a, lado);
  if(typeof ajustarAtmosfera==='function') ajustarAtmosfera(M, j.comp, j.fase, j.rodada);
  if(j.res.publico) M.publico=j.res.publico;
  M.hg=0; M.ag=0; M.min=0; M.fim=false; M.eventos=[]; M.pausa=null; M.replay=true;
  REPLAY = {evs:(j.res.eventos||[]).map(_expandir), i:0, hg:j.res.hg, ag:j.res.ag,
            fim: Math.max(90, ...(j.res.eventos||[]).map(e=>(e.m||0)+(e.a||0))), depois:depois||null,
            slot:slot, sm:j.res.sm||null, compNome:nomeCurto(j.comp)};
  M.dur = REPLAY.fim;
  prepararRodadaViva(slot);
  $('match').classList.add('on'); $('m-feed').innerHTML='';
  VEL='normal';
  $('m-top').innerHTML='';
  desenharMatch();
  addEvento({min:0,t:'sys',txt:`${esc(nomeCurto(j.comp))} — ${clube(j.h).nome} x ${clube(j.a).nome}, ${M.publico.toLocaleString('pt-BR')} presentes${M.motivoJogo?', '+M.motivoJogo:''}.`,cls:'sys'});
  iniciarTickReplay();
  return true;
}

function fecharReplay(){
  const d = REPLAY ? REPLAY.depois : null;
  fecharSheet(); pararTick(); if(typeof limparLance==='function') limparLance();
  $('match').classList.remove('on'); $('match').classList.remove('bcast');
  M=null; REPLAY=null; _rodadaViva=null;
  render(); irPara('home');
  if(d) setTimeout(d, 200);
}

let FILA_TIMERS=[], SEGURA=0;

function limparFila(){ FILA_TIMERS.forEach(clearTimeout); FILA_TIMERS=[]; SEGURA=0; }

function seguraAte(ms){ SEGURA=Math.max(SEGURA, Date.now()+ms); }

function passo(){
  if(!M || M.fim){ if(!FILA_TIMERS.length) pararTick(); return; }
  if(Date.now() < SEGURA) return;
  const antes=M.eventos.length;
  passoMinuto(M);
  const novos=M.eventos.slice(antes);
  const depois=()=>{
    if(!M) return;
    if(M.pausa){ pararTick(); tratarPausa(); return; }
    if(M.fim){ pararTick(); fimDeJogo(); }
  };
  if(!novos.length){ bolaOciosa(); desenharMatch(); depois(); return; }
  tocarFila(novos, depois);
}

function passoReplay(){
  if(!M || !REPLAY){ pararTick(); return; }
  if(M.fim){ pararTick(); return; }
  if(Date.now() < SEGURA) return;
  M.min++;
  const novos=[];
  while(REPLAY.i < REPLAY.evs.length){
    const e=REPLAY.evs[REPLAY.i];
    const q=(e.min||0)+(e.add||0);
    if(q > M.min) break;
    REPLAY.i++;
    if(e.t==='gol'){ if(e.side==='h') M.hg++; else M.ag++; }
    if(e.t==='sub' || e.t==='cv'){ aplicarSaidaReplay(e); }
    if(['gol','defesa','trave','fora','chance','penalti'].includes(e.t)){
      if(e.side==='h') M.h.chutes++; else M.a.chutes++;
    }
    if(e.side==='h') M.h.posse+=0.85; else if(e.side==='a') M.a.posse+=0.85;
    M.eventos.push(e); novos.push(e);
  }
  M.h.posse+=0.5; M.a.posse+=0.5;
  const acabou=()=>{
    if(!M || !REPLAY) return;
    if(M.min>=REPLAY.fim && REPLAY.i>=REPLAY.evs.length){
      M.fim=true; M.hg=REPLAY.hg; M.ag=REPLAY.ag;
      pararTick(); desenharMatch(); fimDoReplay();
    }
  };
  if(!novos.length){ bolaOciosa(); desenharMatch(); acabou(); return; }
  tocarFila(novos, acabou);
}
