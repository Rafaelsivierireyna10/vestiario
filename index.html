/* ---------- navegador de clubes ---------- */

let nvClubes = {busca:'', liga:'todas', aberto:null};

function ligasDoNavegador(){
  const out=[{id:'todas', nome:'Todos'}];
  const add=(id,nome)=>{ if(!out.find(x=>x.id===id)) out.push({id,nome}); };
  if(L.comps.brasileirao) add('brasileirao','Série A');
  if(L.comps.serieb) add('serieb','Série B');
  Object.keys(LIGAS_EUROPA).forEach(k=>{ if(L.comps[k]) add(k, LIGAS_EUROPA[k].nome); });
  add('sulam','Sul-América');
  return out;
}

function clubesDoFiltro(){
  const f=nvClubes;
  let ids;
  if(f.liga==='todas') ids=L.clubs.map(c=>c.id);
  else if(f.liga==='sulam') ids=SULAMERICANOS.map(c=>c.id).filter(id=>clube(id));
  else if(L.comps[f.liga]) ids=L.comps[f.liga].clubes.slice();
  else ids=[];
  const q=(f.busca||'').trim().toLowerCase();
  let arr=ids.map(id=>clube(id)).filter(Boolean);
  if(q) arr=arr.filter(c=>(c.nome+' '+c.cidade+' '+(c.uf||'')).toLowerCase().indexOf(q)>=0);
  arr.sort((a,b)=>(nivelClube(b.id)-nivelClube(a.id)) || (a.nome<b.nome?-1:1));
  return arr.slice(0, 80);
}

function bandeira(uf){
  const B={BRA:'🇧🇷',ENG:'🏴󠁧󠁢󠁥󠁮󠁧󠁿',ESP:'🇪🇸',ITA:'🇮🇹',ALE:'🇩🇪',FRA:'🇫🇷',ARG:'🇦🇷',URU:'🇺🇾',PAR:'🇵🇾',CHI:'🇨🇱',
    COL:'🇨🇴',EQU:'🇪🇨',BOL:'🇧🇴',PER:'🇵🇪',VEN:'🇻🇪',MEX:'🇲🇽',KSA:'🇸🇦',EGI:'🇪🇬',POR:'🇵🇹',NZL:'🇳🇿',USA:'🇺🇸'};
  return B[uf] || '🇧🇷';
}

function paisDoClube(c){ return (c.uf && c.uf.length===3) ? c.uf : 'BRA'; }

function renderClubes(){
  const f=nvClubes;
  const lista=clubesDoFiltro();
  const ligas=ligasDoNavegador();
  return `
  <div class="card" style="padding:10px 12px">
    <input class="inp" placeholder="Procurar time ou cidade" value="${esc(f.busca)}"
      oninput="nvClubes.busca=this.value;clearTimeout(window._nvt);window._nvt=setTimeout(render,250)">
    <div class="seg" style="margin-top:8px">${ligas.map(l=>`<button aria-pressed="${f.liga===l.id}" onclick="nvClubes.liga='${l.id}';render()">${esc(l.nome)}</button>`).join('')}</div>
  </div>
  <div class="card" style="padding:4px 10px">
    ${lista.map(c=>`<button class="plr" onclick="abrirClube('${c.id}')">
      ${escudoSVG(c,26)}
      <span class="plr-n"><b>${esc(c.nome)}</b><span>${bandeira(paisDoClube(c))} ${esc(c.cidade)} · ${(L.squads[c.id]||[]).length} jogadores${L.managers&&L.managers[c.id]?' · <b>'+esc(L.managers[c.id].nome)+'</b>':''}</span></span>
      <span class="ovr">${Math.round(nivelClube(c.id))}</span></button>`).join('')||'<p class="empty">Nenhum clube com esse nome.</p>'}
  </div>`;
}

function abrirClube(cid){

      <span class="ovr" style="margin-left:auto">${Math.round(nivelClube(cid))}</span></div>
    <div class="between xs mut" style="margin-bottom:6px">

      <tbody>${el.map(p=>`<tr class="${craqueCls(p)}" onclick="fichaJogador('${p.id}','${meu?'meu':'mercado'}')" style="cursor:pointer">
        <td style="text-align:left"><b>${esc(p.nome)}</b>${estrelaSelo(p)}${p.lesao>0?' <span class="pill r">L</span>':''}</td>
        <td><span class="pos ${p.pos}">${p.pos}</span></td>

        <td class="mut">${dinheiro(p.valor||0)}</td></tr>`).join('')}</tbody></table></div>`);

/* ---------- Agenda ---------- */

function resultadoMeu(j){
  const r=j.comp.resultados[j.chave]; if(!r) return null;
  const casa=j.h===L.meuClube;
  const meu=casa?r.hg:r.ag, dele=casa?r.ag:r.hg;
  return {r, meu, dele, cls: meu>dele?'v':meu===dele?'e':'d', letra: meu>dele?'V':meu===dele?'E':'D'};
}

function renderAgenda(){
  const fim=fimSlot(L);
  const me=L.meuClube;
  let html='';
  for(let s=1;s<=fim;s++){
    const jogos=jogosDoSlotComResultado(L, s).filter(j=>j.h===me||j.a===me);
    const atual=s===L.slot;
    if(!jogos.length){
      html+=`<div class="ag-sem ${atual?'atual':''}${s<L.slot?' passou':''}"><span class="ag-n">${s}</span><span class="ag-livre">semana livre</span></div>`;
      continue;
    }
    html+=jogos.map((j,i)=>{
      const casa=j.h===me, adv=clube(casa?j.a:j.h);
      const res=resultadoMeu(j);
      const abre=res?`onclick="abrirSumulaDe('${esc(j.comp.id)}','${esc(j.chave)}','${j.h}','${j.a}')"`:'';
      return `<div class="ag-sem ${atual?'atual':''}${s<L.slot?' passou':''}" ${abre} style="--cc:${corDaComp(j.comp.id)}">
        <span class="ag-n">${i===0?s:''}</span>
        <span class="ag-comp">${esc(nomeCurto(j.comp))}<small>${esc(NOME_FASE[j.fase]||('R'+(j.rodada+1)))}</small></span>
        <span class="ag-adv">${escudoSVG(adv,20)}<b>${esc(nomeExib(adv))}</b><small>${casa?'em casa':'fora'} · ${esc(nomeEstadio(clube(j.h)))}</small></span>
        <span class="ag-res ${res?res.cls:''}">${res?`${res.meu}×${res.dele}<i>${res.letra}</i>`:'<em>–</em>'}</span>
      </div>`;
    }).join('');
  }
  const total=(()=>{ let v=0,e=0,d=0; for(let s=1;s<L.slot;s++) jogosDoSlotComResultado(L,s).filter(j=>j.h===me||j.a===me).forEach(j=>{const r=resultadoMeu(j); if(r){ if(r.cls==='v')v++; else if(r.cls==='e')e++; else d++; }}); return {v,e,d}; })();
  return `<div class="barrinha" style="margin-bottom:8px"><span><b>${total.v}</b>vitórias</span><span><b>${total.e}</b>empates</span><span><b>${total.d}</b>derrotas</span><span><b>${L.slot}</b>semana</span></div>
    <div class="card" style="padding:4px 8px">${html}</div>
    <p class="xs mut" style="margin-top:8px">Toque num jogo já disputado para ver a súmula. As copas aparecem conforme você avança de fase.</p>`;
}

/* ---------- Estádio ---------- */

const OBRA_CUSTO_LUGAR = 6000;     // R$ por lugar
const OBRA_SEMANAS = 4;
const ESTADIO_MAX = 80000;

function demandaTorcida(c){ return [12000, 18000, 28000, 42000, 60000, 80000][clamp((c&&c.torcida)||1,0,5)]; }

function jogosEmCasaTemporada(cid){
  const out=[];
  Object.keys(L.comps||{}).forEach(k=>{ const comp=L.comps[k];
    Object.keys(comp.resultados||{}).forEach(ch=>{ const r=comp.resultados[ch];
      if(!r || !r.publico) return;
      const partes=ch.split('_'); // fase+rodada_h_a
      const h=partes[1], a=partes[2];
      if(h!==cid) return;
      out.push({comp, publico:r.publico, renda:Math.round(r.publico*ingressoMedio(clube(cid), comp.id)), adv:a});
    });
  });
  return out;
}

function renderEstadio(){
  const c=meuClube();
  const jogos=jogosEmCasaTemporada(c.id);
  const media=jogos.length?Math.round(jogos.reduce((s,j)=>s+j.publico,0)/jogos.length):0;
  const renda=jogos.reduce((s,j)=>s+j.renda,0);
  const ocup=jogos.length?Math.round(100*media/(c.estadio||1)):0;
  const dem=demandaTorcida(c);
  const obra=c.obras;
  const pend=(L.acoesPendentes&&L.acoesPendentes[c.id]&&L.acoesPendentes[c.id].est)||null;
  const opcoes=[5000,10000,20000].map(n=>{ const novo=Math.min(ESTADIO_MAX, (c.estadio||0)+n); const custo=(novo-(c.estadio||0))*OBRA_CUSTO_LUGAR;
    return {n, novo, custo, pode: novo>(c.estadio||0) && c.caixa>=custo}; }).filter(o=>o.novo>(c.estadio||0));
  const maior=jogos.slice().sort((a,b)=>b.publico-a.publico)[0];
  return `
  <div class="est-hero" style="--c1:${c.cor||'#333'};--c2:${(typeof tintaSobre==='function')?tintaSobre(c):'#fff'}">
    ${typeof estadioFaixaSVG==='function'?estadioFaixaSVG(c, jogos.length?media/(c.estadio||1):0.6, c.sigla):''}
    <div class="est-nome"><b>${esc(nomeEstadio(c))}</b><span>${esc(c.cidade)} · ${(c.estadio||0).toLocaleString('pt-BR')} lugares</span></div>
  </div>
  <div class="barrinha" style="margin:8px 0"><span><b>${jogos.length}</b>jogos em casa</span><span><b>${media?media.toLocaleString('pt-BR'):'—'}</b>média</span><span><b>${ocup}%</b>ocupação</span><span><b>${dinheiro(renda)}</b>renda</span></div>
  <div class="card">
    <div class="between sm"><span class="mut">Ingresso médio</span><span class="mono">R$ ${ingressoMedio(c)}</span></div>
    <div class="between sm"><span class="mut">Torcida que o clube atrai</span><span class="mono">até ${dem.toLocaleString('pt-BR')}</span></div>
    ${maior?`<div class="between sm"><span class="mut">Maior público</span><span class="mono">${maior.publico.toLocaleString('pt-BR')} × ${esc((clube(maior.adv)||{}).sigla||'')}</span></div>`:''}
    <p class="xs mut" style="margin-top:6px">O público enche com campanha boa, clássico e decisão. Estádio maior só rende se a torcida acompanha — time pequeno não enche 60 mil.</p>
  </div>
  <div class="card">
    <div class="eyebrow" style="margin-bottom:6px">Obras</div>
    ${obra?`<div class="news led"><i></i><span class="sm">Ampliação para <b>${obra.ate.toLocaleString('pt-BR')}</b> lugares em andamento — fica pronta na semana ${obra.pronto}.</span></div>`
     : pend?`<div class="news led"><i></i><span class="sm">Ampliação para <b>${pend.toLocaleString('pt-BR')}</b> pedida — começa quando a semana fechar${L.online?' (vai junto com o seu OK)':''}.</span></div>
        <button class="btn sm ghost wide" style="margin-top:6px" onclick="cancelarAcao('est')">Cancelar pedido</button>`
     : (c.estadio||0)>=ESTADIO_MAX ? '<p class="empty">Estádio no tamanho máximo.</p>'
     : `<p class="sm mut" style="margin-bottom:8px">R$ ${OBRA_CUSTO_LUGAR.toLocaleString('pt-BR')} por lugar, ${OBRA_SEMANAS} semanas de obra. O dinheiro sai do caixa quando a semana fechar.</p>
        <div class="stack">${opcoes.map(o=>`<button class="btn wide ${o.pode?'':'ghost'}" ${o.pode?'':'disabled'} onclick="pedirAmpliacao(${o.novo})">
          +${o.n.toLocaleString('pt-BR')} lugares → ${o.novo.toLocaleString('pt-BR')} · ${dinheiro(o.custo)}</button>`).join('')}</div>
        ${opcoes.some(o=>!o.pode)?'<p class="xs mut" style="margin-top:6px">Opções apagadas: não cabe no caixa.</p>':''}`}
  </div>
  ${jogos.length?`<div class="card"><div class="eyebrow" style="margin-bottom:4px">Últimos jogos em casa</div>
    ${jogos.slice(-8).reverse().map(j=>`<div class="between sm"><span>${esc(nomeCurto(j.comp))} × ${esc((clube(j.adv)||{}).sigla||'')}</span><span class="mono">${j.publico.toLocaleString('pt-BR')} · ${dinheiro(j.renda)}</span></div>`).join('')}</div>`:''}`;
}

function pedirAmpliacao(novo){
  const c=meuClube();
  const custo=(novo-(c.estadio||0))*OBRA_CUSTO_LUGAR;
  if(c.obras){ toast('Já tem obra em andamento.'); return; }
  if(c.caixa<custo){ toast('Não cabe no caixa.'); return; }
  L.acoesPendentes=L.acoesPendentes||{}; L.acoesPendentes[c.id]=L.acoesPendentes[c.id]||{};
  L.acoesPendentes[c.id].est=novo;
  toast('Ampliação pedida. Começa quando a semana fechar.');
  salvar(true); render();
}

function cancelarAcao(k){
  const c=meuClube();
  if(L.acoesPendentes&&L.acoesPendentes[c.id]) delete L.acoesPendentes[c.id][k];
  salvar(true); render();
}

/* ---------- ações de clube: vão no código das ordens e fecham com a semana ---------- */

// texto do campo 16 do código: "est~60000.base~3.base~5"
function codAcoes(cid){
  const a=(L.acoesPendentes&&L.acoesPendentes[cid])||{};
  const partes=[];
  if(a.est) partes.push('est~'+a.est);
  (a.base||[]).forEach(i=>partes.push('base~'+i));
  return partes.join('.');
}

function lerAcoes(txt){
  const a={base:[]};
  String(txt||'').split('.').filter(Boolean).forEach(p=>{ const [k,v]=p.split('~');
    if(k==='est') a.est=parseInt(v,10)||0;
    if(k==='base') a.base.push(parseInt(v,10));
  });
  return a;
}

// aplicada quando a semana fecha, em todos os aparelhos, na mesma ordem
function aplicarAcoesDaSemana(slot){
  const cids=Object.keys(L.managers||{}).sort();
  cids.forEach(cid=>{
    const c=clube(cid); if(!c) return;
    const o=L.ordens && L.ordens[chaveOrdem(cid, slot)];
    let a = o && o.acoes ? o.acoes : null;
    if(!a && cid===L.meuClube && L.acoesPendentes && L.acoesPendentes[cid]) a=L.acoesPendentes[cid];
    if(!a) return;
    if(a.est && !c.obras && a.est>(c.estadio||0)){
      const custo=(a.est-(c.estadio||0))*OBRA_CUSTO_LUGAR;
      if(c.caixa>=custo){ c.caixa-=custo; c.obras={ate:a.est, pronto:slot+OBRA_SEMANAS, custo};
        L.noticias.unshift({t:cid===L.meuClube?'led':'', txt:`${c.nome} inicia obras: ${esc(nomeEstadio(c))} vai para ${a.est.toLocaleString('pt-BR')} lugares.`}); }
    }
    (a.base||[]).forEach(i=>promoverDaBase(cid, i, true));
  });
  if(L.acoesPendentes && L.acoesPendentes[L.meuClube]) delete L.acoesPendentes[L.meuClube];
  // obras que terminam
  L.clubs.forEach(c=>{ if(c.obras && slot+1>=c.obras.pronto){ c.estadio=c.obras.ate; delete c.obras;

/* ---------- Base (juniores) ---------- */

function baseDoClube(cid){
  const c=clube(cid); if(!c) return [];
  const r=rng((L.seed||'x')+'#base#'+cid+'#'+L.temporada);
  const rep=c.rep||2;
  const posList=['GOL','ZAG','ZAG','LAT','VOL','MEI','MEI','PON','ATA','ATA'];
  const out=[];
  for(let i=0;i<8;i++){
    const pos=posList[Math.floor(r()*posList.length)];
    const idade=16+Math.floor(r()*4);
    const ovr=clamp(Math.round(40+rep*3+r()*14), 40, 66);
    let pot=clamp(ovr+8+Math.round(r()*16), ovr+6, 82);
    if(r()<0.14) pot=clamp(pot+8+Math.round(r()*8), pot, 90);       // a joia
    const id='b'+L.temporada+'_'+cid+'_'+i;
    const oldR=R.r; R.r=r; const nome=nomeAleatorio(); R.r=oldR;
    out.push({id, nome, pos, idade, ovr, pot, idx:i});
  }
  return out;
}

function jaPromovido(id){ return !!(L.promovidos && L.promovidos[id]); }

function promoverDaBase(cid, idx, silencioso){
  const lista=baseDoClube(cid); const g=lista[idx]; if(!g) return false;
  if(jaPromovido(g.id)) return true;
  const el=L.squads[cid]||(L.squads[cid]=[]);
  if(el.length>=40) return false;
  const p={ id:g.id, nome:g.nome, pos:g.pos, idade:g.idade, ovr:g.ovr, pot:g.pot,
    forma:55, moral:70, energia:100, salario:Math.max(30000, Math.round(salarioDe(g.ovr,g.idade)*0.6/1000)*1000),
    valor:valorDeMercado(g.ovr,g.idade), contrato:3, gols:0, assist:0, jogos:0, ca:0, cv:0, notaSoma:0, lesao:0, base:true };
  el.push(p);
  L.promovidos=L.promovidos||{}; L.promovidos[g.id]=1;
  if(!silencioso) L.noticias.unshift({t:'led', txt:`${g.nome}, ${g.idade} anos, sobe da base para o profissional.`});
  return true;
}

function promoverBase(idx){
  const c=meuClube();
  const lista=baseDoClube(c.id), g=lista[idx]; if(!g) return;
  const promovidosNaTemp=(L.promovidos?Object.keys(L.promovidos):[]).filter(id=>id.indexOf('b'+L.temporada+'_'+c.id+'_')===0).length;
  if(promovidosNaTemp>=3){ toast('Só dá para subir 3 garotos por temporada.'); return; }
  if(!promoverDaBase(c.id, idx, false)){ toast('Elenco cheio (máximo de 40).'); return; }
  L.acoesPendentes=L.acoesPendentes||{}; L.acoesPendentes[c.id]=L.acoesPendentes[c.id]||{};
  L.acoesPendentes[c.id].base=(L.acoesPendentes[c.id].base||[]).concat([idx]);
  if(L.online && typeof meuOkOnline==='function' && meuOkOnline()) toast(g.nome+' subiu. Reenvie o OK para os amigos verem.');
  else toast(g.nome+' subiu para o profissional.');
  salvar(true); render();
}

function fbDisponivel(){ return typeof firebase!=='undefined' && !!firebase.database; }

function fbIniciar(){
  if(FB.pronto) return FB.pronto;
  FB.pronto = new Promise(res=>{

    let feito=false;

      FB.db = firebase.database();
      const auth=firebase.auth();
      auth.onAuthStateChanged(u=>{ if(u){ FB.uid=u.uid; FB.ok=true; fim(u.uid); } });
      auth.signInAnonymously().catch(e=>{ FB.erro=(e&&e.code)||String(e); fim(null); });

  });
  return FB.pronto;
}

  }
  L.online=true; L.meuUid=uid; R.r=Math.random; _pidDoElenco();

  ON={code, tecnicos:{}, clubes:{}, ok:{}, fechada:{}, selos:{}, vendas:{}, lances:{}, chat:[], presenca:{}, subs:[], carregado:{}};
  const ouvir=(sub, campo, fn)=>{
    const ref=fbRef(sub);
    const cb=s=>{ ON[campo]=fn?fn(s):(s.val()||{}); ON.carregado[campo]=true; agendarSync(); };
    ref.on('value', cb, e=>{ ON.erro=(e&&e.code)||String(e); ON.carregado[campo]=true; agendarSync(); });
    ON.subs.push(()=>ref.off('value', cb));
  };
  ouvir('tecnicos','tecnicos'); ouvir('clubes','clubes'); ouvir('ok','ok'); ouvir('fechada','fechada');
  ouvir('selos','selos'); ouvir('vendas','vendas'); ouvir('lances','lances'); ouvir('presenca','presenca');

    ref.on('value', cb, ()=>{}); ON.subs.push(()=>ref.off('value', cb)); })();

function _pidDoElenco(){
  let max=0;
  Object.keys(L.squads||{}).forEach(cid=>(L.squads[cid]||[]).forEach(p=>{ const n=parseInt(String(p.id).slice(1),10); if(n>max) max=n; }));
  if(max+1>_pid) _pid=max+1;
}

function marcarPresenca(){
  if(!ON||!FB.uid) return;
  try{ fbRef('presenca/'+FB.uid).set(Date.now()); }catch(e){}
}

function agendarSync(){ clearTimeout(_syncTimer); _syncTimer=setTimeout(onlineSincronizar, 60); }

const ANO0 = 2026;
function rgDe(temp, slot){ return (temp-ANO0)*SEMANAS_AMIGOS + slot; }
function rgAtual(){ return rgDe(L.temporada, L.slot); }
function slotDoRg(rg){ return ((rg-1)%SEMANAS_AMIGOS)+1; }
function tempDoRg(rg){ return ANO0 + Math.floor((rg-1)/SEMANAS_AMIGOS); }

function meuCidOnline(){
  const t=ON&&ON.tecnicos&&ON.tecnicos[FB.uid];
  return t&&t.cid ? t.cid : L.meuClube;
}

function uidDoClube(cid){
  const ts=ON.tecnicos||{};
  return Object.keys(ts).find(u=>ts[u]&&ts[u].cid===cid)||null;
}

function managersDeTecnicos(){
  const ts=ON.tecnicos||{}, m={};
  Object.keys(ts).forEach(u=>{ const t=ts[u]; if(!t||!t.cid||!clube(t.cid)) return;
    m[t.cid]={id:u, nome:t.nome||'Técnico', local:u===FB.uid}; });
  L.managers=m;
  const meu=meuCidOnline(); if(meu&&clube(meu)) L.meuClube=meu;
  Object.keys(m).forEach(cid=>garanteTactics(L,cid));
}

function cidsDaRodada(rg){
  const f=ON.fechada[rg]; if(!f) return null;
  return String(f.cids||'').split(',').filter(Boolean);
}

function todosOkOnline(slot){
  const cids=Object.keys(L.managers||{});
  if(!cids.length) return false;
  const o=ON.ok[slot]||{};
  return cids.every(cid=>o[cid]&&o[cid].cod);
}

function faltamOk(slot){
  const o=ON.ok[slot||L.slot]||{};
  return Object.keys(L.managers||{}).filter(cid=>!(o[cid]&&o[cid].cod));
}

function quadro(){ return new Promise(r=>{ (window.requestAnimationFrame||setTimeout)(()=>r(), 0); }); }

/* Barra de "rodando as semanas": com onze competições, cada semana leva um
   tempinho no celular. Melhor mostrar o progresso do que travar a tela. */
function progressoSemana(feito, total){
  let el=document.getElementById('rodando');
  if(!total){ if(el) el.remove(); return; }
  if(!el){
    el=document.createElement('div'); el.id='rodando'; el.className='rodando';
    el.innerHTML='<div class="rd-in"><div class="rd-tit"></div><div class="rd-barra"><i></i></div></div>';
    document.body.appendChild(el);
  }
  el.querySelector('.rd-tit').textContent = total>1
    ? `Rodando a semana ${feito} de ${total}…` : 'Rodando a semana…';
  el.querySelector('.rd-barra i').style.width = Math.round(100*feito/total)+'%';
}

async function onlineSincronizar(){
  if(!L||!L.online||!ON) return;
  const c=ON.carregado;
  if(!(c.tecnicos&&c.ok&&c.fechada)) return;
  if(_sincronizando){ _syncDeNovo=true; return; }
  _sincronizando=true;
  try{
    managersDeTecnicos();
    const transfs=[]; let rodou=0, viradas=0;
    const inicio=L.slot, tempIni=L.temporada;
    const antes=tabela(L).findIndex(x=>x.id===L.meuClube)+1;
    let pendentesN=0;
    for(let k=0, rg=rgAtual(); k<60 && ON.fechada[rg]; k++, rg++) pendentesN++;
    while(ON.fechada[rgAtual()] && rodou<60){
      const r=rodarRodadaOnline(rgAtual());
      r.transfs.forEach(t=>transfs.push(t));
      if(r.virou) viradas++;
      rodou++;
      if(pendentesN>1){ progressoSemana(rodou, pendentesN); await quadro(); }
    }
    if(pendentesN>1) progressoSemana(0,0);
    if(rodou){
      managersDeTecnicos();
      const mesmaTemp = L.temporada===tempIni;
      const ultima = mesmaTemp ? L.slot-1 : SEMANAS_AMIGOS;
      publicarSelo(rgAtual()-1);
      Object.keys(L.vendas||{}).forEach(cid=>{ if(cid===L.meuClube) Object.keys(L.vendas[cid]||{}).forEach(pid=>{ const p=jog(pid); if(p) p.aVenda=true; }); });
      salvar(true);
      const resumo=()=>{
        if(transfs.length) filaSheets.push(()=>resumoMercadoAmigos(transfs));
        if(viradas){ if(L.balancoVisto!==tempIni){ L.balancoVisto=tempIni; telaBalancoTemporada(); } }
        else if(rodou===1) resumoDaRodada(inicio);
        else resumoPeriodo(inicio, ultima, antes);
      };
      // todos os meus jogos das semanas que rodaram, um atrás do outro
      const meus=[];
      if(!viradas) for(let sl=inicio; sl<=ultima; sl++)
        meusJogosDoSlot(sl).forEach((j,i)=>meus.push({slot:sl, i}));
      const abrir=()=>{ if(meus.length) assistirSequencia(meus, resumo); else resumo(); };
      if(!sheetAberta() && !M) abrir();
      else filaSheets.push(abrir);       // espera a janela aberta fechar
    }
    // fecha de uma vez todas as rodadas que já têm o OK de todo mundo:
    // sem isso cada rodada esperaria uma ida e volta ao servidor
    if(!ON.fechando){
      const cids=Object.keys(L.managers);
      const pendentes=[];
      for(let k=0, rg=rgAtual(); k<20; k++, rg++){
        if(ON.fechada[rg] || !todosOkOnline(rg)) break;
        pendentes.push(rg);
      }
      if(pendentes.length){
        ON.fechando=true;
        (async()=>{ try{ for(const rg of pendentes) await fecharRodadaOnline(rg, cids); }
                    finally{ ON.fechando=false; agendarSync(); } })();
      }
    }
    espelharMercadoVivo();
    if(!M) render();
  } finally {
    _sincronizando=false;
    if(_syncDeNovo){ _syncDeNovo=false; agendarSync(); }
  }
}

function rodarRodadaOnline(rg){
  const slot=L.slot;
  const cids=cidsDaRodada(rg)||[];
  const nomes={}; Object.keys(ON.tecnicos||{}).forEach(u=>{ const t=ON.tecnicos[u]; if(t&&t.cid) nomes[t.cid]={id:u,nome:t.nome||'Técnico'}; });
  L.managers={};
  cids.forEach(cid=>{ if(!clube(cid)) return;
    const n=nomes[cid]||{id:'r'+cid,nome:'Técnico'};
    L.managers[cid]={id:n.id, nome:n.nome, local:n.id===FB.uid};
    garanteTactics(L,cid); });
  L.lances=L.lances||{}; L.vendas=L.vendas||{}; L.vendasSlot=L.vendasSlot||{}; L.ordens=L.ordens||{};
  const oks=ON.ok[rg]||{};
  Object.keys(L.managers).forEach(cid=>{
    const k='r'+slot+'_'+cid;
    delete L.ordens[k]; L.lances[k]=[]; L.vendasSlot[k]={};
    const o=oks[cid];
    if(o&&o.cod) aplicarCodigoOnline(o.cod, slot, cid);
  });
  const transfs = rodarUmaRodadaAmigos();
  let virou=false;
  if(L.slot>fimSlot(L)){
    fecharTemporadaAmigos();
    viradaTemporadaAmigos();
    managersDeTecnicos();
    virou=true;
  }
  return {transfs, virou};
}

function aplicarCodigoOnline(cod, slot, cid){
  const o=lerCodigoOrdens(cod); if(!o||o.clubId!==cid) return false;
  const k='r'+slot+'_'+cid;
  // garotos da base sobem quando o código chega (antes de conferir a escalação)
  if(o.acoes && o.acoes.base && typeof promoverDaBase==='function') o.acoes.base.forEach(i=>promoverDaBase(cid, i, true));
  const el=L.squads[cid]||[];
  L.lances[k]=(o.lances||[]).filter(x=>x.pid&&x.valor>0&&jog(x.pid));
  const v={}; (o.vendas||[]).forEach(x=>{ if(el.some(p=>p.id===x.pid)) v[x.pid]=x.valor; });
  L.vendasSlot[k]=v;
  o.tac.titulares=(o.tac.titulares||[]).filter(id=>el.some(p=>p.id===id));
  if(o.tac.titulares.length<11){
    // vendeu alguém que estava escalado: completa com os melhores fora da lista
    const extra=el.filter(p=>!o.tac.titulares.includes(p.id)&&p.lesao<=0)
      .sort((a,b)=>b.ovr-a.ovr||(a.id<b.id?-1:1)).slice(0,11-o.tac.titulares.length).map(p=>p.id);
    o.tac.titulares=o.tac.titulares.concat(extra);
  }
  if(o.tac.titulares.length!==11) return false;
  o.tac.banco=el.filter(p=>!o.tac.titulares.includes(p.id)&&p.lesao<=0)
    .sort((a,b)=>b.ovr-a.ovr||(a.id<b.id?-1:1)).slice(0,7).map(p=>p.id);
  L.ordens[k]={tac:o.tac, ts:0, acoes:o.acoes||null};
  return true;
}

async function fecharRodadaOnline(rg, cids){
  if(ON._fechando===rg) return;
  ON._fechando=rg;
  try{
    await fbRef('fechada/'+rg).transaction(cur=>{ if(cur) return; return {cids:cids.slice().sort().join(','), ts:Date.now(), por:FB.uid, v:VERSAO_JOGO}; });
  }catch(e){ ON.erro=(e&&e.code)||String(e); }
  ON._fechando=null;
}

function publicarSelo(rg){
  if(!ON||!FB.uid||!L.meuClube) return;
  if(tempDoRg(rg)!==L.temporada) return;         // temporada virada: o selo dela já foi
  try{ fbRef('selos/'+rg+'/'+L.meuClube).set({s:seloRodada(slotDoRg(rg)), v:VERSAO_JOGO, ts:Date.now()}); }catch(e){}
}

function espelharMercadoVivo(){
  L.vendas=L.vendas||{};
  Object.keys(L.managers||{}).forEach(cid=>{
    if(cid===L.meuClube) return;
    const v=(ON.vendas||{})[cid]||{};
    const el=L.squads[cid]||[];
    const lim={}; Object.keys(v).forEach(pid=>{ if(el.some(p=>p.id===pid)) lim[pid]=v[pid]; });
    L.vendas[cid]=lim;
  });
}

/* ---------- ordens (OK) ---------- */

function meuOkOnline(rg){ const o=ON&&ON.ok[rg||rgAtual()]; return o&&o[L.meuClube]&&o[L.meuClube].cod ? o[L.meuClube] : null; }

function coberturaOnline(cid){
  const rg0=rgAtual(); let n=0;
  while(n<SEMANAS_AMIGOS-L.slot+1 && ON.ok[rg0+n] && ON.ok[rg0+n][cid] && ON.ok[rg0+n][cid].cod) n++;
  return L.slot + n - 1;
}

function codigoMudou(){
  const o=meuOkOnline(); if(!o) return false;
  const a=String(o.cod).split('|'), b=codigoOrdens(L.meuClube, L.slot).split('|');
  a[1]=b[1]=''; a[2]=b[2]='';
  return a.join('|')!==b.join('|');
}

async function enviarOrdensOnline(n){
  n=Math.max(1, Math.min(n||1, SEMANAS_AMIGOS-L.slot+1));
  const cid=L.meuClube;
  const ate=L.slot+n-1;
  const rg0=rgAtual();
  const cod=codigoOrdens(cid, ate);
  const up={};
  let algum=false;
  for(let k=0; k<n; k++){ const rg=rg0+k; if(ON.fechada[rg]) continue; up['ok/'+rg+'/'+cid]={cod, uid:FB.uid, ts:Date.now()}; algum=true; }
  // limpa OKs antigos além do novo alcance (até o fim desta temporada)
  for(let k=n; k<=SEMANAS_AMIGOS-L.slot; k++){ const rg=rg0+k; if(ON.ok[rg]&&ON.ok[rg][cid]&&!ON.fechada[rg]) up['ok/'+rg+'/'+cid]=null; }
  up['vendas/'+cid]=minhasVendas();
  const lc={}; meusLances().forEach(x=>{ lc[x.pid]=x.valor; }); up['lances/'+cid]=lc;
  if(!algum){ toast('Essa rodada já fechou.'); return; }
  try{ await fbRef().update(up); }
  catch(e){ toast('Não consegui enviar ('+((e&&e.code)||'erro')+'). Tenta de novo.'); return; }
  salvar(true);
  sheet('Escalação enviada', `
    <p class="sm" style="margin-bottom:10px">Vale da rodada <b>${L.slot}</b> até a <b>${ate}</b>${meusLances().length?` — com seus <b>${meusLances().length}</b> ${meusLances().length===1?'lance':'lances'} de mercado`:''}.</p>
    <div id="on-aguardo">${htmlAguardando()}</div>
    <p class="xs mut" style="margin-top:10px">A rodada roda sozinha, em todos os celulares, assim que o último der OK. Pode fechar o app — quando voltar, o resultado está aqui.</p>
    <button class="btn pri wide" style="margin-top:12px" onclick="fecharSheet()">Beleza</button>`);
  render();
}

function htmlAguardando(){
  const falta=faltamOk(rgAtual());
  if(!falta.length) return `<p class="sm" style="color:var(--ok)">Todo mundo deu OK — rodando a rodada ${L.slot}…</p>`;
  return `<p class="sm mut">Faltam dar OK: <b>${falta.map(c=>esc((L.managers[c]||{}).nome||clube(c).nome)).join(', ')}</b></p>`;
}

async function retirarOkOnline(){
  const cid=L.meuClube, up={}, rg0=rgAtual();
  for(let k=0; k<=SEMANAS_AMIGOS-L.slot; k++){ const rg=rg0+k; if(ON.ok[rg]&&ON.ok[rg][cid]&&!ON.fechada[rg]) up['ok/'+rg+'/'+cid]=null; }
  if(!Object.keys(up).length){ render(); return; }
  try{ await fbRef().update(up); toast('OK retirado. Mexe à vontade e manda de novo.'); }
  catch(e){ toast('Não consegui retirar ('+((e&&e.code)||'erro')+').'); }
  render();
}

/* ---------- selos / sincronia ---------- */

function estadoSelos(slot){
  const s=(ON.selos||{})[rgDe(L.temporada, slot)]||{};
  const meu=s[L.meuClube]&&s[L.meuClube].s;
  const outros=Object.keys(s).filter(c=>c!==L.meuClube);
  if(!meu) return {ok:null, txt:'calculando…'};
  const dif=outros.filter(c=>s[c].s!==meu);
  if(dif.length) return {ok:false, txt:'diferença com '+dif.map(c=>esc((L.managers[c]||{}).nome||clube(c).nome)).join(', ')};
  if(!outros.length) return {ok:true, txt:'só você calculou até agora'};
  return {ok:true, txt:'igual em '+(outros.length+1)+' celulares'};
}

function recalcularLigaOnline(){
  const guard={meuClube:L.meuClube, nome:L.nome, seed:L.seed, code:L.code, dono:L.dono, treino:L.treino,
    vendasMinhas:(L.vendas||{})[L.meuClube]||{}, lances:L.lances||{}, tactics:(clube(L.meuClube)||{}).tactics};
  montarLigaAmigos(guard.seed, guard.code, guard.nome);
  L.online=true; L.dono=guard.dono; L.meuUid=FB.uid; L.meuClube=guard.meuClube; L.treino=guard.treino;
  L.lances=guard.lances; L.vendas={}; L.vendas[guard.meuClube]=guard.vendasMinhas;
  managersDeTecnicos();
  if(guard.tactics && clube(guard.meuClube)) clube(guard.meuClube).tactics=guard.tactics;
  let g=0;
  while(ON.fechada[rgAtual()] && g++<400) rodarRodadaOnline(rgAtual());
  managersDeTecnicos();
  Object.keys(guard.vendasMinhas).forEach(pid=>{ const p=jog(pid); if(p) p.aVenda=true; });
  for(let k=1;k<L.slot;k++) publicarSelo(rgDe(L.temporada,k));
  aplicarTemaClube(meuClube()); salvar(true); fecharSheet(); render();
  toast('Liga recalculada do zero.');
}

function telaSincroniaOnline(){
  const ate=Math.max(1, Math.min(L.slot-1, fimSlot(L)));
  const linhas=[]; for(let r=Math.max(1,ate-4); r<=ate; r++) linhas.push(r);
  sheet('Sincronia da liga', `
    <p class="sm mut" style="margin-bottom:12px">Cada celular calcula a rodada e manda um selo pro servidor. Se os selos batem, a liga está idêntica em todos.</p>
    <div class="card flat" style="margin-bottom:12px">
      ${linhas.map(r=>{const e=estadoSelos(r); return `<div class="between sm"><span class="mut">Rodada ${r}</span>
        <span class="mono" style="font-size:15px;font-weight:600;letter-spacing:.1em;color:${e.ok===false?'var(--danger)':e.ok?'var(--ok)':'inherit'}">${seloRodada(r)}</span></div>
        <div class="xs mut" style="margin:-2px 0 6px">${e.txt}</div>`;}).join('')||'<p class="empty">A liga ainda não começou.</p>'}
    </div>
    <div class="eyebrow" style="margin-bottom:6px">Deu diferença?</div>
    <p class="xs mut" style="margin-bottom:10px">Quase sempre é alguém com o jogo desatualizado. Peça pra todos <b>recarregarem a página</b>. Depois, quem estiver diferente toca em recalcular: a liga inteira é refeita a partir do servidor.</p>
    <button class="btn led wide" onclick="recalcularLigaOnline()">Recalcular a liga inteira</button>`);
}

function presencaTxt(uid){
  const t=(ON.presenca||{})[uid]; if(!t) return 'nunca entrou';
  const d=Date.now()-t;
  if(d<3*60000) return 'online';
  if(d<3600000) return 'há '+Math.round(d/60000)+' min';
  if(d<86400000) return 'há '+Math.round(d/3600000)+' h';
  return 'há '+Math.round(d/86400000)+' d';
}

function renderHomeOnline(){
  const c=meuClube(), tb=tabela(L);
  let pos=tb.findIndex(x=>x.id===c.id)+1; if(pos<1) pos=tb.length||1;
  const me=tb[pos-1]||{p:0,j:0};
  const compromissos = meusCompromissos(L, L.slot);
  const jogosSemana = cid => fixturesDoSlot(L, L.slot)
    .reduce((n,bl)=>n + (bl.jogos||[]).filter(g=>g.h===cid||g.a===cid).length, 0);
  const el=elenco(c.id);
  const lesionados=el.filter(p=>p.lesao>0).length;
  const ok=meuOkOnline();
  const falta=faltamOk(rgAtual());
  const mudou=ok&&codigoMudou();
  const cids=Object.keys(L.managers||{});
  const sozinho=cids.length<=1;
  const lancesNosMeus=(()=>{ const out=[]; Object.keys(ON.lances||{}).forEach(cid=>{ if(cid===c.id) return;
    const lc=ON.lances[cid]||{}; Object.keys(lc).forEach(pid=>{ const p=jog(pid); if(p&&donoDe(pid)===c.id) out.push({p,cid,valor:lc[pid]}); }); }); return out; })();

  $('scr-home').innerHTML=`
  ${cabecalhoClube()}
  ${!FB.conectado&&FB.ok?`<div class="card" style="border-color:var(--led);padding:8px 12px"><span class="xs" style="color:var(--led)">Sem conexão agora — mostrando a última situação. Reconecto sozinho.</span></div>`:''}
  ${ON.erro?`<div class="card" style="border-color:var(--danger);padding:8px 12px"><span class="xs" style="color:var(--danger)">Servidor recusou algo (${esc(ON.erro)}). Se persistir, recarregue a página.</span></div>`:''}
  ${compromissos.length ? compromissos.map((cp,i)=>{
      const g=cp.jogo, casa=g.h===c.id;
      const ultimo = i===compromissos.length-1;
      return `<div class="nextg" style="--cc:${corDaComp(cp.comp.id)}">
      <div class="ng-cab"><span>${esc(nomeCurto(cp.comp))} · ${esc(NOME_FASE[cp.fase]||('Rodada '+(cp.rodada+1)))}</span>
        <span class="ng-loc ${casa?'casa':''}">${casa?'Em casa':'Fora'}</span></div>
      <div class="ng-jogo">
        <span class="ng-t r">${esc(nomeExib(clube(g.h)))}</span>
        ${escudoSVG(clube(g.h),30)}<span class="ng-x">×</span>${escudoSVG(clube(g.a),30)}
        <span class="ng-t">${esc(nomeExib(clube(g.a)))}</span>
      </div>
      <div class="ng-sub">${esc(clube(g.h).cidade)}${compromissos.length>1?` · ${i+1}º de ${compromissos.length} jogos nesta semana`:''}</div>
      ${ultimo?`<div class="ng-bt">
        ${ok
          ? (mudou
              ? `<button class="btn pri" onclick="telaEnviarOrdens()">Reenviar (você mudou)</button>
                 <button class="btn" onclick="retirarOkOnline()">Retirar OK</button>`
              : `<button class="btn" onclick="irPara('tactics')">Ver escalação</button>
                 <button class="btn" onclick="retirarOkOnline()">Retirar OK</button>`)
          : `<button class="btn pri" onclick="irPara('tactics')">Escalar e dar OK</button>`}
      </div>`:''}
    </div>`;}).join('')
    : `<div class="card"><p class="empty">Semana livre — seu time não joga.</p>
       <div class="ng-bt" style="margin-top:8px">${ok
         ? `<button class="btn" onclick="retirarOkOnline()">Retirar OK</button>`
         : `<button class="btn pri" onclick="telaEnviarOrdens()">Dar OK e seguir</button>`}</div></div>`}

  ${`<div class="card sec">
    <div class="between" style="margin-bottom:6px"><span class="eyebrow">Semana ${L.slot} de ${SEMANAS_AMIGOS} · quem já deu OK</span>
      <span class="pill ${falta.length?'a':'g'}">${cids.length-falta.length}/${cids.length}</span></div>
    ${cids.map(cid=>{const m=L.managers[cid]; const deu=!falta.includes(cid); const u=uidDoClube(cid);
      return `<div class="plr" style="padding:6px 0">${escudoSVG(clube(cid),24)}
        <span class="plr-n"><b>${esc(m.nome)}</b><span>${esc(nomeExib(clube(cid)))} · ${(()=>{const n=jogosSemana(cid);return n===0?'sem jogo':n===1?'1 jogo':n+' jogos';})()} · ${u===FB.uid?'você':presencaTxt(u)}</span></span>
        <span class="pill ${deu?'g':'a'}">${deu?'OK ✓':'esperando'}</span></div>`;}).join('')}
    ${sozinho?`<p class="xs mut" style="margin:6px 0 0">Você está sozinho na liga por enquanto. Chama os amigos — a rodada só roda quando todos derem OK.</p>`:''}
    <div class="grid2" style="margin-top:8px">
      <button class="btn sm" onclick="telaConvidarOnline()">Convidar · código ${esc(L.code)}</button>
      ${L.dono===FB.uid&&falta.length&&ok&&!sozinho?`<button class="btn sm ghost" onclick="telaForcarRodada()">Rodar sem quem falta</button>`
        : sozinho&&ok?`<button class="btn sm ghost" onclick="fecharRodadaOnline(rgAtual(),Object.keys(L.managers))">Rodar sozinho</button>`:''}
    </div>
  </div>`}

  ${lancesNosMeus.length?`<div class="card sec"><div class="eyebrow" style="margin-bottom:4px">Lances nos seus jogadores</div>
    ${lancesNosMeus.map(x=>{const min=minhasVendas()[x.p.id]; return `<div class="news ${min!==undefined&&x.valor>=min?'good':''}"><i></i><span class="sm"><b>${esc((L.managers[x.cid]||{}).nome||clube(x.cid).nome)}</b> ofereceu ${dinheiro(x.valor)} por ${esc(x.p.nome)}${min===undefined?' — ele não está na sua lista':x.valor>=min?' — bate o seu mínimo, sai na rodada':' — abaixo do seu mínimo de '+dinheiro(min)}.</span></div>`;}).join('')}
    </div>`:''}

  <div class="barrinha">
    <span onclick="telaFinancas()" style="cursor:pointer"><b>${dinheiro(c.caixa)}</b>caixa ›</span>
    <span><b>${(garanteTactics(L,c.id).formacao)||'4-4-2'}</b>esquema</span>
    <span class="${lesionados?'al':''}"><b>${lesionados}</b>lesionados</span>
    <span><b>${cids.length}</b>técnicos</span>
  </div>

  <div class="card sec">
    <div class="between" style="margin-bottom:6px"><span class="eyebrow">Elenco</span>
      <button class="btn sm ghost" onclick="irPara('tactics')">Escalar ›</button></div>
    ${tabelaElenco(c.id, 12)}
  </div>

  ${L.slot>1?(()=>{const r=Math.min(L.slot-1,fimSlot(L)); const e=estadoSelos(r);
    return `<button class="card flat between selo" style="width:100%;text-align:left" onclick="telaSincroniaOnline()">
    <span><span class="eyebrow">Rodada ${r} · sincronia</span>
      <span class="xs" style="display:block;color:${e.ok===false?'var(--danger)':'var(--muted)'}">${e.txt}</span></span>
    <span class="selo-cod" style="${e.ok===false?'color:var(--danger)':''}">${seloRodada(r)}</span></button>`;})():''}

  <div class="card sec">
    <div class="eyebrow" style="margin-bottom:6px">Classificação</div>
    <table class="tbl"><tbody>${tb.slice(0,6).map((x,i)=>`<tr class="${x.id===L.meuClube?'me':''}">
      <td style="text-align:left;width:18px">${i+1}</td>
      <td><span class="tb-cl">${barraClube(clube(x.id))}${esc(nomeExib(clube(x.id)))}</span> <span class="mut xs">${L.managers[x.id]?esc(L.managers[x.id].nome):''}</span></td>
      <td>${x.j}</td><td><b>${x.p}</b></td></tr>`).join('')}</tbody></table>
    <button class="btn sm ghost wide" style="margin-top:8px" onclick="irPara('league')">Ver tabela completa</button>
  </div>

  ${htmlChat()}

  ${L.noticias&&L.noticias.length?`<div class="card sec"><div class="eyebrow" style="margin-bottom:4px">No radar</div>
    ${L.noticias.slice(0,4).map(n=>`<div class="news ${esc(n.t||'')}"><i></i><span class="sm">${esc(n.txt)}</span></div>`).join('')}</div>`:''}

  <button class="btn ghost wide sm" onclick="menuJogo()">Opções</button>`;
  const cl=$('chat-lista'); if(cl) cl.scrollTop=cl.scrollHeight;
}
/* ===== 09-boot ===== */
'use strict';

window.addEventListener('keydown',e=>{ if(e.key==='Escape') fecharSheet(); });

(async function boot(){
  meuId();
  renderStart();
  await initDB();
  const code=(location.hash||'').replace('#','').trim().toUpperCase();
  if(code && code.length>=4 && code!=='SOLO'){ abrirLiga(code); }
  else { renderStart(); }
})();
</script></body></html>
