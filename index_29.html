function semAcento(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

function marcarEstrelas(L){
  if(!L || !L.squads) return;
  L._estClubes = L._estClubes || {};
  /* A lista escrita à mão roda UMA vez. O ajuste por força (quem passou de 87
     virou craque, quem caiu de 78 deixou de ser) NÃO pode rodar aqui: esta
     função é chamada em todo render, e render acontece em momento diferente em
     cada celular. Quem evoluía até 87 ganhava a estrela no aparelho de quem
     estava com a tela aberta e não ganhava no do amigo — e estrela mexe na
     força do time (+1,6 de ataque no "faro"), então a rodada saía com placar
     diferente em cada celular e os selos paravam de bater. Agora o ajuste roda
     dentro do cálculo da semana, no mesmo ponto em todos os aparelhos. */
  if(L._estClubes.__reais) return;
  L._estClubes.__reais = 1;
  // limpa qualquer estrela sorteada de versões antigas
  Object.keys(L.squads).forEach(cid=>(L.squads[cid]||[]).forEach(p=>{ if(p.estrela && !p.estrelaReal) delete p.estrela; }));
  CRAQUES_REAIS.forEach(([nome, cidPref, tipo])=>{
    const alvo=semAcento(nome);
    // sem clube fixo: só procura nos clubes da Europa (evita homônimos brasileiros)
    // Se o jogador mudou de clube desde que a lista foi escrita, procura nos
    // outros clubes brasileiros também — foi assim que o Hulk ficou sem estrela
    // por estar no Fluminense enquanto a lista o procurava no Atlético-MG.
    const brasileiros = Object.keys(L.squads).filter(cid=>!(typeof ehEuropeu==='function' && ehEuropeu(cid)));
    const cids = cidPref ? [cidPref].concat(brasileiros.filter(c=>c!==cidPref))
                         : Object.keys(L.squads).filter(cid=>typeof ehEuropeu==='function' && ehEuropeu(cid));
    for(const cid of cids){
      const el=L.squads[cid]||[];
      // nome inteiro igual, ou nome do jogo terminando com o nome buscado (ex.: "Giorgian de Arrascaeta")
      const p=el.find(x=>{ const n=semAcento(x.nome); return n===alvo || n.endsWith(' '+alvo) || (alvo.indexOf(' ')<0 && n.split(' ')[0]===alvo && !cidPref && false); });
      if(p){ p.estrela=tipo; p.estrelaReal=true;
        if(tipo==='faro'||tipo==='paredao'||tipo==='muralha') p.ovr=Math.min(93, p.ovr+1);
        p.valor=Math.round(p.valor*1.22/100000)*100000; break; }
    }
  });
  ajustarEstrelas(L);
}

/* Estrela é craque, não "fez um bom ano".
   A lista da Bola de Prata trazia laterais e goleiros de 71 a 74 com estrela,
   enquanto Rodri (89) e Alisson (87) ficavam sem nenhuma — 106 jogadores de 86+
   sem estrela. A estrela deixava de significar o que ela significa. */
const OVR_MIN_ESTRELA = 78;     // abaixo disso ninguém é craque
const OVR_ESTRELA_AUTO = 87;    // acima disso é craque mesmo sem estar na lista (e só gente real chega lá)

function tipoDeEstrela(p){
  if(p.pos==='GOL') return 'paredao';
  if(p.pos==='ZAG'||p.pos==='VOL') return 'muralha';
  if(p.pos==='ATA') return 'faro';
  if(p.pos==='PON'||p.pos==='LAT') return 'veloz';
  return 'maestro';
}

function ajustarEstrelas(L){
  if(!L || !L.squads) return;
  Object.keys(L.squads).forEach(cid=>(L.squads[cid]||[]).forEach(p=>{
    if(p.estrela && p.ovr < OVR_MIN_ESTRELA){ delete p.estrela; delete p.estrelaReal; }
    else if(!p.estrela && p.ovr >= OVR_ESTRELA_AUTO){ p.estrela=tipoDeEstrela(p); p.estrelaReal=true; }
  }));
}

function estrelaSelo(p){
  if(!p || !p.estrela || !ESTRELAS[p.estrela]) return '';
  return `<i class="selo-estrela" title="${esc(ESTRELAS[p.estrela].n)}">★</i>`;
}
// classe da linha do craque: a linha inteira fica dourada, como no Brasfoot
function craqueCls(p){ return (p && p.estrela && ESTRELAS[p.estrela]) ? ' craque' : ''; }

function estrelaTexto(p){
  if(!p || !p.estrela || !ESTRELAS[p.estrela]) return '';
  const e=ESTRELAS[p.estrela];
  return `<div class="craque-lin"><i>${e.i}</i><span><b>${esc(e.n)}</b>${esc(e.d)}</span></div>`;
}

/* Identidade de campo: derivada dos atributos que já existem no save.
   Não cria campos novos nem sorteios; o mesmo atleta mantém uma leitura
   coerente em carreira solo, liga online e saves antigos. */
function perfilJogador(p){
  if(!p) return {nome:'Jogador versátil', desc:'Cumpre sua função e oferece equilíbrio ao time.', chave:'versatil'};
  const at=garanteAtributos(p, (typeof L!=='undefined'&&L)?L.seed:'x');
  if(p.estrela && ESTRELAS[p.estrela]){
    const e=ESTRELAS[p.estrela];
    return {nome:e.n, desc:e.d, chave:p.estrela};
  }
  const melhor=(ks)=>ks.slice().sort((a,b)=>(at[b]||0)-(at[a]||0))[0];
  let chave='versatil';
  if(p.pos==='GOL') chave='paredao';
  else if(p.pos==='ZAG') chave=(at.pas>=at.mar+5?'construtor':'xerife');
  else if(p.pos==='LAT') chave=(at.pas>=at.vel+4?'lateral construtor':'ala incansável');
  else if(p.pos==='VOL') chave=(at.pas>=at.mar+4?'volante construtor':'cão de guarda');
  else if(p.pos==='MEI') chave=(at.fin>=at.pas+5?'meia infiltrador':'organizador');
  else if(p.pos==='PON') chave=(at.dri>=at.vel-2?'driblador':'ponta veloz');
  else if(p.pos==='ATA') chave=(at.fin>=at.vel+2?'matador':'atacante móvel');
  const descricoes={
    paredao:'Especialista em reflexos e proteção da meta.',
    xerife:'Gosta do duelo, protege a área e impõe presença na defesa.',
    construtor:'Ajuda a iniciar as jogadas e sair jogando com qualidade.',
    'lateral construtor':'Apoia por fora e procura companheiros com passe.',
    'ala incansável':'Usa velocidade e fôlego para percorrer o corredor.',
    'cão de guarda':'Protege a defesa, disputa espaços e recupera a bola.',
    'volante construtor':'Recupera e também dá o primeiro passe da construção.',
    'meia infiltrador':'Ataca a área e aparece como opção para finalizar.',
    organizador:'Pensa o jogo, aproxima os companheiros e dita o ritmo.',
    driblador:'Procura o um contra um para desmontar a marcação.',
    'ponta veloz':'Ataca o espaço e acelera as jogadas pelos lados.',
    matador:'Tem a finalização como principal arma perto do gol.',
    'atacante móvel':'Se movimenta para abrir espaços e atacar a profundidade.',
    versatil:'Cumpre sua função e oferece equilíbrio ao time.'
  };
  return {nome:chave.charAt(0).toUpperCase()+chave.slice(1), desc:descricoes[chave]||descricoes.versatil, chave};
}

function identidadeJogadorHTML(p){

}

function forcas(S){
  const f = forcasBase(S);
  let atk=0, mid=0, def=0;
  S.emCampo.forEach(u=>{
    if(u.fora || !u.p.estrela) return;
    if(u.p.estrela==='faro')    atk+=1.6;
    if(u.p.estrela==='veloz')   { atk+=0.9; mid+=0.5; }
    if(u.p.estrela==='maestro') { mid+=1.6; atk+=0.5; }
    if(u.p.estrela==='muralha') def+=1.5;
    if(u.p.estrela==='paredao') def+=1.8;
  });
  return Object.assign({}, f, {def:f.def+def, mid:f.mid+mid, atk:f.atk+atk});
}/* ===== 05-amigos ===== */

function ligaParaCloud(){
  return {
    nome:L.nome, seed:L.seed, size:L.size, temporada:L.temporada, rodada:L.rodada,
    fixtures:L.fixtures, clubs:L.clubs, treino:L.treino, noticias:L.noticias.slice(0,10),
    historico:L.historico, temporadaFim:!!L.temporadaFim, ts:Date.now()
  };
}

async function enviarLigaCompleta(){
  if(!DB||!L.code) { salvarComEspaco('vest_liga_'+L.code,L); return false; }
  try{
    await DB.doc(P.info(L.code)).set(ligaParaCloud());
    await Promise.all(L.clubs.map(c=>DB.doc(P.squad(L.code,c.id)).set({js:L.squads[c.id]})));
    await DB.doc(P.res(L.code)).set({r:L.resultados});
    await Promise.all(Object.keys(L.managers).map(cid=>
      DB.collection(P.mgr(L.code)).doc(cid).set(L.managers[cid])));
    salvarComEspaco('vest_liga_'+L.code,L);
    return true;
  }catch(e){ salvarComEspaco('vest_liga_'+L.code,L); return false; }
}

async function baixarLiga(code){
  if(!DB) return false;
  try{
    const snap=await DB.doc(P.info(code)).get();
    if(!snap.exists) return false;
    const d=snap.data();
    const L2 = {v:1, code, modo:'amigos', nome:d.nome, seed:d.seed, size:d.size,
      temporada:d.temporada, rodada:d.rodada, fixtures:d.fixtures, clubs:d.clubs,
      squads:{}, resultados:{}, managers:{}, ordens:{}, noticias:d.noticias||[],
      historico:d.historico||[], treino:d.treino||'equilibrado', meuClube:null,
      diretoria:null, temporadaFim:!!d.temporadaFim};
    const sq=await Promise.all(L2.clubs.map(c=>DB.doc(P.squad(code,c.id)).get()));
    sq.forEach((s,i)=>{ L2.squads[L2.clubs[i].id] = s.exists?s.data().js:[]; });
    const rs=await DB.doc(P.res(code)).get();
    if(rs.exists) L2.resultados=rs.data().r||{};
    const mg=await DB.collection(P.mgr(code)).get();
    (mg.docs||[]).forEach(x=>{ L2.managers[x.id]=x.data(); });
    const or=await DB.collection(P.ord(code)).get();
    (or.docs||[]).forEach(x=>{ L2.ordens[x.id]=x.data(); });
    L=L2; salvarComEspaco('vest_liga_'+code,L);
    return true;
  }catch(e){ return false; }
}

function assinarLiga(){
  if(!DB||!L||!L.code) return;
  if(unsub){try{unsub()}catch(e){}}
  try{
    const u1=DB.doc(P.info(L.code)).onSnapshot(s=>{
      if(!s.exists||!L) return;
      const d=s.data();
      if(d.rodada>L.rodada){ toast('Rodada '+(d.rodada-1)+' encerrada!'); baixarLiga(L.code).then(()=>{
        const meu=Object.keys(L.managers).find(cid=>L.managers[cid].id===ME.id); if(meu)L.meuClube=meu; render(); }); }
    },()=>{});
    const u2=DB.collection(P.ord(L.code)).onSnapshot(s=>{
      if(!L) return; (s.docs||[]).forEach(x=>{L.ordens[x.id]=x.data();});
      if(TELA==='home') render();
    },()=>{});
    const u3=DB.collection(P.mgr(L.code)).onSnapshot(s=>{
      if(!L) return; (s.docs||[]).forEach(x=>{L.managers[x.id]=x.data();});
      if(TELA==='home'||TELA==='league') render();
    },()=>{});
    unsub=()=>{[u1,u2,u3].forEach(f=>{try{f&&f()}catch(e){}});};
  }catch(e){}
}

function chaveOrdem(cid, slot){ return 'r'+(slot||L.slot)+'_'+cid; }

function jaEnviei(){ if(L.online&&ON) return !!meuOkOnline(); return !!L.ordens[chaveOrdem(L.meuClube)]; }

function ordensPendentes(slot){ if(L.online&&ON) return faltamOk(slot||L.slot); return Object.keys(L.managers).filter(cid=>!L.ordens[chaveOrdem(cid, slot)]); }

function coberturaAte(cid){
  if(L.online&&ON) return coberturaOnline(cid);
  let r=L.slot-1;
  while(L.ordens[chaveOrdem(cid, r+1)] && r+1<=fimSlot(L)) r++;
  return r;
}

function rodadasProntas(){
  const ids=Object.keys(L.managers);
  if(!ids.length) return 0;
  return Math.max(0, Math.min.apply(null, ids.map(coberturaAte)) - L.slot + 1);
}

function minhaCobertura(){ return Math.max(0, coberturaAte(L.meuClube) - L.slot + 1); }

function telaEnviarOrdens(){
  const t=garanteTactics(L,L.meuClube);

    <div class="stack">
      ${[[1,'Só a próxima rodada','rodada a rodada, no controle total'],
         [5,'Próximas 5 rodadas','ritmo bom pra jogar no grupo'],
         [10,'Próximas 10 rodadas','deixa correr e volta pra ver']]
        .filter(([n])=>n<=restam||n===1)
        .map(([n,tit,sub])=>`<button class="btn wide" style="flex-direction:column;align-items:flex-start;padding:12px 14px;height:auto"
          onclick="enviarOrdens(${n})">

      ${restam>10?`<button class="btn wide" onclick="enviarOrdens(${restam})">Até o fim do campeonato (${restam} rodadas)</button>`:''}
    </div>`);
}

function enviarOrdens(n){
  if(L.online&&ON) return enviarOrdensOnline(n);
  n = Math.max(1, Math.min(n||1, fimSlot(L)-L.slot+1));
  const t=garanteTactics(L,L.meuClube);
  const copia=JSON.parse(JSON.stringify(t));
  L.vendasSlot=L.vendasSlot||{};
  const vend=JSON.parse(JSON.stringify((L.vendas||{})[L.meuClube]||{}));
  for(let r=L.slot; r<L.slot+n; r++){
    L.ordens['r'+r+'_'+L.meuClube]={tac:copia, ts:Date.now()};
    L.vendasSlot['r'+r+'_'+L.meuClube]=vend;
  }
  salvar(true);
  const pend=ordensPendentes();
  const prontas=rodadasProntas();
  const vale=`<p class="sm" style="margin-bottom:10px">Vale da rodada <b>${L.slot}</b> até a <b>${L.slot+n-1}</b>${(L.lances&&L.lances[chaveOrdem(L.meuClube)]||[]).length?` — e leva junto seus <b>${(L.lances[chaveOrdem(L.meuClube)]||[]).length}</b> lances de mercado`:''}.</p>`;
  const rodar=`<p class="sm" style="color:var(--ok);margin-bottom:8px">Todo mundo pronto para ${prontas} ${prontas===1?'rodada':'rodadas'}.</p>
       <div class="stack">
        <button class="btn pri wide" onclick="fecharSheet();rodarRodadaAmigos(1)">Rodar 1 rodada</button>
        ${prontas>=5?`<button class="btn wide" onclick="fecharSheet();rodarRodadaAmigos(5)">Rodar 5 rodadas</button>`:''}
        ${prontas>1?`<button class="btn led wide" onclick="fecharSheet();rodarRodadaAmigos(${prontas})">Rodar as ${prontas} rodadas</button>`:''}
       </div>`;

  /* Para quem está NESTE aparelho não existe código nenhum: o cara está do
     lado. Antes esta folha cuspia um código de 300 caracteres "pra mandar no
     grupo" e um botão de colar ordens — para o irmão sentado na mesma mesa.
     Quem manda aqui não é como a liga foi criada, é quem ainda falta: se todos
     os que faltam estão neste aparelho, a rodada anda só passando a vez. */
  const vez = proximoLocalPendente();
  const passar = vez
    ? `<div class="eyebrow" style="margin-bottom:6px">Agora é a vez de</div>
       <div class="plr" style="margin-bottom:12px">${crestHTML(clube(vez))}
         <span class="plr-n"><b>${esc((L.managers[vez]||{}).nome||'Técnico')}</b><span>${esc(clube(vez).nome)}</span></span>
         <span class="pill a">Falta escalar</span></div>
       <button class="btn pri wide" onclick="fecharSheet();virarTecnico('${vez}')">Passar pro ${esc((L.managers[vez]||{}).nome||'Técnico')}</button>`
    : '';
  const soDaqui = pend.every(cid=>L.managers[cid] && L.managers[cid].local);
  if(soDaqui){
    sheet('Escalação enviada', `${vale}${vez ? passar : rodar}`);
    render(); return;
  }

  const cod=codigoOrdens(L.meuClube, L.slot+n-1);
  sheet('Escalação enviada', `
    ${vale}
    <p class="xs mut" style="margin-bottom:8px">Se seus amigos jogam em outros celulares, mande este código no grupo:</p>
    <div class="card flat" style="margin-bottom:10px"><p class="mono xs" style="word-break:break-all">${esc(cod)}</p></div>
    <button class="btn wide" onclick="copiar(${JSON.stringify(cod)})">Copiar código</button>
    <hr class="chalk" style="margin:14px 0">
    ${pend.length?`<p class="sm mut">Faltam mandar: <b>${pend.map(x=>esc(clube(x).nome)).join(', ')}</b></p>
      ${passar?passar+'<hr class="chalk" style="margin:12px 0">':''}
      <button class="btn wide" style="margin-top:8px" onclick="colarOrdens()">Colar ordens de um amigo</button>`
     : rodar}`);
  render();
}

function resumoPeriodo(de, ate, posAntes){
  const tb=tabela(L);
  const pos=tb.findIndex(x=>x.id===L.meuClube)+1;
  /* Isto só olhava o BRASILEIRÃO. Rodando cinco semanas de uma vez — que é
     como se joga no grupo —, os jogos de Libertadores, Sul-Americana e Copa
     do Brasil do período simplesmente não apareciam, e o aproveitamento
     mentia: 2V 1D num período em que ele jogou seis vezes. Agora varre todas
     as competições, e cada jogo diz de qual é. */
  const meus=[];
  for(let r=de;r<=ate;r++){
    fixturesDoSlot(L, r).forEach(bl=>{
      (bl.jogos||[]).forEach(g=>{
        if(!g||(g.h!==L.meuClube && g.a!==L.meuClube)) return;
        const res=bl.comp.resultados[chave(bl.comp, bl.fase, bl.rodada, g.h, g.a)];
        if(res) meus.push({r, comp:bl.comp, fase:bl.fase, rodada:bl.rodada,
                           h:g.h, a:g.a, hg:res.hg, ag:res.ag});
      });
    });
  }
  let v=0,e=0,d=0,gp=0,gc=0;
  meus.forEach(m=>{ const casa=m.h===L.meuClube; const meu=casa?m.hg:m.ag, del=casa?m.ag:m.hg;
    gp+=meu; gc+=del; if(meu>del)v++; else if(meu===del)e++; else d++; });
  const porComp={};
  meus.forEach(m=>{ porComp[m.comp.id]=porComp[m.comp.id]||{comp:m.comp, jogos:[]};
                    porComp[m.comp.id].jogos.push(m); });
  const dif = posAntes-pos;
  sheet(`Rodadas ${de} a ${ate}`, `
    <div class="grid2" style="margin-bottom:12px">
      <div class="card flat" style="text-align:center"><div class="eyebrow">Em todas as competições</div>
        <div class="mono" style="font-size:24px;font-weight:600">${v}V ${e}E ${d}D</div>
        <div class="xs mut">${gp} gols pró · ${gc} contra</div></div>
      <div class="card flat" style="text-align:center"><div class="eyebrow">Posição</div>
        <div class="mono" style="font-size:24px;font-weight:600">${pos}º</div>
        <div class="xs" style="color:${dif>0?'var(--ok)':dif<0?'var(--danger)':'var(--muted)'}">
          ${dif>0?'▲ subiu '+dif:dif<0?'▼ caiu '+(-dif):'manteve'}</div></div>
    </div>
    <div class="eyebrow" style="margin-bottom:6px">Seus ${meus.length} jogo${meus.length===1?'':'s'} no período</div>
    ${Object.keys(porComp).map(k=>{const bloco=porComp[k];
      return `<div style="margin-bottom:10px">
        <div style="margin-bottom:4px">${chipComp(bloco.comp)}</div>
        ${bloco.jogos.map(m=>linhaJogo(m.h,m.a,m.hg,m.ag,true)).join('')}
      </div>`;}).join('') || '<p class="empty">Você não jogou neste período.</p>'}
    <hr class="chalk" style="margin:12px 0">
    <div class="eyebrow" style="margin-bottom:4px">Classificação</div>
    <table class="tbl"><tbody>${tb.slice(0,6).map((x,i)=>`<tr class="${x.id===L.meuClube?'me':''}">
      <td style="text-align:left;width:18px">${i+1}</td>
      <td><span class="tb-cl">${barraClube(clube(x.id))}${esc(clube(x.id).nome)}</span></td>
      <td>${x.j}</td><td><b>${x.p}</b></td></tr>`).join('')}</tbody></table>
    <button class="btn pri wide" style="margin-top:12px" onclick="fecharSheet()">Continuar</button>`);
}

function aplicarSemanaAmigos(){
  // economia: todo clube da liga fatura e paga folha (igual em todos os aparelhos)
  clubesDaLiga().forEach(c=>{ semanaFinanceira(c, jogosEmCasaDoSlot(L, c.id, L.slot)); });
  Object.keys(L.squads).forEach(cid=>{
    // o treino de cada técnico viaja no código das ordens; quem não mandou treina equilibrado
    const cl=clube(cid);
    const treino=(cl && cl.treinoSemana) || 'equilibrado';
    const meu = cid===L.meuClube;
    L.squads[cid].forEach(p=>{
      p.energia=clamp(p.energia+recuperaSemana(p, treino),0,100);
      if(p.lesao>0) p.lesao=Math.max(0,p.lesao-1);
      let ganho=0;
      if(p.ovr<p.pot) ganho=(p.idade<=19?0.185:p.idade<=21?0.155:p.idade<=23?0.115:p.idade<=26?0.058:p.idade<=29?0.028:0.014)*fatorDesempenho(p)*(treino==='tatico'?1.15:1);
      const SEM=42, gol=p.pos==='GOL';
      const limiar=gol?33:30, taxa=gol?0.22:0.36, teto=gol?3.0:4.0;
      if(p.idade>=limiar) ganho -= Math.min(teto, taxa*(p.idade-limiar+1))/SEM;
      const d=aplicarEvolucao(p, ganho, treino, L.slot);
      if(d && meu) noticiaEvolucao(L, p, d);
    });
  });
  if(L.slot%6===0) noticiaRodada(L);
  /* as estrelas acompanham a evolução aqui, no fim da semana: é o único ponto
     pelo qual todos os celulares passam na mesma ordem */
  if(typeof ajustarEstrelas==='function') ajustarEstrelas(L);
  L.noticias=L.noticias.slice(0,12);
}

function codigoEntrada(){
  return ['J1', L.meuClube, (ME.nome||'Técnico').replace(/[|]/g,' ')].join('|');

function lerCodigoEntrada(txt){
  const p=String(txt||'').trim().split('|');
  if(p[0]!=='J1'||p.length<2) return null;
  return {clubId:p[1], nome:(p[2]||'Técnico').trim()};
}

function registrarTecnico(cid, nome){
  if(!cid || !L.clubs.find(c=>c.id===cid)) return false;
  if(cid===L.meuClube) return true;
  if(!L.managers[cid]) L.managers[cid]={id:'r'+cid, nome:nome||'Técnico', local:false};
  else if(nome && nome!=='Técnico') L.managers[cid].nome=nome;
  garanteTactics(L,cid);
  return true;
}

function aplicarCodigoOrdens(txt){
  const ent=lerCodigoEntrada(txt);
  if(ent){
    const ok=registrarTecnico(ent.clubId, ent.nome);
    if(ok){ L.noticias.unshift({t:'led', txt:`${ent.nome} assume o ${clube(ent.clubId).nome} na ${L.nome}.`}); salvar(true); }
    return ok;
  }
  const o=lerCodigoOrdens(txt);
  if(!o) return false;
  if(!L.clubs.find(c=>c.id===o.clubId)) return false;
  registrarTecnico(o.clubId, (o.nome||'').trim());     // quem manda escalação é técnico
  L.lances=L.lances||{}; L.vendas=L.vendas||{}; L.vendasSlot=L.vendasSlot||{};
  if(o.lances) L.lances['r'+o.slot+'_'+o.clubId]=o.lances.filter(x=>jog(x.pid));
  if(o.vendas){
    const v={}; o.vendas.forEach(x=>{ if((L.squads[o.clubId]||[]).some(p=>p.id===x.pid)) v[x.pid]=x.valor; });
    L.vendas[o.clubId]=v;
    for(let r=o.slot; r<=Math.min(o.ate, fimSlot(L)); r++) L.vendasSlot['r'+r+'_'+o.clubId]=v;
  }
  // garotos da base sobem na hora em que o código chega (antes de conferir a escalação)
  if(o.acoes && o.acoes.base && typeof promoverDaBase==='function') o.acoes.base.forEach(i=>promoverDaBase(o.clubId, i, true));
  const el=L.squads[o.clubId]||[];
  o.tac.titulares=o.tac.titulares.filter(id=>el.some(p=>p.id===id));
  if(o.tac.titulares.length!==11) return false;
  o.tac.banco=el.filter(p=>!o.tac.titulares.includes(p.id)&&p.lesao<=0)
    .sort((a,b)=>b.ovr-a.ovr).slice(0,7).map(p=>p.id);
  for(let r=o.slot; r<=Math.min(o.ate, fimSlot(L)); r++)
    L.ordens['r'+r+'_'+o.clubId]={tac:o.tac, ts:Date.now(), acoes:(r===o.slot&&o.acoes)?o.acoes:null};
  return true;
}

function entrarPorCodigo(){
  const txt=(($('in-code')||{}).value||'').trim();
  const nome=(($('in-nome2')||{}).value||'Técnico').trim().slice(0,16);
  ME.nome=nome; lsSet('vest_me',ME);
  const d=lerCodigoDaLiga(txt);
  if(!d){ toast('Código inválido. Cole o código inteiro que começa com VST1.'); return; }
  montarLigaAmigos(d.seed, d.code, d.nome);
  d.managers.forEach(m=>{ if(L.clubs.find(c=>c.id===m.id)) L.managers[m.id]={id:'r'+m.id, nome:m.nome, local:false}; });
  _entrouPorCodigo=true;
  fecharSheet();

}

function assumirClubeAmigos(cid){

  _entrouPorCodigo=false;
  /* No modo "mesmo aparelho" o próximo passo é óbvio e tem que vir sozinho:
     quem mais vai jogar. Cair direto na tela de convites (com código, QR e
     explicação de celular) fazia parecer que você estava jogando sozinho. */
  const proxima = entrou ? telaAvisarEntrada
                : (L.mesmoAparelho && Object.keys(L.managers).length<2) ? addTecnicoLocal
                : convidar;
  setTimeout(proxima, 400);
}

/* ===== 06b-lance =====
   O futebol de botão de verdade.

   O problema da versão anterior era de fundo: cada toque durava 300ms fixos,
   então um passe de 42 metros viajava a 140 m/s — mais rápido que o olho segue —
   e a bola cruzava o campo inteiro de um lado ao outro sem motivo. Medido numa
   partida: velocidade mediana de 62 m/s, pico de 379. Um passe de verdade anda
   a 18.

   Agora vale o seguinte, e vale para a bola parada e para o lance:
   1. A bola tem velocidade física. O tempo de cada toque sai da distância.
   2. Os passes são curtos. A jogada sobe o campo de 10 em 15 metros.
   3. Quem recebe vai até onde a bola vai. O jogador é preso no ponto de recepção
      enquanto a bola viaja, e chega junto com ela — é isso que faz parecer passe.
   4. A jogada progride na direção do gol. Nada de voltar 40 metros sem razão.
   5. O gol nasce da jogada: o chute sai de onde se chuta, não do meio-campo. */
'use strict';

// metros por segundo, na escala do campo (100 x 64)
const VEL_BOLA = {curto:15, passe:19, forte:25, lancamento:23, conducao:6.5,
                  cruzamento:21, chute:32, recuo:16, saida:22, sobra:12};

function msDaBola(d, tipo, f){
  const v = VEL_BOLA[tipo] || VEL_BOLA.passe;
  return Math.max(110, Math.round(d / v * 1000 * (f==null?1:f)));
}

/* Recolocar a bola (marca do pênalti, meio de campo, bandeirinha) não é passe:
   é o juiz levando a bola. Pode ser longe — às vezes atravessa o campo — mas
   tem que ser deliberado e não pode demorar uma eternidade.
   O teto era 1,5s, e aí a bola voltando do fundo do gol pro meio de campo (uns
   68m) fazia 45 m/s: um borrão, que é justo o que o Rafael chamou de sem
   sentido. Agora o teto é 2,6s, então a recolocação mais longa do jogo fica em
   ~26 m/s — rápido como uma bola tocada com firmeza, nunca um foguete. */
function msRecolocar(d, f){
  return clamp(Math.round(d / 18 * 1000 * (f==null?1:f)), 560, 2600);
}

function dentroDoCampo(p){
  return {x: clamp(p.x, 2.2, CAMPO_W-2.2), y: clamp(p.y, 3, CAMPO_H-3)};
}

/* Quem recebe num ponto: o companheiro cuja posição natural é a mais próxima
   dali. Assim o lateral recebe na lateral e o atacante recebe na área. */
function receptorNoPonto(S, ponto, usados, semGol){
  let melhor=null, d0=1e9;
  S.emCampo.forEach(u=>{
    if(u.fora) return;
    if(semGol!==false && u.slot==='GOL') return;
    if(usados && usados[u.idx]) return;
    const q=posBase(S, u.idx);
    const d=Math.hypot(q.x-ponto.x, q.y-ponto.y);
    if(d<d0){ d0=d; melhor=u; }
  });
  return melhor;
}

// o adversário de linha mais perto de um ponto — quem vai pressionar
function defensorPerto(O, ponto, usados){
  let melhor=null, d0=1e9;
  O.emCampo.forEach(u=>{
    if(u.fora || u.slot==='GOL') return;
    if(usados && usados[u.idx]) return;
    const q=posBase(O, u.idx);
    const d=Math.hypot(q.x-ponto.x, q.y-ponto.y);
    if(d<d0){ d0=d; melhor=u; }
  });
  return melhor;
}

/* De onde se finaliza. Um chute de fora sai de 22 a 27 metros; o de dentro da
   área, de 9 a 16, na diagonal de quem vem de fora. */
function pontoDeChute(S, estilo){
  const gol=golDe(S), dir=S.casa?1:-1;
  if(estilo==='fora'){
    const dist = 22 + rnd()*6;
    return dentroDoCampo({x: gol.x - dir*dist, y: CAMPO_H/2 + (rnd()-.5)*20});
  }
  if(estilo==='cruz'){   // cabeceio/finalização no segundo pau, coladinho
    return dentroDoCampo({x: gol.x - dir*(7 + rnd()*5), y: CAMPO_H/2 + (rnd()-.5)*13});
  }
  const dist = 9 + rnd()*7;
  return dentroDoCampo({x: gol.x - dir*dist, y: CAMPO_H/2 + (rnd()-.5)*17});
}

// o ponto do cruzamento: perto da linha de fundo, na ponta
function pontoDeCruzamento(S){
  const gol=golDe(S), dir=S.casa?1:-1;
  return dentroDoCampo({x: gol.x - dir*(5 + rnd()*6), y: rnd()<.5 ? 5.5 : CAMPO_H-5.5});
}

/* O caminho da jogada: do lugar onde a bola está até o ponto de finalização,
   em saltos que cabem num passe. Cada salto ganha um dono. */
function caminhoAteOAlvo(S, inicio, alvo, orcamento, f){
  const dir=S.casa?1:-1;
  const D = Math.hypot(alvo.x-inicio.x, alvo.y-inicio.y);
  // quantos toques cabem: nem um passe de 40m, nem vinte toquinhos
  let n = clamp(Math.round(D/13), 1, 5);
  // nenhum passe pode ser maior que 34m: era isso que fazia a bola atravessar
  // o campo inteiro de uma vez e o jogo perder o sentido
  const minimo = Math.max(1, Math.ceil(D/34));
  n = Math.max(n, minimo);
  // e o orçamento manda: se não dá tempo, menos toques — mas nunca menos que o mínimo
  const tempoDe = k => { let t=0, p=inicio;
    for(let i=1;i<=k;i++){ const q={x:inicio.x+(alvo.x-inicio.x)*i/k, y:inicio.y+(alvo.y-inicio.y)*i/k};
      t += msDaBola(Math.hypot(q.x-p.x,q.y-p.y), 'passe', f) + 90*(f||1); p=q; }
    return t; };
  while(n>minimo && tempoDe(n) > orcamento) n--;
  const pontos=[];
  for(let i=1;i<=n;i++){
    const t=i/n;
    let p={x: inicio.x+(alvo.x-inicio.x)*t, y: inicio.y+(alvo.y-inicio.y)*t};
    if(i<n){                                   // desvia um pouco do risco reto
      p.y += (rnd()-.5)*11;
      p.x += dir*(rnd()-.3)*3;
    } else { p={x:alvo.x, y:alvo.y}; }
    pontos.push(dentroDoCampo(p));
  }
  return pontos;
}

/* ---------- montar o lance ---------- */

/* Se o motor já disse de que tipo foi o lance, obedece. Era aqui que a
   animação sorteava de novo e contradizia a narração — cabeçada de 28m.
   O sorteio local fica só para evento antigo (replay de save velho) e para
   defesa/trave/fora, que a narração não compromete com distância. */
function estiloDoLance(S, e){
  if(e && e.estilo) return e.estilo;
  const u = e.i!=null ? S.emCampo.find(z=>z.idx===e.i) : null;
  const fin = u && typeof atrDe==='function' ? atrDe(u,'fin') : 70;
  const fis = u && typeof atrDe==='function' ? atrDe(u,'fis') : 70;
  const r = rnd()*100;
  if(r < 15 + (fin-70)*0.5) return 'fora';
  if(r < 42 + (fis-70)*0.5) return 'cruz';
  return 'dentro';
}

/* Devolve a lista de passos do lance. Cada passo:
   {para:{x,y}, tipo, receptor(idx ou null), fase, ms, antes(fn)} */
function montarLance(S, O, e, orcamento, f){
  const dir=S.casa?1:-1, gol=golDe(S), lado=ladoDe(S);
  const inicio = {x:BOLA_POS.x, y:BOLA_POS.y};
  const passos=[];
  const usados={};
  const estilo = (e.t==='gol'||e.t==='defesa'||e.t==='trave'||e.t==='fora'||e.t==='chance')
    ? estiloDoLance(S, e) : 'dentro';

  // reserva quem finaliza: ele é o dono do último toque antes do chute
  const fim = e.i!=null ? S.emCampo.find(u=>u.idx===e.i && !u.fora) : null;
  if(fim) usados[fim.idx]=1;

  const alvoChute = pontoDeChute(S, estilo);
  const alvoConstru = (estilo==='cruz') ? pontoDeCruzamento(S) : alvoChute;

  // sobra do orçamento para a construção (o chute e o desfecho comem o resto)
  const custoFim = (estilo==='cruz' ? 900 : 650) * (f||1);
  const pontos = caminhoAteOAlvo(S, inicio, alvoConstru, Math.max(300, orcamento-custoFim), f);

  pontos.forEach((pt, i)=>{
    const ultimo = (i===pontos.length-1);
    const dono = (ultimo && estilo!=='cruz' && fim) ? fim
               : receptorNoPonto(S, pt, usados);
    if(dono) usados[dono.idx]=1;
    const d = Math.hypot(pt.x - (i?pontos[i-1].x:inicio.x), pt.y - (i?pontos[i-1].y:inicio.y));
    const tipo = d>26 ? 'lancamento' : d>17 ? 'forte' : d>9 ? 'passe' : 'curto';
    const avanco = (pt.x - (i?pontos[i-1].x:inicio.x))*dir;
    passos.push({para:pt, tipo, receptor:dono?dono.idx:null, lado,
      fase: ultimo ? 'area' : (avanco>4 ? 'ataque' : 'normal'),
      ms: msDaBola(d, tipo, f)});
  });

  if(estilo==='cruz'){
    // o cruzamento: bola alta pra área, e quem finaliza aparece lá
    const d=Math.hypot(alvoChute.x-alvoConstru.x, alvoChute.y-alvoConstru.y);
    passos.push({para:alvoChute, tipo:'cruzamento', receptor:fim?fim.idx:null, lado,
      fase:'area', ms: msDaBola(d, 'cruzamento', f), cruzou:true});
  }

  return {passos, estilo, alvoChute, fim, gol, dir, lado};
}

/* ---------- tocar o lance ---------- */

let LANCE_MS = {};   // duração real medida do último lance de cada tipo
let GOL_RELOGIO = null;   // relógio exclusivo da tela de gol (limparLance não mexe)

function animarLanceBase(e){
  if(!M || !$('campo-svg')) return;
  if(VEL==='turbo' && e.t!=='gol') return;
  const S = e.side==='h'?M.h:M.a, O = e.side==='h'?M.a:M.h;
  if(!S || !O) return;
  limparLance();
  const f = velFator();
  /* A TELA DE GOL não pode depender da animação chegar até o fim. Ela era
     disparada num setTimeout junto com o resto do lance, e limparLance() corta
     esses timers quando o lance seguinte chega — num celular travando, o gol
     entrava no placar sem a tela. Este relógio aqui é só dela, fica fora da
     lista que limparLance limpa, e cada gol só acende uma vez (e._flash). */
  if(e.t==='gol'){
    clearTimeout(GOL_RELOGIO);
    const quando = Math.max(500, (tempoLance(e)||1500) * 0.72);
    GOL_RELOGIO = setTimeout(()=>{
      if(!M || e._flash) return;
      e._flash=1;
      try{ flashGol(e.side==='h'?M.h:M.a, e.q||'', e); }catch(err){}
    }, quando);
  }
  const lado = e.side;
  const orcamento = Math.max(400, (tempoLance(e)||1500) * 0.62);

  // eventos que não são jogada: resolve e sai
  if(e.t==='ca' || e.t==='cv'){
    if(e.i!=null) acender(S, e.i, e.q);
    if(e.t==='cv') BOLA_TIMERS.push(setTimeout(()=>redesenharBotoes(), 260));
    return;
  }
  if(e.t==='sub' || e.t==='lesao'){
    if(e.i!=null) acender(S, e.i, e.q);
    BOLA_TIMERS.push(setTimeout(()=>redesenharBotoes(), 300));
    return;
  }
  if(e.t==='apito'){
    estado({ataque:null, fase:'normal', foco:null, gol:null, setp:null, recebe:null, chute:null}, 700);
    // apito: a bola é recolocada no meio, devagar, não chutada até lá
    const meioC={x:CAMPO_W/2, y:CAMPO_H/2};
    moverBola(meioC, msRecolocar(distBola(meioC), f), true);
    if(typeof POSSE!=='undefined') POSSE=null;
    return;
  }
  /* A MARCAÇÃO do pênalti. Antes esta função saía daqui sem travar LANCE_ATIVO:
     no tique seguinte a bolaOciosa() entrava por cima, desfazia o arco e levava
     a bola embora — por isso o texto "PÊNALTI PARA O..." aparecia com o campo
     num lance qualquer, e a batida nunca acontecia. */
  if(e.t==='penalti' && e.tipo!=='gol'){
    const marca=marcaDoPenalti(S);
    /* TEM QUE EXISTIR A JOGADA QUE GEROU O PÊNALTI.
       Era isto que o Rafael viu: a bola rolando entre os zagueiros dele e, do
       nada, pênalti. O motor decide o pênalti de forma abstrata (quem tem a
       posse naquele minuto), e esta função pegava a bola onde ela estivesse e
       levava direto pra marca — sem ataque nenhum no meio. Agora a bola sobe o
       campo até a área primeiro, o atacante é derrubado lá, e só então a bola
       vai pra marca. O texto entra quando ela chega. */
    const inicio = {x:BOLA_POS.x, y:BOLA_POS.y};
    const entrada = pontoDeChute(S, 'dentro');
    const orc = Math.max(900, (tempoLance(e)||4200) * 0.62);
    const subida = caminhoAteOAlvo(S, inicio, entrada, orc, f);
    const passos = [];
    const usados = {};
    const faltoso = e.i!=null ? S.emCampo.find(u=>u.idx===e.i && !u.fora) : null;
    if(faltoso) usados[faltoso.idx]=1;
    let de = inicio;
    subida.forEach((pt,i)=>{
      const ultimo = (i===subida.length-1);
      const dono = ultimo && faltoso ? faltoso : receptorNoPonto(S, pt, usados);
      if(dono) usados[dono.idx]=1;
      const d = Math.hypot(pt.x-de.x, pt.y-de.y);
      const tipo = d>22 ? 'lancamento' : d>13 ? 'passe' : 'curto';
      passos.push({para:pt, tipo, ms:msDaBola(d, tipo, f),
        antes:()=>{ if(dono) acender(S, dono.idx, ''); }});
      de = pt;
    });
    // a infração: todo mundo se posiciona e a bola vai pra marca
    passos.push({para:marca, tipo:'sobra', recoloca:true, ms:msRecolocar(Math.hypot(marca.x-de.x, marca.y-de.y), f),
      antes:()=>{ estado({ataque:lado, fase:'penalti', setp:{side:lado, idx:e.i}, foco:null, recebe:null, chute:null, gol:null}, 420*f);
                  acender(S, e.i, e.q); },
      depois:()=>narrar(e)});
    const total = seqTocar(passos, f);
    LANCE_ATIVO = e;
    BOLA_TIMERS.push(setTimeout(()=>{ LANCE_ATIVO=null; }, Math.max(total, tempoLance(e)||1200)));
    if(typeof POSSE!=='undefined') POSSE = {side:lado, terco:2, de:e.i, lev:0, seq:0};
    return;
  }

  // A BATIDA: gol ou defesa de pênalti não é jogada trabalhada, é bater da marca.
  if((e.t==='gol' || e.t==='defesa') && e.tipo==='penalti'){
    batidaDePenalti(S, O, e, f, lado);
    return;
  }

  const L1 = montarLance(S, O, e, orcamento, f);
  const gol = L1.gol, dir = L1.dir;
  const seq = [];

  // ---- a construção ----
  L1.passos.forEach(pp=>{
    seq.push({para:pp.para, tipo:pp.tipo, ms:pp.ms, antes:()=>{
      // quem vai receber corre pro ponto e chega junto com a bola
      estado({ataque:lado, fase:pp.fase, setp:null, gol:null, chute:null,
              foco: pp.receptor!=null ? {side:lado, idx:pp.receptor} : EST.foco,
              recebe: pp.receptor!=null ? {side:lado, idx:pp.receptor, x:pp.para.x, y:pp.para.y} : null},
             pp.ms);
      // o nome de quem está com a bola aparece SEMPRE, não só na área: antes
      // o rótulo só saía no terço final e parecia que aparecia por sorteio
      if(pp.receptor!=null) acender(S, pp.receptor);
    }});
  });

  // ---- o desfecho ----
  const canto = () => CAMPO_H/2 + (rnd()<.5?-1:1)*(6.5+rnd()*3);
  const chutar = (destino, tipoChute, depois) => {
    const yCanto = destino.y;
    seq.push({para:destino, tipo: tipoChute||'chute',
      ms: msDaBola(Math.hypot(destino.x-L1.alvoChute.x, destino.y-L1.alvoChute.y), tipoChute||'chute', f),
      antes:()=>{
        if(L1.fim) acender(S, L1.fim.idx, e.q);
        // o goleiro se joga para o canto do chute
        estado({fase:'area', recebe:null, chute:{side:lado, y:yCanto}}, Math.max(120, 220*f));
      }, depois});
  };

  if(e.t==='gol'){
    const c = canto();
    chutar({x:gol.x, y:c}, 'chute', ()=>{
      tremerRede(S); if(!e._flash){ e._flash=1; flashGol(S, e.q, e); }
      estado({fase:'gol', foco:null, setp:null, chute:null, recebe:null,
              gol:{side:lado, idx:e.i, canto:c}}, 900);
      acender(S, e.i);
    });
    // a festa: a bola fica no fundo da rede, depois o juiz a leva pro meio
    const rede={x:gol.x - dir*1.5, y:c};
    seq.push({para:rede, tipo:'sobra', ms:Math.max(700, 1500*f), festa:true});
    // o juiz leva a bola de volta pro meio: é caminhada, não foguete. Sem um
    // piso de tempo, na velocidade rápida isso virava um tiro de 45 m/s.
    const meio={x:CAMPO_W/2, y:CAMPO_H/2};
    const dVolta = Math.hypot(meio.x-rede.x, meio.y-rede.y);
    seq.push({para:meio, tipo:'sobra', recoloca:true, ms:msRecolocar(dVolta, f),
      antes:()=>estado({fase:'meio', saida:(lado==='h'?'a':'h'), ataque:null, foco:null, gol:null, setp:null, chute:null, recebe:null}, 700*f)});

  } else if(e.t==='defesa'){
    const gk = O.emCampo.find(u=>!u.fora && u.slot==='GOL');
    const c = canto();
    const pego = {x: gol.x - dir*2.2, y: c*0.62 + CAMPO_H/2*0.38};
    chutar(pego, 'chute', ()=>{ narrar(e); if(gk) acender(O, gk.idx, e.q); });
    // o goleiro segura e recoloca a bola em jogo
    const saida = dentroDoCampo({x: gol.x - dir*(16+rnd()*8), y: CAMPO_H/2 + (rnd()-.5)*30});
    seq.push({para:saida, tipo:'saida', ms:msDaBola(Math.hypot(saida.x-pego.x, saida.y-pego.y),'saida',f),
      antes:()=>{
        const u = receptorNoPonto(O, saida, {});
        estado({ataque:ladoDe(O), fase:'normal', foco:u?{side:ladoDe(O), idx:u.idx}:null,
                recebe:u?{side:ladoDe(O), idx:u.idx, x:saida.x, y:saida.y}:null, chute:null}, 600*f);
      }});

  } else if(e.t==='trave'){
    const naTrave = {x:gol.x, y: CAMPO_H/2 + (rnd()<.5?-1:1)*4.6};
    chutar(naTrave, 'chute', ()=>{
      narrar(e);
      const r=$(S.casa?'rede-h':'rede-a');
      if(r){ r.classList.remove('trave'); void r.getBoundingClientRect(); r.classList.add('trave'); }
    });
    // a sobra volta pro campo e alguém afasta
    const sobra = dentroDoCampo({x: gol.x - dir*(9+rnd()*7), y: CAMPO_H/2 + (rnd()-.5)*22});
    seq.push({para:sobra, tipo:'sobra', ms:msDaBola(Math.hypot(sobra.x-naTrave.x,sobra.y-naTrave.y),'sobra',f),
      antes:()=>estado({fase:'area', chute:null, recebe:null}, 400*f)});
    const afasta = afastarDali(sobra, dentroDoCampo({x: gol.x - dir*(24+rnd()*11), y: CAMPO_H/2 + (rnd()-.5)*20}), 38);
    seq.push({para:afasta, tipo:'forte', ms:msDaBola(Math.hypot(afasta.x-sobra.x,afasta.y-sobra.y),'forte',f),
      antes:()=>estado({ataque:ladoDe(O), fase:'normal', foco:null, recebe:null}, 600*f)});

  } else if(e.t==='fora'){
    // chute que sai: a bola cruza a linha de fundo e vem o escanteio.
    // Ela para rente à linha, não no canto de fora da tela.
    const yFora = rnd()<.5 ? -1.2 : CAMPO_H+1.2;
    const destino = {x: clamp(gol.x + dir*0.8, 1, CAMPO_W-1), y: yFora};
    seq.push({para:destino, tipo:'chute',
      ms: msDaBola(Math.hypot(destino.x-L1.alvoChute.x, destino.y-L1.alvoChute.y), 'chute', f),
      antes:()=>{ if(L1.fim) acender(S, L1.fim.idx, e.q);
        estado({fase:'area', recebe:null, chute:{side:lado, y:CAMPO_H/2}}, 220*f); },
      depois:()=>narrar(e)});
    const canto0 = yFora<0 ? 3 : CAMPO_H-3;
    const bandeira = {x: S.casa?CAMPO_W-2.5:2.5, y:canto0};
    seq.push({para:bandeira, tipo:'recuo', recoloca:true,
      ms:msRecolocar(Math.hypot(bandeira.x-destino.x, bandeira.y-destino.y), f),
      antes:()=>estado({ataque:lado, fase:'escanteio', foco:null, chute:null, recebe:null,
                        setp:{side:lado, idx:e.i, canto:canto0}}, 700*f)});
    const naArea = dentroDoCampo({x: gol.x - dir*7, y: CAMPO_H/2 + (rnd()-.5)*12});
    seq.push({para:naArea, tipo:'cruzamento', ms:msDaBola(Math.hypot(naArea.x-bandeira.x,naArea.y-bandeira.y),'cruzamento',f),
      antes:()=>{ const z=S.emCampo.filter(u=>!u.fora&&u.slot!=='GOL');
        const quem = receptorNoPonto(S, naArea, {});
        estado({fase:'area', setp:null, recebe: quem?{side:lado, idx:quem.idx, x:naArea.x, y:naArea.y}:null,
                foco: quem?{side:lado, idx:quem.idx}:null}, 600*f);
        if(quem) acender(S, quem.idx); }});
    const afasta = afastarDali(naArea, dentroDoCampo({x: gol.x - dir*(24+rnd()*11), y: CAMPO_H/2 + (rnd()-.5)*20}), 38);
    seq.push({para:afasta, tipo:'forte', ms:msDaBola(Math.hypot(afasta.x-naArea.x,afasta.y-naArea.y),'forte',f),
      antes:()=>estado({ataque:ladoDe(O), fase:'normal', foco:null, recebe:null, setp:null}, 620*f)});

  } else if(e.t==='chance'){
    // a jogada morre: um zagueiro corta antes da finalização
    const corta = defensorPerto(O, L1.alvoChute, {});
    const pc = corta ? posBase(O, corta.idx) : {x: gol.x - dir*14, y: CAMPO_H/2};
    const ponto = dentroDoCampo({x:(L1.alvoChute.x+pc.x)/2, y:(L1.alvoChute.y+pc.y)/2});
    seq.push({para:ponto, tipo:'curto', ms:msDaBola(Math.hypot(ponto.x-L1.alvoChute.x,ponto.y-L1.alvoChute.y),'curto',f),
      antes:()=>{ narrar(e); if(corta) acender(O, corta.idx, e.q);
        estado({fase:'area', recebe: corta?{side:ladoDe(O), idx:corta.idx, x:ponto.x, y:ponto.y}:null,
                foco: corta?{side:ladoDe(O), idx:corta.idx}:null, chute:null}, 400*f); }});
    const afasta = afastarDali(ponto, dentroDoCampo({x: ponto.x - dir*(24+rnd()*11), y: CAMPO_H/2 + (rnd()-.5)*20}), 38);
    seq.push({para:afasta, tipo:'forte', ms:msDaBola(Math.hypot(afasta.x-ponto.x,afasta.y-ponto.y),'forte',f),
      antes:()=>estado({ataque:ladoDe(O), fase:'normal', foco:null, recebe:null}, 620*f)});

  } else {
    return;
  }

  LANCE_ATIVO = e;
  const total = seqTocar(seq, f);
  LANCE_MS[e.t] = total;
  BOLA_TIMERS.push(setTimeout(()=>{ LANCE_ATIVO=null; }, total));
  // depois do lance a bola pertence a quem faz sentido
  const outro = e.side==='h'?'a':'h';
  if(typeof POSSE!=='undefined'){
    if(e.t==='gol'||e.t==='penalti'||e.t==='defesa'||e.t==='fora'||e.t==='trave'||e.t==='chance')
      POSSE = {side: outro, terco:0, de:null, lev:0};
  }
  return total;
}

/* ---------- o pênalti ----------
   A marca fica a 11m do gol: no campo de 100 de comprimento isso dá ~13.
   A batida é uma cena curta e tensa, não uma jogada trabalhada: todo mundo
   parado fora da área, o batedor atrás da bola, o goleiro na linha, e aí o
   chute. No gol o goleiro cai pro lado errado; na defesa ele cai no lado da
   bola — é isso que faz a cena valer a pena assistir. */
function marcaDoPenalti(S){
  return {x: S.casa ? CAMPO_W-13 : 13, y: CAMPO_H/2};
}

function batidaDePenalti(S, O, e, f, lado){
  const marca = marcaDoPenalti(S);
  const gol = golDe(S);
  const c = CAMPO_H/2 + (rnd()<.5?-1:1)*(6.2+rnd()*2.6);   // canto escolhido
  const defendeu = (e.t==='defesa');
  const seq=[];

  // 1. tudo parado no lugar do pênalti: o arco, o batedor, o goleiro na linha
  estado({ataque:lado, fase:'penalti', setp:{side:lado, idx:e.i}, foco:null,
          recebe:null, chute:null, gol:null}, 420*f);
  // a bola pode não estar exatamente na marca (veio de outro lance): acerta devagar
  if(distBola(marca) > 0.6){
    seq.push({para:marca, tipo:'sobra', recoloca:true, ms:msRecolocar(distBola(marca), f)});
  }

  // 2. a espera: o batedor toma distância e ninguém se mexe
  const espera = Math.max(180, 620*f);
  seq.push({para:marca, tipo:'sobra', ms:espera,
    antes:()=>{ acender(S, e.i, e.q); estado({fase:'penalti'}, espera); }});

  // 3. o chute: da marca direto pro canto, forte
  const alvo = {x: gol.x, y: c};
  const msChute = msDaBola(Math.hypot(alvo.x-marca.x, alvo.y-marca.y), 'chute', f);
  const gk = O.emCampo.find(u=>!u.fora && u.slot==='GOL');
  // pulo do goleiro: no lado da bola se defendeu, no lado errado se foi gol
  const pulo = defendeu ? c : (CAMPO_H - c);
  seq.push({para: defendeu ? {x: gol.x + (S.casa?-2.0:2.0), y: c} : alvo,
    tipo:'chute', ms:msChute,
    antes:()=>estado({fase:'area', setp:null, recebe:null, chute:{side:lado, y:pulo}}, Math.max(110, 190*f)),
    depois:()=>{
      narrar(e);
      if(defendeu){
        if(gk) acender(O, gk.idx, e.q);
        estado({fase:'area', chute:{side:lado, y:pulo}}, 500*f);
      } else {
        tremerRede(S); if(!e._flash){ e._flash=1; flashGol(S, e.q, e); }
        estado({fase:'gol', foco:null, setp:null, chute:null, recebe:null,
                gol:{side:lado, idx:e.i, canto:c}}, 900);
        acender(S, e.i);
      }
    }});

  if(defendeu){
    // sobra: a bola volta pro campo e o jogo recomeça
    const solta = dentroDoCampo({x: gol.x - (S.casa?1:-1)*(16+rnd()*10), y: CAMPO_H/2 + (rnd()-.5)*22});
    seq.push({para:solta, tipo:'forte', ms:msDaBola(Math.hypot(solta.x-gol.x, solta.y-c),'forte',f),
      antes:()=>estado({ataque:ladoDe(O), fase:'normal', foco:null, recebe:null, setp:null, chute:null}, 600*f)});
  } else {
    // festa e o juiz levando a bola de volta pro meio
    const rede={x: gol.x - (S.casa?1:-1)*1.5, y:c};
    seq.push({para:rede, tipo:'sobra', ms:Math.max(700, 1400*f), festa:true});
    const meio={x:CAMPO_W/2, y:CAMPO_H/2};
    seq.push({para:meio, tipo:'sobra', recoloca:true, ms:msRecolocar(Math.hypot(meio.x-rede.x, meio.y-rede.y), f),
      antes:()=>estado({fase:'meio', saida:(e.side==='h'?'a':'h'), ataque:null, foco:null, gol:null, setp:null, chute:null, recebe:null}, 700*f)});
  }

  LANCE_ATIVO = e;
  const total = seqTocar(seq, f);
  LANCE_MS[e.t] = total;
  BOLA_TIMERS.push(setTimeout(()=>{ LANCE_ATIVO=null; }, total));
  if(typeof POSSE!=='undefined') POSSE = {side: (e.side==='h'?'a':'h'), terco:0, de:null, lev:0, seq:0};
  return total;
}

// toca a sequência: cada passo dispara no seu tempo, a bola nunca teleporta
// narra no momento certo: se a animação já contou, o relógio da fila não repete
function narrar(e){
  if(typeof mostrarPendente==='function') mostrarPendente(e);
  if(typeof desenharMatch==='function') desenharMatch();
}

function seqTocar(seq, f){
  let t=0;
  seq.forEach(pp=>{
    const ms = Math.max(110, pp.ms||200);
    BOLA_TIMERS.push(setTimeout(()=>{
      if(!M) return;
      if(pp.antes) try{ pp.antes(); }catch(e){}
      moverBola(pp.para, ms, !!pp.recoloca);
      if(pp.depois) BOLA_TIMERS.push(setTimeout(()=>{ try{ pp.depois(); }catch(e){} }, ms));
    }, t));
    t += ms + (pp.festa?0:Math.round(70*(f||1)));   // um respiro entre um toque e outro
  });
  return t;
}

/* ---------- a bola entre os lances ----------
   Mesmas regras: passe curto, velocidade real, e quem recebe vai até o ponto. */

function bolaOciosa(){
  if(!M || M.fim || LANCE_ATIVO || !$('bola')) return;
  if(VEL==='turbo') return;
  // não interrompe uma bola que ainda está viajando: com o relógio adiantado os
  // toques vinham mais rápido que o passe e a bola voltava a saltar
  if(typeof BOLA_ATE!=='undefined' && Date.now() < BOLA_ATE) return;
  const f=velFator();
  const pH = M.h.posse/Math.max(1, M.h.posse+M.a.posse);
  if(!POSSE || !POSSE.side) POSSE = {side:(rnd()<pH?'h':'a'), terco:0, de:null, lev:0};
  const S = POSSE.side==='h' ? M.h : M.a;
  const O = POSSE.side==='h' ? M.a : M.h;
  if(!S.emCampo.some(u=>!u.fora)) return;
  const lado=ladoDe(S), dir=S.casa?1:-1;

  const dono = (POSSE.de!=null) ? S.emCampo.find(u=>u.idx===POSSE.de && !u.fora) : null;
  const pBola = {x:BOLA_POS.x, y:BOLA_POS.y};
  const pres = (typeof pressaoSobre==='function') ? pressaoSobre(O, pBola) : {d:20, u:null};
  const aperto = clamp(1-(pres.d-3.5)/15, 0, 1);

  // perder a bola depende de estar apertado e de quem marca
  const forte=forcas(S).mid, fraco=forcas(O).mid;
  const dominio = clamp(forte/Math.max(1,forte+fraco), 0.32, 0.68);
  const tec = dono && typeof atrDe==='function' ? atrDe(dono,'dri')*0.55 + atrDe(dono,'pas')*0.45 : 66;
  const mar = pres.u && typeof atrDe==='function' ? atrDe(pres.u,'mar') : 62;
  let perde = 0.08 + aperto*0.28 + (mar-tec)/320 - (dominio-0.5)*0.30
            + (POSSE.terco===2 ? 0.07 : POSSE.terco===0 ? -0.03 : 0);
  /* Quanto mais tempo com a bola, mais difícil segurar. Sem isso, um time
     chegava a 29 passes seguidos sem perder — e a bola acampava num lado só do
     campo por meio minuto. Numa posse longa de verdade dá uns 15 passes. */
  POSSE.seq = (POSSE.seq||0) + 1;
  perde += Math.min(0.26, Math.max(0, POSSE.seq-4) * 0.035);
  if(rnd() < clamp(perde, 0.04, 0.62)) return bolaPerdida(S, O, pBola, pres, f);

  // bola no meio sem dono: é pontapé inicial, um toque curto pro lado
  if(POSSE.de==null && Math.abs(pBola.x-CAMPO_W/2)<6 && Math.abs(pBola.y-CAMPO_H/2)<8){
    const alvo0 = dentroDoCampo({x: pBola.x - dir*(4+rnd()*5), y: pBola.y + (rnd()<.5?-1:1)*(4+rnd()*6)});
    const u0 = receptorNoPonto(S, alvo0, {});
    if(u0){
      const ms0 = msDaBola(Math.hypot(alvo0.x-pBola.x, alvo0.y-pBola.y), 'curto', f);
      POSSE.de=u0.idx; POSSE.terco=tercoDe(S, alvo0.x); POSSE.lev=0;
      estado({ataque:lado, fase:'normal', foco:{side:lado, idx:u0.idx},
              recebe:{side:lado, idx:u0.idx, x:alvo0.x, y:alvo0.y}, gol:null, setp:null, chute:null}, ms0);
      moverBola(alvo0, ms0);
      return;
    }
  }

  // sem dono no próprio campo: o goleiro pega e recomeça dali
  if(POSSE.de==null && POSSE.terco===0 && distBola(posGoleiro(S))<34 && rnd()<0.6){
    const gk = S.emCampo.find(u=>!u.fora && u.slot==='GOL');
    if(gk){
      const g = posBase(S, gk.idx);
      const msg = msDaBola(distBola(g), 'recuo', f);
      POSSE.de=gk.idx; POSSE.terco=0; POSSE.lev=0;
      estado({ataque:lado, fase:'normal', foco:{side:lado, idx:gk.idx},
              recebe:{side:lado, idx:gk.idx, x:g.x, y:g.y}, gol:null, setp:null, chute:null}, msg);
      moverBola(g, msg);
      return;
    }
  }

  // conduzir: quem tem drible e espaço leva a bola nos pés
  if(dono && pres.d>6.5 && (POSSE.lev||0)<2 && typeof atrDe==='function' &&
     rnd() < clamp((atrDe(dono,'dri')+atrDe(dono,'vel')-118)/150, 0.06, 0.45)){
    POSSE.lev=(POSSE.lev||0)+1;
    const av=4+rnd()*4;
    const alvo=dentroDoCampo({x:pBola.x+dir*av, y:pBola.y+(rnd()-.5)*4});
    POSSE.terco=tercoDe(S, alvo.x);
    const ms=msDaBola(av,'conducao',f);
    estado({ataque:lado, fase:faseDoTerco(POSSE.terco), gol:null, setp:null, chute:null,
            foco:{side:lado, idx:dono.idx}, recebe:{side:lado, idx:dono.idx, x:alvo.x, y:alvo.y}}, ms);
    acender(S, dono.idx);
    moverBola(alvo, ms);
    return;
  }
  POSSE.lev=0;

  // o passe: escolhe um ponto a uma distância de passe, na direção que o time quer
  const avancar = rnd() < (POSSE.terco===0 ? 0.50 : POSSE.terco===1 ? 0.72 : 0.58);
  const pas = dono && typeof atrDe==='function' ? atrDe(dono,'pas') : 70;
  const lancar = avancar && rnd() < clamp((pas-64)/230, 0.02, 0.14);
  const dist = lancar ? 26+rnd()*12 : 9+rnd()*9;
  const ang = avancar ? (rnd()-.5)*1.5 : (rnd()<.5 ? 1.9 : -1.9) + (rnd()-.5)*0.8;
  const alvo = dentroDoCampo({
    x: pBola.x + dir*Math.cos(ang)*dist,
    y: pBola.y + Math.sin(ang)*dist
  });
  const d = Math.hypot(alvo.x-pBola.x, alvo.y-pBola.y);
  const tipo = lancar ? 'lancamento' : d>17 ? 'forte' : d>9 ? 'passe' : 'curto';
  const ms = msDaBola(d, tipo, f);
  const u = receptorNoPonto(S, alvo, POSSE.de!=null?{[POSSE.de]:1}:{});
  if(!u) return;
  POSSE.de = u.idx;
  POSSE.terco = tercoDe(S, alvo.x);
  estado({ataque:lado, fase:faseDoTerco(POSSE.terco), gol:null, setp:null, chute:null,
          foco:{side:lado, idx:u.idx}, recebe:{side:lado, idx:u.idx, x:alvo.x, y:alvo.y}}, ms);
  acender(S, u.idx);
  moverBola(alvo, ms);
}

// a bola foi roubada: quem pressionava leva, ali mesmo onde a bola estava
/* Afastar a bola é um chutão para longe — mas 50 metros já é atravessar o
   campo. Este ajuste puxa o ponto de volta para caber em 38m do lugar onde a
   bola está, mantendo a direção. */
function afastarDali(de, alvo, maxM){
  const dx=alvo.x-de.x, dy=alvo.y-de.y, d=Math.hypot(dx,dy), M=maxM||38;
  if(d<=M) return alvo;
  const k=M/d;
  return dentroDoCampo({x:de.x+dx*k, y:de.y+dy*k});
}

function bolaPerdida(S, O, pBola, pres, f){
  const lado=ladoDe(O);
  let ladrao = (pres.d<11) ? pres.u : defensorPerto(O, pBola, {});
  if(!ladrao){ POSSE={side:lado, terco:0, de:null, lev:0}; return; }
  const p = dentroDoCampo({x: pBola.x + (rnd()-.5)*4, y: pBola.y + (rnd()-.5)*4});
  const ms = msDaBola(Math.hypot(p.x-pBola.x, p.y-pBola.y)+2, 'curto', f);
  POSSE = {side:lado, terco:tercoDe(O, p.x), de:ladrao.idx, lev:0, seq:0};
  estado({ataque:lado, fase:'normal', gol:null, setp:null, chute:null,
          foco:{side:lado, idx:ladrao.idx}, recebe:{side:lado, idx:ladrao.idx, x:p.x, y:p.y}}, ms);
  acender(O, ladrao.idx);
  moverBola(p, ms);
}

/* O orçamento de tempo de cada lance. Com a bola andando em velocidade de
   verdade, uma jogada de gol precisa de mais fôlego do que os 4,3s de antes. */
function tempoLance(e){
  const f=(typeof velFator==='function')?velFator():1;
  if(VEL==='turbo' && e.t!=='gol') return 0;
  // a batida de pênalti é uma cena: posicionar, esperar, bater. Precisa de fôlego.
  if(e.tipo==='penalti' && (e.t==='gol'||e.t==='defesa'))
    return Math.max(150, (e.t==='gol'?6400:4400)*f);
  /* O pênalti ganhou a jogada que o gerou (a bola sobe o campo antes da
     infração), então ele precisa de mais tempo: com 2600ms o relógio de
     segurança da fila narrava "PÊNALTI" no meio da subida, com a bola ainda a
     24m da marca — exatamente o que a gente estava tentando consertar. */
  const base={gol:6000, penalti:4200, defesa:2900, trave:2800, fora:3300,
              chance:2600, ca:600, cv:900, sub:900, lesao:900, apito:800}[e.t];
  if(!base) return 0;
  /* Se a jogada deste tipo mediu mais tempo do que a conta acima, o relógio da
     fila usa a medida. Sem isso o lance seguinte entrava por cima da festa do
     gol e o time ficava congelado comemorando. */
  const medido = (e.t==='gol') ? (LANCE_MS[e.t]||0) : 0;
  return Math.max(120, base*f, medido+140);
}

function animarLance(e){
  const r = animarLanceBase(e);
  return r;
}

/* A transmissão mostra o que vale a pena, não tudo.

   Medido: o motor gera 22 momentos por jogo — um a cada 4 minutos de jogo, que
   na velocidade normal são 2,5 segundos. Só que a jogada de um gol leva 6,4
   segundos para ser contada. Ou seja: cada jogada era cortada pela seguinte
   antes de terminar, e a bola saltava de um lado ao outro. Era esse o
   "sem sentido" — não a velocidade da bola, e sim jogada nenhuma chegando ao fim.

   Agora gol, pênalti e expulsão sempre aparecem. Os demais lances só viram
   animação se a jogada anterior já teve tempo de acabar; senão entram só na
   narração, com a bola seguindo o fluxo normal. Dá cerca de 9 momentos por
   jogo, que é o que cabe. */
let ULT_LANCE = -99;
const INTERVALO_LANCE = 11;      // minutos de jogo entre uma jogada e outra

function mereceLance(e){
  if(!e || !e.t) return false;
  if(VEL==='turbo') return e.t==='gol';
  if(e.t==='gol' || e.t==='penalti' || e.t==='cv'){ ULT_LANCE = e.min||0; return true; }
  // a defesa de pênalti é a outra metade da batida: não pode ficar só no texto
  if(e.t==='defesa' && e.tipo==='penalti'){ ULT_LANCE = e.min||0; return true; }
  if(e.t==='ca' || e.t==='sub' || e.t==='lesao' || e.t==='apito') return true;  // rápidos, não são jogada
  const min = e.min||0;
  if(min - ULT_LANCE < INTERVALO_LANCE) return false;
  ULT_LANCE = min;
  return true;
}
/* ===== 06-partida ===== */
'use strict';

let M = null, tick = null, VEL = 'normal';

const VELS = {pausado:0, normal:620, rapido:180, turbo:45};

function fecharMatch(){ pararTick(); $('match').classList.remove('on'); M=null; }

function pararTick(){ if(tick){clearInterval(tick);clearTimeout(tick);tick=null;} }

function alternarVel(){ if(VEL==='pausado'){VEL='normal';} else {VEL='pausado';} iniciarTick(); desenharMatch(); }

function mudarVel(){ const o=['normal','rapido','turbo']; const i=o.indexOf(VEL); VEL=o[(i+1)%o.length]; iniciarTick(); desenharMatch(); }

function tratarPausa(){
  const p=M.pausa; M.pausa=null;
  limparFila();                                  // tudo que estava na fila entra no placar antes da janela
  if(p.tipo==='intervalo') sheetIntervalo();
  else if(p.tipo==='penalti') sheetPenalti(p.side);
  else if(p.tipo==='lesao') sheetLesao(p.side,p.uid);
  else if(p.tipo==='momento') sheetMomento(p.side, p.k);
}

/* Momento de decisão: o jogo para e você escolhe. A opção do seu plano
   vem marcada — é só confirmar se estiver de acordo. */
const OPCOES_MOMENTO = [
  ['manter','pressao','recuar','curto','direto','lados'],
  ['manter','ofensivo','total','segurar','atacante','zagueiro']
];

function sheetMomento(side, k){
  const S = side==='h'?M.h:M.a, O = side==='h'?M.a:M.h;
  const meu = side==='h'?M.hg:M.ag, dele = side==='h'?M.ag:M.hg;
  const sit = situacaoDe(M,S);
  const plano = acaoDoMomento(M,S,k);
  const eu=S.emCampo.filter(u=>!u.fora);
  const cansados=eu.filter(u=>u.energia<62).length;
  const posse=Math.round(100*S.posse/Math.max(1,M.min));
  const bancoAta=entraDoBanco(S,'ATA'), bancoZag=entraDoBanco(S,'ZAG');
  const opcoes=OPCOES_MOMENTO[k].filter(a=>{
    if(a==='atacante') return !!bancoAta && S.subs<3;
    if(a==='zagueiro') return !!bancoZag && S.subs<3;
    return true;
  });
  sheet(`${M.min}' · sua decisão`, `
    <div class="board" style="margin-bottom:10px"><div class="board-row">
      <span class="board-team">${esc(M.h.clube.sigla)}</span><span class="board-score">${M.hg}</span>
      <span class="board-score" style="opacity:.3;font-size:20px">:</span><span class="board-score">${M.ag}</span>
      <span class="board-team r">${esc(M.a.clube.sigla)}</span></div>
      <div class="board-clock">${k===0?'LEITURA DO JOGO':'RETA FINAL'} · ${M.min}'</div></div>
    <div class="barrinha" style="margin-bottom:10px">
      <span><b>${posse}%</b>posse</span>
      <span><b>${S.chutes}</b>chutes</span>
      <span class="${cansados?'al':''}"><b>${cansados}</b>no limite</span>
      <span><b>${MAX_SUBS-S.subs}</b>trocas</span>
    </div>
    <p class="sm mut" style="margin-bottom:10px">Você está <b>${sit}</b>${k===0?'. Ainda dá tempo de mudar a cara do jogo.':'. É agora ou não é mais.'}</p>
    <div class="stack">
      ${opcoes.map(a=>`<button class="btn wide ${a===plano?'pri':''}" style="flex-direction:column;align-items:flex-start;padding:11px 13px;height:auto"
        onclick="escolherMomento('${side}',${k},'${a}')">
        <span style="font-size:14.5px">${ACOES_MOMENTO[a].n}${a===plano?' · do seu plano':''}</span>
        <span style="font-family:var(--fb);font-weight:400;text-transform:none;letter-spacing:0;font-size:11.5px;color:inherit;opacity:.72;text-align:left">${ACOES_MOMENTO[a].d}</span>
      </button>`).join('')}
    </div>`);
}

function escolherMomento(side, k, acao){
  const S = side==='h'?M.h:M.a;
  const txt = aplicarAcaoMomento(M,S,acao);
  if(txt){ const e=ev(M,'sys',side,'Banco: '+txt,'sys'); addEvento(e); }
  else { const e=ev(M,'sys',side,'Banco: o time segue como está.','sys'); addEvento(e); }
  retomar();
}

function retomar(){ fecharSheet(); if(VEL!=='pausado') iniciarTick(); desenharMatch(); }

/* Retomar DEPOIS de tocar o que a decisão gerou.
   retomar() chama iniciarTick(), que chama limparFila(), que cancela os timers
   que addEvento() acabou de agendar e despeja o texto na hora. Resultado: o
   pênalti do SEU time nunca mostrava a batida nem a tela do gol (o do
   adversário mostrava, porque vinha pela fila normal), e a narração saía
   duplicada. Aqui a jogada é tocada até o fim e só então o relógio volta. */
function retomarTocando(novos){
  fecharSheet();
  const lista=(novos||[]).filter(e=>e && e.t && e.t!=='sys');
  if(!lista.length) return retomar();
  desenharMatch();
  tocarFila(lista, ()=>{ if(VEL!=='pausado') iniciarTick(); desenharMatch(); });
}

function sheetIntervalo(){
  if(typeof telaVestiario==='function'){ M.conversou=null; telaVestiario('intervalo'); return; }
  const eu=M.liveSide==='h'?M.h:M.a;
  const meu=M.liveSide==='h'?M.hg:M.ag, dele=M.liveSide==='h'?M.ag:M.hg;
  const sit = meu>dele?'ganhando':meu===dele?'empatando':'perdendo';
  const notas = eu.emCampo.filter(u=>!u.fora).slice().sort((a,b)=>a.nota-b.nota);
  sheet('Intervalo', `
    <div class="board" style="margin-bottom:12px"><div class="board-row">
      <span class="board-team">${esc(M.h.clube.sigla)}</span><span class="board-score">${M.hg}</span>
      <span class="board-score" style="opacity:.3;font-size:20px">:</span><span class="board-score">${M.ag}</span>
      <span class="board-team r">${esc(M.a.clube.sigla)}</span></div>
      <div class="board-clock">VESTIÁRIO · 45'</div></div>
    <p class="sm mut" style="margin-bottom:10px">Você está ${sit}. O que diz ao grupo?</p>
    <div class="stack">
      <button class="btn wide" onclick="conversa('elogiar')">Elogiar o time</button>
      <button class="btn wide" onclick="conversa('cobrar')">Cobrar mais intensidade</button>
      <button class="btn wide" onclick="conversa('acalmar')">Acalmar e pedir paciência</button>
    </div>
    <hr class="chalk" style="margin:14px 0">
    <div class="eyebrow" style="margin-bottom:4px">Notas do primeiro tempo</div>
    ${notas.slice(0,4).map(u=>`<div class="plr"><span class="pos ${u.slot}">${u.slot}</span>
      <span class="plr-n"><b>${esc(u.p.nome)}</b><span>energia ${Math.round(u.energia)}%</span></span>
      <span class="ovr" style="color:${u.nota<5.5?'var(--danger)':u.nota>7?'var(--ok)':'inherit'}">${u.nota.toFixed(1)}</span></div>`).join('')}`);
}

function conversa(tipo, ficar){
  const eu=M.liveSide==='h'?M.h:M.a;
  const meu=M.liveSide==='h'?M.hg:M.ag, dele=M.liveSide==='h'?M.ag:M.hg;
  const sit = meu>dele?1:meu===dele?0:-1;
  let d=0, txt='';
  if(tipo==='elogiar'){ d = sit>=0?6:-4; txt = sit>=0?'O grupo saiu do vestiário confiante.':'Elogio fora de hora: o elenco não gostou.'; }
  if(tipo==='cobrar'){ d = sit<0?7:sit===0?3:-5; txt = sit<0?'A bronca acertou o tom, o time voltou ligado.':sit===0?'O time voltou mais ligado.':'Cobrança com o jogo ganho soou injusta.'; }
  if(tipo==='acalmar'){ d = sit===0?5:2; txt='Discurso calmo, o time volta organizado.'; }
  eu.emCampo.forEach(u=>{ if(!u.fora) u.p.moral=clamp(u.p.moral+d,5,100); });
  M.eventos.push({min:45,add:0,t:'sys',side:M.liveSide,txt:'Vestiário: '+txt,cls:'sys'});
  addEvento(M.eventos[M.eventos.length-1]);
  if(ficar){ M.conversou=txt; telaVestiario(); return; }
  retomar();
}

function sheetPenalti(side){
  if(side!==M.liveSide){
    const S=side==='h'?M.h:M.a, O=side==='h'?M.a:M.h;
    const antes0=M.eventos.length;
    cobrarPenalti(M,S,O,escolheAtacante(S));
    retomarTocando(M.eventos.slice(antes0)); return;
  }
  const S=M.liveSide==='h'?M.h:M.a;
  const cands=S.emCampo.filter(u=>!u.fora&&u.slot!=='GOL').sort((a,b)=>b.p.ovr-a.p.ovr);
  const melhor = cands[0];
  sheet('Pênalti a favor!', `<p class="sm mut" style="margin-bottom:10px">Quem vai bater?</p>
    ${cands.slice(0,6).map(u=>`<button class="plr" onclick="baterPenalti('${u.id}')">
      <span class="pos ${u.slot}">${u.slot}</span>
      <span class="plr-n"><b>${esc(u.p.nome)}</b><span>moral ${Math.round(u.p.moral)} · ${u.gols} ${u.gols===1?'gol':'gols'} no jogo</span></span>
      <span class="ovr">${u.p.ovr}</span></button>`).join('')}`,
    ()=>{
      /* Fechar esta janela no × deixava o pênalti sem ser cobrado e o relógio
         parado — o jogo simplesmente travava. Agora o × manda o melhor bater. */
      const x=document.querySelector('#sheet-in .sheet-h .x');
      if(x && melhor) x.setAttribute('onclick', `baterPenalti('${melhor.id}')`);
    });
}

function baterPenalti(uid){
  const S=M.liveSide==='h'?M.h:M.a, O=M.liveSide==='h'?M.a:M.h;
  const u=S.emCampo.find(x=>x.id===uid);
  const antes=M.eventos.length;
  cobrarPenalti(M,S,O,u);
  retomarTocando(M.eventos.slice(antes));
}

function verReplay(r,h,a){
  const res=L.resultados[`r${r}_${h}_${a}`]; if(!res||!res.eventos) return;
  const meuLado = h===L.meuClube?'h':a===L.meuClube?'a':null;
  sheet(`${clube(h).sigla} ${res.hg} x ${res.ag} ${clube(a).sigla}`,
    `<div>${res.eventos.map(e=>`<div class="ev ${e.c||''} ${e.t==='gol'?'goal':''} ${e.t==='gol'&&meuLado&&e.s!==meuLado?'rival':''}">
      <span class="ev-min">${e.m}${e.a?'+'+e.a:''}'</span><span class="ev-tx">${esc(e.x)}</span></div>`).join('')}</div>`);
}

function campanhaDoClube(L, cid){
  const B=L.comps&&L.comps.brasileirao;
  if(!B) return {pos:10, ppj:1.3, forma:[]};
  const tb=tabelaComp(L,B);
  const i=tb.findIndex(x=>x.id===cid);
  if(i<0) return {pos:10, ppj:1.3, forma:[]};
  const x=tb[i];
  return {pos:i+1, ppj: x.j? x.p/x.j : 1.3, forma:x.forma.slice(-5), total:tb.length};
}

function ehClassico(h, a){
  const A=clube(h), B=clube(a); if(!A||!B) return false;
  if(A.cidade && A.cidade===B.cidade) return true;
  return A.uf===B.uf && (A.torcida||0)>=3 && (B.torcida||0)>=3;
}

function publicoDoJogo(L, h, a, comp, fase, rodada){
  const c=clube(h), v=clube(a);
  if(!c) return {publico:5000, pct:.5, atmosfera:1, motivo:''};
  const cap=c.estadio||20000;
  const camp=campanhaDoClube(L,h);
  let pct = 0.30 + 0.055*(c.torcida||1);              // 0,36 a 0,58 de base
  const motivos=[];                                    // {t:texto, p:prioridade}
  const mot=(t,pr)=>motivos.push({t, p:pr});

  // campanha: aproveitamento e posição
  pct += clamp((camp.ppj-1.35)*0.16, -0.13, 0.17);
  const ult=camp.forma;
  if(ult.length>=3){
    const v3=ult.filter(x=>x==='V').length, d3=ult.filter(x=>x==='D').length;
    pct += v3*0.028 - d3*0.030;
    if(v3>=4) mot('time embalado', 2);
    if(d3>=4) mot('clima pesado', 2);
  }
  if(camp.pos<=4 && camp.ppj>1.5){ pct+=0.07; mot(camp.pos===1?'líder do Brasileirão':'time no G4', 4); }
  if(camp.pos>=17 && camp.total>=20){ pct-=0.05; }

  // tamanho do jogo
  const compId=comp?comp.id:'brasileirao';
  /* Faltavam aqui a Libertadores e a Sul-Americana com os nomes que elas têm na
     carreira ('continental' é o id do modo antigo): jogo de Libertadores enchia
     o estádio no papel e não enchia na prática. */
  if(compId==='estadual'){ pct-=0.14; }
  else if(compId==='continental'||compId==='libertadores'){ pct+=0.13; mot('noite de Libertadores', 7); }
  else if(compId==='sulamericana'){ pct+=0.07; mot('noite de Sul-Americana', 6); }
  else if(compId==='champions'){ pct+=0.15; mot('noite de Champions', 7); }
  else if(compId==='recopa'){ pct+=0.18; mot('Recopa', 9); }
  else if(compId==='copabr'){ pct+=0.05; }
  else if(compId==='intercont'){ pct+=0.22; mot('jogo de Mundial', 9); }
  const mult={oitavas:1.02, quartas:1.05, semi:1.10, final:1.18}[fase];
  if(mult){ pct*=mult; mot(fase==='final'?'decisão':fase==='semi'?'semifinal':'mata-mata', fase==='final'?10:fase==='semi'?8:6); }

  // adversário: torcida grande e clássico enchem
  pct += 0.022*Math.max(0,(v?v.torcida:1)-2);
  if(ehClassico(h,a)){ pct+=0.16; mot('clássico', 8); }

  // reta final com o campeonato em jogo
  if(compId==='brasileirao' && rodada>=30){
    if(camp.pos<=6 || camp.pos>=16){ pct+=0.06; mot(camp.pos<=6?'briga pelo título':'fuga do rebaixamento', 5); }
  }

  pct = clamp(pct*(0.96+rnd()*0.08), 0.18, 1);
  // estádio maior só enche se a torcida acompanha
  const demanda = (typeof demandaTorcida==='function') ? demandaTorcida(c) : cap;
  const publico = Math.round(clamp(Math.min(cap, demanda)*pct, 900, cap));
  // atmosfera: o quanto a casa empurra (1,02 a 1,13)
  const atmosfera = 1 + 0.045 + 0.086*Math.pow(clamp((pct-0.25)/0.75,0,1), 1.15);
  motivos.sort((x,y)=>y.p-x.p);
  return {publico, pct, atmosfera, motivo:(motivos[0]||{}).t||''};
}

function ajustarAtmosfera(M, comp, fase, rodada){
  if(!M||!M.h||!M.a) return M;
  const r=publicoDoJogo(M.L||L, M.h.clubId, M.a.clubId, comp, fase, rodada);
  M.publico=r.publico; M.lotacao=r.pct; M.motivoJogo=r.motivo;
  K.HOME = r.atmosfera;                 // vale só para esta simulação
  return M;
}

function descricaoCasa(pct){
  if(pct>=0.95) return 'lotação máxima';
  if(pct>=0.82) return 'casa cheia';
  if(pct>=0.62) return 'boa presença';
  if(pct>=0.42) return 'público mediano';
  if(pct>=0.26) return 'arquibancada vazia';
  return 'estádio às moscas';
}

function estadioFaixaSVG(c, pct, sigla){
  const dens = clamp(pct||0.5, 0, 1);
  const n = Math.round(150 + dens*470);
  let torcida='';
  for(let i=0;i<n;i++){
    const x=((i*37.7)%100), y=3.4+((i*23.3)%16.6);
    const cor = i%3===0 ? (c.cor2||'#fff') : (c.cor||'#0B6B45');
    torcida += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${i%6===0?0.75:0.5}" fill="${cor}" opacity="${(0.3+((i%4)*0.17)).toFixed(2)}"/>`;
  }
  const luzes=[16,50,84].map(x=>`<g><rect x="${x-2.6}" y="0.6" width="5.2" height="2.6" rx=".8" fill="#F5D98A"/>
    <path d="M${x-13} 24 L${x-2.6} 2.4 L${x+2.6} 2.4 L${x+13} 24 Z" fill="url(#fx)" opacity=".42"/></g>`).join('');
  return `<svg class="est-faixa" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="fx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9AE" stop-opacity=".5"/><stop offset="1" stop-color="#FFE9AE" stop-opacity="0"/></linearGradient>
      <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1B7A4C"/><stop offset="1" stop-color="#0C4C2E"/></linearGradient></defs>
    <rect width="100" height="30" fill="#0A1420"/>
    ${luzes}
    <rect y="2.4" width="100" height="18" fill="#16202B"/>
    <rect y="2.4" width="100" height="1" fill="#0E1720"/>
    ${torcida}
    <rect y="20.4" width="100" height="1.4" fill="#0A1119"/>
    <rect y="21.8" width="100" height="8.2" fill="url(#gr)"/>
    ${[0,1,2,3,4,5].map(i=>`<rect x="${i*17}" y="21.8" width="8.5" height="8.2" fill="#fff" opacity="${i%2?0.055:0}"/>`).join('')}
    <rect x="34" y="24.4" width="32" height="5.6" fill="none" stroke="rgba(255,255,255,.22)" stroke-width=".35"/>
  </svg>`;
}

function momentoBarra(M){
  // pressão dos últimos 12 minutos, pelas finalizações
  const desde=Math.max(0,M.min-12);
  let ch={h:0,a:0};
  M.eventos.forEach(e=>{ if(e.min<desde||!e.side) return;
    if(['gol','defesa','trave','fora','chance','penalti'].includes(e.t)) ch[e.side]+= (e.t==='gol'?2.2:e.t==='penalti'?2:1); });
  const tot=ch.h+ch.a;
  const p = tot? ch.h/tot : 0.5;
  return Math.round(p*100);
}

function fecharTemporadaAmigos(){
  const A=tabelaComp(L,L.comps.brasileirao);
  const B=L.comps.serieb ? tabelaComp(L,L.comps.serieb) : [];
  const minha=tabela(L);
  L.temporadaFim=true;
  A.forEach((x,i)=>{ const cl=clube(x.id); if(cl) cl.caixa+=premioPosicao(i+1); });
  B.forEach((x,i)=>{ const cl=clube(x.id); if(cl) cl.caixa+=Math.round(premioPosicao(i+1)*0.32); });
  L.noticias.unshift({t:'led',txt:`${clube(A[0].id).nome} é campeão do Brasileirão ${L.temporada}.`});
  if(B.length) L.noticias.unshift({t:'',txt:`${clube(B[0].id).nome} é campeão da Série B e sobe.`});
  /* A taça do Brasileirão não pagava nada na liga entre amigos: só o prêmio
     por posição. Paga agora — e no caixa do campeão em TODOS os aparelhos. */
  [[A[0]&&A[0].id,'brasileirao','Brasileirão Série A'], [B[0]&&B[0].id,'serieb','Série B']].forEach(([cid,cid2,nome])=>{
    if(!cid || !recebePremio(L, cid)) return;
    if(cid===L.meuClube){ L.titulos=L.titulos||[];
      L.titulos.push({comp:nome, ano:L.temporada, id:cid2});
      pagarTitulo(L, cid2, nome); }
    else pagarTituloClube(L, cid, cid2);
  });
  if(typeof registrarGaleria==='function') registrarGaleria(L);
  L.balanco = {
    temporada:L.temporada,
    campeaoA:A[0]?A[0].id:null, campeaoB:B[0]?B[0].id:null,
    sobem:B.slice(0,4).map(x=>x.id), caem:A.slice(-4).map(x=>x.id),
    minhaPos: minha.findIndex(x=>x.id===L.meuClube)+1, minhaDiv: minhaDivisao(),
    pts: (minha.find(x=>x.id===L.meuClube)||{}).p||0
  };
  if(minha[0] && minha[0].id===L.meuClube){
    const c=meuClube();
    festa(minhaDivisao()==='B'?'Série B':L.nome, `${c.nome} · campeão com ${minha[0].p} pontos`, c.cor||'#0B6B45', c.cor2||'#FFFFFF');
  }
}

/* Vira a temporada da liga com amigos: acesso, rebaixamento, elencos.
   Tudo semeado pelo seed da liga, então sai igual em todos os celulares. */
function viradaTemporadaAmigos(){
  const bal = L.balanco || {sobem:[], caem:[]};
  R.r = rng(L.seed+'#v'+L.temporada);
  const d = divisoes(L);
  const caem = bal.caem.slice(), sobem = bal.sobem.slice();
  d.A = d.A.filter(id=>caem.indexOf(id)<0).concat(sobem);
  d.B = d.B.filter(id=>sobem.indexOf(id)<0).concat(caem);
  L.classificacaoAnterior = tabelaComp(L, L.comps.brasileirao).map(x=>x.id);
  /* guarda quem levantou cada taça: é isso que distribui as vagas do ano que vem */
  const vice = (c)=>{ const f=c && c.chave && c.chave.final && c.chave.final[0];
    return f && f.venc ? (f.venc===f.h?f.a:f.h) : null; };
  L.campeoesAnteriores = {
    copabr:       (L.comps.copabr&&L.comps.copabr.campeao)||null,
    copabrVice:   vice(L.comps.copabr),
    libertadores: (L.comps.libertadores&&L.comps.libertadores.campeao)||null,
    sulamericana: (L.comps.sulamericana&&L.comps.sulamericana.campeao)||null
  };
  L.ligaAnterior = {};
  Object.keys(LIGAS_EUROPA).forEach(k=>{
    if(L.comps[k]) L.ligaAnterior[k] = tabelaComp(L, L.comps[k]).map(x=>x.id);
  });
  L.temporada++; L.slot=1; L.temporadaFim=false; L.balanco=null; L.assistidoAte=0;
  envelhecerElencos(L);
  L.clubs.forEach(c=>{ c.titulos=c.titulos||[]; });
  montarTemporadaAmigos(L);
  prepararSlot(L, 1);
  // dinheiro da divisão: quem sobe fatura mais, quem cai aperta o cinto
  d.A.concat(d.B).forEach(id=>{
    const c=clube(id); if(!c) return;
    c.tetoFolha = tetoFolhaDe(c) * (divisaoDe(id)==='B' ? 0.45 : 1);
    c.tetoFolha = Math.round(c.tetoFolha);
  });
  L.lances={}; L.vendas={}; L.vendasSlot={}; L.ordens={}; L.propostas=[];
  L.noticias.unshift({t:'led', txt:`Temporada ${L.temporada}. ${sobem.map(id=>clube(id).sigla).join(', ')} sobem; ${caem.map(id=>clube(id).sigla).join(', ')} caem.`});
  L.noticias=L.noticias.slice(0,12);
  R.r = Math.random;
}

/* ---------- o que eu conquistei para o ano que vem ----------
   A tela de fim de temporada contava quem subiu e quem caiu, mas não dizia a
   coisa que o jogador mais quer saber: "e eu, vou jogar o quê em 2027?".
   Regra que não aparece não vira decisão — então aqui ela aparece, com o
   motivo (posição, taça da Copa do Brasil, taça continental). */
function oQueConquistei(b){
  const eu=L.meuClube, tb=(L.comps.brasileirao?tabelaComp(L,L.comps.brasileirao):[]);
  const pos=tb.findIndex(x=>x.id===eu)+1;
  const camp = k => (L.comps[k]||{}).campeao;
  const naSerieB = (typeof divisaoDe==='function') && divisaoDe(eu,L)==='B';
  const linhas=[];
  const poe=(t,txt,por)=>linhas.push({t,txt,por});
  if(b.caem.indexOf(eu)>=0) poe('bad','Série B em '+(b.temporada+1), 'rebaixado');
  else if(b.sobem.indexOf(eu)>=0) poe('good','Série A em '+(b.temporada+1), 'acesso conquistado');

  if(camp('libertadores')===eu) poe('good','Libertadores '+(b.temporada+1), 'campeão da Libertadores');
  else if(camp('sulamericana')===eu) poe('good','Libertadores '+(b.temporada+1), 'campeão da Sul-Americana');
  else if(camp('copabr')===eu) poe('good','Libertadores '+(b.temporada+1), 'campeão da Copa do Brasil');
  else if(!naSerieB && pos>=1 && pos<=4) poe('good','Libertadores '+(b.temporada+1), pos+'º no Brasileirão');
  else if(!naSerieB && pos===5) poe('good','Libertadores '+(b.temporada+1), '5º no Brasileirão — pode cair para a Sul-Americana se as vagas de copa mudarem');
  else if(!naSerieB && pos<=12) poe('','Sul-Americana '+(b.temporada+1), pos+'º no Brasileirão');

  if(camp('sulamericana')===eu || camp('libertadores')===eu)
    poe('good','Recopa Sul-Americana', 'decisão contra o outro campeão continental');
  if(camp('libertadores')===eu) poe('good','Mundial de Clubes', 'campeão da Libertadores');
  if(!linhas.length) poe('','Sem vaga continental em '+(b.temporada+1), 'a Sul-Americana vai até o 12º');
  return linhas;
}
