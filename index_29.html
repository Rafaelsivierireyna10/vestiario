  fla:[2.08, 1],  pal:[2.04, 2],  cap:[1.73, 3],  flu:[1.73, 4],  bah:[1.65, 5],
  cru:[1.62, 6],  cfc:[1.42, 7],  cam:[1.44, 8],  bra:[1.40, 9],  sao:[1.32,10],
  cor:[1.28,11],  san:[1.28,12],  bot:[1.24,13],  vit:[1.16,14],  gre:[1.17,15],
  mir:[1.08,16],  vas:[1.00,17],  int:[0.96,18],  rem:[0.88,19],  cha:[0.58,20]
};

function forcaAlvo(ppg){ return 68.5 + (ppg - 0.58) * 8.0; }

function calibrarPelaTabela(L2){
  if(!L2 || !L2.squads) return;
  L2._calib = L2._calib || {};
  Object.keys(TABELA_REAL).forEach(cid=>{
    if(L2._calib[cid]) return;
    const el = L2.squads[cid];
    if(!el || el.length < 11) return;
    L2._calib[cid] = 1;
    const [ppg, pos] = TABELA_REAL[cid];
    const ord = el.slice().sort((a,b)=>b.ovr-a.ovr);
    const atual = ord.slice(0,11).reduce((s,x)=>s+x.ovr,0)/11;
    const alvo = forcaAlvo(ppg);
    const ajuste = Math.round(clamp(alvo - atual, -3, 3));
    const c = L2.clubs.find(x=>x.id===cid);
    if(c){ c.niv = Math.round(alvo) - 1; c.posReal = pos; }
    if(!ajuste) return;
    el.forEach(p=>{
      p.ovr = clamp(p.ovr + ajuste, 40, 93);
      p.pot = clamp(Math.max(p.pot + ajuste, p.ovr), p.ovr, 93);
      p.ovrF = p.ovr;
      if(typeof valorDeMercado==='function') p.valor = valorDeMercado(p.ovr, p.idade);
      if(typeof salarioDe==='function')      p.salario = Math.max(30000, Math.round(salarioDe(p.ovr, p.idade)*((c&&c.escSal)||1)/1000)*1000);
    });
  });
}

function metaDiretoriaReal(c){
  // na Série B a cobrança é uma só: subir
  if(c && typeof divisaoDe==='function' && divisaoDe(c.id)==='B'){
    // na Série B sobem os 4 primeiros: a cobrança é o acesso, não o título.
    // Pedir 2º lugar para quem acabou de cair era desproporcional.
    const meta = (c.niv||62)>=66 ? 4 : (c.niv||62)>=62 ? 6 : 9;
    return {meta, paciencia:100, avisos:0, serieB:true};
  }
  const pos = c && c.posReal;
  if(pos){
    const meta = pos<=2 ? 2 : pos<=6 ? Math.max(3, pos-2)
               : pos<=12 ? Math.max(6, pos-3) : Math.max(10, pos-4);
    return {meta: clamp(meta,1,17), paciencia:100, avisos:0};
  }
  const meta = c.niv>=78?3 : c.niv>=75?6 : c.niv>=73?10 : c.niv>=70?14 : 16;
  return {meta, paciencia:100, avisos:0};
}

function render(){
  if(L && typeof calibrarPelaTabela==='function') calibrarPelaTabela(L);
  return renderBase();
}
/* ===== 02-atributos =====
   Cada jogador tem qualidades próprias, no espírito do Brasfoot/FM:
   velocidade, finalização, passe, drible, marcação, físico — e, para o
   goleiro, o "goleiro" (reflexo + posicionamento). Elas nascem da força (ovr),
   da posição e de um sorteio fixo por jogador (igual em todo aparelho), e
   evoluem com a idade e o treino. O motor usa a mistura de força e atributos. */
'use strict';

const ATRIBS = ['vel','fin','pas','dri','mar','fis','gol'];
const ATRIB_NOME = {vel:'Velocidade', fin:'Finalização', pas:'Passe', dri:'Drible', mar:'Marcação', fis:'Físico', gol:'Goleiro'};

// deslocamento em relação à força, por posição
const PERFIL_POS = {
  GOL: {vel:-16, fin:-30, pas:-12, dri:-28, mar:-18, fis:-4,  gol:+3},
  ZAG: {vel:-5,  fin:-16, pas:-4,  dri:-9,  mar:+8,  fis:+6,  gol:-40},
  LAT: {vel:+6,  fin:-11, pas:+1,  dri:-1,  mar:+3,  fis:+3,  gol:-40},
  VOL: {vel:-4,  fin:-10, pas:+3,  dri:-4,  mar:+6,  fis:+5,  gol:-40},
  MEI: {vel:-1,  fin:-2,  pas:+8,  dri:+4,  mar:-7,  fis:-2,  gol:-40},
  PON: {vel:+8,  fin:+1,  pas:0,   dri:+6,  mar:-13, fis:-3,  gol:-40},
  ATA: {vel:+4,  fin:+8,  pas:-4,  dri:+2,  mar:-15, fis:0,   gol:-40}
};

// o que o craque tem de especial
const BONUS_ESTRELA = { veloz:{vel:6,dri:2}, faro:{fin:6}, maestro:{pas:6,dri:2}, muralha:{mar:6,fis:2}, falta:{fin:3,pas:3}, paredao:{gol:5} };

// quais atributos contam para cada papel em campo (pesos)
const PESO_PAPEL = {
  GOL: {gol:.75, fis:.10, pas:.15},
  ZAG: {mar:.50, fis:.25, vel:.10, pas:.15},
  LAT: {vel:.30, mar:.30, pas:.20, fis:.20},
  VOL: {mar:.35, pas:.30, fis:.25, dri:.10},
  MEI: {pas:.40, dri:.25, fin:.15, vel:.10, fis:.10},
  PON: {vel:.35, dri:.30, fin:.20, pas:.15},
  ATA: {fin:.45, vel:.20, dri:.15, fis:.20}
};

function garanteAtributos(p, seed){
  if(p.at && ATRIBS.every(k=>typeof p.at[k]==='number')) return p.at;
  const r = rng(String(seed||'x')+'#at#'+p.id);
  const perfil = PERFIL_POS[p.pos] || PERFIL_POS.MEI;
  const bonus = (p.estrela && BONUS_ESTRELA[p.estrela]) || {};
  const at={};
  ATRIBS.forEach(k=>{
    const ruido = Math.round((r()+r()-1)*6);              // -6..+6, concentrado no meio
    at[k] = clamp(Math.round(p.ovr + (perfil[k]||0) + ruido + (bonus[k]||0)), 25, 99);
  });
  // mantém a média dos atributos que importam para a posição colada na força
  const peso = PESO_PAPEL[p.pos] || PESO_PAPEL.MEI;
  const media = Object.keys(peso).reduce((s,k)=>s+at[k]*peso[k],0);
  const corr = Math.round(p.ovr - media);
  Object.keys(peso).forEach(k=>{ at[k]=clamp(at[k]+corr, 25, 99); });
  p.at = at;
  return at;
}

function garanteAtributosDe(L2){
  if(!L2 || !L2.squads) return;
  Object.keys(L2.squads).forEach(cid=>(L2.squads[cid]||[]).forEach(p=>garanteAtributos(p, L2.seed)));
}

// força efetiva do jogador num papel: metade a força geral, metade os atributos que aquele papel pede
function forcaNoPapel(p, slot){
  const at = p.at || garanteAtributos(p, (typeof L!=='undefined'&&L)?L.seed:'x');
  const peso = PESO_PAPEL[slot] || PESO_PAPEL[p.pos] || PESO_PAPEL.MEI;
  const tot = Object.keys(peso).reduce((s,k)=>s+peso[k],0)||1;
  const v = Object.keys(peso).reduce((s,k)=>s+at[k]*peso[k],0)/tot;
  return p.ovr*0.5 + v*0.5;
}

// quando a força muda (evolução ou queda), os atributos acompanham — os da posição um pouco mais
function evoluirAtributos(p, delta, foco){
  const at = p.at; if(!at || !delta) return;
  const peso = PESO_PAPEL[p.pos] || PESO_PAPEL.MEI;
  ATRIBS.forEach(k=>{
    if(k==='gol' && p.pos!=='GOL') return;
    let f = (peso[k] ? 1.2 : 0.6);
    if(foco && foco===k) f += 0.9;
    at[k] = clamp(at[k] + delta*f, 25, 99);
  });
}

// os três atributos que definem o jogador (para a lista e a ficha)
function atributosChave(p){
  const at = p.at || garanteAtributos(p, (typeof L!=='undefined'&&L)?L.seed:'x');
  if(p.pos==='GOL') return [['gol',at.gol],['fis',at.fis],['pas',at.pas]];
  const peso = PESO_PAPEL[p.pos] || PESO_PAPEL.MEI;
  return Object.keys(peso).sort((a,b)=>peso[b]-peso[a]).slice(0,3).map(k=>[k,at[k]]);
}

// cores fixas: o acento do time é colorido e confundia a leitura
function corAtrib(v){ return v>=80?'var(--ok)':v>=68?'var(--ink)':v>=56?'var(--warn)':'var(--danger)'; }

function atributosHTML(p){
  const at = p.at || garanteAtributos(p, (typeof L!=='undefined'&&L)?L.seed:'x');
  const lista = p.pos==='GOL' ? ['gol','fis','pas','vel','mar','dri'] : ['vel','fin','pas','dri','mar','fis'];
  const peso = PESO_PAPEL[p.pos] || PESO_PAPEL.MEI;
  return `<div class="atr-grid">${lista.map(k=>`<div class="atr ${peso[k]?'chave':''}">
      <span class="atr-n">${ATRIB_NOME[k]}</span>
      <span class="atr-b"><i style="width:${Math.round(at[k])}%;background:${corAtrib(at[k])}"></i></span>
      <b style="color:${corAtrib(at[k])}">${Math.round(at[k])}</b></div>`).join('')}</div>`;
}

/* ---------- evolução semanal (uma regra só para carreira e liga) ---------- */

const TREINO_FOCO = {finalizacao:'fin', fisico:'fis'};
function focoDoTreino(treino, p){
  if(treino==='tatico') return (p.pos==='ZAG'||p.pos==='LAT'||p.pos==='VOL') ? 'mar' : 'pas';
  return TREINO_FOCO[treino] || null;
}

// aplica o ganho/queda da semana e faz os atributos e o histórico acompanharem
/* Quanto de força um jogador pode ganhar numa temporada. Sem esse limite o
   Vitor Roque saía de 79 pra 92 num ano só, e jogador nenhum faz isso na vida
   real — nem Endrick. O que o potencial diz é onde ele chega, não em quanto
   tempo; esse teto é o "em quanto tempo". */
function subidaMaxAno(p){
  const i = p.idade||25;
  return i<=18 ? 8 : i<=21 ? 7 : i<=23 ? 5.5 : i<=26 ? 4 : i<=29 ? 2.5 : 1.5;
}

function aplicarEvolucao(p, ganho, treino, slotAtual, L2){
  const antes = p.ovr;
  // o teto do inventado (86) vale na evolução também, senão o mundo enche de
  // jogador de 90 que não existe
  const teto = (typeof tetoDeForca==='function') ? tetoDeForca(p) : 92;
  if(ganho>0){
    // os últimos pontos até o potencial custam mais que os primeiros
    const falta = (p.pot||p.ovr) - p.ovr;
    ganho *= (typeof clamp==='function') ? clamp(falta/6, 0.3, 1) : 1;
    const base = (p.ovr0===undefined) ? p.ovr : p.ovr0;
    const tetoAno = base + subidaMaxAno(p);
    if(p.ovrF===undefined) p.ovrF = p.ovr;
    if(p.ovrF >= tetoAno) ganho = 0;
    else ganho = Math.min(ganho, tetoAno - p.ovrF);
  }
  p.ovrF = Math.min((p.ovrF||p.ovr) + ganho, teto + 0.49);
  p.ovr = clamp(Math.round(p.ovrF), 45, teto);
  p.valor = valorDeMercado(p.ovr, p.idade);
  if(p.ovr0===undefined) p.ovr0 = p.ovr;
  const delta = p.ovr - antes;
  // atributos: acompanham a força; o foco do treino puxa um pouco mais mesmo sem mudar a força
  if(p.at){
    if(delta) evoluirAtributos(p, delta, focoDoTreino(treino, p));
    else if(treino && treino!=='equilibrado' && (p.at.__f=(p.at.__f||0)+1)%6===0){
      const k=focoDoTreino(treino, p); if(k) p.at[k]=clamp(p.at[k]+1, 25, Math.min(99, p.ovr+12));
    }
  }
  if(delta){
    p.h = (p.h||[]).concat([[slotAtual||0, p.ovr]]).slice(-16);   // histórico curto: [semana, força]
    if(L2 && L2.meuClube && (p._cid===L2.meuClube)) p._mudou = delta;
  }
  return delta;
}

function noticiaEvolucao(L2, p, delta){
  if(!L2 || !L2.noticias) return;
  const txt = delta>0 ? `${p.nome} evoluiu: força ${p.ovr-delta} → ${p.ovr}.` : `${p.nome} caiu de rendimento: força ${p.ovr-delta} → ${p.ovr}.`;
  L2.noticias.unshift({t: delta>0?'good':'bad', txt});
}
/* ===== 02-motor ===== */
'use strict';

/* EQ = a razão ataque/defesa de um time contra outro IGUAL a ele. Medida em
   elencos de 60 a 90 e é sempre 0,906 — a defesa leva um multiplicador de
   formação que o ataque não leva, e por isso a razão crua nunca passava de
   1,17 nem quando um time tinha 12 pontos de overall a mais que o outro.
   Dividindo por EQ, a razão vale exatamente 1 quando os times se equivalem, em
   qualquer nível: o ritmo de gols da liga não muda, mas a diferença de elenco
   passa a pesar de verdade. Só então os expoentes fazem sentido. */
const EQ = 0.906;
const K = { SHOT:0.2271, CONV:0.0762, HOME:1.095, TALENTO:1.28, EXP_S:2.10, EXP_C:1.75,
            FOUL:0.132, PEN:0.0128, DUR:90 };

/* Pontaria de quem finaliza. Antes a chance de um chute virar gol era só do
   TIME: contratar um 92 não fazia o time marcar mais, ele só tomava os gols dos
   companheiros. Agora quem chuta bem converte mais — é o que faz um craque
   valer o que custa. A referência é 74, a pontaria típica de quem finaliza. */
function miraDe(u){
  const p = u && u.p; if(!p) return 1;
  const q = (p.at && typeof p.at.fin==='number') ? p.ovr*0.40 + p.at.fin*0.60 : p.ovr;
  return clamp(Math.pow(Math.max(40,q)/74, 2.0), 0.70, 1.75);
}

const MENT = {
  retranca:   {n:'Retranca',    atk:.82, mid:.95, def:1.14, dre:.85, risco:.85},
  cauteloso:  {n:'Cauteloso',   atk:.92, mid:.99, def:1.06, dre:.93, risco:.93},
  equilibrado:{n:'Equilibrado', atk:1,   mid:1,   def:1,    dre:1,   risco:1},
  ofensivo:   {n:'Ofensivo',    atk:1.11,mid:1.02,def:.92,  dre:1.08,risco:1.08},
  total:      {n:'Tudo pra frente',atk:1.22,mid:1.02,def:.80,dre:1.20,risco:1.20}
};

const PRESS = {
  baixa: {n:'Baixa', mid:.96, def:1.04, dre:.82, falta:.8},
  media: {n:'Média', mid:1,   def:1,    dre:1,   falta:1},
  alta:  {n:'Alta',  mid:1.06,def:.96,  dre:1.30,falta:1.35}
};

const ESTILO = {
  curto:  {n:'Toque curto', shot:.90, conv:1.14, mid:1.05},
  direto: {n:'Jogo direto', shot:1.14, conv:.88, mid:.97},
  lados:  {n:'Pelos lados', shot:1.04, conv:1.0, mid:1.0}
};

function escalarAuto(elenco, formacao){
  const slots = FORMACOES[formacao] || FORMACOES['4-4-2'];
  const livres = elenco.filter(p=>p.lesao<=0).slice();
  const tit=[];
  slots.forEach(slot=>{
    let melhor=null, melhorV=-1;
    livres.forEach(p=>{
      if(tit.includes(p.id)) return;
      const base = (typeof forcaNoPapel==='function') ? forcaNoPapel(p, slot) : p.ovr;
      const v = base*fit(p.pos,slot)*(0.92+0.08*p.forma/100)*(0.74+0.26*clamp(p.energia,0,100)/100);
      if(v>melhorV){melhorV=v;melhor=p;}
    });
    if(melhor) tit.push(melhor.id);
  });
  /* O banco era só "os 7 melhores que sobraram" e saía sem nenhum goleiro:
     se o titular tomava vermelho ou se machucava, não havia quem pôr no gol.
     Todo time leva um goleiro reserva — aqui ele entra por primeiro. */
  const sobra = livres.filter(p=>!tit.includes(p.id)).sort((a,b)=>b.ovr-a.ovr);
  const gkRes = sobra.find(p=>p.pos==='GOL');
  const banco = (gkRes ? [gkRes].concat(sobra.filter(p=>p!==gkRes).slice(0,6))
                       : sobra.slice(0,7)).map(p=>p.id);
  return {titulares:tit, banco};
}

function forcasBase(S){
  let gk=0, def=[], mid=[], atk=[];
  S.emCampo.forEach(u=>{
    if(u.fora) return;
    const p=u.p, f=fit(p.pos,u.slot);
    // metade a força geral, metade as qualidades que o papel pede (velocidade, marcação, passe…)
    const base = (typeof forcaNoPapel==='function') ? forcaNoPapel(p, u.slot) : p.ovr;
    const eff = base*f*(.70+.30*clamp(u.energia,0,100)/100)*(.92+.16*p.forma/100)*(.94+.12*p.moral/100);
    if(u.slot==='GOL') gk=eff;
    else if(u.slot==='ZAG'||u.slot==='LAT') def.push(eff);
    else if(u.slot==='ATA') atk.push(eff);
    else mid.push(eff);
  });
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:48;
  const m=MENT[S.tac.mentalidade]||MENT.equilibrado;
  const pr=PRESS[S.tac.pressao]||PRESS.media;
  const es=ESTILO[S.tac.estilo]||ESTILO.lados;
  const nCampo = S.emCampo.filter(u=>!u.fora).length;
  const penalN = nCampo>=11?1:0.90+0.10*(nCampo-10);   // 10 homens ≈ -10%
  let D = (gk?gk*.30:14) + avg(def)*.70;
  let M = avg(mid), A = avg(atk)*.78 + avg(mid)*.22;
  // formações densas no meio
  const slots=FORMACOES[S.tac.formacao]||[];
  const nMid = slots.filter(s=>s==='VOL'||s==='MEI'||s==='PON').length;
  M *= (0.94 + 0.02*nMid);
  const nDef = slots.filter(s=>s==='ZAG'||s==='LAT').length;
  D *= (0.95 + 0.0165*nDef*2);
  /* Talento rende mais que proporcional. Antes a força era linear no overall:
     um elenco de 80 valia só 14% mais que um de 70, e o melhor time do país
     terminava em 12º numa temporada em cada seis. No futebol de verdade a
     diferença entre um grande e um pequeno é bem maior que 14%.
     Aqui a distância para a média da liga é esticada. Um time médio não muda —
     por isso o ritmo de gols e o empate ficam onde estavam — mas o grande fica
     mais grande e o pequeno, mais pequeno. Esticar com potência, em vez disso,
     inflava a defesa dos dois lados e enchia o campeonato de 0 a 0. */
  const G = K.TALENTO, PIVO = 72;
  const talento = v => PIVO + (v - PIVO) * G;
  D = talento(D); M = talento(M); A = talento(A);
  return {
    def: D*m.def*pr.def*penalN,
    mid: M*m.mid*pr.mid*es.mid*penalN,
    atk: A*m.atk*penalN,
    shot: es.shot, conv: es.conv, dre:m.dre*pr.dre, falta:pr.falta, risco:m.risco
  };
}

function criarPartida(L, h, a, liveSide, compId){
  const M = {
    compId: compId||null,
    /* Em que competição o gol entra na artilharia.
       Separado de compId de propósito: compId entra na SEMENTE do "dia do
       time" (diaDoTime), então mudá-lo muda o placar dos jogos. Na liga com
       amigos as partidas sempre foram simuladas sem compId; passar a mandá-lo
       agora quebraria toda liga em andamento no meio do campeonato. Então a
       liga com amigos preenche só este campo — a artilharia por competição
       volta a funcionar e nenhum resultado muda de valor. */
    compGols: compId||null,
    L, min:0, extra:0, dur:K.DUR, half:1, fim:false, pausa:null,
    h: montarLado(L,h,true), a: montarLado(L,a,false),
    hg:0, ag:0, eventos:[], liveSide: liveSide||null,
    publico: 0, historia:[]
  };
  const hc=M.h.clube;
  M.publico = Math.round(clamp(hc.estadio*(0.35+0.09*hc.rep+rnd()*0.25),3000,hc.estadio));
  M.h.ao_vivo = liveSide==='h'; M.a.ao_vivo = liveSide==='a';
  return M;
}

function ev(M, t, side, txt, cls){
  const e={min:M.min>K.DUR?K.DUR:M.min, add:M.min>K.DUR?M.min-K.DUR:0, t, side, txt, cls:cls||''};
  M.eventos.push(e); return e;
}

function nome(u){return u.p.nome;}

/* Quem finaliza. Antes a posição mandava quase sozinha (expoente 2,2 no overall),
   e por isso um atacante de 77 fazia mais gol que um ponta de 80 — medido: a faixa
   76-78 marcava 0,152 por jogo contra 0,135 da faixa 79-81, invertido. Agora conta
   a finalização do jogador, e conta forte. */
function escolheAtacante(S){
  const cands = S.emCampo.filter(u=>!u.fora && u.slot!=='GOL');
  const peso = cands.map(u=>{
    const b = u.slot==='ATA'?10 : u.slot==='PON'?6 : u.slot==='MEI'?5.2 : u.slot==='VOL'?1.8 : 1;
    const p = u.p;
    const q = (p.at && typeof p.at.fin==='number') ? p.ovr*0.45 + p.at.fin*0.55 : p.ovr;
    return b*Math.pow(Math.max(40,q)/62, 4.2);
  });
  const tot=peso.reduce((a,b)=>a+b,0); let r=rnd()*tot;
  for(let i=0;i<cands.length;i++){ r-=peso[i]; if(r<=0) return cands[i]; }
  return cands[cands.length-1];
}

function escolheAssist(S, exceto){
  const cands=S.emCampo.filter(u=>!u.fora&&u.slot!=='GOL'&&u!==exceto);
  if(!cands.length||rnd()<.25) return null;
  const peso=cands.map(u=>u.slot==='MEI'?7:u.slot==='PON'?7:u.slot==='ATA'?4:u.slot==='LAT'?3:1.5);
  const tot=peso.reduce((a,b)=>a+b,0); let r=rnd()*tot;
  for(let i=0;i<cands.length;i++){ r-=peso[i]; if(r<=0) return cands[i]; }
  return null;
}

function goleiro(S){ return S.emCampo.find(u=>!u.fora&&u.slot==='GOL'); }

/* A NARRAÇÃO TEM QUE BATER COM O QUE APARECE NO CAMPO.
   Antes era um saco só: o motor sorteava a frase ('Cabeçada de {A}') e a
   animação sorteava, separado, de onde partia o chute. Dava cabeçada marcada
   de 28 metros e golaço "de fora da área" batido de dentro da pequena área —
   foi o que o Rafael viu. Agora quem decide o estilo é o motor, uma vez só, e
   a frase e o desenho saem os dois dessa mesma decisão. Decidir aqui também é
   melhor para a liga online: o sorteio do motor é semeado e igual em todo
   aparelho, o da animação não precisa ser. */
const F_GOL_FORA  = ['Que golaço de {A}, de fora da área!','{A} arriscou de longe e achou o ângulo!','{A} pegou de muito longe e a bola morreu no fundo!'];
const F_GOL_CRUZ  = ['Cabeçada de {A}, sem chance pro goleiro!','{A} apareceu na segunda trave e completou!','Cruzamento na medida e {A} testou pro gol!','{A} subiu sozinho e cabeceou no canto!'];
const F_GOL_PERTO = ['{A} pega a sobra e manda pro fundo do gol!','{A} girou na marcação e bateu no canto!','{A} tocou na saída do goleiro!','{A} pegou de primeira e estufou a rede!','{A} ficou de frente pro goleiro e não perdoou!'];

/* 'fora' = chute de 22 a 28m · 'cruz' = cabeçada/segunda trave · 'dentro' = área.
   Os pesos são os mesmos que a animação já usava: finalizador bom arrisca mais
   de longe, jogador forte fisicamente aparece mais no cruzamento. */
function estiloDoGol(S, u){
  const fin = (u && typeof atrDe==='function') ? atrDe(u,'fin') : 70;
  const fis = (u && typeof atrDe==='function') ? atrDe(u,'fis') : 70;
  const r = rnd()*100;
  if(r < 15 + (fin-70)*0.5) return 'fora';
  if(r < 42 + (fis-70)*0.5) return 'cruz';
  return 'dentro';
}

const F_DEF = ['{G} espalma pra escanteio!','Defesa enorme de {G}!','{G} cresce na frente de {A} e salva!','{A} bateu firme, {G} defendeu!'];

const F_FORA= ['{A} bateu por cima do travessão.','{A} finalizou pra fora, tinha condições de fazer melhor.','A bola passou raspando a trave de {A}.','{A} chutou torto, foi pra linha de fundo.'];

const F_TRAVE=['{A} carimbou o travessão!','No poste! {A} quase abriu o placar!'];

const F_CHANCE=['{A} recebe livre na área...','Contra-ataque puxado por {A}...','{A} arrisca de longe...','Jogada trabalhada, {A} aparece na área...'];

/* A narração do gol considera o placar DEPOIS da bola entrar e o minuto.
   O objetivo é dar contexto ao lance sem inventar acontecimentos: empate,
   virada e gol decisivo são inferidos exclusivamente do placar real. */
function contextoNarrativoGol(M, S){
  const meu = S===M.h ? M.hg : M.ag;
  const rival = S===M.h ? M.ag : M.hg;
  const antes = meu-1;
  const min = M.min;
  const lado = S===M.h ? 'h' : 'a';
  if(meu===rival){
    if(antes<rival) M._reacaoLado=lado; // estava atrás e buscou o empate
    return min>=85 ? 'EMPATE NO FIM DA PARTIDA!' : 'É O GOL DE EMPATE!';
  }
  if(meu>rival && antes===rival){
    if(M._reacaoLado===lado){ M._reacaoLado=null;
      return min>=85 ? 'VIRADA NOS MINUTOS FINAIS!' : 'É A VIRADA!';
    }
    return min>=85 ? 'GOL QUE PODE GARANTIR A VITÓRIA!' : 'ABRE VANTAGEM NO PLACAR!';
  }
  if(min>=85 && meu>rival) return 'GOL NA RETA FINAL!';
  if(min<=15 && meu>rival) return 'COMEÇA COM TUDO!';
  return '';
}

function marcarGol(M, S, O, u, tipo){
  S.gols++; if(S===M.h) M.hg++; else M.ag++;
  u.p.gols++; u.gols++; u.nota+=1.1;
  let ass=null;
  if(tipo!=='penalti'){ ass=escolheAssist(S,u); if(ass){ass.p.assist++;ass.assist++;ass.nota+=.5;} }
  const F_ESCANTEIO = ['GOL! {A} subiu mais que todo mundo no escanteio!',
                      'GOL! Escanteio na cabeça de {A}, sem chance pro goleiro!',
                      'GOL! {A} apareceu na segunda trave e testou pro gol!',
                      'GOL DE ESCANTEIO! {A} cabeceou firme no canto!'];
  // o estilo vale para a frase E para o desenho do lance
  const estilo = tipo==='jogada' ? estiloDoGol(S,u) : null;
  const banco = estilo==='fora' ? F_GOL_FORA : estilo==='cruz' ? F_GOL_CRUZ : F_GOL_PERTO;
  const txtBase = tipo==='penalti' ? `GOL! ${nome(u)} converte o pênalti.`
            : tipo==='falta'   ? `GOL! ${nome(u)} na cobrança de falta, no ângulo!`
            : tipo==='escanteio' ? pick(F_ESCANTEIO).replace('{A}',nome(u)) + (ass?` Assistência de ${nome(ass)}.`:'')
            : `GOL! ${pick(banco).replace('{A}',nome(u))}` + (ass?` Assistência de ${nome(ass)}.`:'');
  const contexto = contextoNarrativoGol(M,S);
  const assinatura = u.p.estrela && ESTRELAS[u.p.estrela]
    ? (u.p.estrela==='faro' ? 'O faro de gol aparece na hora decisiva.'
      : u.p.estrela==='maestro' ? 'O maestro também sabe decidir.'
      : u.p.estrela==='veloz' ? 'Arranque e precisão para definir.'
      : u.p.estrela==='muralha' ? 'Até quem protege lá atrás aparece para decidir.'
      : u.p.estrela==='paredao' ? 'O goleiro também entra para a história.' : '')
    : '';
  const txt = [contexto, txtBase, assinatura].filter(Boolean).join(' ');
  const _e=ev(M,'gol',S===M.h?'h':'a', txt, 'goal');
  _e.contexto = contexto || null;
  _e.i=u.idx; _e.ia=ass?ass.idx:null; _e.q=nome(u); _e.tipo=tipo;
  if(estilo) _e.estilo=estilo;   // a animação obedece a isto
  /* artilharia por competição: sem isto só dava para somar os gols de tudo
     junto, e não tinha como ver o artilheiro do Brasileirão separado da Copa. */
  const _cg = M.compGols || M.compId;
  if(_cg){ u.p.golsComp = u.p.golsComp || {};
    u.p.golsComp[_cg] = (u.p.golsComp[_cg]||0) + 1; }
  // moral
  S.emCampo.forEach(x=>x.p.moral=clamp(x.p.moral+1.2,0,100));
  O.emCampo.forEach(x=>x.p.moral=clamp(x.p.moral-1.0,0,100));
}

function cobrarPenalti(M, S, O, batedor){
  const gk=goleiro(O);
  const chance = clamp(.78 + (batedor.p.ovr-60)*.004 - (gk?(gk.p.ovr-60)*.003:0), .55, .93);
  if(rnd()<chance) marcarGol(M,S,O,batedor,'penalti');
  else { const _e=ev(M,'defesa',S===M.h?'h':'a', `${gk?nome(gk):'O goleiro'} defende o pênalti de ${nome(batedor)}!`,'');
         _e.i=batedor.idx; _e.q=gk?nome(gk):''; _e.tipo='penalti';
         batedor.nota-=.8; if(gk) gk.nota+=1; }
}

/* Goleiro expulso: no futebol o time NÃO fica sem goleiro. Ou entra o reserva
   (e sai um jogador de linha), ou alguém de linha veste a luva. Antes disso o
   goleiro simplesmente sumia e o gol ficava vazio o jogo inteiro. */
function cobrirGolVazio(M, S){
  if(S.emCampo.some(u=>!u.fora && u.slot==='GOL')) return;
  const linha = S.emCampo.filter(u=>!u.fora);
  if(!linha.length) return;
  const reserva = (S.banco||[]).filter(p=>p.pos==='GOL' && !(p.lesao>0))
                               .sort((a,b)=>b.ovr-a.ovr)[0];
  if(reserva && S.subs<MAX_SUBS){
    // sai o jogador de linha menos decisivo (e não um zagueiro, se der)
    const ordem = {ATA:0, PON:1, MEI:2, VOL:3, LAT:4, ZAG:5};
    const sai = linha.slice().sort((a,b)=>
      (ordem[a.slot]??9)-(ordem[b.slot]??9) || a.p.ovr-b.p.ovr)[0];
    const i = S.emCampo.indexOf(sai);
    S.banco = S.banco.filter(p=>p.id!==reserva.id);
    S.emCampo[i] = {id:reserva.id, p:reserva, slot:'GOL', idx:sai.idx, energia:reserva.energia,
                    ca:0, cv:0, nota:6, gols:0, assist:0, fora:false,
                    entrouMin:M.min, energiaInicio:reserva.energia};
    sai.fora=true; sai.substituido=true; S.subs++;
    (S.sairam=S.sairam||[]).push(sai);
    (S.subsLog=S.subsLog||[]).push({min:M.min, sai:nome(sai), slot:sai.slot, nota:sai.nota,
      entra:reserva.nome, gols:sai.gols||0, assist:sai.assist||0, ca:sai.ca||0, cv:sai.cv||0});
    const _eg=ev(M,'sub',S===M.h?'h':'a',
      `Entra o goleiro ${reserva.nome} no lugar de ${nome(sai)}.`,'sys');
    _eg.i=sai.idx; _eg.q=reserva.nome;
    return;
  }
  // sem reserva ou sem troca: alguém de linha vai pro gol
  const ordem = {ZAG:0, LAT:1, VOL:2, MEI:3, PON:4, ATA:5};
  const heroi = linha.slice().sort((a,b)=>(ordem[a.slot]??9)-(ordem[b.slot]??9) || b.p.ovr-a.p.ovr)[0];
  heroi.slot='GOL'; heroi.improvisado=true;
  const _eh=ev(M,'sub',S===M.h?'h':'a',
    `Sem goleiro no banco: ${nome(heroi)} veste a camisa e vai pro gol.`,'sys');
  _eh.i=heroi.idx; _eh.q=nome(heroi);
}

function aplicaCartao(M, S, u, vermelho){
  if(vermelho || u.ca>=1){
    u.cv=1; u.fora=true; u.p.cv++; u.nota-=1.6;
    const _ec=ev(M,'cv',S===M.h?'h':'a', `VERMELHO! ${nome(u)} está expulso. ${S.clube.sigla} fica com ${S.emCampo.filter(x=>!x.fora).length} em campo.`,'card-r');
    _ec.i=u.idx; _ec.q=nome(u);
    if(u.slot==='GOL') cobrirGolVazio(M, S);
  } else {
    u.ca=1; u.p.ca++; u.nota-=.35;
    const _ea=ev(M,'ca',S===M.h?'h':'a', `Amarelo para ${nome(u)}.`,'card-y'); _ea.i=u.idx; _ea.q=nome(u);
  }
}


/* ---------- Momentos do jogo: duas decisões que mudam a partida ----------
   O técnico deixa as duas escolhas armadas (uma por situação: perdendo,
   empatando, ganhando). Na liga online a partida roda igual em todo celular,
   então o plano é o que vale. Na carreira, se você estiver assistindo,
   o jogo pausa e pergunta — com o plano já selecionado. */
const ACOES_MOMENTO = {
  manter:   {n:'Manter o plano',       d:'Nada muda. O time segue como está.'},
  pressao:  {n:'Subir a marcação',     d:'Pressão alta: rouba mais bola e cria mais, mas cansa e dá falta.'},
  recuar:   {n:'Recuar as linhas',     d:'Pressão baixa e time cauteloso: sofre menos, cria menos.'},
  curto:    {n:'Segurar a bola',       d:'Toque curto: menos finalizações, mas de melhor qualidade.'},
  direto:   {n:'Jogo direto',          d:'Bola pra frente: muito mais chute, menos capricho.'},
  lados:    {n:'Abrir pelos lados',    d:'Jogo pelas pontas, equilíbrio entre volume e qualidade.'},
  ofensivo: {n:'Adiantar o time',      d:'Mentalidade ofensiva: mais ataque, mais espaço atrás.'},
  total:    {n:'Tudo pra frente',      d:'Time todo no ataque. Ou empata, ou toma o terceiro.'},
  segurar:  {n:'Fechar o jogo',        d:'Retranca: segura o resultado e aceita o sufoco.'},
  atacante: {n:'Botar mais um atacante', d:'Entra o melhor atacante do banco no lugar do mais cansado da defesa.'},
  zagueiro: {n:'Botar mais um zagueiro', d:'Entra um defensor no lugar de um homem de frente.'}
};

/* As duas decisões só acontecem no SEGUNDO tempo. No primeiro o jogo mal
   começou: parar aos 30' para perguntar se muda o time atrapalhava mais do que
   ajudava — técnico nenhum mexe antes do intervalo por causa do placar. */
const MIN_MOMENTO = 46;
function momentosPadrao(){
  return [
    {min:55, perdendo:'pressao', empatando:'manter',  ganhando:'manter'},
    {min:75, perdendo:'ofensivo',empatando:'atacante',ganhando:'segurar'}
  ];
}
/* Quem tinha 30' guardado de antes volta para o padrão do segundo tempo, em vez
   de colar no 46' — assim o que a tela mostra é o que o jogo faz. */
function minDoMomento(m,k){
  const padrao = k?75:55;
  const v = (m && m.min) || padrao;
  return v < MIN_MOMENTO ? padrao : v;
}

function situacaoDe(M,S){
  const meu = S===M.h?M.hg:M.ag, dele = S===M.h?M.ag:M.hg;
  return meu<dele ? 'perdendo' : meu>dele ? 'ganhando' : 'empatando';
}

function acaoDoMomento(M,S,k){
  const ms=(S.instr&&S.instr.momentos)||momentosPadrao();
  const m=ms[k]||momentosPadrao()[k];
  return m[situacaoDe(M,S)]||'manter';
}

function entraDoBanco(S, posQuer){
  const ordem = posQuer==='ATA' ? ['ATA','PON','MEI'] : ['ZAG','LAT','VOL'];
  for(const pos of ordem){
    const c=S.banco.filter(p=>p.pos===pos&&p.lesao<=0).sort((a,b)=>b.ovr-a.ovr||(a.id<b.id?-1:1))[0];
    if(c) return c;
  }
  return null;
}

function saiDoCampo(S, defensivo){
  const grupos = defensivo ? ['VOL','ZAG','LAT'] : ['ATA','PON','MEI'];
  const cands=S.emCampo.filter(u=>!u.fora&&u.slot!=='GOL'&&grupos.includes(u.slot));
  if(!cands.length) return null;
  return cands.slice().sort((a,b)=>a.energia-b.energia||(a.p.id<b.p.id?-1:1))[0];
}

function aplicarAcaoMomento(M,S,acao){
  const sig = S===M.h?'h':'a';
  const sg = S.clube.sigla;
  if(!acao||acao==='manter') return null;
  if(acao==='pressao'){ S.tac.pressao='alta'; return `${sg} sobe a marcação e aperta no campo do adversário.`; }
  if(acao==='recuar'){ S.tac.pressao='baixa'; S.tac.mentalidade='cauteloso'; return `${sg} recua as linhas e fecha os espaços.`; }
  if(acao==='curto'){ S.tac.estilo='curto'; return `${sg} passa a segurar a bola e trocar passes.`; }
  if(acao==='direto'){ S.tac.estilo='direto'; return `${sg} parte pro jogo direto, bola na frente.`; }
  if(acao==='lados'){ S.tac.estilo='lados'; return `${sg} abre o jogo pelos lados.`; }
  if(acao==='ofensivo'){ S.tac.mentalidade='ofensivo'; return `${sg} adianta o time no campo de ataque.`; }
  if(acao==='total'){ S.tac.mentalidade='total'; return `${sg} joga tudo pra frente.`; }
  if(acao==='segurar'){ S.tac.mentalidade='retranca'; return `${sg} fecha o jogo pra segurar o resultado.`; }
  if(acao==='atacante'||acao==='zagueiro'){
    if(S.subs>=MAX_SUBS) return null;
    const entra=entraDoBanco(S, acao==='atacante'?'ATA':'ZAG');
    const sai=saiDoCampo(S, acao==='atacante');
    if(!entra||!sai) return null;
    const nomeSai=sai.p.nome, nomeEntra=entra.nome;
    fazerSub(M,S,sai,entra);
    return acao==='atacante'
      ? `${sg} vai com mais um atacante: ${nomeEntra} no lugar de ${nomeSai}.`
      : `${sg} reforça a defesa: ${nomeEntra} entra no lugar de ${nomeSai}.`;
  }
  return null;
}

/* A força do time muda devagar dentro do jogo: recalcular a cada minuto é o
   que mais custa numa semana com 70 partidas. Recalculamos a cada 5 minutos e
   sempre que algo muda de verdade (troca, cartão, mudança de postura). */
function invalidarForcas(S){ if(S) S._fCache=null; }

/* O DIA DO TIME. Futebol tem dia inspirado e dia ruim: o mesmo elenco não
   rende igual todo domingo. Sem isso, com o overall pesando como agora, o
   melhor da Série A ganhava 86% dos jogos em casa e o lanterna só 8% — a zebra
   praticamente sumia, e o Rafael pediu justamente que ela continuasse
   existindo. Este fator é sorteado uma vez por partida, vale ±9%, e na média
   é 1: não mexe em quem é melhor, mexe em quanto o resultado é garantido. */
let DIA_VAR = 0.26;              // amplitude do dia do time (0.26 = ±13%)
/* O dia é sorteado por uma semente própria, montada com o confronto e a
   semana. Usar rnd() aqui consumia o gerador da partida: na liga com amigos,
   onde cada celular recalcula a rodada e os resultados têm de bater na
   vírgula, isso desalinhava tudo e os selos paravam de fechar. */
function diaDoTime(M, S){
  if(S._dia==null){
    /* O público já é sorteado uma vez por partida, na mesma ordem em todo
       aparelho — serve de identidade daquele jogo. Sem ele a semente era só o
       confronto, e o mesmo jogo repetido dava sempre o mesmo dia: o acaso
       sumia e o equilíbrio saía torto. */
    const semente = ((M.L&&M.L.seed)||'x') + '#dia#' + (M.compId||'') + '#' +
                    ((M.L&&M.L.slot)||0) + '#' + (M.h&&M.h.clubId||'') + 'x' +
                    (M.a&&M.a.clubId||'') + '#' + (M.publico||0) + '#' + (S.clubId||'');
    const r = (typeof rng==='function') ? rng(semente) : Math.random;
    S._dia = (1 - DIA_VAR/2) + r()*DIA_VAR;
  }
  return S._dia;
}

function forcasCache(M, S){
  const t=S.tac||{};
  const marca = (S.subs||0)+'|'+t.mentalidade+'|'+t.pressao+'|'+t.estilo+'|'+
                S.emCampo.reduce((n,u)=>n+(u.fora?1:0),0);
  if(S._fCache && S._fMarca===marca && (M.min - S._fMin) < 5) return S._fCache;
  const f = forcas(S);
  const d = diaDoTime(M, S);
  S._fCache = {...f, def:f.def*d, mid:f.mid*d, atk:f.atk*d};
  S._fMarca = marca; S._fMin = M.min;
  return S._fCache;
}

function aplicaMomentos(M,S,O){
  const ms=(S.instr&&S.instr.momentos)||momentosPadrao();
  for(let k=0;k<2;k++){
    const m=ms[k]||momentosPadrao()[k];
    if(S.jaAplicou['m'+k]) continue;
    if(M.min < minDoMomento(m,k)) continue;
    S.jaAplicou['m'+k]=1;
    if(S.ao_vivo && M.liveSide){ M.pausa={tipo:'momento', side:S===M.h?'h':'a', k}; return; }
    const txt=aplicarAcaoMomento(M,S,acaoDoMomento(M,S,k));
    if(txt) ev(M,'sys',S===M.h?'h':'a','Banco: '+txt,'sys');
  }
}

function aplicaInstrucoes(M, S, O){
  const i=S.instr; if(!i) return;
  const meu = S===M.h?M.hg:M.ag, dele = S===M.h?M.ag:M.hg;
  if(i.perdendo && i.perdendo.on && !S.jaAplicou.perdendo && M.min>=i.perdendo.min && meu<dele){
    S.tac.mentalidade=i.perdendo.ment; S.jaAplicou.perdendo=1;
    ev(M,'sys',S===M.h?'h':'a',`${S.clube.sigla} muda para ${MENT[i.perdendo.ment].n.toLowerCase()} atrás do resultado.`,'sys');
  }
  if(i.ganhando && i.ganhando.on && !S.jaAplicou.ganhando && M.min>=i.ganhando.min && meu>dele){
    S.tac.mentalidade=i.ganhando.ment; S.jaAplicou.ganhando=1;
    ev(M,'sys',S===M.h?'h':'a',`${S.clube.sigla} recua para segurar o resultado.`,'sys');
  }
  (i.subs||[]).forEach((r,k)=>{
    if(!r.on || S.jaAplicou['s'+k] || S.subs>=MAX_SUBS || M.min<46) return;
    let disparo=false;
    if(r.quando==='minuto') disparo = M.min>=r.valor;
    else if(r.quando==='energia') disparo = S.emCampo.some(u=>!u.fora&&u.slot!=='GOL'&&u.energia<r.valor);
    else if(r.quando==='perdendo') disparo = M.min>=r.valor && meu<dele;
    if(!disparo) return;
    const entra = r.entra ? S.banco.find(p=>p.id===r.entra) : melhorReserva(S);
    if(!entra) { S.jaAplicou['s'+k]=1; return; }
    const sai = maisCansado(S, entra.pos);
    if(!sai) { S.jaAplicou['s'+k]=1; return; }
    fazerSub(M,S,sai,entra); S.jaAplicou['s'+k]=1;
  });
}

function melhorReserva(S){ return S.banco.slice().sort((a,b)=>b.ovr-a.ovr)[0]||null; }

function maisCansado(S, posEntra){
  const cands=S.emCampo.filter(u=>!u.fora&&u.slot!=='GOL');
  if(!cands.length) return null;
  const scored=cands.map(u=>({u, v:u.energia - (posEntra&&fit(posEntra,u.slot)>=.9?12:0)}));
  scored.sort((a,b)=>a.v-b.v); return scored[0].u;
}

function fazerSub(M,S,sai,entra){
  if(S.subs>=MAX_SUBS) return false;
  const idx=S.emCampo.indexOf(sai); if(idx<0) return false;
  S.banco = S.banco.filter(p=>p.id!==entra.id);
  S.emCampo[idx] = {id:entra.id,p:entra,slot:sai.slot,idx:sai.idx,energia:entra.energia,ca:0,cv:0,nota:6,gols:0,assist:0,fora:false};
  sai.fora=true; sai.substituido=true; S.subs++;
  (S.sairam=S.sairam||[]).push(sai);
  S.emCampo[idx].entrouMin = M.min; S.emCampo[idx].energiaInicio = entra.energia;
  (S.subsLog=S.subsLog||[]).push({min:M.min, sai:nome(sai), slot:sai.slot, nota:sai.nota, entra:entra.nome,
    gols:sai.gols||0, assist:sai.assist||0, ca:sai.ca||0, cv:sai.cv||0});
  const _es=ev(M,'sub',S===M.h?'h':'a',`Substituição no ${S.clube.nome}: sai ${nome(sai)}, entra ${entra.nome}.`,'sys'); _es.i=sai.idx; _es.q=entra.nome;
  return true;
}

function passoMinuto(M){
  M.min++;
  const H=M.h, A=M.a;
  if(!H.ao_vivo) aplicaInstrucoes(M,H,A);
  if(!A.ao_vivo) aplicaInstrucoes(M,A,H);

  aplicaMomentos(M,H,A);
  if(!M.pausa) aplicaMomentos(M,A,H);
  if(M.pausa) { M.min--; return; }

  const fh=forcasCache(M,H), fa=forcasCache(M,A);
  const mH=fh.mid*K.HOME, aH=fh.atk*K.HOME, dH=fh.def*(1+(K.HOME-1)*.5);
  const pH = Math.pow(mH,1.35)/(Math.pow(mH,1.35)+Math.pow(fa.mid,1.35));
  H.posse+=pH; A.posse+=(1-pH);

  // desgaste: a barra do jogo (rende menos no fim) e o custo que fica para a semana seguinte
  const drenoH=.42*fh.dre, drenoA=.42*fa.dre;
  const desg=(S,dreno)=>S.emCampo.forEach(u=>{ if(u.fora) return;
    const f=fatorDesgaste(u.p, u.slot)*(.85+rnd()*.3);
    u.energia=clamp(u.energia-dreno*f,0,100);
    u.gasto=(u.gasto||0)+ (CUSTO_JOGO/90)*f*dreno/.42;
  });
  desg(H,drenoH); desg(A,drenoA);

  const lado=(S,O,f,fo,poss,atkV,defO)=>{
    const sig = S===M.h?'h':'a';
    // falta / cartão
    if(rnd() < K.FOUL*fo.falta){
      let alvo=pick(O.emCampo.filter(u=>!u.fora))||null;
      /* Quem está pendurado se cuida — e o técnico tira. Sem isso o segundo
         amarelo caía em qualquer um e o jogo tinha 0,57 expulsão por partida,
         quase quatro vezes o futebol de verdade (~0,15). */
      if(alvo && alvo.ca>=1 && rnd()<0.80){
        const limpos=O.emCampo.filter(u=>!u.fora && !(u.ca>=1));
        if(limpos.length) alvo=pick(limpos);
      }
      S.faltas++;
      if(alvo && rnd()<.20) aplicaCartao(M,O,alvo,rnd()<.010);
      // falta perigosa
      if(rnd()<.10){
        const bat=(typeof batedorFalta==='function') ? batedorFalta(S) : escolheAtacante(S);
        const ch=(typeof chanceFalta==='function') ? chanceFalta(bat) : .09;
        if(bat && rnd()<ch){ marcarGol(M,S,O,bat,'falta'); return; }
      }
    }
    // lesão
    if(rnd()<.0012){
      const u=pick(S.emCampo.filter(x=>!x.fora&&x.slot!=='GOL'));
      if(u){ const sem=ri(1,6); u.p.lesao=sem; u.lesionado=true;
        ev(M,'lesao',sig,`${nome(u)} sentiu e pede substituição. Deve ficar fora por ${sem} ${sem===1?'semana':'semanas'}.`,'sys');
        const e=melhorReserva(S); if(e&&S.subs<3) fazerSub(M,S,u,e); else {u.fora=true;}
      }
    }
    /* A diferença entre os times conta, mas SATURA. A razão vem normalizada por
       EQ (vale 1 quando os times se equivalem) e depois passa por uma curva que
       quase não toca no meio — onde uma contratação tem que ser sentida — e
       aperta nas pontas. Sem a saturação, os 12 pontos de overall que separam o
       melhor do pior da Série A viravam 86% de vitória e 8% de zebra; o Rafael
       pediu que o favorito ganhasse mais, não que o jogo virasse tabelinha. */
    const cru = atkV/defO/EQ, SAT = 2.9;
    const razao = cru>1 ? 1 + (cru-1)/(1+(cru-1)*SAT)
                        : 1 - (1-cru)/(1+(1-cru)*SAT);
    // goleada encaminhada: quem está ganhando tira o pé, quem perde se joga
    const dif = (S===M.h ? M.hg-M.ag : M.ag-M.hg);
    let ritmo = dif>=4 ? 0.42 : dif>=3 ? 0.58 : dif>=2 ? 0.82
              : dif<=-3 ? 1.18 : dif<=-2 ? 1.10 : 1;
    // reta final apertada: quem perde por um se joga, quem ganha por um se fecha
    if(M.min>=70){
      if(dif===-1) ritmo *= 1.22;
      else if(dif===1) ritmo *= 0.86;
    }
    const pChute = clamp(K.SHOT*poss*Math.pow(razao,K.EXP_S)*f.shot*ritmo, 0, 0.42);
    if(rnd()<pChute){
      S.chutes++;
      const atac=escolheAtacante(S);
      if(!atac) return;
      // pênalti?
      if(rnd()<K.PEN){
        { const _e=ev(M,'penalti',sig,`PÊNALTI para o ${S.clube.nome}! ${nome(atac)} foi derrubado na área.`,'big'); _e.i=atac.idx; _e.q=nome(atac); }
        if(S.ao_vivo){ M.pausa={tipo:'penalti', side:sig}; return; }
        const bat = S.instr && S.instr.penalti ? (S.emCampo.find(u=>u.id===S.instr.penalti&&!u.fora)||atac) : atac;
        cobrarPenalti(M,S,O,bat); return;
      }
      const pGol = clamp(K.CONV*Math.pow(razao,K.EXP_C)*f.conv*miraDe(atac), .02, .40);
      if(rnd()<pGol){ S.noAlvo++; marcarGol(M,S,O,atac,'jogada'); }
      else{
        const r=rnd();
        if(r<.42){ S.noAlvo++; const g=goleiro(O);
          { const _e=ev(M,'defesa',sig,pick(F_DEF).replace('{A}',nome(atac)).replace('{G}',g?nome(g):'o goleiro'),''); _e.i=atac.idx; _e.q=g?nome(g):''; }
          if(g) g.nota+=.12; }
        else if(r<.52){ const _e=ev(M,'trave',sig,pick(F_TRAVE).replace('{A}',nome(atac)),'big'); _e.i=atac.idx; _e.q=nome(atac); }
        else if(r<.72){
          S.escanteios++;
          const _e=ev(M,'fora',sig,pick(F_FORA).replace('{A}',nome(atac)),''); _e.i=atac.idx; _e.q=nome(atac);
          cobrarEscanteio(M,S,O,sig);
        }
        else { const _e=ev(M,'chance',sig,pick(F_CHANCE).replace('{A}',nome(atac))+' a defesa afasta.',''); _e.i=atac.idx; }
      }
    }
  };
  lado(H,A,fh,fh,pH,aH,fa.def);
  if(!M.pausa) lado(A,H,fa,fa,1-pH,fa.atk,dH);

  if(M.min===45 && M.half===1){
    M.half=1.5;
    ev(M,'apito',null,`Fim do primeiro tempo. ${M.h.clube.sigla} ${M.hg} x ${M.ag} ${M.a.clube.sigla}`,'big');
    // recuperação do intervalo
    [H,A].forEach(S=>S.emCampo.forEach(u=>{if(!u.fora)u.energia=clamp(u.energia+8,0,100);}));
    if(M.liveSide) M.pausa={tipo:'intervalo'};
  }
  if(M.min>=K.DUR && !M.extraSorteado){ M.extraSorteado=true; M.extra=ri(1,5); M.dur=K.DUR+M.extra;
    ev(M,'sys',null,`${M.extra} minutos de acréscimo.`,'sys'); }
  if(M.min>=M.dur){ M.fim=true; finalizar(M); }
}

/* ---------- o escanteio ----------
   Ele: "não vi sair gol de escanteio, seria legal às vezes". Tinha razão: o
   escanteio só contava na estatística e ia embora. No futebol de verdade uns
   2,5% deles viram gol — raro, mas acontece, e quase sempre é zagueirão ou
   centroavante subindo. Aqui vale pouco mais que isso quando o time tem gente
   alta e boa de bola aérea (físico e finalização). */
function cabeceadorDe(S){
  const cands=S.emCampo.filter(u=>!u.fora && u.slot!=='GOL');
  if(!cands.length) return null;
  const peso=u=>{
    const b = u.slot==='ZAG'?3.4 : u.slot==='ATA'?3.0 : u.slot==='VOL'?1.5 : u.slot==='LAT'?0.9 : 1.1;
    const at=u.p.at||{};
    const q = (typeof at.fis==='number') ? (at.fis*0.6 + (at.fin||u.p.ovr)*0.4) : u.p.ovr;
    return b*Math.pow(Math.max(40,q)/70, 2.2);
  };
  const pesos=cands.map(peso); const tot=pesos.reduce((a,b)=>a+b,0);
  let r=rnd()*tot;
  for(let i=0;i<cands.length;i++){ r-=pesos[i]; if(r<=0) return cands[i]; }
  return cands[cands.length-1];
}

function cobrarEscanteio(M,S,O,sig){
  const cab=cabeceadorDe(S); if(!cab) return;
  const at=cab.p.at||{};
  const altura = (typeof at.fis==='number') ? at.fis : cab.p.ovr;
  const gk=goleiro(O);
  const defesaAerea = gk ? ((gk.p.at&&gk.p.at.gol)||gk.p.ovr) : 70;
  const ch = clamp(0.030 * Math.pow(Math.max(40,altura)/72, 1.8) * (72/Math.max(50,defesaAerea)), 0.008, 0.075);
  if(rnd()<ch){ S.noAlvo++; marcarGol(M,S,O,cab,'escanteio'); }
}

/* Súmula compacta: o que a tela de fim de jogo mostra e o que fica guardado
   nos MEUS jogos (escalação com notas, gols, cartões, trocas, números). */
function sumulaDe(M){
  const lado=S=>{
    const j = S.emCampo.map(u=>[u.p.nome, u.slot, Math.round((u.nota||6)*10), u.gols||0, u.assist||0, u.ca||0, u.cv||0, u.entrouMin||0]);
    const sub = (S.subsLog||[]).map(x=>[x.min, x.sai, x.entra, Math.round((x.nota||6)*10), x.slot, x.gols, x.assist, x.ca, x.cv]);
    return {j, sub};
  };
  const min=Math.max(1, M.min);
  const gols=M.eventos.filter(e=>e.t==='gol').map(e=>[e.side, e.q||'', e.min+(e.add||0), e.tipo==='penalti'?'p':e.tipo==='falta'?'f':(e.tipo==='contra'?'c':'')]);
  const cart=M.eventos.filter(e=>e.t==='ca'||e.t==='cv').map(e=>[e.side, e.q||(e.txt||'').replace(/^(Amarelo para |VERMELHO! )/,'').split(/[ .]/).slice(0,2).join(' '), e.min+(e.add||0), e.t==='cv'?'v':'a']);
  return {
    h: lado(M.h), a: lado(M.a),
    st: [Math.round(100*M.h.posse/min), Math.round(100*M.a.posse/min), M.h.chutes||0, M.a.chutes||0,
         M.h.noAlvo||0, M.a.noAlvo||0, M.h.faltas||0, M.a.faltas||0, M.h.escanteios||0, M.a.escanteios||0],
    gols, cart, pub: M.publico||0
  };
}

function golsDe(M){
  return M.eventos.filter(e=>e.t==='gol').map(e=>[e.side, e.q||'', e.min+(e.add||0)]);
}

function finalizar(M){
  ev(M,'apito',null,`FIM DE JOGO. ${M.h.clube.nome} ${M.hg} x ${M.ag} ${M.a.clube.nome}`,'big');
  const res = M.hg>M.ag?1:M.hg===M.ag?0:-1;
  [[M.h,res],[M.a,-res]].forEach(([S,r])=>{
    S.emCampo.concat(S.sairam||[]).forEach(u=>{
      u.nota = clamp(u.nota + r*0.45 + (u.slot==='GOL'? (S===M.h?-M.ag:-M.hg)*0.28 : 0) + (rnd()-.5)*.6, 3, 10);
      u.p.jogos++; u.p.notaSoma += u.nota;
      u.p.energia = clamp((u.energiaInicio!=null?u.energiaInicio:u.p.energia) - (u.gasto||0), 3, 100);
      // só na carreira: na liga online este campo não é usado e é mais um
      // estado que pode chegar diferente em cada celular
      if(M.L && !M.L.online) u.p._slotJogo = (M.L.slot!=null) ? M.L.slot : null;
      u.p.moral = clamp(u.p.moral + r*4 + (u.nota-6)*1.6, 5, 100);
      u.p.forma = clamp(u.p.forma*0.72 + (u.nota*10)*0.28, 20, 99);
    });
    S.banco.forEach(p=>{ p.energia=clamp(p.energia+5,0,100); });
  });
}

function simularTudo(M){
  let guard=0;
  while(!M.fim && guard++<400){
    if(M.pausa){ resolverPausaAuto(M); }
    passoMinuto(M);
  }
  return M;
}

function resolverPausaAuto(M){
  const p=M.pausa; M.pausa=null;
  if(!p) return;
  if(p.tipo==='penalti'){
    const S=p.side==='h'?M.h:M.a, O=p.side==='h'?M.a:M.h;
    const bat=(S.instr&&S.instr.penalti&&S.emCampo.find(u=>u.id===S.instr.penalti&&!u.fora))||escolheAtacante(S);
    cobrarPenalti(M,S,O,bat);
  } else if(p.tipo==='lesao'){
    const S=p.side==='h'?M.h:M.a; const u=S.emCampo.find(x=>x.id===p.uid);
    const e=melhorReserva(S);
    if(u&&e&&S.subs<3) fazerSub(M,S,u,e); else if(u) u.fora=true;
  }
}

function avisoContratos(L){
  if(!L || L.modo==='amigos' || !L.meuClube) return;
  const fim = (typeof fimSlot==='function') ? fimSlot(L) : SLOTS_TOTAL;
  const marcos = [fim-14, fim-6];
  if(marcos.indexOf(L.slot)<0) return;
  const el=(L.squads[L.meuClube]||[]).filter(p=>p.contrato<=1).sort((a,b)=>b.ovr-a.ovr);
  if(!el.length) return;
  L.noticias = L.noticias.filter(n=>!n.contratos);
  L.noticias.unshift({t:'bad', contratos:true,
    txt:`${el.length===1?'Fim de contrato':'Fins de contrato'}: ${el.slice(0,4).map(p=>p.nome+' ('+p.ovr+')').join(', ')}${el.length>4?` e mais ${el.length-4}`:''} — sem renovação, saem de graça na virada.`});
}

/* Recuperação semanal: quanto mais cansado, mais o corpo repõe.
   Quem joga os 90 minutos toda rodada estabiliza perto de 78% — dá pra segurar,
   mas rodar o elenco rende. Quem fica de fora uma rodada volta zerado. */
/* Energia entre jogos (no espírito do Brasfoot): um jogo inteiro custa uns 24
   pontos para um jogador no auge; laterais, volantes e pontas gastam mais,
   zagueiros menos, goleiros quase nada; a partir dos 30 o custo sobe e a
   recuperação cai. Um titular no auge aguenta 4-5 jogos seguidos com energia
   decente jogando uma vez por semana; com dois jogos na semana precisa de rodízio. */
const CUSTO_JOGO = 22;
const CUSTO_POS = {GOL:.35, ZAG:.85, LAT:1.15, VOL:1.10, MEI:1.05, PON:1.10, ATA:.95};
/* O veterano cansa mais, mas 1,5x era punição demais: um lateral de 35 anos
   gastava 38 pontos num jogo só e nunca mais se recuperava. */
function fatorIdade(idade){
  if(idade>=35) return 1.30;
  if(idade>=33) return 1.18;
  if(idade>=30) return 1.08;
  if(idade<=23) return .88;
  return 1;
}
function fatorDesgaste(p, slot){
  return (CUSTO_POS[slot||p.pos]||1) * fatorIdade(p.idade);
}
/* Uma semana de descanso tem que devolver mais ou menos o que um jogo custa,
   senão o titular que joga toda rodada vai afundando: estava estabilizando em
   75% no começo do jogo e 55% no fim, o que obriga rodízio o tempo todo.
   Com isto ele estabiliza perto de 90% e ainda acaba o jogo acima de 70% —
   mas quem joga DUAS vezes na semana continua sentindo, que é a graça. */
function recuperaSemana(p, treino){
  const falta = 100 - clamp(p.energia,0,100);
  let base = 13 + 0.40*falta;
  if(treino==='fisico') base *= 1.20;
  else if(treino==='finalizacao') base *= 0.85;
  if(p.idade>=33) base *= 0.86;
  else if(p.idade>=30) base *= 0.94;
  else if(p.idade<=23) base *= 1.10;
  return Math.round(base*(0.90+rnd()*0.20));
}

function tacticsPadrao(){
  return {formacao:'4-4-2', mentalidade:'equilibrado', pressao:'media', estilo:'lados',
          titulares:[], banco:[], auto:true, rodizio:true, instr:instrPadrao()};
}

function garanteTactics(L, clubId){
  let c = L.clubs.find(x=>x.id===clubId);
  if(!c){ c = (typeof clube==='function') ? clube(clubId) : null; }
  if(!c) return tacticsPadrao();
  if(!L.squads[clubId] || !L.squads[clubId].length){
    if(typeof garanteElenco==='function') garanteElenco(L, clubId);
  }
  if(!L.squads[clubId] || !L.squads[clubId].length) return tacticsPadrao();
  if(!c.tactics) c.tactics = tacticsPadrao();
  const t = c.tactics;
  if(!t.instr) t.instr = instrPadrao();
  /* O rodízio vinha ligado para todo mundo e trocava os onze por desgaste sem
     avisar: o Rafael escalava e entrava outro time. Rodízio é coisa de técnico
     da máquina — quem tem gente no comando escala e os onze dele jogam, até ele
     dizer o contrário no botão. L.managers é igual em todos os aparelhos da
     liga, então isto não desencontra ninguém. */
  const temTecnico = !!(L.managers && L.managers[clubId]);
  if(temTecnico && !t.rodizioEscolhido) t.rodizio = false;
  const elenco = L.squads[clubId];
  const limite = t.rodizio===false ? 0 : (t.auto ? 62 : 46);
  const ok = t.titulares && t.titulares.length===11 &&
             t.titulares.every(id=>{const p=elenco.find(x=>x.id===id);return p && p.lesao<=0;}) &&
             !(limite && t.titulares.some(id=>{const p=elenco.find(x=>x.id===id);return p && p.energia<limite;}));
  if(!ok){ const e=escalarAuto(elenco,t.formacao); t.titulares=e.titulares; t.banco=e.banco; }
  else {
    t.banco = (t.banco||[]).filter(id=>{const p=elenco.find(x=>x.id===id);return p&&p.lesao<=0&&!t.titulares.includes(id);});
    if(t.banco.length<5){
      const extra = elenco.filter(p=>p.lesao<=0&&!t.titulares.includes(p.id)&&!t.banco.includes(p.id))
        .sort((a,b)=>b.ovr-a.ovr).slice(0,7-t.banco.length).map(p=>p.id);
      t.banco = t.banco.concat(extra);
    }
  }
  return t;
}

function porNoSlot(i,pid){
  const t=garanteTactics(L,L.meuClube);
  const j=t.titulares.indexOf(pid);
  if(j>=0){ const tmp=t.titulares[i]; t.titulares[i]=pid; t.titulares[j]=tmp; }
  else { const sai=t.titulares[i]; t.titulares[i]=pid;
    t.banco=t.banco.filter(x=>x!==pid); if(sai) t.banco.unshift(sai); }
  t.auto=false;
  fecharSheet();salvar();render();
}

function alternarRodizio(){
  const t=garanteTactics(L,L.meuClube);
  t.rodizio = t.rodizio===false ? true : false;
  t.rodizioEscolhido = true;          // escolha dele manda; o padrão não volta
  if(t.rodizio) t.auto=true;
  salvar(); render();
  toast(t.rodizio?'Rodízio ligado: quem estiver morto fica no banco.':'Rodízio desligado: os onze escolhidos jogam sempre.');
}

function botaoRodizio(){
  if(!L || !L.meuClube) return;
  const t=garanteTactics(L,L.meuClube);
  const el=(L.squads[L.meuClube]||[]);
  const cansados=t.titulares.filter(id=>{const p=el.find(x=>x.id===id);return p&&p.energia<60;}).length;
  const wrap=document.createElement('div');
  wrap.innerHTML=`<button class="card flat between" style="width:100%;text-align:left" onclick="alternarRodizio()">
    <span><span class="eyebrow">Rodízio automático</span>
      <span class="xs mut" style="display:block">${t.rodizio===false
        ? 'Desligado — os onze escolhidos jogam sempre'
        : 'Ligado — quem está morto fica no banco'}${cansados?` · ${cansados} desgastado${cansados>1?'s':''}`:''}</span></span>
    <span class="pill ${t.rodizio===false?'r':'g'}">${t.rodizio===false?'Off':'On'}</span></button>`;
  $('scr-tactics').appendChild(wrap.firstChild);
}/* ===== 03-temporada ===== */
'use strict';

function simularOutrosJogos(){
  const jogos=L.fixtures[L.rodada-1]||[];
  jogos.forEach(g=>{
    const chave=`r${L.rodada}_${g.h}_${g.a}`;
    if(L.resultados[chave]) return;
    const P=criarPartida(L,g.h,g.a,null);
    simularTudo(P);
    L.resultados[chave]={hg:P.hg,ag:P.ag,publico:P.publico,
      eventos:P.eventos.filter(e=>e.t==='gol').map(e=>({m:e.min,a:e.add,t:e.t,s:e.side,x:e.txt,c:e.cls}))};
  });
}

function simularRodadaSolo(pular){
  const g=proximoJogo();
  if(g){ R.r=Math.random; const P=criarPartida(L,g.h,g.a,null); simularTudo(P);
    L.resultados[`r${L.rodada}_${g.h}_${g.a}`]={hg:P.hg,ag:P.ag,publico:P.publico,eventos:compactar(P.eventos)};
    const meu=g.h===L.meuClube?P.hg:P.ag, dele=g.h===L.meuClube?P.ag:P.hg;
    toast(`${clube(g.h).sigla} ${P.hg} x ${P.ag} ${clube(g.a).sigla} — ${meu>dele?'vitória':meu===dele?'empate':'derrota'}`);
  }
  simularOutrosJogos();
  avancarRodada();
  render();
}

function avancarRodada(){
  const r=L.rodada;
  // finanças
  L.clubs.forEach(c=>{
    const el=elenco(c.id);
    const folha=el.reduce((s,p)=>s+p.salario,0);
    c.caixa -= Math.round(folha/4.3);
    c.caixa += Math.round(180000 + c.rep*140000);            // patrocínio/TV por rodada
    const jogo=(L.fixtures[r-1]||[]).find(g=>g.h===c.id);
    if(jogo){ const res=L.resultados[`r${r}_${jogo.h}_${jogo.a}`];
      const pub=res&&res.publico?res.publico:Math.round(c.estadio*.45);
      c.caixa += Math.round(pub*(18+c.rep*6)); }
  });
  // recuperação, treino, lesões, moral
  L.clubs.forEach(c=>{
    const meu = c.id===L.meuClube;
    const treino = meu?L.treino:'equilibrado';
    elenco(c.id).forEach(p=>{
      let rec = treino==='fisico'?ri(26,38):treino==='finalizacao'?ri(14,24):ri(19,30);
      p.energia=clamp(p.energia+rec,0,100);
      if(p.lesao>0) p.lesao=Math.max(0,p.lesao-1);
      // evolução
      const jovem=p.idade<=23, velho=p.idade>=32;
      let ganho=0;
      if(p.ovr<p.pot){
        ganho = (jovem?0.10:0.045) * (treino==='tatico'?1.25:treino==='finalizacao'&&['ATA','PON','MEI'].includes(p.pos)?1.4:1);
        if(p.jogos>0) ganho*=1.25;
      }
      if(velho) ganho -= 0.055*(p.idade-31);
      const tetoP = (typeof tetoDeForca==='function') ? tetoDeForca(p) : 92;
      p.ovrF = Math.min((p.ovrF||p.ovr) + ganho, tetoP + 0.49);
      p.ovr = clamp(Math.round(p.ovrF), 36, tetoP);
      p.valor = Math.round(Math.pow(p.ovr/10,3.4)*(p.idade<27?1.25:p.idade<31?.9:.5)*1000)*100;
      if(p.jogos===0) p.moral=clamp(p.moral-1.1,5,100);
    });
  });
  // mercado da IA + propostas pelos meus listados
  if(r%3===0) mercadoIA();
  propostasPorMeus();
  // notícias
  const tb=tabela(L);
  if(r%4===0){ const lider=clube(tb[0].id);
    L.noticias.unshift({t:'', txt:`${lider.nome} lidera com ${tb[0].p} pontos após ${tb[0].j} jogos.`}); }
  const art=artilharia(L)[0];
  if(art && r%5===0) L.noticias.unshift({t:'led', txt:`${art.nome} (${clube(art.clubId).sigla}) é o artilheiro com ${art.gols} gols.`});
  L.noticias=L.noticias.slice(0,14);
  // diretoria
  avaliarDiretoria();
  L.rodada++;
  rodadaVista=null;
  if(L.rodada>L.fixtures.length) fecharTemporada();
  salvar(true);
}

function avaliarDiretoria(){
  if(!L.diretoria||L.modo==='amigos') return;
  const tb=tabela(L), pos=tb.findIndex(x=>x.id===L.meuClube)+1;
  const meta=L.diretoria.meta;
  if(L.rodada<8) return;
  const taca4 = (typeof pesoDasTacas==='function') ? pesoDasTacas([L.temporada]) : 0;
  const alivio4 = taca4>=3 ? 0 : taca4>=2 ? 0.35 : taca4>=1 ? 0.6 : 1;
  if(pos>meta+4){ L.diretoria.paciencia-=6*alivio4; }
  else if(pos>meta){ L.diretoria.paciencia-=2*alivio4; }
  else { L.diretoria.paciencia=clamp(L.diretoria.paciencia+3,0,100); }
  if(L.diretoria.paciencia<40 && L.diretoria.avisos===0){
    L.diretoria.avisos=1;
    L.noticias.unshift({t:'bad',txt:`A diretoria do ${meuClube().nome} soltou nota de "confiança no trabalho". Você conhece o significado disso.`});
  }
  if(L.diretoria.paciencia<=0) demitido();
}

function fecharTemporada(){
  const tb=tabela(L);
  const campeao=clube(tb[0].id);
  L.historico.unshift({ano:L.temporada, campeao:campeao.nome,
    minhaPos:tb.findIndex(x=>x.id===L.meuClube)+1, pts:tb.find(x=>x.id===L.meuClube).p});
  // premiação
  tb.forEach((x,i)=>{ const c=clube(x.id);
    c.caixa += Math.round((L.size-i)*820000 + (i===0?9000000:0)); });
  L.temporadaFim=true;
  L.noticias.unshift({t:'led',txt:`${campeao.nome} é campeão de ${L.temporada}.`});
}

function parseElenco(txt, seedBase){
  const out=[];
  txt.split(';').forEach((linha,i)=>{
    const p=linha.trim(); if(!p) return;
    const [nome,pos,idade,ovr]=p.split('|');
    if(!nome||!pos) return;
    const o=parseInt(ovr,10), id=parseInt(idade,10);
    out.push(novoJogadorReal(seedBase+'-'+i, nome.trim(), pos.trim(), id, o));
  });
  return out;
}


/* ---------- finanças (escala ≈ metade dos valores reais do futebol brasileiro) ---------- */
const FIN = {
  TV:    [0, 30, 45, 65, 95, 165],      // R$ mi/ano por tamanho de torcida (1..5): cota de TV
  PATRO: [0, 15, 30, 55, 110, 290],     // patrocínio + marketing + sócio-torcedor
  ESTRUTURA: 0.40,                      // fatia da receita fixa que vai em estrutura (CT, funcionários, estádio)
  TETO: 0.52,                           // folha anual sustentável = 52% da receita fixa
  CAIXA0: 0.25,                         // caixa inicial = 1/4 da receita fixa anual
  ESTOURO: 0.30                         // multa semanal sobre o que passa do teto
};

function torcidaDe(c){ return clamp(Math.round((c&&c.torcida)||1),1,5); }

function receitaFixaAnual(c){
  const t=torcidaDe(c);
  const divB = (typeof divisaoDe==='function') && divisaoDe(c.id)==='B';
  return (FIN.TV[t]+FIN.PATRO[t])*1e6*(divB?0.42:1);
}

function tetoFolhaDe(c){ return Math.round(receitaFixaAnual(c)*FIN.TETO/12/1000)*1000; }

function caixaInicial(c){ return Math.round(receitaFixaAnual(c)*FIN.CAIXA0/1e5)*1e5; }

function ingressoMedio(c, compId){ return 22 + torcidaDe(c)*5 + (compId==='continental'?10:compId==='copa'?4:0); }

function premioPosicao(pos){ return pos>=1 && pos<=16 ? Math.round((24-(pos-1)*1.2)*1e6) : 0; }

function extratoSemanal(c, jogosCasa){
  const fixa=receitaFixaAnual(c)/52;
  const estrutura=fixa*FIN.ESTRUTURA;
  const folha=folhaDe(c.id)/4.33;
  const teto=(c.tetoFolha||tetoFolhaDe(c))/4.33;
  const estouro = folha>teto ? (folha-teto)*FIN.ESTOURO : 0;
  let bilheteria=0;
  (jogosCasa||[]).forEach(g=>{ if(g&&g.publico) bilheteria += g.publico*ingressoMedio(c, g.compId); });
  const total = fixa + bilheteria - estrutura - folha - estouro;
  return {tv:FIN.TV[torcidaDe(c)]*1e6/52, patro:FIN.PATRO[torcidaDe(c)]*1e6/52, bilheteria, estrutura, folha, estouro, total};
}

function semanaFinanceira(c, jogosCasa){
  const e=extratoSemanal(c, jogosCasa);
  c.caixa += Math.round(e.total);
  c.ultimoExtrato = {tv:e.tv, patro:e.patro, bilheteria:e.bilheteria, estrutura:e.estrutura, folha:e.folha, estouro:e.estouro, total:e.total};
  return e;
}

// Na criação da liga: salários e caixa de cada clube passam a caber na receita dele.
// O mesmo jogador ganha mais no Flamengo do que no Mirassol — como na vida real.
function ajustarFinancasIniciais(L){
  L.clubs.forEach(c=>{
    if(typeof ehEuropeu==='function' && ehEuropeu(c.id)) return;
    const el=L.squads[c.id]||[]; if(!el.length) return;
    const divB = (typeof divisaoDe==='function') && divisaoDe(c.id, L)==='B';
    const teto=Math.round(tetoFolhaDe(c)*(divB?0.45:1));
    const folha=el.reduce((s,p)=>s+p.salario,0);
    const esc=clamp(teto*0.95/Math.max(1,folha), 0.30, 1.25);
    c.escSal=Math.round(esc*100)/100; c.tetoFolha=teto;
    el.forEach(p=>{ p.salario=Math.max(30000, Math.round(p.salario*esc/1000)*1000); });
    c.caixa=caixaInicial(c);
  });
}

/* Já na primeira temporada tem que existir gente sem clube — no futebol de
   verdade sempre tem. Elenco inflado (33+) solta os dois piores mais velhos;
   o top-11 não muda, então a calibração pela tabela fica de pé. Sem rnd():
   isso roda em todos os aparelhos da liga online e tem que dar igual. */
function semearLivres(L){
  if(!Array.isArray(L.livres)) L.livres=[];
  if(L._semeou) return;
  L._semeou = 1;
  Object.keys(L.squads).sort().forEach(cid=>{
    const el = L.squads[cid]; if(!el || el.length<33) return;
    if(typeof ehBrasileiro==='function' && !ehBrasileiro(cid)) return;
    const c = (typeof CLUBE_POR_ID!=='undefined') ? CLUBE_POR_ID[cid] : null;
    const corte = ((c&&c.niv)||66) - 5;
    const fora = el.slice()
      .filter(p=>p.idade>=25 && p.ovr<=corte && p.pos!=='GOL')
      .sort((a,b)=> (a.ovr - b.ovr) || (b.idade - a.idade) || (a.id<b.id?-1:1))
      .slice(0, Math.min(2, el.length-31));
    if(!fora.length) return;
    const ids = fora.map(p=>p.id);
    fora.forEach(p=>{ p.contrato=0; p.semClube=0; p.deQuemSaiu=cid; p.aVenda=false; L.livres.push(p); });
    L.squads[cid] = el.filter(p=>ids.indexOf(p.id)<0);
  });
}

function prepararElencosIniciais(L){
  if(typeof calibrarPelaTabela==='function') calibrarPelaTabela(L);   // sempre antes da 1ª rodada (determinismo)
  semearLivres(L);
  if(typeof marcarEstrelas==='function') marcarEstrelas(L);
  if(typeof ajustarEstrelas==='function') ajustarEstrelas(L);
  if(typeof garanteAtributosDe==='function') garanteAtributosDe(L);   // qualidades de cada jogador
  ajustarFinancasIniciais(L);
}

function jogosEmCasaDoSlot(L, cid, slot){

function valorDeMercado(ovr, idade){
  // escala EA FC: 70 ≈ R$ 6 mi, 80 ≈ R$ 55 mi, 85 ≈ R$ 130 mi
  const base = Math.pow(1.19, ovr-58) * 900000;
  const f = idade<=21?1.35 : idade<=25?1.25 : idade<=28?1.0 : idade<=31?0.72 : idade<=34?0.42 : 0.20;
  return Math.max(300000, Math.round(base*f/100000)*100000);
}

function salarioDe(ovr, idade){
  const v = valorDeMercado(ovr, idade);
  return Math.max(60000, Math.round(v*0.040/1000)*1000);
}

function novoJogadorReal(seed, nome, pos, idade, ovr){
  const r = rng('j'+seed);
  const pot = idade<=19 ? clamp(ovr+Math.round(r()*13)+7, ovr, 91)
            : idade<=21 ? clamp(ovr+Math.round(r()*11)+5, ovr, 91)
            : idade<=24 ? clamp(ovr+Math.round(r()*8)+2, ovr, 90)
            : idade<=27 ? clamp(ovr+Math.round(r()*4), ovr, 89) : ovr;
  return {
    id:'p'+(_pid++), nome, pos, idade, ovr, pot, ovrF:ovr,
    forma: 50+Math.round(r()*22), moral: 58+Math.round(r()*24), energia: 100,
    salario: salarioDe(ovr,idade), valor: valorDeMercado(ovr,idade),
    contrato: 2+Math.floor(r()*4),
    gols:0, assist:0, jogos:0, ca:0, cv:0, notaSoma:0, lesao:0, aVenda:false
  };
}

function garanteElenco(L, clubId){
  const c = CLUBE_POR_ID[clubId];
  if(c && !L.clubs.find(x=>x.id===clubId)) L.clubs.push(clubeJogo(c, L));
  if(L.squads[clubId] && L.squads[clubId].length) return L.squads[clubId];
  if(!c){ // clube desconhecido: cria um genérico para não travar a competição
    if(!L.clubs.find(x=>x.id===clubId))
      L.clubs.push({id:clubId,nome:clubId.toUpperCase(),sigla:clubId.slice(0,3).toUpperCase(),cidade:'',uf:'',
        cor:'#5A5A5A',cor2:'#FFFFFF',rep:2,niv:62,estadio:10000,torcida:1,caixa:3000000,tactics:null,titulos:[]});
    L.squads[clubId] = elencoGerado(clubId, 62, L.seed);
    return L.squads[clubId];
  }
  const real = ELENCOS_REAIS[clubId] || (typeof ELENCOS_EUROPA!=='undefined' ? ELENCOS_EUROPA[clubId] : null);
  L.squads[clubId] = real ? parseElenco(real, L.seed+'-'+clubId) : elencoGerado(clubId, c.niv, L.seed);
  return L.squads[clubId];
}

function clubeJogo(c, L){
  return {id:c.id, nome:c.n, sigla:c.s, cidade:c.c, uf:c.uf, cor:c.cor, cor2:c.cor2,
    rep: Math.max(1,Math.min(5,Math.round((c.niv-58)/5))), niv:c.niv,
    estadio:c.est, torcida:c.tor||1,
    caixa: Math.round(Math.pow(1.22, c.niv-58)*2400000 + 6000000),
    tactics:null, titulos:[]};
}

function roundRobin(ids, turnos){
  const t=ids.slice(); if(t.length%2) t.push(null);
  const n=t.length, base=[];
  let arr=t.slice();
  for(let r=0;r<n-1;r++){
    const jogos=[];
    for(let i=0;i<n/2;i++){
      const a=arr[i], b=arr[n-1-i];
      if(a===null||b===null) continue;
      jogos.push(r%2===0?{h:a,a:b}:{h:b,a:a});
    }
    base.push(jogos);
    arr=[arr[0]].concat([arr[n-1]],arr.slice(1,n-1));
  }
  let out=base;
  if(turnos===2) out=base.concat(base.map(j=>j.map(g=>({h:g.a,a:g.h}))));
  return out;
}

function cruzado(ids, seed){
  const r=rng(seed); const emb=ids.slice();
  for(let i=emb.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[emb[i],emb[j]]=[emb[j],emb[i]];}
  const meio=Math.ceil(emb.length/2);
  const A=emb.slice(0,meio), B=emb.slice(meio);
  const rodadas=[];
  for(let k=0;k<B.length;k++){
    const jogos=[];
    for(let i=0;i<A.length;i++){
      const b=B[(i+k)%B.length];
      if(!b) continue;
      jogos.push((i+k)%2===0?{h:A[i],a:b}:{h:b,a:A[i]});
    }
    rodadas.push(jogos);
  }
  return {rodadas, grupos:{A,B}};
}
