const CAMPO_W=100, CAMPO_H=64;

let BOLA_TIMERS=[], LANCE_ATIVO=null, FEED_TUDO=false;

let EST={ataque:null, fase:'normal', foco:null, gol:null, t:0};

function posCampo(S, idx){ return posBase(S, idx); }

// o gol que o time ATACA
function golDe(S){ return S.casa ? {x:CAMPO_W-1.6, y:CAMPO_H/2} : {x:1.6, y:CAMPO_H/2}; }
// o gol que o time DEFENDE — é o outro. Confundir os dois mandava o goleiro
// para o lado errado do campo no meio do chute.
function golProprio(S){ return S.casa ? {x:1.6, y:CAMPO_H/2} : {x:CAMPO_W-1.6, y:CAMPO_H/2}; }

function ladoDe(S){ return (M&&S===M.h)?'h':'a'; }

function posGoleiro(S){ const u=S.emCampo.find(x=>!x.fora&&x.slot==='GOL'); return u?posBase(S,u.idx):golProprio(S); }

const PESO_LINHA={GOL:0.10, ZAG:0.55, LAT:0.82, VOL:0.95, MEI:1.10, PON:1.20, ATA:1.28};

function posViva(S, u){
  if(EST.layout){ const p=EST.layout[ladoDe(S)+'-'+u.idx]; if(p) return p; }
  return posCrua(S,u);
}

function acharMarcador(){
  if(!EST.foco || !M){ EST.marca=null; EST.marca2=null; return; }
  const S = EST.foco.side==='h'?M.h:M.a;
  const O = EST.foco.side==='h'?M.a:M.h;
  // marca onde o jogador realmente está: se ele foi buscar a bola, é lá que se marca
  const p = (EST.recebe && EST.recebe.side===EST.foco.side && EST.recebe.idx===EST.foco.idx)
    ? {x:EST.recebe.x, y:EST.recebe.y} : posBase(S, EST.foco.idx);
  const ord = O.emCampo.filter(u=>!u.fora && u.slot!=='GOL')
    .map(u=>{ const q=posBase(O,u.idx); return {idx:u.idx, d:(q.x-p.x)**2+(q.y-p.y)**2}; })
    .sort((a,b)=>a.d-b.d);
  EST.marca = ord[0] ? ord[0].idx : null;     // quem vai na bola
  EST.marca2 = ord[1] ? ord[1].idx : null;    // quem dá cobertura
}

function moverBotoes(){
  if(!M || !$('campo-svg')) return;
  acharMarcador(); layoutCampo();
  [M.h, M.a].forEach(S=>{
    const lado=ladoDe(S);
    S.emCampo.forEach(u=>{
      if(u.fora) return;
      const el=$('bot-'+lado+'-'+u.idx); if(!el) return;
      const p=posViva(S,u);
      el.style.transform=`translate(${p.x.toFixed(2)}px,${p.y.toFixed(2)}px)`;
      const comPosse=!!(EST.foco && EST.foco.side===lado && EST.foco.idx===u.idx);
      const pressiona=!!(EST.foco && EST.foco.side!==lado && (EST.marca===u.idx || EST.marca2===u.idx));
      el.classList.toggle('com-posse',comPosse);
      el.classList.toggle('pressao',!comPosse && pressiona);
    });
  });
}

function estado(novo, dur){
  Object.assign(EST, novo);
  EST.t += 1; EST.layout=null;
  const svg=$('campo-svg');
  if(svg) svg.style.setProperty('--tmov', ((dur||520)/1000).toFixed(2)+'s');
  moverBotoes();
}

// Nome curto para o campo: "Lucas Moura" fica inteiro, "Jonathan Calleri" vira "Calleri",
// "André Silva" vira "André" (sobrenome comum demais não identifica ninguém).
const SOBRENOMES_COMUNS=['silva','santos','souza','sousa','oliveira','pereira','lima','costa','alves','rodrigues','ferreira','gomes',
  'martins','ribeiro','carvalho','araujo','araújo','nascimento','junior','júnior','filho','neto','jr.','jr'];
/* max = quantas letras cabem no lugar onde o nome vai. No campo da tática cabem
   menos do que na súmula, e era por isso que apareciam "Lucas M...",
   "Pablo M..." e "Ferreirin..." — o nome vinha inteiro e o CSS cortava. */
function nomeCampo(p, max){
  const lim = max || 11;
  const n=String(p.nome||'').trim();
  const partes=n.split(/\s+/).filter(x=>!/^(de|da|do|dos|das|e)$/i.test(x));
  if(partes.length<=1) return n;                   // nome único: a fonte que se ajuste
  if(n.length<=lim) return n;                      // cabe inteiro
  const ult=partes[partes.length-1], primeiro=partes[0];
  let out = SOBRENOMES_COMUNS.includes(ult.toLowerCase()) ? primeiro : ult;
  if(out.length<4 && primeiro!==out) out = primeiro;
  // ainda grande: tenta a outra parte antes de cortar com ponto
  if(out.length>lim){ const alt = out===ult?primeiro:ult; if(alt && alt.length<=lim) out=alt; }
  return out;
}

function discosHTML(M){ return discosLado(M.h)+discosLado(M.a); }

function _rgb(h){h=String(h||'#000').replace('#','');
  if(h.length===3)h=h.split('').map(x=>x+x).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}

function _dist(x,y){const a=_rgb(x),b=_rgb(y);
  return Math.sqrt((a[0]-b[0])**2*0.9+(a[1]-b[1])**2*1.2+(a[2]-b[2])**2*0.7);}

function _escurece(h,f){const c=_rgb(h);
  return '#'+c.map(v=>('0'+Math.round(clamp(v*f,0,255)).toString(16)).slice(-2)).join('');}

function coresDoJogo(){
  if(M && M._cores) return M._cores;
  const BOLA='#FFFFFF';
  const H=corBotao(M.h.clube);
  let A=corBotao(M.a.clube);
  const okAway=(cand)=> _dist(H.a,cand)>=120 && _dist(BOLA,cand)>=150;
  if(!okAway(A.a)){
    // 1) segundo uniforme do visitante
    const alt=corBotao({cor:M.a.clube.cor2, cor2:M.a.clube.cor});
    if(okAway(alt.a)) A={a:alt.a, b:(_rgb(alt.a).reduce((s,v)=>s+v,0)/765)<0.45?'#FFFFFF':'#12181D'};
    else {
      // 2) terceiro uniforme: o mais distante da casa e da bola
      const banco=['#101A22','#1E63A8','#D98B12','#7B3FA8','#0F6B4B','#B0322A'];
      let melhor=banco[0], d0=-1;
      banco.forEach(c=>{ const d=Math.min(_dist(H.a,c), _dist(BOLA,c)*0.7);
        if(d>d0){ d0=d; melhor=c; } });
      A={a:melhor, b:'#FFFFFF'};
    }
  }
  const res={h:H, a:A};
  if(M) M._cores=res;
  return res;
}

function corBotao(c){
  const lum=h=>{h=String(h||'#000').replace('#','');
    if(h.length===3)h=h.split('').map(x=>x+x).join('');
    return (parseInt(h.slice(0,2),16)*0.299+parseInt(h.slice(2,4),16)*0.587+parseInt(h.slice(4,6),16)*0.114)/255;};
  let a=c.cor||'#0B6B45', b=c.cor2||'#FFFFFF';
  if(lum(a)>0.72){ const t=a; a=b; b=t; }
  if(lum(a)>0.72){ a='#31404A'; }
  return {a, b};
}

/* Mistura duas cores. Torcida de longe é cor lavada: o vermelho puro do
   escudo numa faixa de 38px vira uma tira de néon em volta do campo. */
function misturaCor(a, b, t){
  const p=h=>{h=String(h||'#000').replace('#','');
    if(h.length===3)h=h.split('').map(x=>x+x).join('');
    return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
  const A=p(a), B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');
}

/* ---------- a arquibancada em volta do campo ----------
   Ideia dele: "e se em volta do campo tivesse arquibancada? aí fica cheia ou
   vazia de acordo com o público". Sem encolher o campo: a viewBox cresce para
   fora, o campo continua com as mesmas coordenadas (0..100 x 0..64) e os
   jogadores não mudam de lugar. No computador sobra altura, então a faixa é
   mais funda; no celular ela é fina, para o campo não perder tamanho.
   A lotação vem do público do jogo, e a cor é a do mandante. */
function fundoArq(){
  try{ return window.matchMedia('(min-width:1000px)').matches ? 7.5 : 3.6; }catch(e){ return 3.6; }
}

function arquibancadaSVG(M, arq, arqX){
  if(!arq) return '';
  const cH = M.h.clube || {}, cA = M.a.clube || {};
  const bH = (typeof corBotao==='function') ? corBotao(cH) : {a:(cH.cor||'#7a1f2b'), b:'#fff'};
  const bA = (typeof corBotao==='function') ? corBotao(cA) : {a:(cA.cor||'#1f3a7a'), b:'#fff'};
  // lavadas contra o cinza da sombra: é assim que torcida aparece de longe
  const lava = k => ({a: misturaCor(k.a, '#2C3A42', 0.42), b: misturaCor(k.b, '#2C3A42', 0.50)});
  const kH = lava(bH), kA = lava(bA);
  const lot = clamp((M.publico||0) / Math.max(1, cH.estadio||40000), 0.10, 1);

  /* A arquibancada tem 7 unidades de profundidade contra 100 de campo: ali não
     cabe estádio, cabe uma BORDA que pareça estádio. Três tentativas ensinaram
     o resto:
     1) um lugar por <rect>: 1.100 nós, o celular travava;
     2) blocos de 3,4 unidades em quatro <path>: virou xadrez de peças de Lego;
     3) ladrilho de cadeirinhas: qualquer desenho DENTRO do ladrilho, repetido
        160 vezes numa faixa de 38px, vira motivo — saiu papel de parede.
     A saída é um padrão de UMA dimensão: fileiras. Linha contínua repetida não
     forma motivo nenhum, e é assim que arquibancada cheia aparece de longe na
     TV — faixas horizontais, não pontinhos. As fileiras acompanham a borda:
     deitadas em cima e embaixo, em pé atrás dos gols. */
  const x0 = -arqX, y0 = -arq, W = CAMPO_W + arqX*2, H = CAMPO_H + arq*2;
  const Tf = Math.max(0.62, arq*0.112);        // altura de um grupo de fileiras

  function fileiras(id, k, vertical){
    const l = [[0.00,0.16,k.a,0.82],[0.20,0.14,k.a,0.52],[0.38,0.10,k.b,0.30],
               [0.52,0.16,k.a,0.68],[0.72,0.12,k.a,0.42]];
    const s = l.map(([o,h,c,op])=>{
      const a=(o*Tf).toFixed(3), e=(h*Tf).toFixed(3), t=Tf.toFixed(3);
      return vertical ? `<rect x="${a}" y="0" width="${e}" height="${t}" fill="${c}" opacity="${op}"/>`
                      : `<rect x="0" y="${a}" width="${t}" height="${e}" fill="${c}" opacity="${op}"/>`;
    }).join('');
    return `<pattern id="${id}" width="${Tf.toFixed(3)}" height="${Tf.toFixed(3)}"
      patternUnits="userSpaceOnUse"><rect width="${Tf.toFixed(3)}" height="${Tf.toFixed(3)}" fill="#162026"/>${s}</pattern>`;
  }

  const cx=(x,y,w,h,f,op)=> (w>0&&h>0)
    ? `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}" fill="${f}"${op?` opacity="${op}"`:''}/>`
    : '';
  /* Um anel de 'a' (fora) a 'b' (campo), em fração da profundidade. Os cantos
     ficam com as faixas de cima e de baixo: nada se sobrepõe. */
  function anel(a, b, f, op, fV){
    const px=a*arqX, qx=b*arqX, py=a*arq, qy=b*arq;
    const v = fV||f;
    return cx(x0+px, y0+py, W-px*2, qy-py, f, op)
         + cx(x0+px, y0+H-qy, W-px*2, qy-py, f, op)
         + cx(x0+px, y0+qy, qx-px, H-qy*2, v, op)
         + cx(x0+W-qx, y0+qy, qx-px, H-qy*2, v, op);
  }

  /* Escadas de acesso: um <path> só, fatias escuras cortando a torcida de fora
     a dentro. Sem elas a faixa não tem escala — podia ter 5 metros ou 50. */
  const escadas = (()=>{ let d='';
    const g = Math.max(0.45, arq*0.09);
    const corta=(de,ate,passo,vert,fixo,prof)=>{
      for(let v=de; v<ate; v+=passo)
        d += vert ? `M${v.toFixed(2)} ${fixo.toFixed(2)}h${g.toFixed(2)}v${prof.toFixed(2)}h-${g.toFixed(2)}z`
                  : `M${fixo.toFixed(2)} ${v.toFixed(2)}h${prof.toFixed(2)}v${g.toFixed(2)}h-${prof.toFixed(2)}z`;
    };
    corta(x0+7, x0+W-7, 12.5, true,  y0+arq*0.04, arq*0.93);
    corta(x0+7, x0+W-7, 12.5, true,  y0+H-arq*0.97, arq*0.93);
    corta(y0+arq+6, y0+H-arq-6, 10.5, false, x0+arqX*0.04,  arqX*0.93);
    corta(y0+arq+6, y0+H-arq-6, 10.5, false, x0+W-arqX*0.97, arqX*0.93);
    return d; })();

  const alt = (H-2*arq)*0.38;                  // setor visitante atrás do gol da direita
  const escuro = (0.10 + (1-lot)*0.60).toFixed(2);

  const teto = (id,x1,y1,x2,y2)=>`<linearGradient id="${id}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">
      <stop offset="0" stop-color="#04080A" stop-opacity=".92"/>
      <stop offset="1" stop-color="#04080A" stop-opacity="0"/></linearGradient>`;

  return `<g id="arq">
    <defs>
      ${fileiras('arq-casa', kH, false)}${fileiras('arq-casaV', kH, true)}
      ${fileiras('arq-visita', kA, true)}
      ${teto('arq-t1',0,0,0,1)}${teto('arq-t2',0,1,0,0)}${teto('arq-t3',0,0,1,0)}${teto('arq-t4',1,0,0,0)}
    </defs>
    <rect x="${x0}" y="${y0}" width="${W}" height="${H}" fill="#121A1F"/>
    ${anel(0.02, 0.97, 'url(#arq-casa)', null, 'url(#arq-casaV)')}
    ${cx(x0+W-0.97*arqX, y0+H/2-alt/2, 0.95*arqX, alt, 'url(#arq-visita)')}
    <path d="${escadas}" fill="#0B1115" opacity=".9"/>
    ${anel(0.47, 0.515, '#0C1317', '.9')}
    ${anel(0.512, 0.528, 'rgba(255,255,255,.09)')}
    <rect class="arq-vazio" x="${x0}" y="${y0}" width="${W}" height="${H}" fill="#050A0D" opacity="${escuro}"/>
    ${cx(x0, y0, W, arq*0.52, 'url(#arq-t1)')}
    ${cx(x0, y0+H-arq*0.52, W, arq*0.52, 'url(#arq-t2)')}
    ${cx(x0, y0, arqX*0.52, H, 'url(#arq-t3)')}
    ${cx(x0+W-arqX*0.52, y0, arqX*0.52, H, 'url(#arq-t4)')}

    <!-- placas de publicidade na beira do gramado: é isto que o olho lê como
         estádio. Antes havia também um anel preto de 1,8 unidade por cima
         delas — 13px de nada entre a torcida e a grama, que é o que fazia o
         campo parecer emoldurado de luto. -->
    ${anel(0.90, 1.0, '#101A20')}
    ${anel(0.915, 0.985, misturaCor(bH.a, '#0E171C', 0.52))}
    <rect x="-0.35" y="-0.35" width="${CAMPO_W+0.7}" height="${CAMPO_H+0.7}"
          fill="none" stroke="rgba(0,0,0,.55)" stroke-width=".7"/>
  </g>`;
}

function campoSVG(M){
  const linha='rgba(255,255,255,.30)';
  const arq = fundoArq();
  const arqX = arq*0.92;                      // atrás do gol a arquibancada é quase igual
  const sig=(c,x,anc)=>`<text x="${x}" y="${CAMPO_H/2}" fill="rgba(255,255,255,.13)" font-size="13"
    font-family="Barlow Condensed,sans-serif" font-weight="700" text-anchor="middle"
    transform="rotate(${anc},${x},${CAMPO_H/2})">${esc(c.sigla)}</text>`;
  return `<svg class="campo" id="campo-svg" viewBox="${-arqX} ${-arq} ${CAMPO_W+arqX*2} ${CAMPO_H+arq*2}" aria-hidden="true">

      <linearGradient id="grama" x1="0" y1="0" x2="0" y2="1">

      <radialGradient id="brilho" cx="33%" cy="27%" r="55%">
        <stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="52%" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <radialGradient id="luzcampo" cx="50%" cy="20%">
        <stop offset="0" stop-color="#fff" stop-opacity=".10"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
    </defs>
    <rect x="${-arqX}" y="${-arq}" width="${CAMPO_W+arqX*2}" height="${CAMPO_H+arq*2}" fill="#0A1013"/>
    <g id="campo-camera-layer">
    ${arquibancadaSVG(M, arq, arqX)}
    <rect width="${CAMPO_W}" height="${CAMPO_H}" fill="url(#grama)"/>
    <g opacity=".10" pointer-events="none">${Array.from({length:18},(_,i)=>`<path d="M${i*6.2} 0 V${CAMPO_H}" stroke="#d9f5df" stroke-width=".12"/>`).join('')}</g>
    ${[0,1,2,3,4,5,6,7].map(i=>`<rect x="${i*12.5}" y="0" width="12.5" height="${CAMPO_H}" fill="#fff" opacity="${i%2?0.045:0}"/>`).join('')}
    <rect width="${CAMPO_W}" height="${CAMPO_H}" fill="url(#luzcampo)"/>
    ${sig(M.h.clube, 22, 0)}${sig(M.a.clube, 78, 0)}
    <rect x="2" y="2" width="${CAMPO_W-4}" height="${CAMPO_H-4}" fill="none" stroke="${linha}" stroke-width=".5"/>
    <line x1="${CAMPO_W/2}" y1="2" x2="${CAMPO_W/2}" y2="${CAMPO_H-2}" stroke="${linha}" stroke-width=".5"/>
    <circle cx="${CAMPO_W/2}" cy="${CAMPO_H/2}" r="8" fill="none" stroke="${linha}" stroke-width=".5"/>
    <circle cx="${CAMPO_W/2}" cy="${CAMPO_H/2}" r=".7" fill="${linha}"/>
    <rect x="2" y="${CAMPO_H/2-11}" width="12" height="22" fill="none" stroke="${linha}" stroke-width=".5"/>
    <rect x="${CAMPO_W-14}" y="${CAMPO_H/2-11}" width="12" height="22" fill="none" stroke="${linha}" stroke-width=".5"/>
    <rect x="2" y="${CAMPO_H/2-5}" width="5" height="10" fill="none" stroke="${linha}" stroke-width=".4"/>
    <rect x="${CAMPO_W-7}" y="${CAMPO_H/2-5}" width="5" height="10" fill="none" stroke="${linha}" stroke-width=".4"/>
    <rect class="rede" id="rede-a" x="0" y="${CAMPO_H/2-4}" width="2" height="8" fill="rgba(255,255,255,.22)"/>
    <rect class="rede" id="rede-h" x="${CAMPO_W-2}" y="${CAMPO_H/2-4}" width="2" height="8" fill="rgba(255,255,255,.22)"/>
    <g id="g-botoes">${discosHTML(M)}</g>
    <line id="passe" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width=".55" stroke-dasharray="1.6 1.1" opacity="0" stroke-linecap="round"/>
    <g id="bola" style="transform:translate(${CAMPO_W/2}px,${CAMPO_H/2}px)">
      <ellipse id="bola-sombra" cx="0" cy="2.1" rx="1.6" ry=".75" fill="rgba(0,0,0,.45)"/>
      <g id="bola-corpo">
        <circle r="2.35" fill="none" stroke="#FFC233" stroke-width=".55" opacity=".75"/>
        <circle r="1.7" fill="#FFFFFF" stroke="#0A0A0A" stroke-width=".55"/>
        <path d="M0 -.95 L.9 -.3 L.56 .78 L-.56 .78 L-.9 -.3 Z" fill="#141414"/>
      </g>
    </g>
    </g>
  </svg>`;
}

function limparLance(){ BOLA_TIMERS.forEach(clearTimeout); BOLA_TIMERS=[]; LANCE_ATIVO=null;
  /* Rede de segurança da formação. A volta ao normal depois do gol (e a saída
     do arco do pênalti / do escanteio) mora num setTimeout da própria jogada.
     Se o lance seguinte chegava antes, esse timeout era cancelado aqui e o time
     ficava congelado comemorando ou parado no arco — era o "depois do gol às
     vezes não volta a formação". Agora, ao cortar um lance, o estado volta ao
     neutro na hora; quem assume em seguida põe o seu por cima. */
  if(typeof EST!=='undefined' && EST && (EST.fase==='gol' || EST.fase==='meio' || EST.setp || EST.chute || EST.recebe)){
    EST.fase='normal'; EST.saida=null; EST.gol=null; EST.setp=null; EST.chute=null; EST.recebe=null;
    EST.foco=null; EST.t+=1; EST.layout=null;
  }
  document.querySelectorAll('.bot.ativo').forEach(e=>e.classList.remove('ativo')); }

let BOLA_POS={x:CAMPO_W/2, y:CAMPO_H/2};
let CAMERA_MODO='seguir'; // 'seguir' aproxima a região da bola; 'ampla' mostra o campo inteiro
/* No celular o campo é uma faixa e a câmera precisa aproximar pra valer. No
   PC o campo já tem 900px: aproximar 1,55 lá deixava os botões gigantes e
   escondia metade do time. O zoom é do tamanho da tela. */
function cameraZoom(){ return (typeof innerWidth!=='undefined' && innerWidth>=700) ? 1.12 : 1.55; }
/* A câmera move uma <div>, não um <g> do SVG.
   Mover o <g> obrigava o navegador a redesenhar os 217 elementos do campo a
   cada quadro: no celular fraco a partida caía de 59 pra 37 quadros por
   segundo, com 54 quadros acima de 50ms contra 7. A <div> é composta pela
   GPU e sai de graça.

   E o enquadramento é travado dentro do desenho: a conta antiga limitava a
   posição da BOLA (que nunca sai do campo, então nunca limitava nada) em vez
   do quadro, e quando a bola chegava na lateral sobrava um terço de tarja
   preta na tela. */
let CAMERA_ALVO=null;      // onde a câmera está mirando agora
/* Zona morta. Câmera de TV não recentraliza a cada toque de bola — e o
   navegador cobra caro por isso: animando o campo inteiro sem parar, o celular
   fraco caía de 17ms para 31ms por quadro (54 quadros lentos contra 2). Com a
   zona morta a câmera só se mexe quando o jogo realmente mudou de região, e
   fica parada no resto do tempo, que é quando o quadro sai de graça. */
const CAMERA_ZONA_MORTA = 13;
function atualizarCamera(alvo, duracao, forcar){
  const cam=$('campo-cam');
  if(!cam) return;
  if(!forcar && CAMERA_MODO==='seguir' && CAMERA_ALVO && alvo
     && Math.hypot(alvo.x-CAMERA_ALVO.x, alvo.y-CAMERA_ALVO.y) < CAMERA_ZONA_MORTA) return;
  const arq=fundoArq(), arqX=arq*.92;
  const x0=-arqX, y0=-arq, w=CAMPO_W+arqX*2, h=CAMPO_H+arq*2;
  const seguir = CAMERA_MODO==='seguir';
  const zoom = seguir ? cameraZoom() : 1;
  // em "campo amplo" a câmera NÃO segue a bola — era isso que empurrava o
  // campo pra fora do quadro e deixava faixa preta em cima
  const bruto = seguir ? alvo : null;
  const px = bruto&&Number.isFinite(bruto.x) ? bruto.x : CAMPO_W/2;
  const py = bruto&&Number.isFinite(bruto.y) ? bruto.y : CAMPO_H/2;
  const meiaL = w/(2*zoom), meiaA = h/(2*zoom);
  const cx = clamp(px, x0+meiaL, x0+w-meiaL);
  const cy = clamp(py, y0+meiaA, y0+h-meiaA);
  const dx = 50 - 100*(cx-x0)/w, dy = 50 - 100*(cy-y0)/h;
  CAMERA_ALVO = {x:px, y:py};
  cam.style.transitionDuration = Math.max(0, Number.isFinite(duracao)?duracao:620)+'ms';
  cam.style.transform = `scale(${zoom.toFixed(3)}) translate(${dx.toFixed(2)}%, ${dy.toFixed(2)}%)`;
  const b=$('camera-toggle');
  if(b){ b.textContent = seguir?'◎ na bola':'▣ aberta'; b.setAttribute('aria-pressed', seguir?'true':'false'); }
}
function alternarCamera(){
  CAMERA_MODO = CAMERA_MODO==='seguir' ? 'ampla' : 'seguir';
  CAMERA_ALVO = null;
  atualizarCamera(BOLA_POS, 420, true);
}
// recoloca=true quando é o juiz levando a bola (meio, marca do pênalti,
// bandeirinha): não é passe, e por isso não vale as regras de passe.
let BOLA_RECOLOCA=false;
function moverBola(p, ms, recoloca){
  const b=$('bola'); if(!b) return;
  BOLA_RECOLOCA = !!recoloca;
  // sem tempo dado, a bola anda numa velocidade constante: passe curto rápido, lançamento demora
  if(ms==null){ const d=Math.hypot(p.x-BOLA_POS.x, p.y-BOLA_POS.y); ms=Math.max(200, d*16*velFator()); }
  // rastro do passe: uma linha que some, para o olho seguir a bola
  const tr=$('passe'); if(tr && Math.hypot(p.x-BOLA_POS.x, p.y-BOLA_POS.y)>5){
    tr.setAttribute('x1',BOLA_POS.x.toFixed(1)); tr.setAttribute('y1',BOLA_POS.y.toFixed(1));
    tr.setAttribute('x2',p.x.toFixed(1)); tr.setAttribute('y2',p.y.toFixed(1));
    tr.style.animation='none'; void tr.getBoundingClientRect(); tr.style.animation=`passeSome ${Math.max(.35,(ms/1000)+.25).toFixed(2)}s linear forwards`;
  }
  const distancia=Math.hypot(p.x-BOLA_POS.x,p.y-BOLA_POS.y);
  BOLA_POS={x:p.x, y:p.y};
  atualizarCamera(BOLA_POS, ms);
  const bola=$('bola');
  if(bola){
    bola.style.transitionDuration=(ms/1000).toFixed(2)+'s';
    /* O giro estava ao contrário em tudo. Primeiro: a duração vinha de
       `distancia/42`, ou seja, quanto MAIS longe o passe, mais devagar a bola
       girava — um lançamento rodava preguiçoso e um toque de 3m rodava feito
       pião. Segundo: girava sempre para o mesmo lado, então metade dos passes
       tinha a bola rodando ao contrário do caminho. E terceiro: bola alta não
       rola, voa — rodar no ar é que fazia parecer sem sentido.
       Agora: só rola no chão, para o lado em que anda, e a volta leva o tempo
       que a bola leva para andar ~9 metros. */
    const alta = !recoloca && distancia>17;
    const rola = !recoloca && distancia>2 && !alta;
    bola.classList.toggle('voo', alta);
    bola.classList.toggle('rolando', rola);
    bola.classList.toggle('giro-esq', rola && p.x < BOLA_POS.x);
    if(rola){
      const voltas = Math.max(1, distancia/9);
      const giro = Math.max(.14, Math.min(.9, (ms/1000)/voltas));
      bola.style.setProperty('--giro-bola', giro.toFixed(2)+'s');
    }
  }
  BOLA_ATE = Date.now() + ms;          // até quando a bola está viajando
  b.style.transitionDuration=(ms/1000).toFixed(2)+'s';
  b.style.transform=`translate(${p.x.toFixed(2)}px,${p.y.toFixed(2)}px)`;
  if(!recoloca) BOLA_TIMERS.push(setTimeout(()=>{ const el=$('bola'); if(el){el.classList.remove('rolando','voo','giro-esq');} }, Math.max(120,ms+90)));
  else if(bola) bola.classList.remove('rolando','voo','giro-esq');
}
let BOLA_ATE = 0;
function distBola(p){ return Math.hypot(p.x-BOLA_POS.x, p.y-BOLA_POS.y); }

function tremerRede(S){
  const r=$(S.casa?'rede-h':'rede-a'); if(!r) return;
  r.classList.remove('balanca'); void r.getBoundingClientRect(); r.classList.add('balanca');
}

/* A legenda da tela de gol. Só diz o que de fato aconteceu: o motor agora
   decide o estilo do lance uma vez só (02-motor, estiloDoGol) e a animação
   obedece, então "DE CABEÇA" nunca mais aparece num chute de fora. Quando o gol
   é de dentro da área, sem nada de especial, não inventa adjetivo: fica o
   minuto, como na TV. */
function legendaDoGol(e){
  if(!e) return '';
  if(e.tipo==='penalti')   return 'DE PÊNALTI';
  if(e.tipo==='falta')     return 'GOLAÇO DE FALTA!';
  if(e.tipo==='escanteio') return 'DE CABEÇA, NO ESCANTEIO';
  if(e.tipo==='contra')    return 'CONTRA';
  if(e.estilo==='fora')    return 'GOLAÇO DE FORA DA ÁREA!';
  if(e.estilo==='cruz')    return 'DE CABEÇA';
  return '';
}

function flashGol(S, quem, e){
  const f=$('gol-flash'); if(!f) return;
  const cb=corBotao(S.clube);
  const lum=h=>{h=String(h||'#000').replace('#','');
    if(h.length===3)h=h.split('').map(x=>x+x).join('');
    return (parseInt(h.slice(0,2),16)*0.299+parseInt(h.slice(2,4),16)*0.587+parseInt(h.slice(4,6),16)*0.114)/255;};
  f.style.setProperty('--g1', cb.a);
  f.style.setProperty('--g2', lum(cb.b)>0.55 ? cb.b : '#FFFFFF');
  const cores=[cb.a, cb.b, '#FFC233', '#FFFFFF'];
  const papel=[...Array(26).keys()].map(i=>{
    const ang=(i/26)*Math.PI*2 + (i%3)*0.21, dist=38+((i*37)%40);
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist*0.7-18;
    return `<i class="gol-papel" style="--dx:${dx.toFixed(0)}px;--dy:${dy.toFixed(0)}px;--rot:${((i*53)%360)}deg;--d:${(i%7)*40}ms;background:${cores[i%4]};width:${5+(i%3)*2}px;height:${7+(i%4)*2}px"></i>`;
  }).join('');
  const minuto = M ? (M.min>K.DUR?`90+${M.min-K.DUR}'`:`${M.min}'`) : '';
  /* A faixa de placar embaixo, como na transmissão: escudo, placar, escudo.
     O placar aqui é o de DEPOIS da bola entrar — é o número que o torcedor
     quer ver no instante do gol. */
  const leg = legendaDoGol(e);
  const barra = M ? `<span class="gol-barra">
      <span class="gb-lado">${escudoSVG(M.h.clube,26)}<b>${esc(M.h.clube.sigla||'')}</b></span>
      <span class="gb-placar">${M.hg}<i>×</i>${M.ag}</span>
      <span class="gb-lado r"><b>${esc(M.a.clube.sigla||'')}</b>${escudoSVG(M.a.clube,26)}</span>
    </span>` : '';
  f.innerHTML=`<span class="gol-onda"></span>${papel}
    <span class="gol-escudo">${escudoSVG(S.clube,44)}</span>
    <span class="gol-txt"><b>G</b><b>O</b><b>O</b><b>O</b><b>L</b></span>
    <span class="gol-quem">${esc(quem||S.clube.nome)}</span>
    ${barra}
    ${leg?`<span class="gol-legenda">${esc(leg)}</span>`:''}
    <span class="gol-placar" id="gol-placar">${esc(minuto)}</span>`;
  f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  /* O placar agora mora na faixa de cima, com o número JÁ somado. Esta linha
     repetia o placar lendo o marcador do topo, que ainda não tinha atualizado:
     dava "PAL 1 × 0" na faixa e "PAL 0 × 0" logo embaixo, na mesma tela. */
  BOLA_TIMERS.push(setTimeout(()=>f.classList.remove('on'), 2600));
  // o placar do topo pula
  /* Este cronômetro dispara 90ms depois do gol. Se a partida foi encerrada no
     meio (encerrar rodada, sair da tela), M já é null e `S===M.h` estourava —
     era o erro intermitente de JavaScript que aparecia no gate de vez em
     quando e nunca reproduzia. O irmão dele, de 140ms, já tinha a guarda. */
  BOLA_TIMERS.push(setTimeout(()=>{ if(!M) return; const b=$(S===M.h?'bc-hg':'bc-ag'); if(b){ b.classList.remove('pula'); void b.offsetWidth; b.classList.add('pula'); } }, 90));
  const est=document.querySelector('.est-wrap');
  if(est){ est.classList.remove('vibra'); void est.offsetWidth; est.classList.add('vibra'); }
}

const EV_IMPORTANTE=['gol','penalti','cv','ca','sub','lesao','apito','trave','defesa'];

/* O que fica guardado da narração. `p` (tipo) e `z` (estilo) entraram porque
   sem eles o replay desmentia o texto: um gol de pênalti era redesenhado como
   jogada trabalhada, e a cabeçada voltava como chute de fora. Save antigo não
   tem os dois campos e cai no sorteio de antes, como sempre caiu. */
function compactar(evs){
  return evs.filter(e=>['gol','cv','ca','apito','penalti','sub','lesao','defesa','trave','fora','chance'].includes(e.t))
            .map(e=>({m:e.min,a:e.add,t:e.t,s:e.side,x:e.txt,c:e.cls,i:e.i,ia:e.ia,q:e.q,p:e.tipo,z:e.estilo}));
}

function _expandir(e){
  return {min:e.m, add:e.a, t:e.t, side:e.s, txt:e.x, cls:e.c, i:e.i, ia:e.ia, q:e.q, tipo:e.p, estilo:e.z};
}

/* Todos os meus jogos da semana que têm narração guardada — pode ser um
   (só o Brasileirão) ou dois (rodada + copa na mesma semana). */
function meusJogosDoSlot(slot){
  const out=[];
  fixturesDoSlot(L, slot).forEach(bl=>{
    (bl.jogos||[]).forEach(g=>{
      if(!g||(g.h!==L.meuClube && g.a!==L.meuClube)) return;
      const k=chave(bl.comp, bl.fase, bl.rodada, g.h, g.a);
      const res=bl.comp.resultados[k];
      if(!res || !res.eventos || !res.eventos.length) return;
      out.push({comp:bl.comp, fase:bl.fase, rodada:bl.rodada, h:g.h, a:g.a, res});
    });
  });
  return out;
}

function meuJogoDoSlot(slot){ return meusJogosDoSlot(slot)[0] || null; }

function rodarRodadaAmigos(n){
  if(L.online){ toast('Na liga online a rodada roda sozinha quando todos derem OK.'); return; }
  if(L.temporadaFim && typeof viradaTemporadaAmigos==='function'){ viradaTemporadaAmigos(); salvar(true); render(); }
  const outros=Object.keys(L.managers).filter(c=>c!==L.meuClube);
  if(!outros.length && !L.rodarSozinho){
    sheet('Falta o código do seu amigo', `
      <div class="card" style="border-color:var(--danger);margin-bottom:12px">
        <p class="sm">Neste aparelho só existe <b>você</b> como técnico. Se rodar agora, o clube do seu amigo vira time da máquina e os resultados de vocês <b>não vão bater</b>.</p>
      </div>
      <p class="sm mut" style="margin-bottom:12px">Peça pra ele o código que começa com <b>J1</b> (aparece quando ele escolhe o clube) ou o código de escalação dele, e cole aqui.</p>
      <div class="stack">
        <button class="btn pri wide" onclick="fecharSheet();colarOrdens()">Colar o código dele</button>
        <button class="btn ghost wide" onclick="fecharSheet();L.rodarSozinho=true;salvar(true);toast('Ok, seguindo sozinho.')">Vou jogar sozinho mesmo</button>
      </div>`);
    return;
  }
  n = Math.max(1, n||1);
  const prontas = rodadasProntas();
  if(prontas<1){
    const falta=ordensPendentes().filter(c=>c!==L.meuClube).map(c=>clube(c).nome);
    toast(falta.length?('Falta a escalação de: '+falta.join(', ')):'Mande sua escalação primeiro.');
    return;
  }
  n = Math.min(n, prontas);
  const inicio=L.slot;
  const antes = tabela(L).findIndex(x=>x.id===L.meuClube)+1;
  const transfs=[];
  for(let k=0;k<n;k++){
    if(L.slot>fimSlot(L)) break;
    rodarUmaRodadaAmigos().forEach(t=>transfs.push(t));
  }
  const ultima=L.slot-1;
  if(L.slot>fimSlot(L)) fecharTemporadaAmigos();
  salvar(true); render();
  const resumo = ()=>{
    if(transfs.length) filaSheets.push(()=>resumoMercadoAmigos(transfs));
    if(n===1) resumoDaRodada(inicio);
    else resumoPeriodo(inicio, ultima, antes);
  };
  // assistir ao jogo da última rodada rodada
  if(meuJogoDoSlot(n===1?inicio:ultima)) assistirJogo(n===1?inicio:ultima, resumo);
  else resumo();
}

function minutosDeGol(ch, n){
  const r = rng('gm'+ch);
  const out=[];
  for(let i=0;i<n;i++) out.push(4+Math.floor(r()*86));
  return out.sort((a,b)=>a-b);
}

let _rodadaViva=null;

let _compViva = '';

/* Os outros jogos da rodada só eram simulados DEPOIS do meu, então a barra de
   cima mostrava "–" o jogo inteiro: não dava para acompanhar nada. Agora eles
   são resolvidos antes de a bola rolar e os gols vão aparecendo conforme o
   relógio anda, como um plantão de domingo. Na liga com amigos isso não é
   feito, porque lá a simulação tem de sair igual em todos os aparelhos e na
   hora certa. */
function preSimularRodada(slot){
  if(!L || L.online) return;
  if(typeof fixturesDoSlot!=='function' || typeof simularJogo!=='function') return;
  const r0 = R.r;
  try{
    (fixturesDoSlot(L, slot)||[]).forEach(bl=>{
      (bl.jogos||[]).forEach(g=>{
        if(!g || !g.h || !g.a) return;
        if(g.h===L.meuClube || g.a===L.meuClube) return;      // o meu é jogado, não simulado
        const k = chave(bl.comp, bl.fase, bl.rodada, g.h, g.a);
        if(bl.comp.resultados[k]) return;
        // semeado pela própria chave: o placar é o mesmo se recarregar a tela
        R.r = (typeof rng==='function') ? rng((L.seed||'x')+'#viva#'+k) : Math.random;
        simularJogo(L, bl.comp, bl.fase, bl.rodada, g);
      });
    });
  }catch(e){}
  R.r = r0;
}

let _rodadaVivaTit = '';

/* O painel da direita tem de mostrar a rodada DO JOGO QUE ESTÁ ROLANDO.
   Numa semana com dois jogos meus (Brasileirão e Sul-Americana), ele pegava o
   ÚLTIMO da lista: dava para estar jogando contra o Palmeiras pelo Brasileiro
   e o painel do lado mostrar a rodada da Sul-Americana, com o meu jogo contra
   outro time. Agora quem manda é a competição da partida em campo. */
function prepararRodadaViva(slot, compAlvo){
  preSimularRodada(slot);
  const jogos = (typeof jogosDoSlotComResultado==='function') ? jogosDoSlotComResultado(L, slot) : [];
  let meuComp = null;
  if(compAlvo) meuComp = jogos.some(j=>j.comp===compAlvo) ? compAlvo
              : (jogos.find(j=>j.comp && compAlvo && j.comp.id===compAlvo.id)||{}).comp || null;
  if(!meuComp) jogos.forEach(j=>{ if(!meuComp && (j.h===L.meuClube||j.a===L.meuClube)) meuComp=j.comp; });
  if(!meuComp){ const c={}; jogos.forEach(j=>{ const k=j.comp&&j.comp.id; if(k) c[k]=(c[k]||0)+1; });
    const top=Object.keys(c).sort((x,y)=>c[y]-c[x])[0];
    meuComp = (jogos.find(j=>j.comp&&j.comp.id===top)||{}).comp || null; }
  // e o cabeçalho diz a rodada daquela competição, não a semana do calendário
  const bl = meuComp ? jogos.find(j=>j.comp===meuComp) : null;
  _rodadaVivaTit = bl
    ? (bl.fase && bl.fase!=='grupo' && typeof NOME_FASE!=='undefined' && NOME_FASE[bl.fase]
        ? NOME_FASE[bl.fase]
        : 'Rodada '+((bl.rodada||0)+1))
    : 'Semana '+slot;
  _compViva = meuComp ? ((typeof nomeCurto==='function'?nomeCurto(meuComp):meuComp.nome)||'') : '';
  const daComp = meuComp ? jogos.filter(j=>j.comp===meuComp) : jogos;
  _rodadaViva = (daComp.length?daComp:jogos).map(j=>{
    const temRes = j.hg!==null && j.hg!==undefined;
    return { h:j.h, a:j.a, hg:j.hg, ag:j.ag, chave:j.chave, semRes:!temRes,
      mh: temRes?minutosDeGol(j.chave+'h', j.hg):[], ma: temRes?minutosDeGol(j.chave+'a', j.ag):[],
      meu: j.h===L.meuClube || j.a===L.meuClube };
  });
  return _rodadaViva;
}

function painelRodada(min){
  if(!_rodadaViva || !_rodadaViva.length) return '';

/* Assiste aos meus jogos em sequência. O botão de pular está na barra da
   partida; pular vai direto pro próximo, e no último cai no resumo. */
let FILA_JOGOS=null;

function assistirSequencia(lista, depois){
  FILA_JOGOS = {lista:lista.slice(), i:0, depois:depois||null};
  proximoDaFila();
}

/* ---------- o jogo que ele ainda não viu ----------
   A primeira rodada da liga dos amigos rodou e o Rafael não viu futebol
   nenhum: ele deu OK, fechou o celular, e quando o último amigo deu OK a
   rodada rodou — a partida dele abriu e se jogou sozinha na tela apagada.
   Quando voltou, já era só o placar. Duas coisas resolvem: a partida não
   começa com o app escondido (logo abaixo), e o jogo guarda até onde ele
   assistiu, então sempre dá pra pedir de volta. */
function marcarAssistido(ate){
  if(!L) return;
  L.assistidoAte = Math.max(L.assistidoAte||0, ate||0);
  try{ salvar(true); }catch(e){}
}

function jogosNaoVistos(){
  if(!L || L.modo!=='amigos' || L.temporadaFim) return [];
  const fim = Math.min((L.slot||1)-1, (typeof SEMANAS_AMIGOS!=='undefined'?SEMANAS_AMIGOS:42));
  /* Liga que já estava rodando quando esta versão chegou não tem marcador:
     oferece só a última rodada, não as dez que ele já viu. */
  const base = (L.assistidoAte!=null) ? L.assistidoAte : Math.max(0, (L.slot||1)-2);
  const out=[];
  for(let s=base+1; s<=fim; s++)
    meusJogosDoSlot(s).forEach((j,i)=>out.push({slot:s, i}));
  return out.length>6 ? out.slice(-6) : out;    // nada de maratona de 20 jogos
}

function assistirNaoVistos(){
  const nv=jogosNaoVistos(); if(!nv.length){ toast('Nenhum jogo seu pra rever.'); return; }
  const ate=nv[nv.length-1].slot;
  fecharSheet();
  assistirSequencia(nv, ()=>{ marcarAssistido(ate); render(); });
}

function botaoNaoVistos(){
  const nv=jogosNaoVistos(); if(!nv.length) return '';
  const rods=[...new Set(nv.map(x=>x.slot))];

}

/* Com o app em segundo plano o replay rodava sozinho e acabava sem ninguém
   ver. Espera ele voltar. */
let _esperandoVoltar=false;
function quandoVisivel(fn){
  try{ if(!document.hidden) return fn(); }catch(e){ return fn(); }
  if(_esperandoVoltar) return;      // duas rodadas enquanto some: um replay só
  _esperandoVoltar=true;
  const h=()=>{ if(document.hidden) return;
    document.removeEventListener('visibilitychange', h);
    _esperandoVoltar=false;
    setTimeout(fn, 250); };
  document.addEventListener('visibilitychange', h);
}

function proximoDaFila(){
  if(!FILA_JOGOS){ return; }
  const f=FILA_JOGOS;
  if(f.i>=f.lista.length){ const d=f.depois; FILA_JOGOS=null; if(d) d(); return; }
  const item=f.lista[f.i++];
  const ok = assistirJogo(item.slot, proximoDaFila, item.i);
  if(!ok) proximoDaFila();
}

function pularJogosDaFila(){
  if(FILA_JOGOS){ const d=FILA_JOGOS.depois; FILA_JOGOS=null;
    if(REPLAY) REPLAY.depois=null;
    fecharReplay(); if(d) setTimeout(d,200); return; }
  fecharReplay();
}

function assistirJogo(slot, depois, indice){
  const lista = meusJogosDoSlot(slot);
  const j = lista[indice||0] || lista[0];
  if(!j){ if(!FILA_JOGOS && depois) depois(); return false; }
  garanteElenco(L,j.h); garanteElenco(L,j.a);
  const lado = j.h===L.meuClube?'h':'a';
  R.r=Math.random;
  M = criarPartida(L, j.h, j.a, lado);
  if(typeof ajustarAtmosfera==='function') ajustarAtmosfera(M, j.comp, j.fase, j.rodada);
  if(j.res.publico) M.publico=j.res.publico;
  M.hg=0; M.ag=0; M.min=0; M.fim=false; M.eventos=[]; M.pausa=null; M.replay=true;
  REPLAY = {evs:(j.res.eventos||[]).map(_expandir), i:0, hg:j.res.hg, ag:j.res.ag,
            fim: Math.max(90, ...(j.res.eventos||[]).map(e=>(e.m||0)+(e.a||0))), depois:depois||null,
            slot:slot, sm:j.res.sm||null, compNome:nomeCurto(j.comp)};
  M.dur = REPLAY.fim;
  prepararRodadaViva(slot);
  garanteCaixasMatch();
  $('match').classList.add('on'); const _f0=$('m-feed'); if(_f0) _f0.innerHTML='';
  VEL='normal';
  $('m-top').innerHTML='';
  desenharMatch();
  addEvento({min:0,t:'sys',txt:`${esc(nomeCurto(j.comp))} — ${clube(j.h).nome} x ${clube(j.a).nome}, ${M.publico.toLocaleString('pt-BR')} presentes${M.motivoJogo?', '+M.motivoJogo:''}.`,cls:'sys'});
  iniciarTickReplay();
  return true;
}

function fecharReplay(){
  const d = REPLAY ? REPLAY.depois : null;
  fecharSheet(); pararTick(); if(typeof limparLance==='function') limparLance();
  $('match').classList.remove('on'); $('match').classList.remove('bcast');
  M=null; REPLAY=null; _rodadaViva=null;
  render(); irPara('home');
  if(d) setTimeout(d, 200);
}

let FILA_TIMERS=[], SEGURA=0, FILA_PEND=[];

// mostra um evento pendente (placar e narração) uma vez só
/* Mostra o evento na narração e no placar. Chamada duas vezes com o mesmo
   evento não repete: quem chama primeiro é a animação, no instante em que a
   bola entra — antes o texto vinha num tempo fixo e contava o gol quase três
   segundos antes de ele acontecer na tela. */
function mostrarPendente(e){
  const i=FILA_PEND.indexOf(e);
  if(i<0) return;                       // já apareceu
  FILA_PEND.splice(i,1);
  mostrarEvento(e);
}
// Ao cortar a fila (troca, tática, pular), o que ainda não apareceu aparece na hora:
// senão o placar de cima fica atrasado em relação ao jogo de verdade.
function limparFila(){
  FILA_TIMERS.forEach(clearTimeout); FILA_TIMERS=[]; SEGURA=0;
  if(FILA_PEND.length && M){ const pend=FILA_PEND.slice(); FILA_PEND=[]; pend.forEach(e=>mostrarEvento(e)); try{ desenharMatch(); }catch(x){} }
  FILA_PEND=[];
}

function seguraAte(ms){ SEGURA=Math.max(SEGURA, Date.now()+ms); }

function passo(){
  if(!M || M.fim){ if(!FILA_TIMERS.length) pararTick(); return; }
  if(Date.now() < SEGURA) return;
  /* A pose de saída de bola (cada time no seu campo) vale enquanto o juiz leva
     a bola de volta ao círculo. Assim que a jogada acaba e o relógio volta a
     correr, o time se espalha de novo — senão eles ficavam plantados no
     próprio campo o resto do jogo. */
  if(EST.fase==='meio' && !LANCE_ATIVO) estado({fase:'normal', saida:null}, 520);
  const antes=M.eventos.length;
  passoMinuto(M);
  const novos=M.eventos.slice(antes);
  const depois=()=>{
    if(!M) return;
    if(M.pausa){ pararTick(); tratarPausa(); return; }
    if(M.fim){ pararTick(); fimDeJogo(); }
  };
  if(!novos.length){ bolaOciosa(); desenharMatch(); depois(); return; }
  tocarFila(novos, depois);
}

function passoReplay(){
  if(!M || !REPLAY){ pararTick(); return; }
  if(M.fim){ pararTick(); return; }
  if(Date.now() < SEGURA) return;
  if(REPLAY.melhores && REPLAY.i < REPLAY.evs.length){
    const prox=REPLAY.evs[REPLAY.i];
    const minProx=(prox.min||0)+(prox.add||0);
    M.min=Math.max(M.min+1,minProx);
  } else M.min++;
  const novos=[];
  while(REPLAY.i < REPLAY.evs.length){
    const e=REPLAY.evs[REPLAY.i];
    const q=(e.min||0)+(e.add||0);
    if(q > M.min) break;
    REPLAY.i++;
    if(e.t==='gol'){ if(e.side==='h') M.hg++; else M.ag++; }
    if(e.t==='sub' || e.t==='cv'){ aplicarSaidaReplay(e); }
    if(['gol','defesa','trave','fora','chance','penalti'].includes(e.t)){
      if(e.side==='h') M.h.chutes++; else M.a.chutes++;
    }
    if(e.side==='h') M.h.posse+=0.85; else if(e.side==='a') M.a.posse+=0.85;
    M.eventos.push(e); novos.push(e);
  }
  M.h.posse+=0.5; M.a.posse+=0.5;
  const acabou=()=>{
    if(!M || !REPLAY) return;
    if(M.min>=REPLAY.fim && REPLAY.i>=REPLAY.evs.length){
      M.fim=true; M.hg=REPLAY.hg; M.ag=REPLAY.ag;
      pararTick(); desenharMatch(); fimDoReplay();
    }
  };
  if(!novos.length){ bolaOciosa(); desenharMatch(); acabou(); return; }
  tocarFila(novos, acabou);
}

/* O relógio adianta o que não interessa. Metade do jogo era a bola rodando sem
   nada acontecer — medido: 55% do tempo. Agora, quando não há jogada rolando, o
   minuto passa em 1/4 do tempo; assim que um lance começa, volta ao normal para
   dar pra acompanhar. O jogo inteiro cai de 90 para cerca de 45 segundos sem
   perder uma jogada sequer. */
function iniciarTick(){ pararTick(); limparFila();
  if(typeof ULT_LANCE!=='undefined') ULT_LANCE = -99;   // jogo novo, conta zerada
  agendarPasso(); }

function agendarPasso(){
  if(!(VELS[VEL]>0)) return;
  // só a jogada rolando segura o relógio; a espera da fila pode ser conferida rápido
  const vazio = !LANCE_ATIVO && !(M && M.pausa);
  const ms = vazio ? Math.max(60, Math.round(VELS[VEL]*0.19)) : VELS[VEL];
  tick = setTimeout(()=>{ passo(); if(tick) agendarPasso(); }, ms);
}

function iniciarTickReplay(){ pararTick(); limparFila(); if(VELS[VEL]>0) tick=setInterval(passoReplay, VELS[VEL]); }

function acender(S, idx, nome){
  // um lance pode terminar depois da partida fechar: sem esta guarda o rótulo
  // tentava ler M.h de um M que já não existe (TypeError na tela do usuário)
  if(!M || !S) return;
  const el=$('bot-'+ladoDe(S)+'-'+idx);
  if(el){ el.classList.add('ativo'); BOLA_TIMERS.push(setTimeout(()=>el.classList.remove('ativo'),1400)); }
  const u=S.emCampo.find(x=>x.idx===idx);
  const txt = nome || (u && u.p ? nomeCampo(u.p) : '');
  if(txt) etiqueta(S, idx, txt);
}

/* No computador a narração vai para dentro da coluna da direita, logo abaixo
   da lista da rodada — senão ela fica colada no pé com um vazio no meio. No
   celular volta para onde sempre esteve. */
/* As três caixas da partida (#m-top, #m-feed, #m-bar).
   No computador a narração (#m-feed) é MOVIDA para dentro do painel da direita,
   e esse painel mora dentro do #m-top. Resultado: quem limpava o #m-top para
   abrir a partida seguinte levava a narração junto, e o jogo seguinte abria
   numa tela preta com só o botão — `$('m-feed')` já não existia e estourava
   antes de desenhar qualquer coisa. Esta função devolve as caixas ao lugar. */
function garanteCaixasMatch(){
  const m=$('match'); if(!m) return;
  if($('m-top') && $('m-feed') && $('m-bar')) return;
  ['m-top','m-feed','m-bar'].forEach(id=>{ const e=$(id); if(e && e.parentNode) e.parentNode.removeChild(e); });
  m.insertAdjacentHTML('afterbegin',
    '<div class="m-top" id="m-top"></div><div class="m-feed" id="m-feed"></div><div class="m-bar" id="m-bar"></div>');
}

function arrumarLayoutPC(){
  const m=$('match'), pai=$('m-painel'), feed=$('m-feed');
  if(!m || !feed) return;
  const pc = window.matchMedia('(min-width:1000px)').matches && m.classList.contains('bcast');
  if(pc && pai && feed.parentNode!==pai){ pai.appendChild(feed); }
  else if(!pc && feed.parentNode!==m){ const bar=m.querySelector('.m-bar'); m.insertBefore(feed, bar||null); }
}
if(typeof window!=='undefined') window.addEventListener('resize', ()=>{ try{ arrumarLayoutPC(); }catch(e){} });

function montarEsqueleto(){

  const lot = M.lotacao===undefined?0.55:M.lotacao;

    </div>`;}).join('');

  $('m-top').innerHTML=`
    <div class="bc-est">

      <div class="bc-est-i"><span>${M.publico?M.publico.toLocaleString('pt-BR'):'—'} · ${descricaoCasa(lot)}</span>
        ${M.motivoJogo?`<span class="bc-tag">${esc(M.motivoJogo)}</span>`:''}</div>
    </div>
    <div id="m-painel">${lista?`<div class="bc-rodada">
      <div class="bc-cab">
        <span class="bc-comp">${esc(_compViva||'')}</span>
        <span class="bc-rod">Rodada ${REPLAY?REPLAY.slot:(L.slot||'')}</span>
        <span class="bc-min" id="bc-min">0'</span></div>
      <div class="bc-lista">${lista}</div></div>`:''}</div>
    <div id="m-board"><div class="bc-placar">
      <div class="bc-lado">${escudoSVG(M.h.clube,24)}<span class="${cls(nh)}">${esc(nh)}</span></div>
      <div class="bc-gols"><b id="bc-hg">0</b><s>×</s><b id="bc-ag">0</b></div>
      <div class="bc-lado r"><span class="${cls(na)}">${esc(na)}</span>${escudoSVG(M.a.clube,24)}</div>
      <div class="bc-prog"><i id="bc-prog" style="width:0%"></i></div>

    </div></div>
    <div class="campo-wrap" id="m-campo">

let _barraSig=null;

function _txt(id, v){ const e=$(id); if(e && e.textContent!==v) e.textContent=v; }

function desenharMatchCampoBase(){
  if(!M) return;
  if(!$('campo-svg')) montarEsqueleto();
  const eu = M.liveSide==='h'?M.h:M.a;
  const rel = M.min>K.DUR?`90+${M.min-K.DUR}'`:`${M.min}'`;
  const prog = clamp(100*M.min/Math.max(M.dur,1),0,100);
  const mom = clamp(momentoBarra(M), 6, 94);
  const cor=coresDoJogo();

  // painel da rodada: só os placares mudam
  const min=Math.min(M.min,90);
  _txt('bc-min', min>=90?'FINAL':min+"'");
  (_rodadaViva||[]).forEach((j,i)=>{
    const el=$('bcp'+i); if(!el) return;
    const [hg,ag]=placarNoMinuto(j,min);
    const v=(j.semRes&&!j.meu)?'-':hg+'x'+ag;
    if(el.dataset.v!==v){
      const tinha = el.dataset.v!=null && el.dataset.v!=='-';
      el.dataset.v=v;
      el.innerHTML=(j.semRes&&!j.meu)?'<em>–</em>':`${hg}<em>×</em>${ag}`;
      // gol em outro campo: o placar pisca, como no plantão
      if(tinha && !j.meu){ const lin=el.closest('.bc-jogo');
        if(lin){ lin.classList.remove('gol'); void lin.offsetWidth; lin.classList.add('gol');
          setTimeout(()=>lin.classList.remove('gol'), 2200); } }
    }
  });

  const pv=placarVis();
  _txt('bc-hg', String(pv[0])); _txt('bc-ag', String(pv[1]));
  const pr=$('bc-prog'); if(pr) pr.style.width=prog+'%';
  _txt('bc-rel', M.fim?'FIM DE JOGO':rel+' · '+(M.min<=45?'1º TEMPO':'2º TEMPO'));

  _txt('bc-ch', String(M.h.chutes)); _txt('bc-ca', String(M.a.chutes));
  const m1=$('bc-m1'), m2=$('bc-m2');
  if(m1){ m1.style.width=mom+'%'; if(m1.dataset.c!==cor.h.a){ m1.dataset.c=cor.h.a; m1.style.background=cor.h.a; } }
  if(m2){ m2.style.width=(100-mom)+'%'; if(m2.dataset.c!==cor.a.a){ m2.dataset.c=cor.a.a; m2.style.background=cor.a.a; } }
  _txt('bc-posse', 'posse '+(M.min<2?'—':Math.round(100*M.h.posse/Math.max(M.min,1))+'%'));
  /* "5 trocas" lia como cinco trocas FEITAS. É o que ainda resta. */
  _txt('bc-trocas', eu.subs<MAX_SUBS?'restam '+(MAX_SUBS-eu.subs)+' trocas':'sem trocas');
  const emC=eu.emCampo.filter(u=>!u.fora);
  _txt('bc-ener', Math.round(emC.reduce((s,u)=>s+u.energia,0)/Math.max(1,emC.length))+'% energia');

  if(!(M && M.replay)){
    const sig=(M.fim?'f':'j')+VEL;
    if(sig!==_barraSig){
      _barraSig=sig;
      $('m-bar').innerHTML = M.fim
        ? `<button class="btn pri wide" onclick="terminarPartida()">Encerrar rodada</button>`
        : `<button class="btn" onclick="alternarVel()">${VEL==='pausado'?'▶':'❚❚'}</button>
           <button class="btn" onclick="mudarVel()">${VEL==='rapido'?'3×':VEL==='turbo'?'10×':'1×'}</button>
           <button class="btn" onclick="sheetSub()">Trocar</button>
           <button class="btn" onclick="sheetTaticaAoVivo()">Tática</button>`;
    }
  }
}

function posSetPeca(S, u){
  if(!M) return null;
  const sp=EST.setp; if(!sp) return null;
  const Sa = sp.side==='h'?M.h:M.a;
  const atc = (ladoDe(S)===sp.side);
  const dir = Sa.casa ? 1 : -1;                    // sentido do ataque
  const gx  = Sa.casa ? CAMPO_W-2.5 : 2.5;         // gol atacado
  const meio= CAMPO_H/2;
  const sLado = (EST.fase==='escanteio' && sp.canto!=null) ? (sp.canto<CAMPO_H/2 ? -1 : 1) : 0;
  if(u.slot==='GOL')                                  // o goleiro que defende sai da linha
    return atc ? {x: S.casa?4:CAMPO_W-4, y:meio} : {x: gx - dir*1.2, y: meio + sLado*1.2};

  const linha = S.emCampo.filter(z=>!z.fora && z.slot!=='GOL');
  const n = Math.max(0, linha.indexOf(u));
  const tot = Math.max(1, linha.length-1);

  if(EST.fase==='penalti'){
    if(atc && u.idx===sp.idx) return {x: gx - dir*15, y: meio};   // batedor atrás da bola
    // os outros formam o arco fora da área, todos atrás da marca
    const marca = gx - dir*11;
    if(n < 7){
      const ang = (-1 + 2*((n + (atc?0:0.5))/6)) * 1.15;           // -66°..66°, times intercalados
      const r   = (atc ? 15.5 : 19.5) + (n%2)*2.2;
      return {x: clamp(marca - dir*Math.abs(Math.cos(ang))*r, 4, CAMPO_W-4),
              y: clamp(meio + Math.sin(ang)*r*1.15, 5, CAMPO_H-5)};
    }
    return {x: clamp(gx - dir*(40 + (n-7)*9), 4, CAMPO_W-4),
            y: clamp(meio + ((n%2)?13:-13), 5, CAMPO_H-5)};
  }
  /* Escanteio. Antes os dois times usavam o MESMO índice para escolher o ponto,
     então o atacante nº0 e o zagueiro nº0 caíam praticamente um em cima do
     outro — era o embolado que o Rafael viu. Agora cada time tem a sua lista de
     pontos, intercaladas, e nenhum par fica a menos de 6 do outro (o botão tem
     raio 3, então 6 é encostar sem sobrepor). */
  if(atc && u.idx===sp.idx)                                        // cobrador na bandeirinha
    return {x: gx + dir*0.3, y: sp.canto<CAMPO_H/2 ? sp.canto+2.4 : sp.canto-2.4};

  // índice do jogador dentro do seu time, sem contar o cobrador
  let k = 0;
  for(const z of linha){ if(z===u) break; if(atc && z.idx===sp.idx) continue; k++; }

  const PT_ATQ = [[9,-15.5],[9,-1.5],[9,12.5],[15,-4],[15,9],[21,4]];
  const PT_DEF = [[3.5,-6.5],[3.5,6.5],[10,-9],[10,6],[16,-12],[15,2.5],[21,-3]];
  const pts = atc ? PT_ATQ : PT_DEF;
  // o bloco inteiro escorrega um pouco para o lado de onde vem a bola
  const s = sp.canto<CAMPO_H/2 ? -1 : 1;
  if(k < pts.length){
    const [dx,dy] = pts[k];
    return {x: clamp(gx - dir*dx, 4, CAMPO_W-4),
            y: clamp(meio + dy + s*1.6, 5, CAMPO_H-5)};
  }
  // o resto fica protegido lá atrás — e também em faixas diferentes por time,
  // senão os que sobram voltam a cair exatamente um em cima do outro
  const r = k - pts.length;
  const rx = (atc ? 28 : 33) + r*9;
  const ry = (atc ? 16 : 8) * (r%2 ? 1 : -1);
  return {x: clamp(gx - dir*rx, 4, CAMPO_W-4),
          y: clamp(meio + ry + s*1.6, 5, CAMPO_H-5)};
}

function layoutCampo(){
  if(!M) return;
  const bolaParada = (EST.fase==='penalti' || EST.fase==='escanteio');
  const itens=[];
  [M.h,M.a].forEach(S=>S.emCampo.forEach(u=>{ if(u.fora) return;
    const p=posCrua(S,u); itens.push({k:ladoDe(S)+'-'+u.idx, x:p.x, y:p.y}); }));
  const MIN = bolaParada ? 5.0 : 6.6;
  const voltas = bolaParada ? 4 : 8;
  for(let it=0; it<voltas; it++){
    for(let i=0;i<itens.length;i++) for(let j=i+1;j<itens.length;j++){
      const a=itens[i], b=itens[j];
      let dx=b.x-a.x, dy=(b.y-a.y)*1.35;
      let d=Math.sqrt(dx*dx+dy*dy);
      if(d<0.01){ dx=(i%2?1:-1)*0.6; dy=0.6; d=0.85; }
      if(d<MIN){
        const f=(MIN-d)/d*(bolaParada?0.35:0.5);
        a.x-=dx*f; a.y-=dy*f/1.35; b.x+=dx*f; b.y+=dy*f/1.35;
      }
    }
  }
  const out={};
  itens.forEach(p=>out[p.k]={x:clamp(p.x,3,CAMPO_W-3), y:clamp(p.y,4,CAMPO_H-4)});
  EST.layout=out;
}

/* ---------- saída de bola ----------
   Ele: "quando vai voltar a bola, os jogadores não podem invadir o campo
   adversário". Na volta do gol o estado já voltava para 'normal' e cada um ia
   para onde a jogada mandava — dava para ver meio time do São Paulo plantado
   no campo do Mirassol com a bola ainda parada no círculo. Agora, enquanto a
   bola espera no meio, cada time fica no seu lado, e só dois entram no
   círculo: quem vai tocar e quem vai receber. */
function posSaidaDeBola(S, u){
  const meu = ladoDe(S);
  const dir = S.casa ? 1 : -1;                 // para onde este time ataca
  const meio = CAMPO_H/2, centroX = CAMPO_W/2;
  const base = posBase(S, u.idx);
  const limite = 2.2;                          // ninguém pisa na linha do meio
  // os dois da saída, do time que recomeça
  if(EST.saida === meu){
    const frente = S.emCampo.filter(z=>!z.fora && (z.slot==='ATA'||z.slot==='PON'||z.slot==='MEI'));
    if(frente[0] && frente[0]===u) return {x: centroX - dir*1.6, y: meio - 1.2};
    if(frente[1] && frente[1]===u) return {x: centroX - dir*4.2, y: meio + 2.0};
  }
  // todo o resto no seu campo, com uma folga da linha
  const x = S.casa ? Math.min(base.x, centroX - limite)
                   : Math.max(base.x, centroX + limite);
  return {x: clamp(x, 3, CAMPO_W-3), y: clamp(base.y, 4, CAMPO_H-4)};
}

function posCrua(S, u){
  if(!M) return posBase(S, u.idx);
  if((EST.fase==='penalti' || EST.fase==='escanteio') && EST.setp){
    const p=posSetPeca(S,u); if(p) return p;
  }
  if(EST.fase==='meio'){ const p=posSaidaDeBola(S,u); if(p) return p; }
  // quem vai receber o passe corre até o ponto e chega junto com a bola:
  // é isso que faz um passe parecer um passe, e não a bola achando um jogador
  if(EST.recebe && EST.recebe.side===ladoDe(S) && EST.recebe.idx===u.idx){
    return {x: clamp(EST.recebe.x, 2.2, CAMPO_W-2.2), y: clamp(EST.recebe.y, 3, CAMPO_H-3)};
  }
  const base=posBase(S,u.idx);
  const dir=S.casa?1:-1, meu=ladoDe(S);
  const atacando = EST.ataque===meu;
  const defendendo = EST.ataque && !atacando;

  let push = atacando ? 6 : defendendo ? -3 : 0;
  if(EST.fase==='ataque')  push = atacando ? 12 : -6;
  if(EST.fase==='area')    push = atacando ? 16 : -8;
  const peso = PESO_LINHA[u.slot]||1;
  let x = base.x + dir*push*peso;

  const larg = EST.fase==='area' ? (atacando?1.04:0.9) : atacando ? 1.04 : defendendo ? 0.94 : 1;
  let y = CAMPO_H/2 + (base.y-CAMPO_H/2)*larg;

  // o bloco desliza para o lado da bola: quem defende fecha mais, quem ataca abre
  if(u.slot!=='GOL'){
    const puxa = defendendo ? 0.17 : atacando ? 0.07 : 0.10;
    y += (BOLA_POS.y - y) * puxa;
  }

  x += Math.sin(u.idx*2.31 + EST.t*0.9)*0.48;
  y += Math.cos(u.idx*1.87 + EST.t*0.8)*0.52;

  if(EST.foco && EST.foco.side===meu && EST.foco.idx===u.idx){
    x += dir*(5 + (EST.foco.ad||0)); y += (CAMPO_H/2-y)*0.18;   // ad = quanto já conduziu
  }
  if(EST.foco && EST.foco.side!==meu && EST.marca===u.idx && u.slot!=='GOL'){
    const alvoS = EST.foco.side==='h'?M.h:M.a;
    const pa = posBase(alvoS, EST.foco.idx);
    x += (pa.x-x)*0.48 + dir*3.2; y += (pa.y-y)*0.48 + 2.4;
  } else if(EST.foco && EST.foco.side!==meu && EST.marca2===u.idx && u.slot!=='GOL'){
    const alvoS = EST.foco.side==='h'?M.h:M.a;
    const pa = posBase(alvoS, EST.foco.idx);
    x += (pa.x-x)*0.22 + dir*2; y += (pa.y-y)*0.22;
  } else if(EST.foco && EST.foco.side===meu && u.slot!=='GOL' && EST.foco.idx!==u.idx){
    // companheiros se oferecem: quem está perto do dono da bola abre uma linha de passe
    const pb = posBase(S, EST.foco.idx);
    const d = Math.hypot(pb.x-x, pb.y-y);
    if(d<22){ x += dir*2.5; y += (y>pb.y?1:-1)*2.2; }
  }

  // Movimentação sem bola: cada função ocupa um espaço diferente quando o
  // time tem a posse. É um ajuste de apresentação/posicionamento do campo;
  // não altera a escolha de passe nem as probabilidades do motor de jogo.
  if(atacando && EST.foco && EST.foco.side===meu && EST.foco.idx!==u.idx && u.slot!=='GOL'){
    const ladoNatural = base.y < CAMPO_H/2 ? -1 : 1;
    const progressoBola = (BOLA_POS.x-base.x)*dir;
    const bolaNoCorredor = Math.abs(BOLA_POS.y-base.y) < 19;
    if(u.slot==='ATA'){
      // O centroavante ameaça a profundidade, sem ultrapassar a linha de fundo.
      x += dir*clamp(5.2-progressoBola*0.055, 2.2, 5.2);
      y += (CAMPO_H/2-y)*0.10;
    } else if(u.slot==='PON'){
      // Pontas dão amplitude e atacam o espaço entre lateral e zagueiro.
      y += ladoNatural*3.1;
      x += dir*3.0;
    } else if(u.slot==='MEI'){
      // Meias se aproximam em diagonal para oferecer uma linha curta de passe.
      x += dir*1.8;
      y += (y>CAMPO_H/2 ? -1 : 1)*1.5;
    } else if(u.slot==='LAT' && bolaNoCorredor && progressoBola>-5){
      // O lateral apoia por fora quando a bola está no seu corredor.
      x += dir*3.8;
      y += ladoNatural*2.0;
    } else if(u.slot==='VOL'){
      // O volante protege a retaguarda e oferece apoio por trás da jogada.
      x -= dir*1.8;
    }
  }
  // goleiro do lado que sofre o chute pula para o canto — no SEU gol
  if(EST.chute && EST.chute.side!==meu && u.slot==='GOL'){
    const g=golProprio(S);
    return {x: clamp(g.x + (S.casa?2.2:-2.2), 2.5, CAMPO_W-2.5),
            y: clamp(CAMPO_H/2 + (EST.chute.y-CAMPO_H/2)*0.62, 4, CAMPO_H-4)};
  }
  if(EST.fase==='gol' && EST.gol && EST.gol.side===meu){
    const canto = {x: S.casa?CAMPO_W-9:9, y: EST.gol.canto};
    if(EST.gol.idx===u.idx){ x=canto.x; y=canto.y; }
    else if(u.slot!=='GOL'){
      const ang = (u.idx*0.83) + (S.casa?Math.PI:0);
      const raio = 7.5 + (u.idx%3)*3.2;
      x = canto.x + Math.cos(ang)*raio*(S.casa?-1:1);
      y = canto.y + Math.sin(ang)*raio*0.75;
    }
  }
  return {x:clamp(x,2.5,CAMPO_W-2.5), y:clamp(y,3,CAMPO_H-3)};
}

const PESO_SAIDA={GOL:0, ZAG:3, LAT:4, VOL:5, MEI:4, PON:2, ATA:1};

/* A construção da jogada e a animação do lance vivem em 06-lance.js. */

EV_IMPORTANTE.length=0;

['gol','penalti','cv','apito','lesao'].forEach(x=>EV_IMPORTANTE.push(x));


function tempoTexto(e){
  const f=(typeof velFator==='function')?velFator():1;
  if(VEL==='turbo') return 0;
  const base={gol:1180, penalti:420, defesa:760, trave:740, fora:700, chance:900}[e.t];
  return base ? base*f : 0;
}

/* Segurar o relógio até a jogada acabar. Antes só o gol era segurado até o fim;
   uma defesa era solta em 1 segundo enquanto a animação levava 3,5, e o evento
   seguinte entrava por cima dela. Se a jogada merece ser mostrada, ela termina. */
function tempoSegura(e){
  const d=tempoLance(e);
  if(!d) return 0;
  return d;
}

/* A peça é o botão, como no futebol de mesa: disco com borda, brilho por cima
   e o número no meio. As cores são as do jogo (uniforme 2 quando batem com o
   adversário); o goleiro usa um botão escuro, que é o de camisa diferente. */
function pecaSVG(c1, c2, num, gk, craque){
  const cor = gk ? '#2A2F36' : c1, tinta = gk ? '#F2C233' : c2;
  // o craque tem anel dourado no botão: dá pra achar ele em campo de longe
  const anel = craque ? `<circle r="3.85" fill="none" stroke="rgba(0,0,0,.55)" stroke-width="1.1"/>
    <circle class="bot-craque" r="3.85" fill="none" stroke="#FFD34D" stroke-width=".7"/>` : '';
  return `<ellipse class="bot-sombra" cx=".35" cy=".9" rx="3.1" ry="3"/>
    ${anel}
    <circle class="bot-c" r="3.05" fill="${tinta}" stroke="rgba(0,0,0,.45)" stroke-width=".3"/>
    <circle r="2.45" fill="${cor}"/>
    <path d="M-2.1 -1.2 A2.45 2.45 0 0 1 2.1 -1.2 A3.4 3.4 0 0 0 -2.1 -1.2 Z" fill="#fff" opacity=".22"/>
    <text class="bot-num" y="1.1" text-anchor="middle" fill="${tinta}">${num||''}</text>`;
}

function discosLado(S){
  if(typeof garanteNumeros==='function') garanteNumeros(S.clubId);
  if(!EST.layout) layoutCampo();
  const cb=coresDoJogo()[ladoDe(S)], c1=cb.a, c2=cb.b, lado=ladoDe(S);
  return S.emCampo.filter(u=>!u.fora).map(u=>{
    const p=posViva(S,u);
    const n=(typeof numeroDe==='function'?numeroDe(u.p):'');
    const comPosse=!!(EST && EST.foco && EST.foco.side===lado && EST.foco.idx===u.idx);
    const pressiona=!!(EST && EST.foco && EST.foco.side!==lado && (EST.marca===u.idx || EST.marca2===u.idx));
    const estadoVisual=comPosse?' com-posse':pressiona?' pressao':'';
    return `<g class="bot${estadoVisual}" id="bot-${lado}-${u.idx}" style="transform:translate(${p.x.toFixed(2)}px,${p.y.toFixed(2)}px)">
      <g class="bot-in">${pecaSVG(c1, c2, n==='–'?'':n, u.slot==='GOL', !!(u.p&&u.p.estrela))}</g></g>`;}).join('');
}

function addEvento(e){
  if(M && e.t && e.t!=='sys' && typeof tocarFila==='function'){ tocarFila([e], null); return; }
  mostrarEvento(e);
}

function placarVis(){
  if(!M) return [0,0];
  if(M._hgv===undefined || M.fim){ M._hgv=M.hg; M._agv=M.ag; }
  return [M._hgv, M._agv];
}

function mostrarEvento(e){
  const f=$('m-feed'); if(!f) return;
  if(M && e.t==='gol'){
    if(M._hgv===undefined){ M._hgv=Math.max(0,M.hg-(e.side==='h'?1:0)); M._agv=Math.max(0,M.ag-(e.side==='a'?1:0)); }
    if(e.side==='h') M._hgv++; else M._agv++;
    /* Rede de segurança da TELA DE GOL. Ela era disparada só lá no fim da
       animação, dentro de um setTimeout — e se o lance seguinte chegasse antes
       (limparLance corta os timers), o gol entrava no placar sem a tela.
       Aqui o gol já está aparecendo na narração: se a tela não saiu, sai
       agora. Cada gol só acende uma vez (e._flash). */
    if(!e._flash && typeof flashGol==='function'){
      e._flash=1;
      try{ flashGol(e.side==='h'?M.h:M.a, e.q||'', e); }catch(err){}
    }
    const board=$('m-board');
    if(board){ board.classList.remove('gol-pop'); void board.offsetWidth; board.classList.add('gol-pop');
      setTimeout(()=>{ if(board.isConnected) board.classList.remove('gol-pop'); },850); }
  }
  if(!FEED_TUDO && e.t && !EV_IMPORTANTE.includes(e.t) && e.t!=='sys') return;
  const div=document.createElement('div');
  const rival = e.t==='gol' && M && e.side && e.side!==M.liveSide;
  div.className='ev '+(e.cls||'')+(e.t==='gol'?' goal':'')+(rival?' rival':'');
  const min = e.min? (e.add? `${e.min}+${e.add}'` : `${e.min}'`) : '';
  div.innerHTML=`<span class="ev-min">${min}</span><span class="ev-tx">${esc(e.txt)}</span>`;
  f.appendChild(div); f.scrollTop=f.scrollHeight;
}

function placarNoMinuto(j, min){
  if(j.meu && M){ return placarVis(); }
  if(j.semRes) return ['–','–'];
  return [j.mh.filter(m=>m<=min).length, j.ma.filter(m=>m<=min).length];
}

let POSSE = null;

const LINHA_TERCO = {
  0: ['ZAG','LAT','VOL'],
  1: ['VOL','MEI','LAT'],
  2: ['MEI','PON','ATA']
};

function jogadorDoTerco(S, terco, evitar){
  const quer = LINHA_TERCO[terco] || LINHA_TERCO[1];
  let cands = S.emCampo.filter(u=>!u.fora && u.slot!=='GOL' && quer.includes(u.slot) && u.idx!==evitar);
  if(!cands.length) cands = S.emCampo.filter(u=>!u.fora && u.slot!=='GOL' && u.idx!==evitar);
  if(!cands.length) return null;
  return pick(cands);
}

function faseDoTerco(t){ return t>=2 ? 'ataque' : 'normal'; }

// atributo de quem está em campo (o motor já garantiu os atributos de todo mundo)
function atrDe(u, k){
  const p = u && u.p; if(!p) return 66;
  const at = p.at || (typeof garanteAtributos==='function'
    ? garanteAtributos(p, (typeof L!=='undefined'&&L)?L.seed:'x') : null);
  const v = at ? at[k] : null;
  return (typeof v==='number') ? v : (p.ovr||66);
}

// quem está marcando: o adversário de linha mais perto do ponto
function pressaoSobre(O, p){
  let d=1e9, u=null;
  O.emCampo.forEach(z=>{ if(z.fora||z.slot==='GOL') return;
    const q=posViva(O,z), dd=Math.hypot(q.x-p.x, q.y-p.y);
    if(dd<d){ d=dd; u=z; } });
  return {d, u};
}

/* A bola entre um lance e outro está em 06-lance.js (bolaOciosa). */

// em que terço do campo (do ponto de vista de S) está um ponto x
function tercoDe(S, x){ const t=S.casa ? x/CAMPO_W : 1-x/CAMPO_W; return t<0.38?0 : t<0.66?1 : 2; }


/* ===== 06-vestiario =====
   O vestiário no meio do jogo, no espírito do Brasfoot: o campo com a
   formação, cada jogador como uma camisa com nome, força e energia, o banco
   embaixo e as trocas com dois toques. O gramado conta a história do clube:
   time pequeno joga em terrão, time grande em tapete. */
'use strict';

const MAX_SUBS = 5;
let VEST = {sai:null, entra:null, modo:'intervalo'};

/* ---------- gramado ---------- */

// 0 = tapete de clube grande … 3 = terrão de time pequeno
function nivelGramado(c){
  const t=(c&&c.torcida)||2, rep=(c&&c.rep)||2;
  const s=t+rep;
  return s>=8 ? 0 : s>=6 ? 1 : s>=4 ? 2 : 3;
}

function gramadoSVG(c, W, H){
  const nv=nivelGramado(c);
  const verde=['#1E7A4B','#237A49','#2B7443','#3A6E3C'][nv];
  const verde2=['#176B3F','#1B6A3D','#256238','#355D33'][nv];
  const terra='#8B6A3E', terra2='#6E5230';
  const seed=hashStr((c&&c.id)||'x');
  const r=rng('grama#'+((c&&c.id)||'x'));
  const faixas=[...Array(9).keys()].map(i=>`<rect x="0" y="${i*H/9}" width="${W}" height="${H/9}" fill="#fff" opacity="${i%2?0.035:0}"/>`).join('');
  // manchas de terra: quanto menor o clube, mais e maiores
  const n = nv===0?0 : nv===1?3 : nv===2?7 : 12;
  let manchas='';
  const pontos=[[50,H*0.5,14,9],[50,H*0.09,12,6],[50,H*0.91,12,6],[18,H*0.32,7,9],[82,H*0.32,7,9],[18,H*0.68,7,9],[82,H*0.68,7,9],
    [35,H*0.42,6,5],[65,H*0.58,6,5],[50,H*0.25,8,5],[50,H*0.75,8,5],[30,H*0.62,5,4],[70,H*0.38,5,4]];
  for(let i=0;i<n;i++){
    const [x,y,rx,ry]=pontos[i%pontos.length];
    const esc=(nv===3?1.25:nv===2?1:0.8)*(0.85+r()*0.3);
    manchas+=`<ellipse cx="${x+(r()-.5)*4}" cy="${y+(r()-.5)*4}" rx="${rx*esc}" ry="${ry*esc}" fill="${i%3?terra:terra2}" opacity="${nv===3?.55:nv===2?.42:.28}" filter="url(#borda-terra)"/>`;
  }
  const linha=nv>=2?'rgba(255,255,255,.55)':'rgba(255,255,255,.75)';
  const gy=H*0.5;
  return `<defs>
    <linearGradient id="vg-grama" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${verde}"/><stop offset="1" stop-color="${verde2}"/></linearGradient>
    <filter id="borda-terra" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="2" seed="${seed%50}"/>
      <feDisplacementMap in="SourceGraphic" scale="6"/>
      <feGaussianBlur stdDeviation=".6"/>
    </filter>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#vg-grama)"/>
  ${faixas}
  ${manchas}
  <g fill="none" stroke="${linha}" stroke-width=".7">
    <rect x="3" y="3" width="${W-6}" height="${H-6}"/>
    <line x1="3" y1="${gy}" x2="${W-3}" y2="${gy}"/>
    <circle cx="50" cy="${gy}" r="9"/>
    <rect x="22" y="3" width="56" height="17"/><rect x="36" y="3" width="28" height="6"/>
    <rect x="22" y="${H-20}" width="56" height="17"/><rect x="36" y="${H-9}" width="28" height="6"/>
  </g>
  <circle cx="50" cy="${gy}" r=".9" fill="${linha}"/>
  <rect x="41" y="0" width="18" height="3" fill="rgba(255,255,255,.35)"/>
  <rect x="41" y="${H-3}" width="18" height="3" fill="rgba(255,255,255,.35)"/>`;
}

/* ---------- camisa ---------- */

// a camisa como peça do campo: mesmo pano da tela de escolha (listras, aros…), 16 unidades de largura
// esc = tamanho da camisa em unidades do campo: 0.4 dá 16 de largura, 0.30 dá 12
function camisaPeca(c, num, sel, escala){
  const k = escala || 0.4;
  const meio = 20*k;                        // a forma tem 40 de largura
  const anel = meio*1.44;
  const id='vp'+c.id+'_'+Math.random().toString(36).slice(2,7);
  const a=c.cor||'#444', p=(typeof padraoDe==='function')?padraoDe(c.id):'solido';
  const claro=/FFF|F2B|F0E|7EA|D4A|FFC|F5C/i.test(a)&&p==='solido';
  const forma='M13 3 L20 6 L27 3 L37 9 L33 16 L31 14 L31 37 H9 V14 L7 16 L3 9 Z';
  return `${sel?`<circle r="${anel.toFixed(2)}" fill="none" stroke="#FFC233" stroke-width="${(1.4*k/0.4).toFixed(2)}" opacity=".95"><animate attributeName="r" values="${(anel*0.91).toFixed(2)};${(anel*1.04).toFixed(2)};${(anel*0.91).toFixed(2)}" dur="1.2s" repeatCount="indefinite"/></circle>`:''}
  <g transform="translate(${(-meio).toFixed(2)},${(-21*k).toFixed(2)}) scale(${k})">
    <defs><clipPath id="${id}"><path d="${forma}"/></clipPath></defs>
    <g clip-path="url(#${id})">${(typeof camisaFundo==='function')?camisaFundo(c):`<rect width="40" height="40" fill="${a}"/>`}</g>
    <path d="${forma}" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="20" y="28" text-anchor="middle" font-family="Barlow Condensed,sans-serif" font-size="16" font-weight="700"
      fill="${claro?'#111':'#fff'}" style="paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:1.4px">${num||''}</text>
  </g>`;
}

/* ---------- a tela ---------- */

function corEnergia(e){ return e>=65?'#4ED191':e>=40?'#F2C230':'#FF6B57'; }

/* ---------- as duas escalações, lado a lado ----------
   No Brasfoot o intervalo mostra os DOIS times com força e energia de cada um,
   e os lances no meio. Aqui só dava para ver o meu — não dava para saber se o
   adversário estava gastando, quem levou amarelo, quem marcou. */
function vestEscalacao(S, euMesmo){
  /* Quem foi expulso ou saiu machucado sem substituto continua na lista, apagado
     e com a marca vermelha. Sumindo, o time aparecia com dez nomes e não dava
     para entender por quê — como no Brasfoot, o nome fica lá, riscado. */
  const emC = S.emCampo;
  const sai = (S.sairam||[]).filter(u=>u.substituido);
  const linha = u => `<div class="vg-el${u.ca?' ca':''}${u.cv?' cv':''}${(u.fora&&!u.cv)?' cv':''}">
    <i class="pos ${u.slot}">${u.slot}</i>
    <b>${esc(nomeCampo(u.p,11))}</b>
    ${u.gols?`<em class="vg-bola">${u.gols>1?u.gols:''}●</em>`:''}
    <span class="vg-ef"><s>${u.p.ovr}</s><span class="vg-bar"><i style="width:${Math.round(clamp(u.energia,0,100))}%;background:${corEnergia(u.energia)}"></i></span></span>
  </div>`;
  return `<div class="vg-esc${euMesmo?' meu':''}">
    <div class="vg-esc-cab">${escudoSVG(S.clube,17)}<b>${esc(nomeExib(S.clube))}</b><i>${esc(S.tac.formacao)}</i></div>
    ${emC.map(linha).join('')}
    ${sai.length?`<div class="vg-saiu">saíram: ${sai.map(u=>esc(nomeCampo(u.p,11))).join(', ')}</div>`:''}
  </div>`;
}

/* os lances do jogo, do jeito que a gente lê uma súmula */
function vestLances(){
  const evs=(M.eventos||[]).filter(e=>e.t==='gol'||e.t==='ca'||e.t==='cv');
  if(!evs.length) return `<div class="vg-lances"><p class="empty" style="font-size:11px">Sem lances ainda.</p></div>`;
  return `<div class="vg-lances">${evs.map(e=>{
    const dir = e.side==='h' ? 'h' : 'a';
    const mark = e.t==='gol' ? '<em class="vg-bola">●</em>'
               : e.t==='cv' ? '<em class="vg-cv"></em>' : '<em class="vg-ca"></em>';
    return `<div class="vg-lance ${dir}"><span class="vg-min2">${e.min}'</span>${mark}<b>${esc(e.q||'')}</b></div>`;
  }).join('')}</div>`;
}

function telaVestiario(modo){
  if(!M) return;
  pararTick();
  VEST.modo = modo || VEST.modo || 'intervalo';
  const S=M.liveSide==='h'?M.h:M.a, O=M.liveSide==='h'?M.a:M.h;
  const c=S.clube;
  const W=100, H=126;
  const campo=S.emCampo.filter(u=>!u.fora);
  const numDe=u=>u.p.numero||'';
  /* As camisas ocupavam 23% da largura do campo cada uma: com quatro zagueiros
     na mesma linha as plaquinhas de nome se atropelavam e o goleiro ficava
     cortado na borda de baixo. Agora a peça inteira cabe em 15,6 de 100, e a
     posição é fechada numa faixa em que nada encosta na borda. */
  const pecas=campo.map(u=>{
    const cd=coordDe(S.tac, u.idx);

/* Trocar dois titulares de posição (o lateral vira zagueiro e vice-versa).
   Não gasta substituição: é só mudar quem ocupa cada casa da formação.
   As casas (slot e idx) ficam paradas; quem troca de casa é o jogador. */
function vestTrocarPosicao(idA, idB){
  const S=M.liveSide==='h'?M.h:M.a;
  const a=S.emCampo.find(x=>x.id===idA), b=S.emCampo.find(x=>x.id===idB);
  if(!a || !b || a===b || a.fora || b.fora) return false;
  const campos=['id','p','energia','ca','cv','nota','gols','assist','entrouMin','energiaInicio','improvisado','substituido'];
  campos.forEach(k=>{ const t=a[k]; a[k]=b[k]; b[k]=t; });
  // a escalação guardada acompanha, senão a próxima partida volta como era
  const t=S.tac && S.tac.titulares;
  if(t){ const i=t.indexOf(a.id), j=t.indexOf(b.id);
    if(i>=0 && j>=0){ const x=t[i]; t[i]=t[j]; t[j]=x; } }
  return true;
}

function vestToque(uid){
  // tocar num titular com outro já escolhido = trocar os dois de posição
  if(VEST.sai && VEST.sai!==uid && !VEST.entra){
    const S=M.liveSide==='h'?M.h:M.a;
    if(S.emCampo.some(x=>x.id===uid && !x.fora) && S.emCampo.some(x=>x.id===VEST.sai && !x.fora)){
      const a=S.emCampo.find(x=>x.id===VEST.sai), b=S.emCampo.find(x=>x.id===uid);
      const na=a?nomeCampo(a.p):'', nb=b?nomeCampo(b.p):'';
      if(vestTrocarPosicao(VEST.sai, uid)){
        VEST.sai=null; VEST.entra=null;
        toast(na+' e '+nb+' trocaram de posição.');
        desenharMatch(); telaVestiario(); return;
      }
    }
  }
  VEST.sai = VEST.sai===uid ? null : uid;
  VEST.entra = null;
  telaVestiario();
}

function vestBanco(pid){
  const S=M.liveSide==='h'?M.h:M.a;
  if(S.subs>=MAX_SUBS){ toast('Você já fez as '+MAX_SUBS+' trocas.'); return; }
  const p=S.banco.find(x=>x.id===pid); if(!p) return;
  if(p.lesao>0){ toast(p.nome+' está lesionado.'); return; }
  if(!VEST.sai){ toast('Primeiro toque em quem sai do campo.'); return; }
  VEST.entra = VEST.entra===pid ? null : pid;
  telaVestiario();
}

function vestConfirmar(){
  const S=M.liveSide==='h'?M.h:M.a;
  const u=S.emCampo.find(x=>x.id===VEST.sai), e=S.banco.find(p=>p.id===VEST.entra);
  VEST.sai=null; VEST.entra=null;
  if(u&&e&&fazerSub(M,S,u,e)){ addEvento(M.eventos[M.eventos.length-1]); desenharMatch(); }
  telaVestiario();
}

/* ---------- arrastar no vestiário ----------
   Arrastar do banco para um jogador em campo (ou o contrário) faz a troca na
   hora. O toque duplo continua valendo para quem preferir. */
let VDRAG = null;

function vestAlvoEm(x, y){
  const el = document.elementFromPoint(x, y);
  if(!el) return null;
  const campo = el.closest ? el.closest('[data-campo]') : null;
  if(campo) return {tipo:'campo', id:campo.getAttribute('data-campo'), el:campo};
  const banco = el.closest ? el.closest('[data-banco]') : null;
  if(banco) return {tipo:'banco', id:banco.getAttribute('data-banco'), el:banco};
  return null;
}

function vestFantasma(txt, x, y){
  let g = document.getElementById('vg-fantasma');
  if(!g){ g=document.createElement('div'); g.id='vg-fantasma'; g.className='vg-fantasma'; document.body.appendChild(g); }
  g.textContent = txt;
  g.style.left = x+'px'; g.style.top = y+'px';
  return g;
}

function vestLimpaDrag(){
  const g=document.getElementById('vg-fantasma'); if(g) g.remove();
  document.querySelectorAll('.vg-alvo').forEach(e=>e.classList.remove('vg-alvo'));
  VDRAG=null;
}

function vestArrastarInicio(ev){
  const sheet=document.getElementById('sheet-in'); if(!sheet) return;
  const alvo = vestAlvoEm(ev.clientX, ev.clientY);
  if(!alvo) return;
  const S = M && (M.liveSide==='h'?M.h:M.a); if(!S) return;
  let nome='';
  if(alvo.tipo==='campo'){ const u=S.emCampo.find(x=>x.id===alvo.id); nome=u?nomeCampo(u.p):''; }
  else { const p=S.banco.find(x=>x.id===alvo.id); nome=p?nomeCampo(p):''; }
  VDRAG = {de:alvo, x0:ev.clientX, y0:ev.clientY, moveu:false, nome};
}

function vestArrastarMove(ev){
  if(!VDRAG) return;
  const dx=ev.clientX-VDRAG.x0, dy=ev.clientY-VDRAG.y0;
  if(!VDRAG.moveu && Math.hypot(dx,dy) < 8) return;     // ainda pode ser um toque
  VDRAG.moveu = true;
  ev.preventDefault();
  vestFantasma(VDRAG.nome, ev.clientX, ev.clientY);
  document.querySelectorAll('.vg-alvo').forEach(e=>e.classList.remove('vg-alvo'));
  const sobre = vestAlvoEm(ev.clientX, ev.clientY);
  // acende o destino: troca (banco↔campo) ou mudança de posição (campo↔campo)
  if(sobre && sobre.id!==VDRAG.de.id && !(sobre.tipo==='banco' && VDRAG.de.tipo==='banco'))
    sobre.el.classList.add('vg-alvo');
}

function vestArrastarFim(ev){
  if(!VDRAG) return;
  const arrastou = VDRAG.moveu;
  const de = VDRAG.de;
  const sobre = arrastou ? vestAlvoEm(ev.clientX, ev.clientY) : null;
  vestLimpaDrag();
  if(!arrastou) return;                                  // foi toque: o onclick resolve
  if(!sobre) return;                                     // soltou no vazio
  // campo → campo: os dois trocam de posição, sem gastar substituição
  if(sobre.tipo==='campo' && de.tipo==='campo'){
    const S0 = M && (M.liveSide==='h'?M.h:M.a); if(!S0) return;
    const a=S0.emCampo.find(x=>x.id===de.id), b=S0.emCampo.find(x=>x.id===sobre.id);
    const na=a?nomeCampo(a.p):'', nb=b?nomeCampo(b.p):'';
    if(vestTrocarPosicao(de.id, sobre.id)){
      VEST.sai=null; VEST.entra=null;
      toast(na+' e '+nb+' trocaram de posição.');
      desenharMatch(); telaVestiario();
    }
    return;
  }
  if(sobre.tipo===de.tipo) return;                       // banco → banco não faz nada
  const idCampo = de.tipo==='campo' ? de.id : sobre.id;
  const idBanco = de.tipo==='banco' ? de.id : sobre.id;
  const S = M && (M.liveSide==='h'?M.h:M.a); if(!S) return;
  if(S.subs>=MAX_SUBS){ toast('Você já fez as '+MAX_SUBS+' trocas.'); return; }
  const p=S.banco.find(x=>x.id===idBanco);
  if(p && p.lesao>0){ toast(p.nome+' está lesionado.'); return; }
  VEST.sai=idCampo; VEST.entra=idBanco;
  vestConfirmar();
}

function vestLigarArrasto(){
  const sheet=document.getElementById('sheet-in'); if(!sheet || sheet._vdrag) return;
  sheet._vdrag = 1;
  sheet.addEventListener('pointerdown', vestArrastarInicio);
  sheet.addEventListener('pointermove', vestArrastarMove, {passive:false});
  sheet.addEventListener('pointerup', vestArrastarFim);
  sheet.addEventListener('pointercancel', vestLimpaDrag);
}

/* Quando o espaço do navegador aperta, a primeira coisa a sair é a narração
   guardada dos jogos antigos — ela só serve para rever a partida. */
function aliviarSave(L2){
  let n=0;
  Object.values(L2.comps||{}).forEach(c=>{
    Object.keys(c.resultados||{}).forEach(k=>{
      const r=c.resultados[k];
      if(r && r.eventos){ r.eventos=null; n++; }
    });
  });
  return n;
}

  if(lsSet(chave, L2)) return true;
  aliviarSave(L2);

    if(!_avisouEspaco){ _avisouEspaco=true;
      toast('Espaço curto no navegador: apaguei as narrações antigas.'); }

async function confirmarApagarSave(id){
  const x=listaSaves().find(y=>y.id===id); if(!x) return;
  if(!confirm(`Apagar a carreira de ${x.tecnico||'Técnico'} no ${x.clube||'clube'} (${x.temporada})?\n\nNão tem como voltar.`)) return;
  await apagarSave(id);
  if(L && L.saveId===id) L=null;
  fecharSheet(); renderStart();
}

function ordinal(n){return n+'º';}

function metaDiretoria(c){
  const meta = c.rep>=5?4 : c.rep===4?8 : c.rep===3?12 : c.rep===2?15 : 17;
  return {meta, paciencia:100, avisos:0};
}

function proximoJogo(){
  if(L.rodada>L.fixtures.length) return null;
  const jogos = L.fixtures[L.rodada-1];
  const g = jogos.find(x=>x.h===L.meuClube||x.a===L.meuClube);
  return g?{...g, rodada:L.rodada}:null;
}

function ultimosResultados(cid,n){
  const out=[];
  for(let r=L.rodada-1;r>=1&&out.length<n;r--){
    const jogos=L.fixtures[r-1]||[];
    const g=jogos.find(x=>x.h===cid||x.a===cid); if(!g)continue;
    const res=L.resultados[`r${r}_${g.h}_${g.a}`]; if(!res)continue;
    out.push({r,g,res});
  }
  return out;
}
