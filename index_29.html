function montarTemporada(L){
  // Carreira solo usa o mesmo calendário do mundo da liga com amigos (42 semanas,
  // sem estadual): Brasileirão A e B, Copa do Brasil, Libertadores, Sul-Americana,
  // as cinco ligas da Europa, Champions e Mundial.
  if(typeof montarTemporadaAmigos==='function'){
    if(!L.divisoes) L.divisoes = divisoesIniciais();
    L.divisoes.A.concat(L.divisoes.B).forEach(id=>garanteElenco(L,id));
    if(typeof SULAMERICANOS!=='undefined') SULAMERICANOS.forEach(c=>garanteElenco(L,c.id));
    if(typeof carregarEuropa==='function' && !L.clubs.some(c=>typeof ehEuropeu==='function' && ehEuropeu(c.id))) carregarEuropa(L);
    montarTemporadaAmigos(L);
    L.fimSlot = SEMANAS_AMIGOS;
    return;
  }
  const meu = CLUBE_POR_ID[L.meuClube];
  L.comps = {};

  /* estadual */
  const est = ESTADUAIS[meu.uf];
  if(est){
    const c = criarComp('estadual', est.nome, 'grupo+mata', est.ids.slice());
    const cr = cruzado(est.ids, L.seed+'-est');
    c.fixtures = cr.rodadas; c.grupos = cr.grupos;
    c.slots = AGENDA.estadual;
    c.ordemFases = ['quartas','semi','final'];
    c.semeadura = 'cruzado8'; c.classificados = 8; c.mandoTipo = 'unico';
    L.comps.estadual = c;
  }
  /* brasileirão: as duas divisões, com acesso e rebaixamento na virada */
  if(!L.divisoes) L.divisoes = divisoesIniciais();
  const bra = criarComp('brasileirao','Brasileirão Série A','liga', divisoes(L).A.slice());
  bra.fixtures = roundRobin(bra.clubes, 2);
  bra.slots = AGENDA.brasileirao; bra.div='A';
  L.comps.brasileirao = bra;
  const serb = criarComp('serieb','Brasileirão Série B','liga', divisoes(L).B.slice());
  serb.fixtures = roundRobin(serb.clubes, 2);
  serb.slots = AGENDA.brasileirao.slice(); serb.div='B';
  L.comps.serieb = serb;
  divisoes(L).B.forEach(id=>garanteElenco(L,id));

  /* as cinco ligas da Europa e a Champions rodam junto */
  Object.keys(LIGAS_EUROPA).forEach(k=>{
    const C=criarComp(k, LIGAS_EUROPA[k].nome, 'liga', clubesDaLigaEuropeia(k));
    C.fixtures=roundRobin(C.clubes,2); C.slots=AGENDA.brasileirao.slice();
    L.comps[k]=C;
  });
  (function(){
    const champ=[];
    Object.keys(LIGAS_EUROPA).forEach(k=>{
      const ids=clubesDaLigaEuropeia(k).slice()
        .sort((x,y)=>(CLUBE_POR_ID[y].niv||0)-(CLUBE_POR_ID[x].niv||0) || (x<y?-1:1));
      const ant = L.ligaAnterior && L.ligaAnterior[k];
      (ant && ant.length>=6 ? ant.slice(0,6) : ids.slice(0,6)).forEach(id=>champ.push(id));
    });
    const CH=montarCopaGrupos(L,'champions','Champions League', champ.slice(0,32),
      AGENDA.continental, '-chs'+L.temporada);
    L.comps.champions=CH;
  })();

  /* copa do brasil — 32 clubes a partir da terceira fase */
  const poolCopa = []
    .concat(SERIE_A.map(c=>c.id))
    .concat(['spo','cea','for','goi','cui','atg','vil','crb','ama','nau','ame','juv','cri']);
  const cb = criarComp('copabr','Copa do Brasil','mata', sorteia(poolCopa, 32, L.seed+'-cb'));
  cb.slots = AGENDA.copabr;
  cb.ordemFases = ['f1','oitavas','quartas','semi','final'];
  cb.mandoTipo = 'copa';
  L.comps.copabr = cb;

  /* continental */
  if(meu.cont==='lib' || meu.cont==='sul'){
    const ehLib = meu.cont==='lib';
    const brasil = SERIE_A.filter(c=>c.cont===meu.cont).map(c=>c.id);
    const estr = SULAMERICANOS.filter(c=>c.comp===meu.cont).map(c=>c.id);
    let pool = brasil.concat(estr);
    const alvo = 32;
    if(pool.length<alvo){
      const extras = SULAMERICANOS.filter(c=>!pool.includes(c.id)).map(c=>c.id)
        .concat(OUTROS_BR.filter(c=>c.niv>=60).map(c=>c.id));
      pool = pool.concat(extras.slice(0, alvo-pool.length));
    }
    pool = pool.slice(0,alvo);
    if(!pool.includes(L.meuClube)) pool[0]=L.meuClube;
    const co = criarComp('continental', ehLib?'Copa Libertadores':'Copa Sul-Americana','grupos+mata', pool);
    co.grupos = fazerGrupos(pool, 8, L.seed+'-co', L.meuClube);
    co.fixtures = gruposFixtures(co.grupos);
    co.slots = AGENDA.continental;
    co.ordemFases = ['oitavas','quartas','semi','final'];
    co.semeadura = 'grupo'; co.porGrupo = 2; co.mandoTipo = 'conti';
    L.comps.continental = co;
  }
  L.slot = 1;
  L.agendaMeu = montarAgendaMeu(L);
}


/* ---------- calendário da liga com amigos ----------
   42 semanas, sem estadual. Meio de semana de copa nunca cai junto com meio de
   semana de continental, então ninguém joga três vezes na mesma semana. */
const SEMANAS_AMIGOS = 42;
const SEM_RODADA = [14, 22, 30, 38];          // semanas só de copa

const AGENDA_MUNDO = {
  liga:        (()=>{ const a=[]; for(let s=1;s<=SEMANAS_AMIGOS;s++) if(SEM_RODADA.indexOf(s)<0) a.push(s); return a; })(),
  copabr:      {f1:[3,5], oitavas:[9,11], quartas:[17,19], semi:[25,27], final:[33,35]},
  continental: {grupo:[2,4,6,8,10,12], oitavas:[16,18], quartas:[20,22], semi:[28,30], final:[36]},
  sula:        {grupo:[2,4,6,8,10,12], oitavas:[16,18], quartas:[20,22], semi:[28,30], final:[34]},
  champions:   {grupo:[2,4,6,8,10,12], oitavas:[16,18], quartas:[20,22], semi:[28,30], final:[38]},
  intercont:   {semi:[40], final:[42]},
  /* Recopa: jogo único no começo da temporada entre o campeão da Libertadores
     e o campeão da Sul-Americana do ano passado. Era a peça que faltava para a
     Sula significar alguma coisa no ano seguinte. */
  recopa:      {final:[7]}
};

/* Quem vai para a Libertadores e para a Sul-Americana: a tabela da temporada
   passada. Na primeira, o que o clube era na vida real. */
/* ---------- quem vai para a Libertadores ----------
   Era só o G-6 da tabela. No futebol de verdade o campeão da Copa do Brasil
   entra direto, o vice vai para a pré, e os campeões continentais brasileiros
   também levam vaga — e cada um desses empurra a vaga da tabela para baixo
   (é por isso que se fala em G-7, G-8, G-9). Sem isso a Copa do Brasil era um
   torneio paralelo: dava dinheiro e taça, mas não mudava nada no ano seguinte. */
function vagasContinentais(L){
  const A = divisoes(L).A;
  const ant = L.classificacaoAnterior;
  const camp = L.campeoesAnteriores || {};
  const naA0 = (ant||[]).filter(id=>A.indexOf(id)>=0);
  if(ant && ant.length>=12){
    const lib=[], porQue={};
    /* Taça dá vaga mesmo fora da Série A. A regra antiga exigia estar na Série A
       para receber vaga, então quando a Copa do Brasil era ganha por um clube da
       Série B (ou por quem caiu no mesmo ano) o campeão era simplesmente
       ignorado e o VICE levava a vaga dele — o contrário do regulamento, que
       manda o campeão da Copa do Brasil pra Libertadores seja qual for a
       divisão. Classificação por posição continua sendo só da Série A. */
    const B = divisoes(L).B || [];
    const noBrasil = id => A.indexOf(id)>=0 || B.indexOf(id)>=0;
    const poe=(id,motivo,soSerieA)=>{
      const vale = soSerieA ? (A.indexOf(id)>=0) : noBrasil(id);
      if(id && vale && lib.indexOf(id)<0 && lib.length<6){ lib.push(id); porQue[id]=motivo; } };
    poe(camp.libertadores, 'campeão da Libertadores');
    poe(camp.sulamericana, 'campeão da Sul-Americana');
    poe(camp.copabr,       'campeão da Copa do Brasil');
    poe(camp.copabrVice,   'vice da Copa do Brasil', true);
    naA0.forEach((id,i)=>poe(id, (i+1)+'º no Brasileirão', true));
    L.porQueLib = porQue;
    const sul = naA0.filter(id=>lib.indexOf(id)<0).slice(0,8);
    return {lib, sul};
  }
  const lib = A.filter(id=>(CLUBE_POR_ID[id]||{}).cont==='lib');
  const sul = A.filter(id=>(CLUBE_POR_ID[id]||{}).cont==='sul');
  const resto = A.filter(id=>lib.indexOf(id)<0 && sul.indexOf(id)<0);
  return {lib: lib.concat(resto.slice(0, Math.max(0,6-lib.length))).slice(0,6),
          sul: sul.concat(resto.slice(Math.max(0,6-lib.length))).slice(0,8)};
}

function montarCopaGrupos(L, id, nome, pool, agenda, seed){
  const C = criarComp(id, nome, 'grupos+mata', pool.slice(0,32));
  C.grupos = fazerGrupos(C.clubes, 8, L.seed+seed);
  C.fixtures = gruposFixtures(C.grupos);
  C.slots = agenda;
  C.ordemFases = ['oitavas','quartas','semi','final'];
  C.semeadura = 'grupo'; C.porGrupo = 2; C.mandoTipo = 'conti';
  return C;
}

/* Monta a temporada inteira da liga com amigos: dois Brasileirões, Copa do
   Brasil, Libertadores, Sul-Americana, as cinco ligas da Europa, a Champions
   e o Mundial. Tudo semeado pelo código da liga — igual em todo aparelho. */
function montarTemporadaAmigos(L){
  L.comps = {};
  const d = divisoes(L);
  const slots = AGENDA_MUNDO.liga;

  const mkLiga=(id,nome,ids,div)=>{
    const C=criarComp(id, nome, 'liga', ids.slice());
    C.fixtures=roundRobin(C.clubes,2); C.slots=slots.slice(); if(div) C.div=div;
    return C;
  };
  L.comps.brasileirao = mkLiga('brasileirao','Brasileirão Série A', d.A, 'A');
  L.comps.serieb      = mkLiga('serieb','Brasileirão Série B', d.B, 'B');
  Object.keys(LIGAS_EUROPA).forEach(k=>{
    L.comps[k] = mkLiga(k, LIGAS_EUROPA[k].nome, clubesDaLigaEuropeia(k));
  });

  /* Copa do Brasil: 32 clubes das duas divisões */
  const poolCopa = sorteia(d.A.concat(d.B), 32, L.seed+'-cb'+L.temporada);
  const cb = criarComp('copabr','Copa do Brasil','mata', poolCopa);
  cb.slots = AGENDA_MUNDO.copabr;
  cb.ordemFases = ['f1','oitavas','quartas','semi','final'];
  cb.mandoTipo = 'copa';
  L.comps.copabr = cb;

  /* Libertadores e Sul-Americana */
  /* Ninguém joga as duas copas no mesmo ano. A lista da Sul-Americana era
     preenchida sem olhar quem já estava na Libertadores, então o mesmo clube
     entrava nas duas — e chegou a ganhar as duas na mesma temporada, o que
     ainda colocava o campeão da Sula no Mundial pela porta da Libertadores. */
  const vg = vagasContinentais(L);
  const sulEstr = SULAMERICANOS.filter(c=>c.comp==='lib').map(c=>c.id);
  const sulEstr2 = SULAMERICANOS.filter(c=>c.comp!=='lib').map(c=>c.id);
  const completa=(base, extras, n, fora)=>{
    const veta = id => (fora && fora.indexOf(id)>=0);
    const out=base.filter(id=>!veta(id));
    extras.forEach(id=>{ if(out.length<n && out.indexOf(id)<0 && !veta(id)) out.push(id); });
    SULAMERICANOS.forEach(c=>{ if(out.length<n && out.indexOf(c.id)<0 && !veta(c.id)) out.push(c.id); });
    return out.slice(0,n);
  };
  const naLib = completa(vg.lib, sulEstr, 32);
  L.comps.libertadores = montarCopaGrupos(L,'libertadores','Copa Libertadores',
    naLib, AGENDA_MUNDO.continental, '-lib'+L.temporada);
  /* Tirando quem foi para a Libertadores, sobravam 23 sul-americanos para a
     Sula — e 23 clubes em 8 grupos vira grupo de 2, onde todo mundo passa.
     Completa com os brasileiros que não pegaram vaga continental, como no
     futebol: a Sula é cheia de time de meio de tabela. */
  const sulLista = completa(vg.sul, sulEstr2, 32, naLib);
  if(sulLista.length<32){
    d.A.concat(d.B).forEach(id=>{
      if(sulLista.length<32 && sulLista.indexOf(id)<0 && naLib.indexOf(id)<0) sulLista.push(id); });
  }
  L.comps.sulamericana = montarCopaGrupos(L,'sulamericana','Copa Sul-Americana',
    sulLista, AGENDA_MUNDO.sula, '-sul'+L.temporada);

  /* Champions: os melhores colocados das cinco ligas europeias */
  const champ = [];
  Object.keys(LIGAS_EUROPA).forEach(k=>{
    const ids = clubesDaLigaEuropeia(k).slice()
      .sort((a,b)=>(CLUBE_POR_ID[b].niv||0)-(CLUBE_POR_ID[a].niv||0) || (a<b?-1:1));
    const ant = L.ligaAnterior && L.ligaAnterior[k];
    (ant && ant.length>=6 ? ant.slice(0,6) : ids.slice(0,6)).forEach(id=>champ.push(id));
  });
  L.comps.champions = montarCopaGrupos(L,'champions','Champions League',
    champ.slice(0,32), AGENDA_MUNDO.champions, '-ch'+L.temporada);

  L.slot = 1;
}

/* Mundial: campeão da Libertadores x campeão da Champions, mais dois convidados. */
function prepararMundial(L, slot){
  const A=AGENDA_MUNDO.intercont;
  if(slot < A.semi[0]) return;
  const lib = L.comps.libertadores && L.comps.libertadores.campeao;
  const ch  = L.comps.champions && L.comps.champions.campeao;
  if(!L.comps.intercont){
    if(!lib && !ch) return;
    const ic = criarComp('intercont','Mundial de Clubes','mata', []);
    ic.slots = A; ic.ordemFases = ['semi','final']; ic.mandoTipo = 'unico';
    /* O campeão da Sul-Americana NÃO joga o Mundial: ele joga a Recopa contra o
       campeão da Libertadores. Estava no Mundial por engano. */
    const convidados = INTERCONT.map(c=>c.id);
    const lista = [lib, ch, convidados[0], convidados[1]].filter(Boolean);
    while(lista.length<4) lista.push(convidados[lista.length%convidados.length]);
    ic.clubes = lista.slice(0,4);
    ic.chave.semi = [
      {h:ic.clubes[0], a:ic.clubes[3], legs:[], venc:null},
      {h:ic.clubes[1], a:ic.clubes[2], legs:[], venc:null}
    ];
    L.comps.intercont = ic;
  }
  const IC=L.comps.intercont;
  if(slot>=A.final[0] && IC.chave.semi && !IC.chave.final){
    const v=IC.chave.semi.map(m=>m.venc).filter(Boolean);
    if(v.length===2) IC.chave.final=[{h:v[0],a:v[1],legs:[],venc:null}];
  }
}

function sorteia(arr, n, seed){
  const r=rng(seed), a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a.slice(0,n);
}

function fazerGrupos(ids, n, seed, forcar){
  const r=rng(seed); const a=ids.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  if(forcar){ const k=a.indexOf(forcar); if(k>0){ [a[0],a[k]]=[a[k],a[0]]; } }
  const g=[]; for(let i=0;i<n;i++) g.push([]);
  a.forEach((id,i)=>g[i%n].push(id));
  return g;
}

function gruposFixtures(grupos){
  // 6 rodadas: ida e volta dentro de cada grupo de 4
  const rodadas=[[],[],[],[],[],[]];
  grupos.forEach(g=>{
    if(g.length<4) return;
    const rr = roundRobin(g,2);
    rr.forEach((jogos,i)=>{ rodadas[i]=rodadas[i].concat(jogos); });
  });
  return rodadas;
}

function montarAgendaMeu(L){
  const ag=[];
  const push=(slot,comp,fase,rodada)=>ag.push({slot,comp,fase,rodada});
  const c=L.comps;
  if(c.estadual) c.estadual.slots.grupo.forEach((s,i)=>{ if(c.estadual.fixtures[i]) push(s,'estadual','grupo',i); });
  c.brasileirao.slots.forEach((s,i)=>push(s,'brasileirao','liga',i));
  if(c.continental) c.continental.slots.grupo.forEach((s,i)=>push(s,'continental','grupo',i));
  ag.sort((a,b)=>a.slot-b.slot);
  return ag;
}

function tabelaComp(L, comp, filtroIds){
  const ids = filtroIds || comp.clubes;
  const t={}; ids.forEach(id=>t[id]={id,j:0,v:0,e:0,d:0,gp:0,gc:0,p:0,forma:[]});
  Object.keys(comp.resultados).forEach(k=>{
    const res=comp.resultados[k]; if(!res||res.mata) return;
    const [,h,a]=k.split('_');
    if(!t[h]||!t[a]) return;
    const H=t[h],A=t[a];
    H.j++;A.j++;H.gp+=res.hg;H.gc+=res.ag;A.gp+=res.ag;A.gc+=res.hg;
    if(res.hg>res.ag){H.v++;A.d++;H.p+=3;H.forma.push('V');A.forma.push('D');}
    else if(res.hg<res.ag){A.v++;H.d++;A.p+=3;A.forma.push('V');H.forma.push('D');}
    else {H.e++;A.e++;H.p++;A.p++;H.forma.push('E');A.forma.push('E');}
  });
  const arr=Object.values(t).map(x=>({...x,sg:x.gp-x.gc}));
  arr.sort((a,b)=>b.p-a.p||b.v-a.v||b.sg-a.sg||b.gp-a.gp||(a.id<b.id?-1:1));
  return arr;
}

/* Artilharia. Sem compId soma tudo (o artilheiro do ano); com compId mostra só
   os gols daquela competição, que é o que a tabela de cada torneio pede. */
function artilhariaGeral(L, compId){
  const arr=[];
  Object.keys(L.squads).forEach(cid=>L.squads[cid].forEach(p=>{
    const g = compId ? ((p.golsComp&&p.golsComp[compId])||0) : p.gols;
    if(g>0) arr.push({...p, clubId:cid, golsNaComp:g});
  }));
  arr.sort((a,b)=>b.golsNaComp-a.golsNaComp||b.assist-a.assist||a.jogos-b.jogos);
  return arr.slice(0,30);
}

function compsAtivas(L){ return Object.keys(L.comps).map(k=>L.comps[k]); }

function chave(comp, fase, rodada, h, a){ return `${fase}${rodada}_${h}_${a}`; }

/* Ordem fixa das competições: o mesmo em todo aparelho, senão os sorteios
   e as simulações saem diferentes entre os celulares da liga. */
const ORDEM_COMPS = ['brasileirao','serieb','copabr','recopa','libertadores','sulamericana',
                     'continental','intercont','champions',
                     'inglesa','espanhola','italiana','alema','francesa','estadual'];

function compsNaOrdem(L){
  const ids=Object.keys(L.comps||{});
  ids.sort((a,b)=>{
    const ia=ORDEM_COMPS.indexOf(a), ib=ORDEM_COMPS.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || (a<b?-1:1);
  });
  return ids.map(id=>L.comps[id]).filter(Boolean);
}

/* Quem manda no jogo de volta depende da competição:
   copa  → segundo jogo na casa de quem visitou primeiro
   conti → igual, mas a final é jogo único na ordem sorteada
   unico → sempre o mando do sorteio */
function mandoDoJogo(C, f, k, m){
  const t = C.mandoTipo || 'copa';
  if(t==='unico') return {h:m.h, a:m.a};
  if(t==='conti' && f==='final') return {h:m.h, a:m.a};
  return k===0 ? {h:m.h, a:m.a} : {h:m.a, a:m.h};
}

function fixturesDoSlot(L, slot){
  const out=[];
  compsNaOrdem(L).forEach(C=>{
    if(Array.isArray(C.slots)){                       // liga de pontos corridos
      const i=C.slots.indexOf(slot);
      if(i>=0 && C.fixtures[i]) out.push({comp:C, fase:'liga', rodada:i, jogos:C.fixtures[i]});
      return;
    }
    if(!C.slots) return;
    if(C.slots.grupo){
      const gi=C.slots.grupo.indexOf(slot);
      if(gi>=0 && C.fixtures[gi]) out.push({comp:C, fase:'grupo', rodada:gi, jogos:C.fixtures[gi]});
    }
    (C.ordemFases||[]).forEach(f=>{
      const k=C.slots[f]?C.slots[f].indexOf(slot):-1;
      if(k>=0 && C.chave[f]) out.push({comp:C, fase:f, rodada:k,
        jogos:C.chave[f].map(m=>mandoDoJogo(C,f,k,m))});
    });
  });
  return out;
}

function meusCompromissos(L, slot){
  const out=[];
  fixturesDoSlot(L, slot).forEach(bl=>{
    bl.jogos.forEach(g=>{
      if(!g||!g.h||!g.a) return;
      if(g.h===L.meuClube||g.a===L.meuClube){
        const k=chave(bl.comp, bl.fase, bl.rodada, g.h, g.a);
        if(!bl.comp.resultados[k]) out.push({comp:bl.comp, fase:bl.fase, rodada:bl.rodada, jogo:g, chave:k});
      }
    });
  });
  return out;
}

function proximoCompromisso(L){
  for(let s=L.slot; s<=fimSlot(L); s++){
    prepararSlot(L, s);
    const m=meusCompromissos(L, s);
    if(m.length) return Object.assign(m[0], {slot:s});
    if(s>L.slot) { /* nada a fazer neste slot para mim */ }
  }
  return null;
}

function prepararSlot(L, slot){
  if(typeof prepararRecopa==='function') prepararRecopa(L, slot);
  compsNaOrdem(L).forEach(C=>prepararComp(L, C, slot));
  if(L.comps.champions) prepararMundial(L, slot);
  else if(L.comps.continental) prepararIntercont(L, slot);
}

/* ---------- Recopa Sul-Americana ----------
   Jogo único, cedo na temporada: campeão da Libertadores contra campeão da
   Sul-Americana do ano passado. É a resposta para "ganhei a Sula e no ano
   seguinte ela não vale nada". Só existe a partir da segunda temporada. */
function prepararRecopa(L, slot){
  if(L.comps.recopa) return;
  const A = AGENDA_MUNDO && AGENDA_MUNDO.recopa;
  if(!A || slot < A.final[0]-1) return;
  const c = L.campeoesAnteriores || {};
  if(!c.libertadores || !c.sulamericana || c.libertadores===c.sulamericana) return;
  const rc = criarComp('recopa','Recopa Sul-Americana','mata',[c.libertadores, c.sulamericana]);
  rc.slots = A; rc.ordemFases = ['final']; rc.mandoTipo = 'unico';
  rc.chave.final = [{h:c.sulamericana, a:c.libertadores, legs:[], venc:null}];
  L.comps.recopa = rc;
}

/* Monta os confrontos de mata-mata de qualquer competição:
   quem se classifica da fase de grupos (ou da tabela) e quem avança de fase. */
function paresDaChave(cls, semeadura){
  const mk=(h,a)=>({h, a, legs:[], venc:null});
  if(semeadura==='cruzado8' && cls.length>=8){
    return [[0,7],[3,4],[1,6],[2,5]].map(([i,j])=>mk(cls[i], cls[j]));
  }
  if(semeadura==='grupo'){
    // primeiros e segundos de grupos diferentes; o primeiro decide em casa
    const n=cls.length/2, pri=[], seg=[];
    for(let i=0;i<cls.length;i+=2){ pri.push(cls[i]); seg.push(cls[i+1]); }
    const out=[];
    for(let i=0;i<n;i++) out.push(mk(seg[(i+1)%n], pri[i]));
    return out;
  }
  const out=[];
  for(let i=0;i+1<cls.length;i+=2) out.push(mk(cls[i], cls[i+1]));
  return out;
}

function classificadosDaComp(L, C){
  if(C.tipo==='mata') return C.clubes.slice();
  if(Array.isArray(C.grupos)){
    const cls=[], n=C.porGrupo||2;
    C.grupos.forEach(g=>{ const tb=tabelaComp(L,C,g); for(let k=0;k<n;k++) if(tb[k]) cls.push(tb[k].id); });
    return cls;
  }
  const tb=tabelaComp(L,C);
  return tb.slice(0, C.classificados||8).map(x=>x.id);
}

function prepararComp(L, C, slot){
  if(!C || C.campeao || Array.isArray(C.slots) || !C.slots) return;
  const seq=C.ordemFases||[];
  if(!seq.length) return;
  const prim=seq[0];
  if(!C.chave[prim] && C.slots[prim] && slot>=C.slots[prim][0]){
    const cls=classificadosDaComp(L, C);
    if(cls.length>=2){
      C.chave[prim]=paresDaChave(cls, C.semeadura);
      if(L.meuClube && C.tipo!=='mata' && cls.indexOf(L.meuClube)<0)
        C.meuStatus='eliminado na fase de grupos';
    }
  }
  for(let i=1;i<seq.length;i++){
    const f=seq[i], ant=seq[i-1];
    if(C.slots[f] && slot>=C.slots[f][0] && C.chave[ant] && !C.chave[f]){
      const v=C.chave[ant].map(m=>m.venc).filter(Boolean);
      if(v.length===C.chave[ant].length && v.length>=2){
        C.chave[f]=[];
        for(let k=0;k+1<v.length;k+=2) C.chave[f].push({h:v[k],a:v[k+1],legs:[],venc:null});
      }
    }
  }
}

function prepararIntercont(L, slot){
  if(slot<AGENDA.intercont.semi[0]) return;
  const CO=L.comps.continental;
  const campeaoLib = CO && CO.id==='continental' && CO.nome.indexOf('Libertadores')>=0 ? CO.campeao : null;
  if(!campeaoLib) return;
  if(!L.comps.intercont){
    const ic=criarComp('intercont','Copa Intercontinental','mata',[]);
    ic.slots=AGENDA.intercont; ic.ordemFases=['semi','final'];
    ic.mandoTipo='unico';
    const outros = INTERCONT.filter(c=>c.niv>=70).map(c=>c.id);
    ic.chave.semi=[{h:campeaoLib, a:pick(outros), legs:[], venc:null}];
    ic.clubes=[campeaoLib].concat(outros);
    L.comps.intercont=ic;
  }
  const IC=L.comps.intercont;
  if(slot>=IC.slots.final[0] && IC.chave.semi && !IC.chave.final){
    const v=IC.chave.semi[0].venc;
    if(v){ const eur=pick(EUROPEUS.map(c=>c.id));
      IC.chave.final=[{h:eur,a:v,legs:[],venc:null}]; IC.clubes.push(eur); }
  }
}

function registrarResultado(L, comp, fase, rodada, h, a, hg, ag, publico, eventos, extra){
  const k=chave(comp,fase,rodada,h,a);
  const mata = fase!=='liga' && fase!=='grupo';
  const r={hg,ag,publico,eventos,mata};
  if(extra){ if(extra.gs) r.gs=extra.gs; if(extra.sm) r.sm=extra.sm; }
  comp.resultados[k]=r;
  if(mata && comp.chave[fase]){
    const m=comp.chave[fase].find(x=>(x.h===h&&x.a===a)||(x.h===a&&x.a===h));
    if(m){ m.legs.push({h,a,hg,ag}); resolverConfronto(L, comp, fase, m); }
  }
}

function resolverConfrontoBase(L, comp, fase, m){
  const jogosNaFase = (comp.slots[fase]||[]).length;
  if(m.legs.length < jogosNaFase) return;
  let g1=0,g2=0;
  m.legs.forEach(l=>{ if(l.h===m.h){g1+=l.hg;g2+=l.ag;} else {g2+=l.hg;g1+=l.ag;} });
  if(g1>g2) m.venc=m.h;
  else if(g2>g1) m.venc=m.a;
  else { const p1=ri(3,6), p2=ri(3,6);
    m.penaltis = p1===p2 ? [p1+1,p2] : [p1,p2];
    m.venc = m.penaltis[0]>m.penaltis[1] ? m.h : m.a; }
  m.perd = m.venc===m.h?m.a:m.h;
  if(typeof premiar==='function') premiar(L, comp, m.venc, fase);
  if(fase==='final'){
    comp.campeao=m.venc;
    const cl=L.clubs.find(c=>c.id===m.venc);
    if(cl){ cl.titulos=cl.titulos||[]; cl.titulos.push({comp:comp.nome, ano:L.temporada}); }
    if(m.venc===L.meuClube){
      L.titulos=L.titulos||[]; L.titulos.push({comp:comp.nome, ano:L.temporada, id:comp.id});
      if(typeof repGanhouTitulo==='function') repGanhouTitulo(comp.nome);
      L.noticias.unshift({t:'led', txt:`🏆 ${clube(L.meuClube).nome} campeão — ${comp.nome} ${L.temporada}!`});
      if(typeof pagarTitulo==='function') pagarTitulo(L, comp.id, comp.nome);
    } else {
      /* O título do amigo paga o caixa DELE aqui também: senão o aparelho dele
         fica com 60 mi que os outros cinco não enxergam. */
      if(recebePremio(L, m.venc) && typeof pagarTituloClube==='function')
        pagarTituloClube(L, m.venc, comp.id);
      L.noticias.unshift({t:'', txt:`${clube(m.venc).nome} campeão — ${comp.nome} ${L.temporada}.`});
    }
  }
  if(m.perd===L.meuClube) comp.meuStatus='eliminado — '+(NOME_FASE[fase]||fase).toLowerCase();
}

function simularJogo(L, comp, fase, rodada, g){
  if(!g||!g.h||!g.a) return null;
  garanteElenco(L,g.h); garanteElenco(L,g.a);
  [g.h,g.a].forEach(id=>{ if(id!==L.meuClube){ const cl=L.clubs.find(x=>x.id===id);
    if(cl){ if(!cl.tactics) cl.tactics=tacticsPadrao(); cl.tactics.auto=true; } } });
  const P=criarPartida(L,g.h,g.a,null,comp&&comp.id);
  if(typeof ajustarAtmosfera==='function') ajustarAtmosfera(P, comp, fase, rodada);
  simularTudo(P);
  const humano = g.h===L.meuClube||g.a===L.meuClube;
  registrarResultado(L, comp, fase, rodada, g.h, g.a, P.hg, P.ag, P.publico,
    humano?compactar(P.eventos):null, extraDoJogo(L, comp, P, humano));
  return P;
}

/* O que fica guardado além do placar: autores dos gols nos jogos brasileiros e
   nas copas (é o que a tela da rodada mostra), e a súmula inteira nos meus. */
function extraDoJogo(L, comp, P, meu){
  const euro = !!(typeof LIGAS_EUROPA!=='undefined' && LIGAS_EUROPA[comp.id]);
  const out={};
  if(!euro || meu) out.gs = golsDe(P);
  if(meu) out.sm = sumulaDe(P);
  return out;
}

function simularRestoDoSlot(L, slot){
  fixturesDoSlot(L, slot).forEach(bl=>{
    bl.jogos.forEach(g=>{
      if(!g||!g.h||!g.a) return;
      const k=chave(bl.comp, bl.fase, bl.rodada, g.h, g.a);
      if(bl.comp.resultados[k]) return;
      simularJogo(L, bl.comp, bl.fase, bl.rodada, g);
    });
  });
}

function noticiaRodada(L){

}

function fecharTemporadaNovaBase(L){
  const tb=tabelaComp(L,L.comps.brasileirao);
  const minhaTb = (typeof tabela==='function') ? tabela(L) : tb;
  const pos = minhaTb.findIndex(x=>x.id===L.meuClube)+1;
  const minha = minhaTb[pos-1] || {p:0};
  L.temporadaFim=true;
  if(typeof registrarGaleria==='function') registrarGaleria(L);
  tb.forEach((x,i)=>{ const cl=L.clubs.find(c=>c.id===x.id); if(cl) cl.caixa+=premioPosicao(i+1); });
  if(L.comps.serieb){
    const tbB=tabelaComp(L,L.comps.serieb);
    tbB.forEach((x,i)=>{ const cl=L.clubs.find(c=>c.id===x.id); if(cl) cl.caixa+=Math.round(premioPosicao(i+1)*0.32); });
    L.balanco={ temporada:L.temporada, campeaoA:tb[0]?tb[0].id:null, campeaoB:tbB[0]?tbB[0].id:null,
      sobem:tbB.slice(0,4).map(x=>x.id), caem:tb.slice(-4).map(x=>x.id),
      minhaPos:pos||20, minhaDiv:(divisaoDe(L.meuClube,L)||'A'),
      pts:minha.p||0 };
    L.noticias.unshift({t:'', txt:`${clube(tbB[0].id).nome} é campeão da Série B e sobe para a elite.`});
  }
  const campeao=clube(tb[0].id);
  if(tb[0].id===L.meuClube){ L.titulos=L.titulos||[]; L.titulos.push({comp:'Brasileirão Série A',ano:L.temporada,id:'brasileirao'});
    if(typeof pagarTitulo==='function') pagarTitulo(L,'brasileirao','Brasileirão Série A');
    if(typeof repGanhouTitulo==='function') repGanhouTitulo('Brasileirão Série A'); }
  // a temporada fecha o balanço do técnico também
  if(typeof repFimDeTemporada==='function' && L.modo!=='amigos')
    repFimDeTemporada(pos||20, L.diretoria?L.diretoria.meta:12);
  L.historico.unshift({ano:L.temporada, campeao:campeao.nome, minhaPos:pos||20, pts:minha.p||0,
    div:(divisaoDe(L.meuClube,L)||'A'),
    titulos:(L.titulos||[]).filter(t=>t.ano===L.temporada).map(t=>t.comp)});
  L.noticias.unshift({t:'led',txt:`${campeao.nome} é campeão brasileiro de ${L.temporada}.`});
}

function jogosDoSlotComResultado(L, slot){
  const out=[];
  fixturesDoSlot(L, slot).forEach(bl=>{
    bl.jogos.forEach(g=>{
      if(!g||!g.h||!g.a) return;
      const k=chave(bl.comp,bl.fase,bl.rodada,g.h,g.a);
      const r=bl.comp.resultados[k];
      out.push({comp:bl.comp, fase:bl.fase, rodada:bl.rodada, h:g.h, a:g.a,
        hg:r?r.hg:null, ag:r?r.ag:null, temEventos:!!(r&&r.eventos), chave:k, slot});
    });
  });
  return out;
}

function ultimoSlotJogado(L){
  const fim=fimSlot(L);
  for(let s=Math.min(L.slot,fim); s>=1; s--){
    const j=jogosDoSlotComResultado(L,s);
    if(j.length && j.some(x=>x.hg!==null)) return s;
  }
  return 1;
}

let slotVisto=null;

function renderRodada(){

    <button class="btn pri wide" style="margin-top:12px" onclick="fecharSheet()">Continuar</button>`);
}

function aplicarSemana(L){
  const c=meuClube();
  const folha=folhaDe(c.id);
  const teto=tetoFolha(c);
  // finanças de todos os clubes brasileiros (TV, patrocínio, bilheteria, folha, estrutura)
  L.clubs.forEach(cl=>{
    if(typeof ehEuropeu==='function' && ehEuropeu(cl.id)) return;
    semanaFinanceira(cl, jogosEmCasaDoSlot(L, cl.id, L.slot));
  });
  if(folha>teto && L.slot%6===0) L.noticias.unshift({t:'bad',txt:`A diretoria cobrou pelo estouro da folha salarial (${dinheiro(folha)} contra teto de ${dinheiro(teto)}).`});
  // recuperação, evolução
  Object.keys(L.squads).forEach(cid=>{
    const meu = cid===L.meuClube;
    const treino = meu?L.treino:'equilibrado';
    L.squads[cid].forEach(p=>{
      p.energia=clamp(p.energia+recuperaSemana(p, treino),0,100);
      if(p.lesao>0) p.lesao=Math.max(0,p.lesao-1);
      let ganho=0;
      if(p.ovr<p.pot){
        /* Depois do pico não se evolui mais, só se mantém e cai. Antes um
           jogador de 31 anos com potencial sobrando ainda GANHAVA 1,3 por
           temporada contra 0,7 de declínio — saldo positivo. Era por isso que
           a faixa dos 30-32 acabava mais forte na nona temporada do que na
           primeira, e a liga inflava sem parar. */
        const picoIdade = p.pos==='GOL' ? 32 : 29;
        ganho = p.idade>picoIdade ? 0
              : (p.idade<=19?0.185:p.idade<=21?0.155:p.idade<=23?0.115:p.idade<=26?0.058:0.028)*(treino==='tatico'?1.3:treino==='finalizacao'&&['ATA','PON','MEI'].includes(p.pos)?1.4:1);
        ganho *= fatorDesempenho(p);
      }
      // temporada ruim faz veterano cair mais rápido
      if(p.jogos>=6 && p.idade>=29){
        const nota=p.notaSoma/p.jogos;
        if(nota<6.0) ganho -= (6.0-nota)*0.010;
      }
      // declínio: goleiro envelhece bem mais devagar; alvo é perda anual, não semanal
      const SEM=49, gol=p.pos==='GOL';
      const limiar = gol?33:30, taxa = gol?0.38:0.64, teto = gol?4.0:5.5;
      if(p.idade>=limiar) ganho -= Math.min(teto, taxa*(p.idade-limiar+1))/SEM;
      const d=aplicarEvolucao(p, ganho, treino, L.slot);
      if(d && meu) noticiaEvolucao(L, p, d);
      if(p.jogos===0) p.moral=clamp(p.moral-0.8,5,100);
    });
  });
  if(L.slot%3===0) mercadoIA();
  propostasPorMeus();
  if(L.slot%3===0) noticiaRodada(L);
  avisoContratos(L);
  if(typeof ajustarEstrelas==='function') ajustarEstrelas(L);   // garoto que virou craque ganha a estrela na virada da semana
  L.noticias=L.noticias.slice(0,16);
}

function fatorDesempenho(p){
  if(!p.jogos) return 0.22;                       // encostado quase não evolui
  const nota = p.notaSoma/p.jogos;
  let f = clamp(0.5 + (nota-5.7)*0.62, 0.3, 1.95);  // nota 6,4 ≈ 1,0 · nota 7,5 ≈ 1,6
  if(['ATA','PON','MEI'].includes(p.pos)){
    const part = (p.gols + p.assist*0.6) / Math.max(5, p.jogos);
    f *= 1 + clamp(part, 0, 0.85)*0.6;             // artilheiro evolui bem mais rápido
  }
  if(['GOL','ZAG','LAT','VOL'].includes(p.pos) && nota>=7) f *= 1.12;
  const ritmo = p.jogos / Math.max(1, L.slot-1);
  if(ritmo >= 0.75) f *= 1.12;                     // titular absoluto
  else if(ritmo < 0.3) f *= 0.7;
  /* Os multiplicadores se empilhavam: 1,95 × 1,51 × 1,12 × 1,12 = 3,7. Com isso
     um garoto de 19 anos subia 19 de força numa temporada só, e em oito
     temporadas a liga dobrava de craques (54 → 131). Artilheiro titular evolui
     rápido, mas não três vezes mais rápido que o normal. */
  return clamp(f, 0.2, 2.0);
}

/* Quanto vale levantar cada taça. O Rafael ganhou a Sul-Americana e não entrou
   um centavo: premiar() só conhecia 'continental', 'copabr' e 'estadual' — a
   Libertadores, a Sula, a Champions e o Mundial pagavam ZERO. */
const PREMIO_TITULO = {
  intercont:    80000000,
  champions:    90000000,
  libertadores: 60000000,
  copabr:       40000000,
  sulamericana: 25000000,
  continental:  30000000,
  recopa:        8000000,
  brasileirao:  24000000,   // já vem por posição; aqui é o bônus de campeão
  serieb:        6000000,
  estadual:      4000000
};

/* O peso de cada taça na confiança da diretoria e no tamanho da torcida. */
const PESO_TITULO = {
  intercont:3, champions:3, libertadores:3, brasileirao:3,
  copabr:2, sulamericana:2, continental:2,
  recopa:1, serieb:1, estadual:1
};

/* Quem recebe prêmio neste aparelho.
   Numa liga entre amigos CADA CELULAR recalcula o mundo inteiro, e o que
   mudava o caixa só do "meu clube" saía diferente em cada aparelho: o do Irmão
   creditava os 3 mi da Copa do Brasil ao Corinthians, os outros cinco não. O
   caixa desencontrado muda quem consegue pagar um lance, e aí os elencos — e
   a liga inteira — se separam. Prêmio de clube é do CLUBE, não do dono do
   aparelho: em modo amigos todo técnico humano recebe, em todo aparelho. */
function recebePremio(L, clubId){
  if(L.modo==='amigos') return !!(L.managers && L.managers[clubId]);
  return clubId===L.meuClube;
}

function premiar(L, comp, clubId, fase){
  if(!recebePremio(L, clubId)) return;
  const cl = clube(clubId); if(!cl) return;
  const porFase = {libertadores:5000000, sulamericana:2200000, champions:7000000, intercont:9000000};
  const base = comp.id==='continental'?4200000 : comp.id==='copabr'?3000000 : comp.id==='estadual'?900000
             : porFase[comp.id] || 0;
  const mult = {oitavas:1, quartas:1.6, semi:2.4, final:4}[fase]||1;
  const v=Math.round(base*mult);
  if(v>0){ cl.caixa+=v;
    if(clubId!==L.meuClube) return;
    L.noticias = L.noticias.filter(n=>n.premio!==comp.id);
    L.noticias.unshift({t:'good', premio:comp.id,
      txt:`${dinheiro(v)} de premiação pela vaga ${fase==='final'?'na final':'nas '+(NOME_FASE[fase]||fase).toLowerCase()} — ${comp.nome}.`}); }
}

function fecharSlot(L2){
  const r = fecharSlotBase(L2);
  try{
    if(L && L.modo!=='amigos' && !L.demitido && typeof avaliarDiretoriaNova==='function')
      avaliarDiretoriaNova();
    // outro clube pode bater na sua porta no meio da temporada
    if(L && L.modo!=='amigos' && !L.demitido && !L.semClube && typeof sondagemDaSemana==='function')
      sondagemDaSemana();
  }catch(e){}
  return r;
}

function demissaoNoFimDaTemporada(pos){
  if(!L.diretoria) return false;
  if(pos <= L.diretoria.meta+6) return false;
  demitido();
  return true;
}

function demitido(){
  if(L.demitido) return;
  const tb=tabela(L), pos=tb.findIndex(x=>x.id===L.meuClube)+1;
  if(typeof repDemitido==='function') repDemitido();
  L.demitido={de:L.meuClube, pos, temporada:L.temporada, slot:L.slot};
  L.noticias.unshift({t:'bad', txt:`O ${clube(L.meuClube).nome} demitiu você. ${pos}º lugar, meta era ${L.diretoria?ordinal(L.diretoria.meta):'—'}.`});
  salvar(true);
  telaRecolocacao();
}

function clubesQueChamam(){
  const antigo = clube(L.demitido.de) || meuClube();
  const base = (antigo.niv||70) - 5 - Math.min(6, Math.max(0, (L.demitido.pos||10)-8));
  const tb = tabela(L);
  const naLiga = (typeof divisoes==='function') ? divisoes(L).A.concat(divisoes(L).B) : null;
  const brasileiros = L.clubs.filter(c=>!ehEuropeu(c.id) && c.id!==L.demitido.de
    && (naLiga ? naLiga.indexOf(c.id)>=0
               : (L.comps.brasileirao ? L.comps.brasileirao.clubes.includes(c.id) : true)));
  const r = rng((L.seed||'x')+'#recol'+L.temporada+'_'+L.demitido.pos);
  const ord = brasileiros
    .map(c=>{
      const i = tb.findIndex(x=>x.id===c.id);
      return {c, dist: Math.abs((c.niv||70)-base), pos: i>=0?i+1:null};
    })
    .sort((a,b)=>a.dist-b.dist);
  const perto = ord.slice(0, 8);
  const escolhidos=[];
  while(escolhidos.length<3 && perto.length){
    escolhidos.push(perto.splice(Math.floor(r()*perto.length),1)[0]);
  }
  return escolhidos;
}

function telaRecolocacao(){
  if(!L.demitido) return;
  // a tela nova mostra reputação e as passagens; a antiga fica de reserva
  if(typeof telaMercadoDeTecnicos==='function') return telaMercadoDeTecnicos();
  const ofertas = clubesQueChamam();
  const antigo = clube(L.demitido.de);
  sheet('Você foi demitido', `
    <p class="sm" style="margin-bottom:10px">O <b>${esc(antigo?antigo.nome:'clube')}</b> encerrou seu ciclo — ${ordinal(L.demitido.pos)} lugar${L.diretoria?`, com meta de ${ordinal(L.diretoria.meta)}`:''}.</p>
    <p class="xs mut" style="margin-bottom:12px">Técnico bom não fica muito tempo parado. Três clubes ligaram:</p>
    <div class="stack" style="margin-bottom:12px">
      ${ofertas.map(o=>`<button class="plr" onclick="assumirNovoClube('${o.c.id}')">
        ${escudoSVG(o.c,26)}
        <span class="plr-n"><b>${esc(o.c.nome)}</b>
          <span>${esc(o.c.cidade)} · Série ${(typeof divisaoDe==='function'&&divisaoDe(o.c.id,L))||'A'}${o.pos?' · '+ordinal(o.pos)+'º na tabela':''} · elenco nível ${o.c.niv}</span></span>
        <span class="pill">Assumir</span></button>`).join('')}
    </div>
    <hr class="chalk" style="margin:12px 0">
    <button class="btn ghost wide" onclick="recomecarDoZero()">Apagar tudo e começar outra carreira</button>`);
}

function assumirNovoClube(cid){
  const c = clube(cid); if(!c) return;
  if(typeof trocarDeClube==='function') return trocarDeClube(cid, false);
  const antes = L.demitido ? L.demitido.de : null;
  L.meuClube = cid;
  L.demitido = null;
  L.propostas = [];
  L.diretoria = (typeof metaDiretoriaReal==='function') ? metaDiretoriaReal(c) : {meta:12, paciencia:100, avisos:0};
  L.diretoria.paciencia = 100; L.diretoria.avisos = 0;
  garanteElenco(L, cid); garanteTactics(L, cid);
  if(typeof aplicarTemaClube==='function') aplicarTemaClube(c);
  L.noticias.unshift({t:'led',
    txt:`Você é o novo técnico do ${c.nome}. A diretoria quer ${ordinal(L.diretoria.meta)} lugar.`});
  fecharSheet(); salvar(true);
  // se a demissão veio no fim da temporada, agora dá pra virar o ano
  if(L.temporadaFim && typeof novaTemporadaBase==='function'){
    try{ novaTemporadaBase(); }catch(e){}

let _filaFesta=[];

function festa(titulo, subtitulo, cor1, cor2){
  // nunca por cima de uma decisão: se tem janela aberta, a taça espera
  const sh=document.getElementById('sheet');
  if(document.querySelector('.festa') || (sh && sh.classList.contains('on'))){
    _filaFesta.push([titulo,subtitulo,cor1,cor2]);
    if(!document.querySelector('.festa')) setTimeout(()=>{ const n=_filaFesta.shift(); if(n) festa.apply(null,n); }, 1500);
    return;
  }
  const el=document.createElement('div');
  el.className='festa';
  const papel=[];
  for(let i=0;i<70;i++){
    const x=(i*13.7)%100, d=(i%9)*0.13, dur=2.6+((i%7)*0.28), w=5+(i%4)*2;
    const cor=[cor1, cor2, '#FFC233', '#fff'][i%4];
    papel.push(`<i style="left:${x.toFixed(1)}%;background:${cor};animation-delay:${d.toFixed(2)}s;animation-duration:${dur.toFixed(2)}s;width:${w}px;height:${w+3}px;transform:rotate(${(i*47)%360}deg)"></i>`);
  }
  el.innerHTML=`<div class="festa-papel">${papel.join('')}</div>
    <div class="festa-in">
      <div class="festa-luz"></div>
      <div class="festa-trofeu">${trofeuSVG('#FFC233',104)}</div>
      <div class="festa-eyebrow">Campeão</div>
      <h2 class="festa-tit">${esc(titulo)}</h2>
      <p class="festa-sub">${esc(subtitulo||'')}</p>
      <button class="btn pri">Erguer a taça</button>
    </div>`;
  const sair=()=>{
    if(!el.parentNode) return;
    el.remove();
    if(_filaFesta.length){ const n=_filaFesta.shift(); setTimeout(()=>festa.apply(null,n), 250); }
  };
  el.addEventListener('click', sair);            // toque em qualquer lugar fecha
  document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('on'));
  setTimeout(()=>{ if(el.parentNode) el.classList.add('calma'); }, 4200);
  setTimeout(sair, 9000);                        // e nunca fica presa
}


/* ---------- o que uma taça faz pelo clube ----------
   Ele foi campeão da Sul-Americana e a diretoria continuou em 63% ("confiança
   ruim"), porque a conta só olhava a posição no Brasileirão. Taça tem que
   mexer em três coisas: o caixa, a paciência da diretoria e o tamanho da
   torcida — e torcida maior é mais TV, mais patrocínio e estádio cheio. */
/* O dinheiro e a torcida do título, sem nada de pessoal: é o que precisa
   acontecer igual em todos os aparelhos da liga. 60 mi de Libertadores
   creditados em um celular só desalinhavam o campeonato inteiro. */
function pagarTituloClube(L, cid, compId){
  const cl = clube(cid); if(!cl) return;
  cl.caixa += (PREMIO_TITULO[compId] || 6000000);
  cl.torcida = clamp((cl.torcida||1) + (PESO_TITULO[compId]||1)*0.16, 1, 5);
}

function pagarTitulo(L, compId, nomeComp){
  const c = (typeof meuClube==='function') ? meuClube() : null;
  if(!c) return;
  const v = PREMIO_TITULO[compId] || 6000000;
  const peso = PESO_TITULO[compId] || 1;
  // a diretoria respira
  if(L.diretoria){
    L.diretoria.paciencia = clamp((L.diretoria.paciencia||70) + peso*14, 0, 100);
    L.diretoria.avisos = 0;
  }
  // e a torcida cresce: 1 a 5, a mesma escala que manda na TV e no patrocínio
  const antes = (typeof torcidaDe==='function') ? torcidaDe(c) : Math.round(c.torcida||1);
  pagarTituloClube(L, c.id, compId);             // caixa + torcida, igual em todo aparelho
  const depois = (typeof torcidaDe==='function') ? torcidaDe(c) : Math.round(c.torcida);
  L.noticias.unshift({t:'good',
    txt:`${dinheiro(v)} de premiação pelo título — ${nomeComp}. A diretoria respira.`});
  if(depois>antes){
    L.noticias.unshift({t:'good',
      txt:`A torcida do ${c.nome} cresceu com o título: mais sócio, mais TV e mais gente no ${nomeEstadio(c)}.`});
    const lot = c.estadio||0;
    if(lot < 78000) L.noticias.unshift({t:'',
      txt:`Com a torcida maior, ${nomeEstadio(c)} começou a ficar pequeno — dá para ampliar em Mais › Estádio.`});
  }
}
/* ===== 04-mercado ===== */
'use strict';

const JANELAS = [[1,6],[22,28]];

function janelaAberta(L){ return JANELAS.some(([a,b])=>L.slot>=a&&L.slot<=b); }

function proximaJanela(L){
  for(const [a,b] of JANELAS){ if(L.slot<a) return a; }
  return null;
}

function donoDe(pid){
  for(const cid in L.squads){ if(L.squads[cid].some(p=>p.id===pid)) return cid; }
  return null;
}

function importancia(cid, p){
  const el=L.squads[cid]||[]; if(!el.length) return .5;
  const melhores=el.slice().sort((a,b)=>b.ovr-a.ovr);
  const i=melhores.findIndex(x=>x.id===p.id);
  if(i<0) return .5;
  if(i<11) return 1;
  if(i<16) return .78;
  return .55;
}

function precoPedido(cid, p){
  if(p.pedido && cid===L.meuClube) return p.pedido;
  const imp=importancia(cid,p);
  const contrato = p.contrato<=1 ? .62 : p.contrato===2 ? .85 : 1.05;
  const listado = p.aVenda ? .82 : 1;
  const jovem = p.idade<=22 && p.pot-p.ovr>=6 ? 1.25 : 1;
  return Math.max(300000, Math.round(p.valor*(0.75+imp*0.75)*contrato*listado*jovem/100000)*100000);
}

function salarioPedido(p, meuClube){
  const c=clube(meuClube);
  const esc = c && c.escSal ? c.escSal : 1;
  const premio = 1.05 + (p.ovr>=78?0.20:p.ovr>=72?0.10:0.04);
  const base = Math.max(p.salario*1.05, salarioDe(p.ovr,p.idade)*esc);
  return Math.round(base*premio/1000)*1000;
}

function folhaDe(cid){ return (L.squads[cid]||[]).reduce((s,p)=>s+p.salario,0); }

/* Comprar um craque de 87+ da Europa não é impossível — é um projeto.
   O clube dele só senta para conversar se o seu já for grande: torcida, estádio,
   títulos ganhos por você e o continente conquistado. Quanto maior o jogador,
   mais projeto ele exige. Depois disso ainda tem que pagar caro e caber a folha. */
function pesoDoProjeto(){
  const c = clube(L.meuClube) || {};
  const tit = L.titulos || [];
  const brasileiros = tit.filter(t=>/Brasileir/i.test(t.comp)).length;
  const continentais = tit.filter(t=>/Libertadores|Mundial|Sul-Americana/i.test(t.comp)).length;
  return {
    torcida: (typeof torcidaDe==='function'?torcidaDe(c):3) - 3,   // −2 a +2
    estadio: c.estadio>=55000 ? 2 : c.estadio>=42000 ? 1 : 0,
    brasileiros: brasileiros*1.5,
    continentais: continentais*3,
    get total(){ return this.torcida + this.estadio + this.brasileiros + this.continentais; }
  };
}

function exigenciaDoCraque(ovr){ return Math.round((ovr-86)*1.8*10)/10; }   // 87 → 1.8 · 91 → 9

function faltaPraSonhar(ovr){
  const g = pesoDoProjeto(), falta = exigenciaDoCraque(ovr) - g.total;
  if(falta<=0) return null;
  const o=[];
  if(g.continentais===0) o.push('ganhar a Libertadores');
  if(g.brasileiros===0)  o.push('ser campeão brasileiro');
  if(g.estadio===0)      o.push('ampliar o estádio');
  return 'Para um jogador assim, seu clube ainda precisa de história: '+(o.slice(0,2).join(' ou ')||'mais títulos')+'.';
}

function avaliarProposta(cid, p, oferta, ofSalario){
  const pedido=precoPedido(cid,p);
  const imp=importancia(cid,p);
  const el=L.squads[cid]||[];
  const mesmaPos=el.filter(x=>x.pos===p.pos&&x.id!==p.id).length;
  const euro = ehEuropeu(cid);
  if(el.length<=17) return {ok:false, motivo:'O elenco já está no limite mínimo.'};
  if(euro && p.ovr>=87){
    const falta = faltaPraSonhar(p.ovr);
    if(falta) return {ok:false, motivo:falta};
  }
  if(mesmaPos<1 && imp===1) return {ok:false, motivo:`É o único ${p.pos} de nível no elenco.`};
  // craque da Europa sai por 50% acima do que pedem; os outros, 35%
  const exigido = euro ? (p.ovr>=87 ? 1.5 : 1.35) : 1.0;
  const razao=oferta/pedido;
  if(razao>=exigido) return {ok:true};
  if(!euro && razao>=0.82 && rnd()<0.55) return {ok:true};
  if(razao>=exigido*0.7) return {ok:false, contra:Math.round(pedido*exigido), motivo:euro?'Na Europa, só saem por muito mais.':'A diretoria quer mais.'};
  return {ok:false, motivo:'Proposta muito abaixo do que pedem.'};
}

function contratarLivre(pid){
  const p=livre(pid); if(!p){ toast('Esse jogador já assinou com outro clube.'); fecharSheet(); render(); return; }
  const c=meuClube();
  if(elenco(c.id).length>=30){ toast('Elenco cheio (30 jogadores).'); return; }
  const teto=tetoFolha(c);
  if(folhaDe(c.id)+p.salario > teto*1.25){
    toast('A diretoria não libera: estouraria demais a folha.'); return; }
  L.livres = L.livres.filter(x=>x.id!==pid);
  p.contrato = 2+Math.floor(rnd()*3); p.semClube=0; p.aVenda=false;
  p.moral = clamp(p.moral+14,0,100); p.energia=100;

function enviarProposta(pid, sal){
  const p=jog(pid), dono=donoDe(pid), c=meuClube();
  const oferta=Math.max(0, Math.round(+($('of-valor').value||0)));
  if(oferta>c.caixa){ toast('Caixa insuficiente: falta '+dinheiro(oferta-c.caixa)); return; }
  if(elenco(c.id).length>=40){ toast('Elenco cheio (máximo de 40).'); return; }
  const r=avaliarProposta(dono,p,oferta,sal);
  if(!r.ok){
    sheet('Proposta recusada', `<p class="sm" style="margin-bottom:12px">O <b>${esc(clube(dono).nome)}</b> recusou. ${esc(r.motivo||'')}</p>
      ${r.contra?`<div class="card flat" style="margin-bottom:12px"><div class="between sm">
        <span class="mut">Aceitam por</span><span class="mono">${dinheiro(r.contra)}</span></div></div>
        <button class="btn pri wide" ${r.contra>c.caixa?'disabled':''} onclick="fecharNegocio('${pid}',${r.contra},${sal})">
          ${r.contra>c.caixa?'Caixa insuficiente':'Aceitar contraproposta'}</button>`:''}
      <button class="btn ghost wide" style="margin-top:8px" onclick="fecharSheet()">Desistir</button>`);
    return;
  }
  // agora o jogador decide
  const folhaNova=folhaDe(c.id)+sal;
  const euro=ehEuropeu(dono);
  const titulos=(L.titulos||[]).length;
  const quer = folhaNova<=tetoFolha(c)*1.35
    && (euro ? (c.torcida>=4 && (p.ovr<=82 || titulos>0) && rnd()<0.72)
             : (c.torcida>=clube(dono).torcida-1 || rnd()<.5));
  if(!quer){
    sheet('Jogador recusou', `<p class="sm" style="margin-bottom:12px"><b>${esc(p.nome)}</b> não se convenceu do projeto${euro?' — sair da Europa para o Brasil pesa muito na conversa':' — o salário oferecido não cobre o que ele pede'}.</p>
      <button class="btn wide" onclick="fecharSheet()">Entendi</button>`);
    return;
  }
  fecharNegocio(pid, oferta, sal);
}

function fecharNegocio(pid, valor, sal){
  const p=jog(pid), dono=donoDe(pid), c=meuClube(), o=clube(dono);
  c.caixa-=valor; o.caixa+=valor;
  L.squads[dono]=L.squads[dono].filter(x=>x.id!==pid);
  p.aVenda=false; p.salario=sal; p.contrato=Math.max(3,p.contrato); p.moral=clamp(p.moral+10,0,100);
  L.squads[c.id].push(p);
  L.noticias.unshift({t:'good',txt:`${p.nome} (${p.pos}, ${p.ovr}) assina com o ${c.nome} por ${dinheiro(valor)}.`});
  garanteTactics(L,c.id); garanteTactics(L,dono);
  fecharSheet(); salvar(true); toast('Contratado: '+p.nome); render();
}

function renovar(pid){

/* ---------- quem compra os meus ----------
   Ele listou seis jogadores por preço camarada e NINGUÉM apareceu a temporada
   inteira. Duas causas: a conta antiga quase não olhava o preço (um jogador
   pela metade do valor tinha praticamente a mesma chance de um pelo dobro), e
   qualquer clube com dinheiro no caixa servia de comprador — inclusive quem
   não precisava daquela posição, o que fazia a proposta nunca sair.
   Agora o preço manda e manda forte: pela metade do valor ele sai na semana;
   pelo dobro, não sai nunca. E quem liga é clube que precisa da posição e tem
   o tamanho do jogador. */
function chanceDeVenda(p, pedido){
  const ratio = p.valor>0 ? pedido/p.valor : 1;
  return clamp(1.25 - ratio*0.62, 0.04, 0.92);
}

function compradoresPara(p, pedido, donoId){
  const niv = id => (typeof nivelClube==='function') ? nivelClube(id) : 70;
  return (L.clubs||[]).filter(o=>{
    if(!o || o.id===donoId) return false;
    if(typeof ehHumano==='function' && ehHumano(o.id)) return false;
    const sq=L.squads[o.id]||[]; if(!sq.length || sq.length>=34) return false;
    if((o.caixa||0) < pedido*1.05) return false;
    const n=niv(o.id);
    if(p.ovr > n+8) return false;     // craque não vai parar em time pequeno
    if(p.ovr < n-10) return false;    // e time grande não compra reserva fraco
    return true;
  });
}

function propostasPorMeus(){
  const c=meuClube(); if(!c) return;
  if(!janelaAberta(L)) return;
  const alvos=elenco(c.id).filter(p=>p.aVenda||(p.ovr>=74&&rnd()<.10));
  alvos.forEach(p=>{
    const pedido=precoPedido(c.id,p);
    const chance = p.aVenda ? chanceDeVenda(p, pedido) : 0.16;
    if(rnd()>chance) return;
    const todos=compradoresPara(p, pedido, c.id);
    if(!todos.length) return;
    // quem está curto naquela posição liga primeiro
    const precisam=todos.filter(o=>(L.squads[o.id]||[]).filter(x=>x.pos===p.pos).length<=2);
    const o=pick(precisam.length?precisam:todos);
    // preço camarada faz o comprador cobrir o pedido; preço salgado faz pechinchar
    const ratio = p.valor>0 ? pedido/p.valor : 1;
    const base = ratio<0.85 ? (1.0+rnd()*0.18) : (0.82+rnd()*0.32);
    const oferta=Math.round(pedido*base);
    L.propostas=L.propostas||[];
    if(L.propostas.some(x=>x.pid===p.id)) return;
    L.propostas.push({pid:p.id, clubId:o.id, valor:oferta});
  });
  if(L.propostas&&L.propostas.length) enfileirar(mostrarProposta);
}

function mostrarProposta(){
  if(!L.propostas||!L.propostas.length) return;
  const n=L.propostas[0];
  const p=jog(n.pid); const o=clube(n.clubId);
  if(!p||donoDe(n.pid)!==L.meuClube){ L.propostas.shift(); return mostrarProposta(); }
  sheet('Proposta recebida', `
    <p class="sm" style="margin-bottom:12px">O <b>${esc(o.nome)}</b> ofereceu <b>${dinheiro(n.valor)}</b> por <b>${esc(p.nome)}</b> (${p.pos}, ${p.ovr}, ${p.idade} anos).</p>
    <div class="card flat" style="margin-bottom:12px">
      <div class="between sm"><span class="mut">Valor de mercado</span><span class="mono">${dinheiro(p.valor)}</span></div>
      <div class="between sm"><span class="mut">Sai da folha</span><span class="mono">${dinheiro(p.salario)}/mês</span></div>
      <div class="between sm"><span class="mut">Caixa depois da venda</span><span class="mono">${dinheiro(meuClube().caixa+n.valor)}</span></div></div>
    <div class="stack">
      <button class="btn pri wide" onclick="aceitarProposta()">Aceitar e vender</button>
      <button class="btn wide" onclick="recusarProposta()">Recusar</button></div>`);
}

function aceitarProposta(){
  const n=L.propostas.shift();
  const p=jog(n.pid), c=meuClube(), o=clube(n.clubId);
  c.caixa+=n.valor; o.caixa-=n.valor;
  L.squads[c.id]=L.squads[c.id].filter(x=>x.id!==n.pid);
  p.aVenda=false; L.squads[n.clubId].push(p);
  L.noticias.unshift({t:'bad',txt:`${p.nome} foi vendido ao ${o.nome} por ${dinheiro(n.valor)}.`});
  garanteTactics(L,c.id); fecharSheet(); salvar(); toast('Venda concluída.'); render();
  if(L.propostas.length) enfileirar(mostrarProposta);
}

function recusarProposta(){ L.propostas.shift(); fecharSheet(); toast('Proposta recusada.'); if(L.propostas.length) enfileirar(mostrarProposta); }

function mercadoIA(){
  if(!janelaAberta(L)) return;
  L.clubs.forEach(c=>{
    if(c.id===L.meuClube || ehEuropeu(c.id)) return;
    const el=L.squads[c.id]; if(!el) return;
    if(el.length>26 && rnd()<.4){ const fraco=el.slice().sort((a,b)=>a.ovr-b.ovr)[0]; if(fraco) fraco.aVenda=true; }
    if(rnd()<.10 && c.caixa>12000000){
      const alvos=[];
      L.clubs.forEach(o=>{ if(o.id===c.id||o.id===L.meuClube||ehEuropeu(o.id)) return;
        (L.squads[o.id]||[]).forEach(p=>{ if(p.aVenda&&precoPedido(o.id,p)<c.caixa*.35) alvos.push({p,o}); }); });
      if(alvos.length){
        const x=pick(alvos), preco=precoPedido(x.o.id,x.p);
        if((L.squads[x.o.id]||[]).length>18){
          c.caixa-=preco; x.o.caixa+=preco;
          L.squads[x.o.id]=L.squads[x.o.id].filter(y=>y.id!==x.p.id);
          x.p.aVenda=false; L.squads[c.id].push(x.p);
          garanteTactics(L,c.id); garanteTactics(L,x.o.id);
        }
      }
    }
  });
}

const JANELAS_AMIGOS = [[1,6],[19,24]];

function janelaAmigos(L){ return !L.temporadaFim && JANELAS_AMIGOS.some(([a,b])=>L.slot>=a&&L.slot<=b); }

function proxJanelaAmigos(L){ for(const [a] of JANELAS_AMIGOS){ if(L.slot<a) return a; } return null; }

function meusLances(){ L.lances=L.lances||{}; const k=chaveOrdem(L.meuClube); return (L.lances[k]=L.lances[k]||[]); }

function lanceDe(pid){ return meusLances().find(x=>x.pid===pid); }

function totalLances(){ return meusLances().reduce((s,x)=>s+x.valor,0); }

function minhasVendas(){ L.vendas=L.vendas||{}; return (L.vendas[L.meuClube]=L.vendas[L.meuClube]||{}); }

function precoListado(pid){ const d=donoDe(pid); const v=(L.vendas||{})[d]; return v?v[pid]:undefined; }

function ehHumano(cid){ return !!(L.managers&&L.managers[cid]); }

function telaLance(pid){
  const p=jog(pid), dono=donoDe(pid), c=meuClube();
  const humano=ehHumano(dono);
  const listado=precoListado(pid);
  const pedido = humano ? (listado!==undefined?listado:null) : precoPedido(dono,p);
  const atual=lanceDe(pid);
  const sug = pedido!==null ? pedido : Math.round(p.valor*1.2/100000)*100000;
  sheet('Lance por '+esc(p.nome), `
    <div class="card flat" style="margin-bottom:12px">
      <div class="between sm"><span class="mut">Clube</span><span>${esc(clube(dono).nome)}${humano?' · '+esc(L.managers[dono].nome||'amigo'):''}</span></div>
      ${pedido!==null
        ? `<div class="between sm"><span class="mut">${humano?'Mínimo pedido':'Preço pedido'}</span><span class="mono" style="color:var(--led)">${dinheiro(pedido)}</span></div>`
        : `<div class="between sm"><span class="mut">Situação</span><span class="mono" style="color:var(--danger)">Não está na lista</span></div>`}
      <div class="between sm"><span class="mut">Valor de mercado</span><span class="mono">${dinheiro(p.valor)}</span></div>
      <div class="between sm"><span class="mut">Salário que vai pedir</span><span class="mono">${dinheiro(salarioPedido(p,c.id))}/mês</span></div>
      <div class="between sm"><span class="mut">Seu caixa</span><span class="mono">${dinheiro(c.caixa)}</span></div>
      ${totalLances()?`<div class="between sm"><span class="mut">Já comprometido em lances</span><span class="mono">${dinheiro(totalLances())}</span></div>`:''}
    </div>
    ${humano&&pedido===null?`<p class="sm mut" style="margin-bottom:12px">O técnico do ${esc(clube(dono).nome)} ainda não colocou esse jogador na lista de negociação. Você pode deixar o lance mesmo assim — se ele listar antes de a rodada rodar, o lance vale.</p>`:''}
    <label class="fld" style="margin-bottom:10px"><span>Seu lance pelo passe</span>
      <input class="inp mono" id="lc-valor" type="number" step="100000" value="${atual?atual.valor:sug}"></label>
    <div class="seg" style="margin-bottom:12px">
      <button onclick="setLance(${Math.round(sug*0.85)})">-15%</button>
      <button onclick="setLance(${sug})">${pedido!==null?'Pedido':'Sugerido'}</button>
      <button onclick="setLance(${Math.round(sug*1.15)})">+15%</button>
      <button onclick="setLance(${Math.round(sug*1.4)})">+40%</button>
    </div>
    <p class="xs mut" style="margin-bottom:12px">Os lances de todos os técnicos são abertos juntos quando a rodada rodar. O maior lance leva — se dois amigos quiserem o mesmo jogador, quem pagar mais fica com ele.</p>
    <button class="btn pri wide" onclick="confirmarLance('${pid}')">${atual?'Mudar meu lance':'Deixar lance'}</button>
    ${atual?`<button class="btn ghost wide" style="margin-top:8px" onclick="tirarLance('${pid}')">Retirar lance</button>`:''}`);
}

function setLance(v){ const el=$('lc-valor'); if(el) el.value=v; }

function confirmarLance(pid){
  const v=Math.max(0,Math.round(+(($('lc-valor')||{}).value||0)));
  const c=meuClube();
  if(v<=0){ toast('Coloque um valor.'); return; }
  const outros=totalLances()-(lanceDe(pid)?lanceDe(pid).valor:0);
  if(v+outros>c.caixa){ toast('Seus lances passam do caixa: sobra '+dinheiro(Math.max(0,c.caixa-outros))); return; }
  if(elenco(c.id).length>=40){ toast('Elenco cheio (máximo de 40).'); return; }
  const a=lanceDe(pid);
  if(a) a.valor=v; else meusLances().push({pid, valor:v});
  fecharSheet(); salvar(true); toast('Lance registrado.'); render();
  if(L.online){ if(meuOkOnline()) setTimeout(avisoCodigo,300); else publicarMercadoVivo(); }
  else if(L.ordens[chaveOrdem(L.meuClube)]) setTimeout(avisoCodigo,300);
}

function tirarLance(pid){
  const k=chaveOrdem(L.meuClube);
  L.lances[k]=meusLances().filter(x=>x.pid!==pid);
  fecharSheet(); salvar(true); render(); if(L.online) publicarMercadoVivo();
}

function avisoCodigo(){
  if(L.online){ toast('Você mudou depois do OK — dê OK de novo pra valer.'); publicarMercadoVivo(); return; }
  toast('Mande o código de novo para seus amigos.');
}

function publicarMercadoVivo(){
  if(!L||!L.online||!ON||!FB.uid||!L.meuClube) return;
  const lc={}; meusLances().forEach(x=>{ lc[x.pid]=x.valor; });
  const up={}; up['vendas/'+L.meuClube]=minhasVendas(); up['lances/'+L.meuClube]=lc;
  try{ fbRef().update(up).catch(()=>{}); }catch(e){}
}

function telaListar(pid){
  const p=jog(pid);
  const atual=minhasVendas()[pid];
  const sug=Math.round(precoPedido(L.meuClube,p)/100000)*100000;
  sheet('Colocar na lista', `
    <div class="card flat" style="margin-bottom:12px">
      <div class="between sm"><span class="mut">Jogador</span><span><b>${esc(p.nome)}</b> · ${p.pos} ${p.ovr}</span></div>
      <div class="between sm"><span class="mut">Valor de mercado</span><span class="mono">${dinheiro(p.valor)}</span></div>
      <div class="between sm"><span class="mut">Sai da folha</span><span class="mono">${dinheiro(p.salario)}/mês</span></div>
    </div>
    <label class="fld" style="margin-bottom:12px"><span>Preço mínimo que você aceita</span>
      <input class="inp mono" id="vd-valor" type="number" step="100000" value="${atual!==undefined?atual:sug}"></label>
    <p class="xs mut" style="margin-bottom:12px">Quando a rodada rodar, o maior lance que bater esse mínimo leva o jogador — e o dinheiro cai no seu caixa. Abaixo disso, ninguém tira ele de você.</p>
    <button class="btn pri wide" onclick="confirmarLista('${pid}')">${atual!==undefined?'Mudar preço':'Colocar na lista'}</button>
    ${atual!==undefined?`<button class="btn ghost wide" style="margin-top:8px" onclick="retirarLista('${pid}')">Tirar da lista</button>`:''}`);
}

function confirmarLista(pid){
  const v=Math.max(0,Math.round(+(($('vd-valor')||{}).value||0)));
  if(v<=0){ toast('Coloque um preço.'); return; }
  minhasVendas()[pid]=v;
  const p=jog(pid); if(p) p.aVenda=true;
  fecharSheet(); salvar(true); toast(jog(pid).nome+' está na lista por '+dinheiro(v)); render();
  if(L.online){ if(meuOkOnline()) setTimeout(avisoCodigo,300); else publicarMercadoVivo(); }
  else if(L.ordens[chaveOrdem(L.meuClube)]) setTimeout(avisoCodigo,300);
}

function retirarLista(pid){
  delete minhasVendas()[pid];
  const p=jog(pid); if(p) p.aVenda=false;
  fecharSheet(); salvar(true); render(); if(L.online) publicarMercadoVivo();
}

  if(!L.ordens[chaveOrdem(L.meuClube)]){ telaEnviarOrdens(); return; }
  const ate=coberturaAte(L.meuClube);
  const cod=codigoOrdens(L.meuClube, ate);
  sheet('Seu código da rodada', `
    <p class="sm" style="margin-bottom:10px">Escalação da rodada <b>${L.slot}</b> até a <b>${ate}</b>${meusLances().length?` e <b>${meusLances().length}</b> ${meusLances().length===1?'lance':'lances'}`:''}.</p>
    <div class="card flat" style="margin-bottom:10px"><p class="mono xs" style="word-break:break-all">${esc(cod)}</p></div>
    <button class="btn pri wide" onclick="copiar(${JSON.stringify(cod)})">Copiar código</button>
    <p class="xs mut" style="margin-top:10px">Toda vez que você mexer nos lances ou na lista de negociação, mande o código novo no grupo — é ele que leva suas jogadas de mercado para o celular dos outros.</p>`);
}

function resolverMercadoAmigos(slot){
  const out=[];
  if(!L.lances) L.lances={};
  if(!L.vendas) L.vendas={};
  if(!janelaAmigos(L)){ mercadoIAAmigos(); return out; }

  const porPid={};
  Object.keys(L.managers).sort().forEach(cid=>{
    (L.lances['r'+slot+'_'+cid]||[]).forEach(x=>{
      if(!x||!x.pid||!(x.valor>0)) return;
      const p=jog(x.pid); if(!p) return;
      const dono=donoDe(x.pid); if(!dono||dono===cid) return;
      (porPid[x.pid]=porPid[x.pid]||[]).push({cid, valor:Math.round(x.valor), ia:false});
    });
  });
  lancesDaIA(slot, porPid);
  const maxDe=pid=>porPid[pid].reduce((m,x)=>Math.max(m,x.valor),0);
  const pids=Object.keys(porPid).sort((a,b)=> maxDe(b)-maxDe(a) || (a<b?-1:1));

  pids.forEach(pid=>{
    const p=jog(pid); if(!p) return;
    const dono=donoDe(pid); if(!dono) return;
    const humano=ehHumano(dono);
    const minimo = humano ? vendasNoSlot(dono, slot)[pid] : null;
    const bids=porPid[pid].slice().sort((x,y)=> y.valor-x.valor || (x.cid<y.cid?-1:1));
    let fechado=false;
    bids.forEach(b=>{
      if(fechado) return;
      const comp=clube(b.cid), vend=clube(dono);
      if(!comp||!vend) return;
      const elC=L.squads[b.cid]||[], elD=L.squads[dono]||[];
      if(elC.length>=40){ out.push({t:'x',pid,nome:p.nome,cid:b.cid,motivo:'elenco cheio'}); return; }
      if(elD.length<=17){ out.push({t:'x',pid,nome:p.nome,cid:b.cid,motivo:'o elenco do vendedor está no limite'}); return; }
      if(comp.caixa<b.valor){ out.push({t:'x',pid,nome:p.nome,cid:b.cid,motivo:'caixa insuficiente'}); return; }
      let aceita;
      if(humano) aceita = (minimo!==undefined && minimo!==null && b.valor>=minimo);
      else aceita = avaliarProposta(dono,p,b.valor,salarioPedido(p,b.cid)).ok;
      if(!aceita){
        out.push({t:'x',pid,nome:p.nome,cid:b.cid,
          motivo: humano ? (minimo===undefined||minimo===null?'não está na lista de negociação':'lance abaixo do mínimo pedido')
                         : 'o clube recusou'});
        return;
      }
      comp.caixa-=b.valor; vend.caixa+=b.valor;
      L.squads[dono]=L.squads[dono].filter(x=>x.id!==pid);
      p.aVenda=false; p.salario=salarioPedido(p,b.cid);
      p.contrato=Math.max(3,p.contrato||3); p.moral=clamp(p.moral+10,0,100);
      L.squads[b.cid].push(p);
      if(L.vendas[dono]) delete L.vendas[dono][pid];
      if(L.vendasSlot && L.vendasSlot['r'+slot+'_'+dono]) delete L.vendasSlot['r'+slot+'_'+dono][pid];
      garanteTactics(L,b.cid); garanteTactics(L,dono);
      fechado=true;
      const rivais=bids.filter(x=>x.cid!==b.cid).length;
      out.push({t:'ok',pid,nome:p.nome,pos:p.pos,ovr:p.ovr,cid:b.cid,de:dono,valor:b.valor,rivais,ia:!!b.ia});
      L.noticias.unshift({t:'good',
        txt:`${p.nome} (${p.pos} ${p.ovr}) sai do ${vend.nome} para o ${comp.nome} por ${dinheiro(b.valor)}.`});
    });
  });

  // os lances ficam guardados: é o que permite recalcular a rodada se alguém
  // rodou com um código velho (ver ressincronizar)
  mercadoIAAmigos();
  return out;
}


/* ---------- competição de mercado ----------
   Os clubes da máquina também disputam quem está na lista de negociação.
   Tudo sorteado pelo gerador semeado da rodada, então dá igual em todo celular. */
function precisaDe(cid, pos){
  const el=L.squads[cid]||[];
  const bons=el.filter(x=>x.pos===pos && x.ovr>=nivelClube(cid)-3).length;
  return bons<=1 ? 1.25 : bons<=2 ? 1.0 : 0.7;
}

function nivelClube(cid){
  const el=(L.squads[cid]||[]).slice().sort((a,b)=>b.ovr-a.ovr).slice(0,11);
  return el.length ? el.reduce((s,x)=>s+x.ovr,0)/el.length : 60;
}

/* Só o que os técnicos humanos colocaram na lista daquela rodada — lido do
   retrato da rodada, nunca do estado ao vivo, senão cada celular veria uma
   lista diferente e os resultados deixariam de bater. */
function listadosDaRodada(slot){
  const out=[];
  Object.keys(L.managers||{}).sort().forEach(dono=>{
    const v = (L.vendasSlot||{})['r'+slot+'_'+dono] || {};
    Object.keys(v).sort().forEach(pid=>{
      const p=jog(pid); if(!p) return;
      if(donoDe(pid)!==dono) return;
      if(!(v[pid]>0)) return;
      out.push({pid, dono, minimo:v[pid]});
    });
  });
  return out.sort((a,b)=> (jog(b.pid).ovr - jog(a.pid).ovr) || (a.pid<b.pid?-1:1));
}

function lancesDaIA(slot, porPid){
  const compradores = clubesDaLiga().filter(c=>!ehHumano(c.id));
  if(!compradores.length) return;
  listadosDaRodada(slot).forEach(item=>{
    const p=jog(item.pid); if(!p) return;
    const dono=item.dono;
    const nivelP=p.ovr;
    // quem tem caixa, vaga e precisa da posição entra na disputa
    const cands = compradores.filter(c=>{
      if(c.id===dono) return false;
      const el=L.squads[c.id]||[];
      if(el.length>=38) return false;
      if(nivelClube(c.id) > nivelP + 4) return false;          // não compra quem é pior que o elenco
      if(nivelClube(c.id) < nivelP - 9) return false;          // nem quem é longe demais
      return c.caixa >= item.minimo*1.05;
    });
    if(!cands.length) return;
    cands.sort((a,b)=> b.caixa-a.caixa || (a.id<b.id?-1:1));
    const quantos = Math.min(cands.length, rnd()<0.55 ? 1 : rnd()<0.85 ? 2 : 3);
    for(let k=0;k<quantos;k++){
      const c = cands[Math.floor(rnd()*Math.min(6,cands.length))];
      if(!c) continue;
      const fome = precisaDe(c.id, p.pos);
      const disposto = Math.min(c.caixa*0.55, p.valor * (0.92 + rnd()*0.42) * fome);
      if(disposto < item.minimo) continue;
      const valor = Math.round(Math.max(item.minimo, item.minimo*(1 + rnd()*0.12))/100000)*100000;
      const lista = (porPid[item.pid]=porPid[item.pid]||[]);
      if(lista.some(x=>x.cid===c.id)) continue;
      lista.push({cid:c.id, valor, ia:true});
    }
  });
}

/* Quantos clubes estão de olho num jogador que você listou — aparece na tela
   de mercado antes de a rodada rodar, pra dar peso à decisão de vender. */
function sondagensPor(pid){
  const p=jog(pid); if(!p) return [];
  const dono=donoDe(pid);
  let minimo=(L.vendas&&L.vendas[dono])?L.vendas[dono][pid]:undefined;
  if(minimo===undefined && p.aVenda && dono===L.meuClube) minimo=precoPedido(dono,p);   // carreira solo
  if(minimo===undefined) return [];
  const amigos = Object.keys(L.managers||{}).filter(cid=>{
    if(cid===dono) return false;
    const lc=(typeof ON!=='undefined'&&ON&&ON.lances)?(ON.lances[cid]||{}):null;
    return lc && lc[pid]!==undefined;
  }).map(cid=>({cid, humano:true}));
  const maq = clubesDaLiga().filter(c=>{
    if(c.id===dono || ehHumano(c.id)) return false;
    const el=L.squads[c.id]||[];
    if(el.length>=38 || c.caixa < minimo*1.05) return false;
    const n=nivelClube(c.id);
    return n <= p.ovr+4 && n >= p.ovr-9;
  }).sort((a,b)=>b.caixa-a.caixa).slice(0,4).map(c=>({cid:c.id, humano:false}));
  return amigos.concat(maq);
}

function mercadoIAAmigos(){
  if(!janelaAmigos(L)) return;
  const livres=clubesDaLiga().filter(c=>!ehHumano(c.id));
  livres.forEach(c=>{
    const el=L.squads[c.id]; if(!el) return;
    if(el.length>26 && rnd()<.30){ const fraco=el.slice().sort((a,b)=>a.ovr-b.ovr)[0]; if(fraco) fraco.aVenda=true; }
    if(rnd()<.09 && c.caixa>15000000){
      const alvos=[];
      livres.forEach(o=>{ if(o.id===c.id) return;
        (L.squads[o.id]||[]).forEach(p=>{ if(p.aVenda&&precoPedido(o.id,p)<c.caixa*.35) alvos.push({p,o}); }); });
      if(alvos.length){
        alvos.sort((a,b)=> b.p.ovr-a.p.ovr || (a.p.id<b.p.id?-1:1));
        const x=alvos[Math.floor(rnd()*Math.min(5,alvos.length))];
        const preco=precoPedido(x.o.id,x.p);
        if((L.squads[x.o.id]||[]).length>18 && (L.squads[c.id]||[]).length<38){
          c.caixa-=preco; x.o.caixa+=preco;
          L.squads[x.o.id]=L.squads[x.o.id].filter(y=>y.id!==x.p.id);
          x.p.aVenda=false; L.squads[c.id].push(x.p);
          garanteTactics(L,c.id); garanteTactics(L,x.o.id);
        }
      }
    }
  });
}

function seloRodada(slot){
  if(!L.comps || !L.comps.brasileirao) return '----';
  const partes=[];
  fixturesDoSlot(L, slot).forEach(bl=>{
    (bl.jogos||[]).forEach(g=>{
      if(!g||!g.h||!g.a) return;
      const r=bl.comp.resultados[chave(bl.comp,bl.fase,bl.rodada,g.h,g.a)];
      partes.push(bl.comp.id+g.h+g.a+(r?r.hg+'-'+r.ag:'x'));
    });
  });
  if(!partes.length) return '----';
  const s=partes.join('|');
  const AL='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let h=hashStr(s), out='';
  for(let i=0;i<4;i++){ out+=AL[h%32]; h=Math.floor(h/32); }
  return out;
}

function ressincronizar(){
  const alvo=L.slot;
  const guardado={ ordens:L.ordens, lances:L.lances, vendas:L.vendas, vendasSlot:L.vendasSlot,
    managers:L.managers, meuClube:L.meuClube, nome:L.nome, seed:L.seed, code:L.code,
    treino:L.treino };
  montarLigaAmigos(guardado.seed, guardado.code, guardado.nome);
  L.ordens=guardado.ordens; L.lances=guardado.lances; L.vendas=guardado.vendas;
  L.vendasSlot=guardado.vendasSlot; L.managers=guardado.managers;
  L.meuClube=guardado.meuClube; L.treino=guardado.treino;
  Object.keys(L.managers).forEach(cid=>garanteTactics(L,cid));
  let g=0;
  while(L.slot<alvo && L.slot<=fimSlot(L) && g++<80) rodarUmaRodadaAmigos();
  if(L.slot>fimSlot(L)) fecharTemporadaAmigos();
  // devolve os marcadores de "à venda" do que ainda está listado
  Object.keys(L.vendas||{}).forEach(cid=>Object.keys(L.vendas[cid]||{}).forEach(pid=>{
    const p=jog(pid); if(p) p.aVenda=true; }));
  aplicarTemaClube(meuClube());
  salvar(true); fecharSheet(); render();
  sheet('Liga recalculada', `
    <p class="sm" style="margin-bottom:12px">Refiz da rodada 1 até a ${ultimaRodadaJogada()}. Compare os selos com seus amigos:</p>
    <div class="card flat" style="margin-bottom:12px">
      ${(()=>{const ate=ultimaRodadaJogada(), o=[];
        for(let r=Math.max(1,ate-4); r<=ate; r++) o.push(`<div class="between sm"><span class="mut">Rodada ${r}</span>
          <span class="mono" style="font-size:16px;font-weight:600;letter-spacing:.12em">${seloRodada(r)}</span></div>`);
        return o.join('');})()}
    </div>
    <button class="btn pri wide" onclick="fecharSheet()">Beleza</button>`);
}

function rodarUmaRodadaAmigos(){
  const slot=L.slot, transfs=[];
  R.r = rng(L.seed+'#m'+slot);
  resolverMercadoAmigos(slot).forEach(t=>transfs.push(t));
  R.r=Math.random;
  Object.keys(L.managers).forEach(cid=>{
    const o=L.ordens[chaveOrdem(cid, slot)];
    if(o&&o.tac){ const cl=clube(cid); cl.tactics=JSON.parse(JSON.stringify(o.tac));
      cl.tactics.auto=false; cl.tactics.rodizio=false; normalizarBanco(cid, cl.tactics); }
  });
  if(typeof aplicarAcoesDaSemana==='function') aplicarAcoesDaSemana(slot);
  R.r = rng(L.seed+'#r'+slot);
  simularSemanaAmigos(L, slot);
  R.r = rng(L.seed+'#s'+slot);
  aplicarSemanaAmigos();
  L.slot++;
  R.r = rng(L.seed+'#p'+L.slot);
  prepararSlot(L, L.slot);
  R.r=Math.random;
  return transfs;
}

/* Todos os jogos da semana, em todas as competições, sempre na mesma ordem. */
function simularSemanaAmigos(L2, slot){
  fixturesDoSlot(L2, slot).forEach(bl=>{
    (bl.jogos||[]).forEach(g=>{
      if(!g||!g.h||!g.a) return;
      const ch=chave(bl.comp, bl.fase, bl.rodada, g.h, g.a);
      if(bl.comp.resultados[ch]) return;
      garanteElenco(L2, g.h); garanteElenco(L2, g.a);
      // a narração só é guardada para os MEUS jogos: é o único replay que este
      // aparelho vai abrir, e guardar a de todo mundo estoura o espaço do celular
      const meu = (g.h===L2.meuClube || g.a===L2.meuClube);
      const P=criarPartida(L2,g.h,g.a,null);
      /* A artilharia por competição vivia vazia na liga com amigos ("ninguém
         marcou ainda nesta competição" na semana 8, com a rodada cheia de
         gols): o gol não sabia de que campeonato era. Só este campo, nunca
         compId — ver criarPartida. */
      P.compGols = bl.comp.id;
      if(typeof ajustarAtmosfera==='function') ajustarAtmosfera(P, bl.comp, bl.fase, bl.rodada);
      simularTudo(P);
      registrarResultado(L2,bl.comp,bl.fase,bl.rodada,g.h,g.a,P.hg,P.ag,
        P.publico, meu?compactar(P.eventos):null, extraDoJogo(L2, bl.comp, P, meu));
    });
  });
}

function batedorFalta(S){
  if(S.instr && S.instr.falta){
    const b=S.emCampo.find(u=>u.id===S.instr.falta && !u.fora);
    if(b) return b;
  }
  const cands=S.emCampo.filter(u=>!u.fora && u.slot!=='GOL');
  if(!cands.length) return null;
  const nota=u=>u.p.ovr*( {MEI:1.12, PON:1.06, ATA:1.02, VOL:0.98, LAT:0.94, ZAG:0.88}[u.slot] || 1 )
             + (u.p.estrela==='falta'?14:0);
  return cands.sort((a,b)=>nota(b)-nota(a))[0];
}

function chanceFalta(bat){
  if(!bat) return 0.05;
  let c = 0.045 + (bat.p.ovr-70)*0.0042;
  if(bat.p.estrela==='falta') c += 0.075;
  return clamp(c, 0.02, 0.22);
}
