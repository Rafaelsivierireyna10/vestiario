<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b14"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Vestiário">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230B6B45%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2216%22 fill=%22%23fff%22/%3E%3Cpath d=%22M32 20l8 6-3 10H27l-3-10z%22 fill=%22%230f1b14%22/%3E%3C/svg%3E">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<title>Vestiário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --ground:#E9EDE8; --surface:#FFFFFF; --surface2:#F2F6F1; --raise:#FFFFFF;
  --ink:#0E1712; --ink2:#33443B; --muted:#63736A; --line:#D2DAD2; --line2:#E3E9E2;
  --pitch:#0B6B45; --pitch-soft:#DCEDE3; --led:#C77A05; --led-soft:#FBEDD3;
  --ok:#15803D; --warn:#B45309; --danger:#B3261E; --danger-soft:#FBE4E1;
  --shadow:0 1px 2px rgba(14,23,18,.07), 0 6px 20px -12px rgba(14,23,18,.28);
  --board:#0B1410; --board-ink:#FFC233; --board-dim:#6A7A6E;
  --acc:#0B6B45; --acc-soft:#DCEDE3; --acc-ink:#FFFFFF;
  --clube1:#0B6B45; --clube2:#FFFFFF;
  --r:12px; --r-sm:8px;
  --fx:'Barlow Condensed',"Arial Narrow",system-ui,sans-serif;
  --fb:'Barlow',system-ui,-apple-system,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#08100C; --surface:#111A15; --surface2:#16211B; --raise:#1A261F;
    --ink:#E7EEE8; --ink2:#B9C7BE; --muted:#87988D; --line:#22322A; --line2:#1B2822;
    --pitch:#35B478; --pitch-soft:#123024; --led:#FFC233; --led-soft:#2E2308;
    --ok:#43BE7B; --warn:#E0A02E; --danger:#F0685C; --danger-soft:#341613;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.8);
    --acc:#35B478; --acc-soft:#123024;
  }
}
:root[data-theme="dark"]{
  --acc:#35B478; --acc-soft:#123024;
  --ground:#08100C; --surface:#111A15; --surface2:#16211B; --raise:#1A261F;
  --ink:#E7EEE8; --ink2:#B9C7BE; --muted:#87988D; --line:#22322A; --line2:#1B2822;
  --pitch:#35B478; --pitch-soft:#123024; --led:#FFC233; --led-soft:#2E2308;
  --ok:#43BE7B; --warn:#E0A02E; --danger:#F0685C; --danger-soft:#341613;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--fb);
  font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  overscroll-behavior-y:none;}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
h1,h2,h3,h4{margin:0;font-family:var(--fx);font-weight:700;line-height:1.1;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--ground);
  display:flex;flex-direction:column;position:relative;
  box-shadow:0 0 0 1px var(--line2);}
.scr{flex:1;padding:12px 14px 96px;display:none;flex-direction:column;gap:14px}
.scr.on{display:flex}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  padding:10px 14px;}
.top::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:linear-gradient(90deg,var(--clube1) 0 50%,var(--clube2) 50% 100%)}
.crest{width:30px;height:30px;border-radius:7px;flex:none;display:grid;place-items:center;
  font-family:var(--fx);font-weight:700;font-size:13px;letter-spacing:.02em;color:#fff}
.top-mid{min-width:0;flex:1}
.top-club{font-family:var(--fx);font-weight:700;font-size:17px;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.top-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-cash{font-family:var(--fm);font-size:12.5px;font-weight:500;text-align:right;flex:none;
  font-variant-numeric:tabular-nums}
.top-cash small{display:block;font-family:var(--fb);font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:600}

/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;gap:3px;
  background:var(--surface);border-top:2px solid var(--acc);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  max-width:560px;margin:0 auto;box-shadow:0 -6px 18px -12px rgba(0,0,0,.5)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
  padding:7px 2px 5px;border-radius:11px;color:var(--ink2);min-height:52px;justify-content:center}
.nav button svg{width:21px;height:21px;stroke-width:1.8}
.nav button span{font-family:var(--fx);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.nav button[aria-current="true"]{color:var(--acc-ink);background:var(--acc);
  box-shadow:0 4px 12px -4px var(--acc)}
.nav button[aria-current="true"] svg{stroke-width:2.4}
.nav button[aria-current="true"] span{font-weight:700}
.dotk{display:none}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card.flat{background:var(--surface2);border-color:var(--line2)}
.eyebrow{font-family:var(--fx);font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
.chalk{border:0;border-top:1px dashed var(--line);margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.sm{font-size:12.5px}
.xs{font-size:11px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 15px;border-radius:10px;background:var(--surface2);
  border:1px solid var(--line);font-family:var(--fx);font-weight:600;font-size:15px;
  letter-spacing:.04em;text-transform:uppercase;min-height:44px;}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);
  box-shadow:0 3px 0 0 rgba(0,0,0,.18)}
.btn.pri:active{box-shadow:0 1px 0 0 rgba(0,0,0,.18)}
.btn.led{background:var(--led);border-color:var(--led);color:#1A1204}
.btn.wide{width:100%}
.btn.sm{padding:7px 11px;min-height:34px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.ghost{background:transparent}

.seg{display:flex;background:var(--surface2);border:1px solid var(--line);
  border-radius:10px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;padding:8px 7px;border-radius:7px;
  font-family:var(--fx);font-weight:600;font-size:13px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);
  border-bottom:2px solid var(--acc)}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:999px;
  font-family:var(--fx);font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.pill.g{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.pill.a{background:var(--led-soft);border-color:transparent;color:var(--led)}
.pill.r{background:var(--danger-soft);border-color:transparent;color:var(--danger)}

/* position tag */
.pos{font-family:var(--fx);font-size:10.5px;font-weight:700;letter-spacing:.06em;
  width:32px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none;color:#fff}
.pos.GOL{background:#9A6B00}.pos.ZAG{background:#1F5FA8}.pos.LAT{background:#2E7FBE}
.pos.VOL{background:#1E7A5A}.pos.MEI{background:#2C9A6E}.pos.PON{background:#8B5CC7}
.pos.ATA{background:#C0392B}

/* meters */
.meter{height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:1;min-width:26px}
.meter i{display:block;height:100%;border-radius:2px;background:var(--pitch)}
.meter.low i{background:var(--danger)}
.meter.mid i{background:var(--warn)}

/* player row */
.plr{display:flex;align-items:center;gap:9px;padding:9px 4px;width:100%;text-align:left;
  border-bottom:1px solid var(--line2)}
.plr:last-child{border-bottom:0}
.plr-n{flex:1;min-width:0}
.plr-n b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plr-n span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovr{font-family:var(--fm);font-weight:600;font-size:15px;width:26px;text-align:right;flex:none}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:var(--fx);font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 3px;
  border-bottom:1px solid var(--line)}
.tbl th:nth-child(2){text-align:left}
.tbl td{padding:7px 3px;text-align:right;border-bottom:1px solid var(--line2);
  font-family:var(--fm);font-variant-numeric:tabular-nums;font-size:12.5px}
.tbl td:nth-child(2){text-align:left;font-family:var(--fb);font-size:13.5px}
.tbl tr.me td{background:var(--acc-soft)}
.tbl tr.me td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.tbl tr.me td:nth-child(2){font-weight:700}
.zn{display:inline-block;width:3px;height:15px;border-radius:2px;margin-right:6px;
  vertical-align:-3px;background:transparent}
.zn.lib{background:var(--pitch)}.zn.sul{background:#2E7FBE}.zn.reb{background:var(--danger)}
.tbl-wrap{overflow-x:auto}

/* scoreboard (committed dark component, both themes) */
.board{background:var(--board);border-radius:var(--r);padding:12px 14px;position:relative;
  overflow:hidden;border:1px solid #1D2A22}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.board::before{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;
  background:
   radial-gradient(28px 14px at 14% 100%, rgba(255,194,51,.14), transparent 70%),
   radial-gradient(28px 14px at 50% 100%, rgba(255,194,51,.10), transparent 70%),
   radial-gradient(28px 14px at 86% 100%, rgba(255,194,51,.14), transparent 70%)}
.board-row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.board-team{flex:1;min-width:0;font-family:var(--fx);font-weight:700;font-size:14.5px;
  letter-spacing:.02em;text-transform:uppercase;color:#DCE6DE;line-height:1.06;
  overflow-wrap:normal;word-break:normal;hyphens:none;max-height:2.2em;overflow:hidden}
.board-team.r{text-align:right}
.board-score{font-family:var(--fm);font-weight:600;font-size:30px;color:var(--board-ink);
  letter-spacing:.04em;flex:none;font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px rgba(255,194,51,.35)}
.board-clock{position:relative;z-index:1;text-align:center;font-family:var(--fm);font-size:12px;
  color:var(--board-dim);letter-spacing:.1em;margin-top:5px}

/* match screen */
#match{position:fixed;inset:0;z-index:60;background:var(--ground);display:none;
  flex-direction:column;max-width:560px;margin:0 auto}
#match.on{display:flex}
.m-top{padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.m-feed{flex:1;overflow-y:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:0}
.ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line2);
  animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ev-min{font-family:var(--fm);font-size:12px;color:var(--muted);width:34px;flex:none;
  font-variant-numeric:tabular-nums;padding-top:1px}
.ev-tx{flex:1;font-size:13.5px;min-width:0}
.ev.goal .ev-tx{font-weight:600}
.ev.goal{background:var(--pitch-soft);margin:2px -8px;padding:8px;border-radius:8px;border-bottom:0;
  box-shadow:inset 3px 0 0 var(--pitch)}
.ev.goal.rival{background:var(--danger-soft);box-shadow:inset 3px 0 0 var(--danger)}
.ev.big .ev-tx{font-family:var(--fx);font-size:17px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.ev.card-y{border-left:3px solid #E0A02E;padding-left:8px;margin-left:-8px}
.ev.card-r{border-left:3px solid var(--danger);padding-left:8px;margin-left:-8px}
.ev.sys .ev-tx{color:var(--muted);font-size:12.5px;font-style:italic}
.m-bar{padding:9px 12px calc(9px + env(safe-area-inset-bottom,0px));background:var(--surface);
  border-top:1px solid var(--line);display:flex;gap:7px;align-items:center}
.m-bar .btn{flex:1;padding:10px 8px;font-size:13px}

/* modal */
.sheet{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;
  background:rgba(6,14,10,.55);backdrop-filter:blur(2px)}
.sheet.on{display:flex}
.sheet-in{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;
  padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:88dvh;overflow-y:auto;
  border-top:1px solid var(--line);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.sheet-h h3{font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.x{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;
  background:var(--surface2);font-size:19px;color:var(--muted);flex:none}

/* pitch view */
.pitch{position:relative;background:
   linear-gradient(180deg,#0d5c3c,#0a4a30);
  border-radius:var(--r);aspect-ratio:3/4;padding:8px;overflow:hidden;border:1px solid #0a3d28}
.pitch::before{content:"";position:absolute;inset:8px;border:1.5px solid rgba(255,255,255,.26);border-radius:4px}
.pitch::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:0;
  border-top:1.5px solid rgba(255,255,255,.26)}
.pitch .circ{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);
  border:1.5px solid rgba(255,255,255,.26);border-radius:50%}
.spot{position:absolute;transform:translate(-50%,-50%);width:66px;text-align:center;z-index:2}
.spot b{display:block;width:34px;height:34px;margin:0 auto 3px;border-radius:50%;
  background:rgba(255,255,255,.94);color:#0a3d28;font-family:var(--fm);font-weight:600;
  font-size:13px;line-height:34px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.spot.warn .camisa{filter:drop-shadow(0 0 3px #FFD98A) drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.spot.bad .camisa{filter:drop-shadow(0 0 3px #F3A79E) drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.spot span{display:block;font-size:10.5px;color:#fff;font-weight:600;line-height:1.15;
  text-shadow:0 1px 3px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spot.warn b{background:#FFD98A}
.spot.bad b{background:#F3A79E}

/* inputs */
.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface2);font-size:15px;min-height:44px}
label.fld{display:flex;flex-direction:column;gap:5px}
label.fld>span{font-family:var(--fx);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted)}
.check{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line2)}
.check input{width:20px;height:20px;flex:none;accent-color:var(--pitch)}

/* estádio da tela inicial */
.hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);
  margin:0 0 4px;background:#0A1420}
.estadio{display:block;width:100%;height:250px}
.hero-in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  padding:16px;background:linear-gradient(180deg,rgba(8,16,26,0) 26%,rgba(6,12,18,.55) 58%,rgba(5,10,15,.93) 100%)}
.hero-in .eyebrow{color:#A9BEB2;letter-spacing:.16em}
.hero-in h1{font-size:42px;letter-spacing:-.005em;color:#fff;text-transform:uppercase;
  text-shadow:0 3px 18px rgba(0,0,0,.75);margin:1px 0 5px;line-height:.95}
.hero-in p{color:#CBD8D0;font-size:12.5px;max-width:34ch;line-height:1.35}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;
  background:var(--surface2);border:1px solid var(--line);font-size:11px;color:var(--ink2)}
.chip b{font-family:var(--fm);font-weight:600;color:var(--acc)}

/* sala de troféus */
.trofeus{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:8px}
.trof{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;padding:10px 8px;
  text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.trof b{font-family:var(--fx);font-size:12px;font-weight:700;line-height:1.1;text-transform:uppercase}
.trof span{font-family:var(--fm);font-size:10.5px;color:var(--muted)}

/* faixa colorida por competição */
.compcard{border-left:4px solid var(--cc,var(--acc));padding-left:9px}

/* comemoração de gol e clube na tabela */
.board.gol{animation:golf .9s ease-out}
@keyframes golf{0%{box-shadow:0 0 0 0 rgba(255,194,51,.7)}100%{box-shadow:0 0 0 22px rgba(255,194,51,0)}}
.tb-cl{display:inline-flex;align-items:center;gap:6px}
.tbl .jgo-c{width:8px;height:15px;flex:none}
.jgo-t{display:flex;align-items:center;gap:5px}
.jgo-t.r{justify-content:flex-end}

/* escudos, camisas e cards */
.escudo{flex:none;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.camisa{display:block;margin:0 auto 1px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.pcard{display:flex;gap:12px;border-radius:14px;padding:12px;margin-bottom:12px;
  background:linear-gradient(135deg,var(--c1),var(--c2));border:1px solid var(--line);
  --c1:var(--surface2);--c2:var(--surface)}
.pcard.ouro{--c1:#F3D98B;--c2:#C79A2E;color:#2A1E05}
.pcard.prata{--c1:#DFE4E6;--c2:#A8B2B8;color:#1A2124}
.pcard.bronze{--c1:#E3C4A4;--c2:#B07E4E;color:#2A1B0C}
.pcard-l{display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;width:56px}
.pcard-ovr{font-size:30px;font-weight:600;line-height:1}
.pcard-pos{width:38px;height:19px;font-size:10px}
.pcard-r{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;gap:3px}

/* barra de números */

  border-radius:10px;overflow:hidden}

/* tabela do elenco */
.card.sec{padding:11px 12px}

.el-cab{display:grid;grid-template-columns:9px 32px 1fr 46px 26px;gap:7px;align-items:center;

  text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}

  width:100%;text-align:left;padding:5px 4px;border-bottom:1px solid var(--line2)}

.el-bar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}

<style>
/* ================================================================
   PELE BRASFOOT — graphite escuro, cor do clube como faixa,

   Ligada por padrão; o botão Opções tem o tema claro.
   ================================================================ */
html[data-pele="bf"]{

  --line:#25333A; --line2:#1E2A30;
  --shadow:none;
  --board:#0A1013; --board-ink:#FFC233; --board-dim:#6E8078;
  --ok:#3FB772; --warn:#E0A02E; --danger:#EF6A5E;
  --pitch:#2FA469; --pitch-soft:#12301F; --led:#FFC233; --led-soft:#2C2308;
}
html[data-pele="bf"] body{background:var(--ground)}
html[data-pele="bf"] #app{background:var(--ground);box-shadow:0 0 0 1px #05090B}
html[data-pele="bf"] .scr{padding:8px 8px 88px;gap:8px}

/* painel: barra de título fina, borda, zero sombra */
html[data-pele="bf"] .card,
html[data-pele="bf"] .nextg,
html[data-pele="bf"] .clubhead{border-radius:6px;border:1px solid var(--line);box-shadow:none}
html[data-pele="bf"] .card{padding:9px 10px}
html[data-pele="bf"] .card.sec{padding:0;overflow:hidden}
html[data-pele="bf"] .card.sec>.between{padding:7px 10px 6px;background:var(--surface2);
  border-bottom:1px solid var(--line);margin:0 !important}
html[data-pele="bf"] .card.sec .elenco-tab{margin:0;padding:0 4px 4px}
html[data-pele="bf"] .card.flat{background:var(--surface2)}

/* cabeçalho de seção: faixa da cor do clube com listra */
html[data-pele="bf"] .secao{background:linear-gradient(90deg,var(--acc),color-mix(in srgb,var(--acc) 55%, #0C1114));
  border-radius:5px;padding:6px 10px;border:1px solid rgba(255,255,255,.08)}
html[data-pele="bf"] .secao-t{font-size:15px;letter-spacing:.1em}

/* topo do clube: faixa de camisa mais marcada */
html[data-pele="bf"] .clubhead.cor::after{background:repeating-linear-gradient(115deg,
  rgba(255,255,255,.09) 0 10px, rgba(255,255,255,0) 10px 26px)}
html[data-pele="bf"] .ch-top{padding:9px 11px 6px 14px}
html[data-pele="bf"] .ch-id b{font-size:19px}
html[data-pele="bf"] .ch-conf{padding:0 11px 8px 14px}

/* tabelas de ponta a ponta, linha fina, número em mono */
html[data-pele="bf"] .tbl td{padding:5px 3px;font-size:12px;border-bottom:1px solid var(--line2)}
html[data-pele="bf"] .tbl th{padding:5px 3px;font-size:9.5px;background:var(--surface2)}
html[data-pele="bf"] .tbl tbody tr:nth-child(odd) td{background:rgba(255,255,255,.022)}
html[data-pele="bf"] .el-lin{min-height:31px;padding:3px 5px}
html[data-pele="bf"] .el-lin:nth-of-type(even){background:rgba(255,255,255,.022)}
html[data-pele="bf"] .el-cab{background:var(--surface2);padding:4px 5px;border-bottom:1px solid var(--line)}
html[data-pele="bf"] .el-nome b{font-size:12.5px}
html[data-pele="bf"] .plr{padding:7px 6px;min-height:42px}
html[data-pele="bf"] .plr:nth-of-type(even){background:rgba(255,255,255,.022)}
html[data-pele="bf"] .jgo:nth-child(even){background:rgba(255,255,255,.022)}

/* barrinha de números vira placar de painel */
html[data-pele="bf"] .barrinha{background:var(--line2);border-color:var(--line);border-radius:6px}
html[data-pele="bf"] .barrinha span{background:var(--surface)}
html[data-pele="bf"] .barrinha b{color:var(--led)}

/* botões: chapados, com traço */
html[data-pele="bf"] .btn{background:var(--surface2);border-color:var(--line);border-radius:5px}
html[data-pele="bf"] .btn.pri{background:var(--acc);border-color:transparent;box-shadow:inset 0 -2px 0 rgba(0,0,0,.28)}
html[data-pele="bf"] .btn.ghost{background:transparent}

html[data-pele="bf"] .seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);
  border-bottom:0;box-shadow:none}

/* barra de baixo: graphite com faixa da cor do clube */
html[data-pele="bf"] .nav{background:#111A1E;border-top:3px solid var(--acc);box-shadow:0 -8px 20px -14px #000}
html[data-pele="bf"] .nav button{color:#8CA09A}
html[data-pele="bf"] .nav button[aria-current="true"]{background:var(--acc);color:var(--acc-ink)}

/* topo fixo */
html[data-pele="bf"] .top{background:#111A1E;border-bottom:1px solid var(--line)}
html[data-pele="bf"] .sheet-in{background:var(--surface);border-top:1px solid var(--line)}
html[data-pele="bf"] .inp,html[data-pele="bf"] select.inp{background:var(--surface2);border-color:var(--line)}
html[data-pele="bf"] .pill{background:var(--surface2);border-color:var(--line)}
html[data-pele="bf"] .hero{border-color:var(--line)}
html[data-pele="bf"] .chip{background:var(--surface2);border-color:var(--line)}
html[data-pele="bf"] .trof{background:var(--surface2);border-color:var(--line)}
html[data-pele="bf"] .craque-lin{background:rgba(255,194,51,.10)}
html[data-pele="bf"] .selo-estrela{background:transparent;color:var(--led)}
html[data-pele="bf"] .num-in{background:var(--surface2);border-color:var(--line)}
</style>

.ag-res i{font-style:normal;font-size:9px;padding:1px 4px;border-radius:3px;background:var(--surface2);color:var(--muted)}
.ag-res.v i{background:rgba(46,158,102,.25);color:var(--ok)}
.ag-res.d i{background:rgba(196,58,58,.25);color:var(--danger)}
.ag-res em{color:var(--muted);font-style:normal}
/* estádio */
.est-hero{position:relative;border-radius:12px;overflow:hidden;background:#0d1a14;border:1px solid var(--line)}
.est-hero svg{display:block;width:100%;height:auto}
.est-nome{position:absolute;left:12px;bottom:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.est-nome b{display:block;font-family:var(--fx);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.est-nome span{font-size:11px;opacity:.85}

/* camisa na tela de tática (no lugar do disco) */
.spot .spot-num,.spot span.spot-num{background:transparent!important;box-shadow:none!important;border:0!important;width:44px;height:44px;
  overflow:visible!important;margin:0 auto 4px;display:grid;place-items:center}
.spot .spot-num svg{width:44px;height:44px;overflow:visible;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.spot.warn .spot-num svg{filter:drop-shadow(0 0 3px #FFD98A) drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.spot.bad .spot-num svg{filter:drop-shadow(0 0 3px #F3A79E) drop-shadow(0 2px 4px rgba(0,0,0,.45))}
.spot.alvo-drop .spot-num{transform:scale(1.18)}
.spot.alvo-drop .spot-num svg{filter:drop-shadow(0 0 4px #FFC233) drop-shadow(0 4px 12px rgba(0,0,0,.5))}

/* ---------- elenco (tabela) ---------- */
.el-cab2{display:grid;grid-template-columns:34px 1fr 34px 58px 34px;gap:7px;padding:6px 2px 2px;font-family:var(--fx);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line2)}
.el-cab2 span:nth-child(3),.el-cab2 span:nth-child(4){text-align:center}
.el-row{display:grid;grid-template-columns:34px 1fr 34px 58px 34px;gap:7px;align-items:center;width:100%;padding:6px 2px;
  border-bottom:1px solid var(--line2);text-align:left;color:var(--ink);background:transparent;min-height:50px}
.el-row:last-child{border-bottom:0}
.el-row.les .el-info b{color:var(--muted)}
.el-camisa{width:34px;height:34px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
.el-info{min-width:0;display:flex;flex-direction:column;gap:1px}
.el-info b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.el-info>span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.el-info .pos{font-size:8px;padding:0 4px;line-height:1.6}
.el-les{font-style:normal;font-family:var(--fm);font-size:9px;color:#fff;background:var(--danger);border-radius:3px;padding:0 4px;line-height:1.5}
.el-ovr{font-family:var(--fm);font-weight:700;font-size:16px;text-align:center}
.el-en{display:flex;flex-direction:column;align-items:center;gap:3px}
.el-en b{font-family:var(--fm);font-size:11px}
.el-en .meter{width:50px;min-width:0;flex:none;height:5px}
/* A coluna ENERGIA da tabela do elenco aparecia VAZIA: a regra .el-en acima é
   flex com align-items:center, e a barrinha (.el-bar) não tem largura própria —
   então ela encolhia para 0px e não dava pra ver nada. Aqui ela ocupa a coluna
   inteira e ganha o número do lado, que é o que se quer ler mesmo. */
.el-lin .el-en{display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:2px}
.el-lin .el-en>b{font-family:var(--fm);font-size:10.5px;line-height:1;text-align:right;font-weight:600}
.el-lin .el-bar{width:100%;min-width:0}
.el-row.craque{background:linear-gradient(90deg,rgba(242,194,48,.16),rgba(242,194,48,.04))}
.el-row.craque .el-info>b{color:var(--led)}

/* ---------- mercado ---------- */
.mk-row{display:grid;grid-template-columns:28px 1fr auto 34px;gap:8px;align-items:center;width:100%;padding:7px 2px;
  border-bottom:1px solid var(--line2);text-align:left;color:var(--ink);background:transparent;min-height:48px}
.mk-row:last-child{border-bottom:0}
.mk-row>.pos{justify-self:center}
.mk-clube{display:grid;place-items:center}
.mk-n{min-width:0;display:flex;flex-direction:column;gap:1px}
.mk-n b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.mk-n>span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.mk-n .pos{font-size:8px;padding:0 4px;line-height:1.6}
.mk-tag{font-style:normal;font-family:var(--fx);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:1px 5px;border-radius:999px;
  background:var(--surface2);color:var(--muted)}
.mk-tag.a{background:var(--led-soft);color:var(--led)}
.mk-tag.g{background:rgba(46,158,102,.2);color:var(--ok)}
.mk-preco{font-family:var(--fm);font-size:11.5px;white-space:nowrap;text-align:right;min-width:60px;color:var(--ink2)}
.mk-row.craque{background:linear-gradient(90deg,rgba(242,194,48,.14),rgba(242,194,48,.03))}
.mk-row.craque .mk-n>b{color:var(--led)}
.mk-filtros{display:grid;grid-template-columns:1fr 1.3fr;gap:6px;margin-bottom:6px}
.seg.mini{padding:3px;gap:2px}
.seg.mini button{padding:6px 4px;font-size:10.5px;min-height:32px;letter-spacing:.02em}
.seg.pos-seg{margin-bottom:0}
.seg.pos-seg button{flex:1 1 0;min-width:0}
.barrinha span.led b{color:var(--led)}

/* ---------- festa de gol ---------- */
.gol-flash{overflow:hidden}
.gol-onda{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.75);
  transform:translate(-50%,-50%) scale(0);opacity:0}
.gol-flash.on .gol-onda{animation:golOnda 1.1s ease-out forwards}
@keyframes golOnda{0%{transform:translate(-50%,-50%) scale(0);opacity:.9}100%{transform:translate(-50%,-50%) scale(12);opacity:0}}
.gol-papel{position:absolute;left:50%;top:50%;border-radius:2px;opacity:0;transform:translate(-50%,-50%)}
.gol-flash.on .gol-papel{animation:golPapel 1.7s var(--d,0ms) cubic-bezier(.15,.8,.3,1) forwards}
@keyframes golPapel{0%{opacity:0;transform:translate(-50%,-50%) rotate(0)}12%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)*2.2),calc(-50% + var(--dy)*2.2 + 70px)) rotate(var(--rot))}}
.gol-escudo{display:block;margin-bottom:4px;animation:golPop .5s cubic-bezier(.2,1.4,.4,1) both;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.gol-txt{display:flex;gap:1px;font-size:54px}
.gol-txt b{display:inline-block;animation:golLetra .55s cubic-bezier(.2,1.5,.4,1) both}
.gol-txt b:nth-child(2){animation-delay:.05s}.gol-txt b:nth-child(3){animation-delay:.1s}
.gol-txt b:nth-child(4){animation-delay:.15s}.gol-txt b:nth-child(5){animation-delay:.2s}
@keyframes golLetra{from{transform:translateY(40px) scale(.4);opacity:0}to{transform:none;opacity:1}}
.gol-placar{font-family:var(--fm);font-size:12px;color:#fff;opacity:.9;margin-top:6px;background:rgba(0,0,0,.35);padding:2px 9px;border-radius:999px;
  animation:golPop .5s .3s cubic-bezier(.2,1.4,.4,1) both}
.bc-gols b.pula{animation:placarPula .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes placarPula{0%{transform:scale(1)}35%{transform:scale(1.7);color:#FFC233}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){ .gol-papel,.gol-onda{display:none} }

@keyframes passeSome{0%{opacity:.75}60%{opacity:.45}100%{opacity:0}}

/* ---------- qualidades do jogador ---------- */
.atr-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.atr{display:grid;grid-template-columns:1fr 46px 22px;align-items:center;gap:6px;font-size:10.5px}
.atr-n{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atr.chave .atr-n{color:var(--ink2);font-weight:600}
.atr-b{height:5px;border-radius:3px;background:var(--line2);overflow:hidden}
.atr-b i{display:block;height:100%;border-radius:3px}
.atr b{font-family:var(--fm);font-size:11px;text-align:right}
.el-info i.q{font-style:normal;font-family:var(--fm);font-size:9px;letter-spacing:.02em;color:var(--ink2);
  background:var(--surface2);border-radius:3px;padding:0 4px;margin-left:4px}
@media (max-width:360px){ .atr-grid{grid-template-columns:1fr} }

/* o campo da tática é menor: a camisa tem que caber na casinha, não transbordar */
#pitchTac .spot-num, #pitchTac span.spot-num{width:38px;height:38px}
#pitchTac .spot-num svg{width:38px;height:38px}

/* arrastar no vestiário: o vulto que segue o dedo e o alvo aceso */
.vg-fantasma{position:fixed;transform:translate(-50%,-140%);z-index:9999;pointer-events:none;
  background:var(--acc,#0B6B45);color:#fff;font:700 12px/1 var(--fm,sans-serif);
  padding:7px 11px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.45);white-space:nowrap}
.vg-alvo{outline:2px solid #FFC233!important;outline-offset:2px;border-radius:8px}
g.vg-alvo{outline:none}
g.vg-alvo .cam-c,g.vg-alvo path:first-of-type{filter:drop-shadow(0 0 3px #FFC233) drop-shadow(0 0 6px #FFC233)}
.vg-peca,.vg-res{touch-action:none}

/* o anel do craque pulsa de leve, pra achar ele em campo */
.bot-craque{animation:anelCraque 2.4s ease-in-out infinite}
@keyframes anelCraque{0%,100%{opacity:.95}50%{opacity:.45}}

/* o botão: número legível, brilho em quem está com a bola */
.bot-num{font-size:2.7px!important;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:.45px}
.bot.ativo .bot-num{font-size:3px!important}
.bot.ativo .bot-c{filter:drop-shadow(0 0 1.4px #fff) drop-shadow(0 0 3px rgba(255,216,107,.9))}
.bot-sombra{fill:rgba(0,0,0,.3)}
#bola{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.5))}

/* ---- fase de grupos: cada grupo é um bloco, com escudo e quem passa marcado.
   Antes eram tabelinhas coladas, só sigla, sem saber onde um grupo terminava. */
.grupo{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px;background:var(--surface)}
.grupo:last-of-type{margin-bottom:6px}
.grupo-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:6px 9px;background:var(--surface2);border-bottom:1px solid var(--line)}
.grupo-cab b{font-family:var(--fx);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.grupo-cab .xs{font-family:var(--fm);letter-spacing:.18em}
.grupo-lin{display:flex;align-items:center;gap:7px;padding:5px 9px;border-bottom:1px solid var(--line)}
.grupo-lin:last-child{border-bottom:0}
.grupo-lin.passa{box-shadow:inset 3px 0 0 var(--ok)}
.grupo-lin.me{background:var(--acc-soft)}
.grupo-lin.me .grupo-nome{font-weight:700}
.grupo-pos{font-family:var(--fm);font-size:11px;color:var(--muted);width:12px;text-align:right;flex:none}
.grupo-nome{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grupo-nums{display:flex;gap:7px;align-items:center;font-family:var(--fm);font-size:11px;color:var(--muted);flex:none}
.grupo-nums b{font-size:13px;color:var(--text);width:16px;text-align:right}
.grupo-nums i{font-style:normal;width:12px;text-align:right}

/* ---- próximos jogos: escudo e nome, não uma lista de siglas ---- */
.jogo-lin{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px solid var(--line)}
.jogo-lin:last-child{border-bottom:0}
.jogo-lin.me{background:var(--acc-soft);border-radius:8px;border-bottom-color:transparent}
.jogo-lado{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.jogo-lado.casa{justify-content:flex-end}
.jogo-lado b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jogo-vs{flex:none;width:58px;text-align:center;font-family:var(--fm);font-size:10px;color:var(--muted)}
@media(max-width:380px){ .jogo-lado b{font-size:11.5px} .jogo-vs{width:48px} .grupo-nums{gap:5px} }


/* ---- classificação com leitura de verdade: zonas visíveis, fronteira marcada
   e cabeçalho firme. Estava tudo tão claro que a tabela parecia apagada. ---- */
.tbl tbody tr.z-lib td,.tbl tbody tr.z-lib:nth-child(odd) td{background:rgba(46,158,102,.20)}
.tbl tbody tr.z-sul td,.tbl tbody tr.z-sul:nth-child(odd) td{background:rgba(58,132,196,.16)}
.tbl tbody tr.z-reb td,.tbl tbody tr.z-reb:nth-child(odd) td{background:rgba(196,58,58,.20)}
.tbl tbody tr.zfim td{border-bottom:2px solid var(--ink)}
.tbl thead th{background:var(--surface2);border-bottom:2px solid var(--line);
  color:var(--ink);padding-top:8px;padding-bottom:8px}
.tbl tr.me td{background:var(--acc-soft)}
.tbl tr.me td:first-child{box-shadow:inset 4px 0 0 var(--acc)}
.zn{width:4px;height:16px}
.zn-leg{display:flex;flex-wrap:wrap;gap:12px;padding:8px 2px 2px;font-size:10.5px;color:var(--muted)}
.zn-leg span{display:inline-flex;align-items:center;gap:5px}
.zn-leg .zn{margin-right:0}
/* as abas de competição precisavam de estado ligado mais forte */
.seg button[aria-pressed="true"]{box-shadow:inset 0 -3px 0 var(--acc)}


/* navegação de fase do mata-mata */
.mm-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mm-nav .btn{min-width:40px}
.mm-nome{flex:1;text-align:center;font-family:var(--fx);font-size:13px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase}
.mm-nome i{display:block;font-style:normal;font-family:var(--fm);font-size:9.5px;
  font-weight:400;letter-spacing:.08em;color:var(--muted);text-transform:none;margin-top:1px}


/* ================= VERSÃO DE COMPUTADOR =================
   No celular o jogo é uma coluna só, e era isso em qualquer tela: no monitor
   virava uma tira estreita no meio com preto dos dois lados. Aqui, a partir de
   1000px, a largura passa a ser usada — e nada disso vale no celular. */
@media (min-width:1000px){

  /* --- telas de gestão: duas colunas, como um jornal --- */
  #app{max-width:980px}
  .top, .nav{max-width:980px}
  /* .scr é flex no celular, e flex ignora columns — no PC vira bloco */
  /* .scr é flex no celular, e flex ignora columns — no PC vira bloco.
     .scr.on tem display:flex com mais peso, então precisa vir junto. */
  .scr, .scr.on{display:block; columns:2; column-gap:16px; padding:14px 18px 96px}
  .scr:not(.on){display:none}
  /* sem forçar display aqui: alguns cards são grid/flex por dentro e quebravam */
  .scr > *{break-inside:avoid; -webkit-column-break-inside:avoid; page-break-inside:avoid;
           margin-bottom:14px; width:100%}
  /* o cabeçalho do clube e as abas ficam inteiros no topo; o resto se divide */
  .scr > .card.full{column-span:all}
  /* as abas não precisam de 1100px de largura */
  .seg{max-width:620px}
  /* a tabela numa coluna só: esticada em 1100px as colunas ficavam longe do
     nome do clube e não dava para ler a linha */
  .tbl td, .tbl th{padding-left:5px;padding-right:5px}
  .tbl td:nth-child(2){max-width:none}

  /* --- a partida: campo grande à esquerda, rodada e narração à direita.
     display:contents faz os filhos do m-top entrarem neste mesmo grid, e aí
     dá para pôr a narração na coluna de fora em vez de uma tirinha no pé. --- */
  #match{max-width:1280px}
  /* O `.on` aqui é obrigatório. Sem ele esta regra (id + classe) ganhava do
     `#match{display:none}` e a tela da partida FICAVA NA FRENTE de tudo depois
     de fechada: no computador o jogo terminava, o botão "Encerrar rodada"
     continuava ali e não respondia a nada, porque a partida já tinha acabado
     por baixo. Era impossível continuar a rodada sem recarregar. */
  #match.bcast.on{
    display:grid;
    grid-template-columns:minmax(0,1.72fr) minmax(340px,1fr);
    grid-template-rows:auto auto 1fr auto auto;
    grid-template-areas:
      "est    painel"
      "board  painel"
      "campo  painel"
      "stats  painel"
      "bar    painel";
    column-gap:0;
  }
  #match.bcast .m-top{display:contents}
  #match.bcast .m-bar{grid-area:bar; max-width:none; margin:0}
  #match.bcast .bc-est{grid-area:est}
  #match.bcast #m-painel{grid-area:painel; border-left:1px solid #1B262A}
  #match.bcast #m-board{grid-area:board}
  #match.bcast #m-campo{grid-area:campo}
  #match.bcast #m-stats{grid-area:stats}
  /* a lista da rodada cabe inteira: não precisa mais rolar */
  /* a lista fica do tamanho do conteúdo: o resto da coluna é da narração.
     Com height:100% ela empurrava a narração para fora da tela. */
  #match.bcast .bc-rodada{background:transparent;border-bottom:0;height:auto;
    flex:0 1 auto; min-height:0; max-height:66%; display:flex; flex-direction:column}
  #match.bcast .bc-rodada .bc-lista{overflow-y:auto; min-height:0}
  /* A narração ocupava uma tirinha de 150px e sobravam 450px de preto embaixo
     da lista da rodada. Na coluna da direita ela toma o espaço que existe. */
  #match.bcast #m-painel #m-feed{max-height:none; flex:1 1 auto; overflow-y:auto; min-height:0}
  #match.bcast .bc-lista{max-height:none;-webkit-mask-image:none;mask-image:none;padding:0 10px 8px}
  #match.bcast .bc-jogo{padding-top:7px;padding-bottom:7px}
  #match.bcast .bc-t{font-size:13px}
  /* campo maior e placar mais presente */
  /* com a arquibancada a figura ficou mais alta que a linha do grid e a parte
     de baixo era cortada: agora ela cabe inteira e fica centrada */
  #match.bcast .campo-wrap{padding:0 14px;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
  #match.bcast .campo{max-height:100%;width:auto;max-width:100%}
  #match.bcast .bc-gols b{font-size:44px}
  #match.bcast .bc-time{font-size:17px}
  /* a narração deixa de ser uma tirinha e vira um painel de verdade, na lateral */
  /* a narração mora dentro da coluna da direita (o JS a move para lá) */
  #match.bcast #m-painel{display:flex; flex-direction:column; min-height:0}
  #match.bcast #m-painel .bc-rodada{flex:0 0 auto}
  #match.bcast #m-painel .m-feed{flex:1 1 auto; max-height:none; min-height:120px;
    padding:10px 14px; border-top:1px solid #1B262A; border-left:0}
  #match.bcast .ev-tx{font-size:13.5px}
  /* placar grande, que é o que se olha de longe */
  #match.bcast .bc-gols{font-size:40px}
  #match.bcast .bc-gols s{font-size:22px}
}

@media (min-width:1400px){
  #app{max-width:1120px}
  .top, .nav{max-width:1120px}
  #match{max-width:1440px}
}


/* ---------- No radar ----------
   "quase nem vi isso": era texto cinza de 12px sem peso nenhum. As notícias
   são o que conta a história da temporada — elas têm que puxar o olho. */
.card.radar{border-left:3px solid var(--acc)}
.card.radar .eyebrow{color:var(--acc);font-size:11px;letter-spacing:.14em}
.news{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line2)}
.news:last-child{border-bottom:0}
.news .sm{font-size:13.5px;line-height:1.35}
.news.led .sm, .news.good .sm{font-weight:600}
.news.led i{background:var(--acc)}
.news.good i{background:var(--ok)}
.news.bad i{background:var(--danger)}
.news i{width:3px;align-self:stretch;border-radius:2px;background:var(--line);flex:none;margin-top:1px}

/* ---------- lista de carreiras salvas na tela inicial ---------- */
.saves{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.save-lin{display:flex;align-items:stretch;gap:6px}
.save-go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left;color:inherit}
.save-go:disabled{opacity:.7}
.save-n{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.save-n b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-n span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

   força e a barra de energia de cada jogador, e os lances no meio. */

   inteiros — espremidos numa coluna de 78px os nomes viravam "Lucas B..." */
.vg-duplo{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 4px;align-items:start}
.vg-duplo > .vg-lances{grid-column:1/-1;order:3;
  background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;
  display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.vg-esc{background:var(--surface2);border:1px solid var(--line);border-radius:9px;overflow:hidden;min-width:0}
.vg-esc.meu{border-color:var(--acc)}
.vg-esc-cab{display:flex;align-items:center;gap:5px;padding:5px 6px;background:var(--surface);
  border-bottom:1px solid var(--line)}
.vg-esc-cab b{flex:1;min-width:0;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vg-esc-cab i{font-style:normal;font-family:var(--fm);font-size:9px;color:var(--muted)}
.vg-el{display:flex;align-items:center;gap:4px;padding:3px 6px;border-bottom:1px solid var(--line2);min-width:0}
.vg-el:last-child{border-bottom:0}
.vg-el b{flex:1;min-width:0;font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vg-el .pos{font-size:7px;padding:0 3px;line-height:1.6;flex:none}
.vg-el.ca{box-shadow:inset 2px 0 0 #F2C230}
.vg-el.cv{box-shadow:inset 2px 0 0 var(--danger);opacity:.55}
.vg-ef{display:flex;align-items:center;gap:3px;flex:none}
.vg-ef s{text-decoration:none;font-family:var(--fm);font-size:10px;font-weight:600;width:16px;text-align:right}
.vg-bar{display:block;width:22px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.vg-bar i{display:block;height:100%;border-radius:2px}
.vg-bola{font-style:normal;font-size:9px;color:var(--ok);flex:none}
.vg-saiu{padding:4px 6px;font-size:9px;color:var(--muted);border-top:1px solid var(--line2)}
.vg-lances{display:flex;flex-direction:column;gap:3px;padding:2px 0}
.vg-lance{display:flex;align-items:center;gap:3px;font-size:9.5px;min-width:0}
.vg-lance.a{flex-direction:row-reverse;text-align:right}
.vg-lance b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.vg-min2{font-family:var(--fm);font-size:8.5px;color:var(--muted);flex:none}

@media (max-width:400px){

  .vg-campo{max-height:44vh}

/* ===== TRANSMISSÃO — bola, jogador com a posse, câmera =====
   Veio do trabalho do ChatGPT (v7) e ficou. Duas coisas mudaram aqui:
   a câmera deixou de ser transform de <g> do SVG (o navegador redesenhava
   217 elementos a cada quadro: 59 fps caíam pra 37 no celular fraco) e
   passou a ser transform de uma <div>, que a GPU compõe sozinha; e o botão
   de alternar câmera saiu de cima do campo, onde tapava um jogador. */
#bola{transition:transform .38s cubic-bezier(.3,.02,.2,1);filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.52))}
#bola-corpo{transform-box:fill-box;transform-origin:center;transition:transform .24s ease-out}
#bola-sombra{transform-box:fill-box;transform-origin:center;transition:transform .24s ease-out,opacity .24s ease-out}
#bola.rolando #bola-corpo{animation:bolaGira var(--giro-bola,.42s) linear infinite}
#bola.giro-esq #bola-corpo{animation-direction:reverse}   /* bola andando pra esquerda gira pra esquerda */
#bola.voo #bola-corpo{transform:translateY(-3px) scale(1.22)}
#bola.voo #bola-sombra{transform:scaleX(1.55);opacity:.18}
@keyframes bolaGira{to{rotate:360deg}}
.bot{transform-box:fill-box;transform-origin:center}
/* Quem está com a bola e quem está em cima dele aparecem — mas SEM animação
   infinita e SEM drop-shadow. Medido no celular fraco: com os dois, a partida
   ia de 18ms para 30ms por quadro e de 5 para 51 quadros lentos; o anel branco
   estático diz a mesma coisa e custa zero. */
.bot.com-posse .bot-in{transform:scale(1.07)}
.bot.pressao .bot-in{transform:scale(1.05)}
.bot.com-posse .bot-c{stroke:#fff;stroke-width:1.1}
.bot.pressao .bot-c{stroke:rgba(255,255,255,.55);stroke-width:.75}

/* A câmera: uma <div> que a GPU move. Nada dentro dela é redesenhado. */
.cam-box{transform-origin:50% 50%;will-change:transform;
  transition:transform .62s cubic-bezier(.18,.72,.22,1);backface-visibility:hidden}
#match.bcast .cam-box{display:flex;align-items:center;justify-content:center;max-height:100%;min-height:0;width:100%}
/* O invólucro da câmera devolveu altura ao campo (de 32% para 50% da tela do
   celular) — mas aí ele espremia a narração, que passava a mostrar meia linha.
   38vh deixa o campo grande e a última fala do jogo inteira. */
@media (max-width:700px){ #match.bcast .campo-wrap{max-height:38vh} }

/* O botão vive na linha de estatística, não em cima do gramado. */
.camera-toggle{appearance:none;padding:4px 9px;border:1px solid rgba(255,255,255,.18);border-radius:999px;
  background:rgba(255,255,255,.05);color:var(--muted);font:600 10px/1.1 var(--fx),sans-serif;
  letter-spacing:.02em;cursor:pointer;transition:background .2s,border-color .2s,color .2s;flex:none}
.camera-toggle[aria-pressed="true"]{background:rgba(15,91,57,.55);border-color:rgba(255,211,105,.5);color:#FFF4D4}
.camera-toggle:focus-visible{outline:2px solid #FFC233;outline-offset:2px}

@media(prefers-reduced-motion:reduce){
  #bola-corpo,#bola-sombra,.bot-in{transition:none!important;animation:none!important}
  .cam-box{transition:none!important}
  .camera-toggle{transition:none}
}

/* ===== câmera de TV: inclinação, luz e o placar reagindo ao gol ===== */
#match.bcast #m-campo{
  position:relative;isolation:isolate;perspective:1050px;
  background:
    radial-gradient(ellipse at 50% 8%,rgba(185,220,205,.13),transparent 48%),
    linear-gradient(180deg,#17272b 0%,#0b1518 48%,#081013 100%);
}
#match.bcast #m-campo::before{
  content:"";position:absolute;z-index:0;inset:0;pointer-events:none;
  background:
    linear-gradient(112deg,transparent 0 17%,rgba(220,245,231,.07) 22%,transparent 30%),
    linear-gradient(248deg,transparent 0 65%,rgba(220,245,231,.06) 72%,transparent 80%),
    radial-gradient(ellipse at 50% 100%,rgba(0,0,0,.02),rgba(0,0,0,.46) 90%);
}

  position:relative;z-index:1;
  transform:perspective(1050px) rotateX(12deg) scale(1.045,1.075);
  transform-origin:50% 56%;

     inteiro (419px de vetor) a cada quadro. Cor fica, sombra sai. */

}

}

function fit(playerPos, slotPos){
  if(slotPos==='GOL') return playerPos==='GOL'?1:.42;
  if(playerPos==='GOL') return .45;
  return (FIT[slotPos] && FIT[slotPos][playerPos]) || .70;
}

const ELENCO_BASE = ['GOL','GOL','GOL','ZAG','ZAG','ZAG','ZAG','LAT','LAT','LAT','LAT','VOL','VOL','VOL','MEI','MEI','MEI','PON','PON','PON','ATA','ATA','ATA'];

let _pid = 1;

function novoJogador(clubRep, posForce, ageForce){
  const pos = posForce || pick(ELENCO_BASE);
  const idade = ageForce || clamp(Math.round(gauss(25.5,4.2)),17,37);
  let base = 50 + clubRep*3.7;                     // 53.7 .. 68.5
  let ovr = clamp(Math.round(gauss(base, 5.8)), 38, 90);
  // curva de idade: jovem tende a ser pior agora, mais potencial
  if(idade<21) ovr = clamp(ovr - ri(3,9), 36, 78);
  if(idade>33) ovr = clamp(ovr - ri(0,4), 36, 88);
  const pot = clamp(ovr + (idade<24 ? ri(3,16) : idade<28 ? ri(0,5) : 0), ovr, OVR_MAX_INVENTADO);
  const nome = nomeAleatorio();
  return {
    id:'p'+(_pid++), nome, pos, idade, ovr, pot,
    forma: ri(45,75), moral: ri(50,80), energia: ri(85,100),
    salario: Math.round(Math.pow(ovr/10,2.5)*950/1000)*1000,   // mensal R$
    valor:  Math.round(Math.pow(ovr/10,3.4)*(idade<27?1.25:idade<31?.9:.5)*1000)*100,
    contrato: ri(1,4),         // temporadas restantes
    gols:0, assist:0, jogos:0, ca:0, cv:0, notaSoma:0, lesao:0
  };
}

function gerarElenco(clubRep){
  const arr = ELENCO_BASE.map(p=>novoJogador(clubRep,p));
  // garante 1 craque por elenco forte
  if(clubRep>=4){ const a=arr.filter(p=>p.pos!=='GOL'); const c=pick(a); c.ovr=clamp(c.ovr+ri(6,12),50,OVR_MAX_INVENTADO); c.pot=Math.max(c.pot,c.ovr); }
  return arr;
}

function gerarCalendario(ids){
  const t = ids.slice();
  if(t.length%2) t.push(null);
  const n = t.length, rodadas = [];
  let arr = t.slice();
  for(let r=0;r<n-1;r++){
    const jogos=[];
    for(let i=0;i<n/2;i++){
      const a=arr[i], b=arr[n-1-i];
      if(a===null||b===null) continue;
      jogos.push(r%2===0?{h:a,a:b}:{h:b,a:a});
    }
    rodadas.push(jogos);
    arr = [arr[0]].concat([arr[n-1]], arr.slice(1,n-1));
  }
  const returno = rodadas.map(j=>j.map(g=>({h:g.a,a:g.h})));
  return rodadas.concat(returno);
}

function criarLiga(opt){
  const seed = opt.seed || (Date.now()+''+Math.floor(Math.random()*1e6));
  R.r = rng(seed); _pid = 1;
  const size = opt.size || 20;
  const base = CLUBS.slice(0, size);
  const clubs = base.map((c,i)=>({
    id:'c'+i, nome:c.n, sigla:c.s, cidade:c.c, uf:c.uf, rep:c.rep,
    cor:c.cor, cor2:c.cor2,
    caixa: 2500000 + c.rep*3200000 + ri(-400000,900000),
    estadio: 12000 + c.rep*11000 + ri(-2000,4000),
    torcida: c.rep,
    tactics: null, manager:null
  }));
  const squads = {};
  clubs.forEach(c=>{ squads[c.id] = gerarElenco(c.rep); });
  const fixtures = gerarCalendario(clubs.map(c=>c.id));
  return {
    v:1, seed, code:opt.code||null, nome:opt.nome||'Campeonato Nacional',
    modo: opt.modo||'solo', size, temporada: 2026,
    clubs, squads, fixtures, resultados:{}, rodada:1,
    managers:{},                       // clubId -> {id,nome}
    ordens:{},                         // "r3_c2" -> ordens
    noticias:[], historico:[], meuClube:null, meuId:null,
    treino:'equilibrado', diretoria:null, temporadaFim:false
  };
}

function _clubesDaLiga(k){
  const L2=LIGAS_EUROPA[k];
  return L2.tab.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split('|');
    return {id:p[0], n:p[1], s:p[2], c:p[3], uf:L2.pais, cor:p[4], cor2:p[5],
            niv:parseInt(p[6],10), est:parseInt(p[7],10), tor:parseInt(p[8],10),
            comp:'inter', liga:k};
  });
}

const EUROPEUS = Object.keys(LIGAS_EUROPA).reduce((a,k)=>a.concat(_clubesDaLiga(k)), []);

const LIGA_DO_CLUBE = {};
EUROPEUS.forEach(c=>{ LIGA_DO_CLUBE[c.id]=c.liga; });

function clubesDaLigaEuropeia(k){ return EUROPEUS.filter(c=>c.liga===k).map(c=>c.id); }

/* Clube do Brasil = UF brasileira. O filtro "Brasil" do mercado perguntava só
   "é europeu?", então Boca Juniors, River e companhia caíam no balde do Brasil
   e apareciam na lista de jogadores brasileiros. */
const UF_ESTRANGEIRA = {ARG:1, URU:1, PAR:1, CHI:1, COL:1, EQU:1, PER:1, BOL:1, VEN:1, MEX:1, USA:1};
function ehBrasileiro(cid){
  const c=CLUBE_POR_ID[cid];
  if(!c) return false;
  if(UF_EUROPA[c.uf] || c.liga) return false;
  return !UF_ESTRANGEIRA[c.uf];
}
function ehDeFora(cid){ return !ehBrasileiro(cid); }

function carregarEuropa(L){
  EUROPEUS.forEach(c=>{
    if(!L.clubs.find(x=>x.id===c.id)) L.clubs.push(clubeJogo(c,L));
    if(!L.squads[c.id] || !L.squads[c.id].length){
      L.squads[c.id] = ELENCOS_EUROPA[c.id]
        ? parseElenco(ELENCOS_EUROPA[c.id], L.seed+'-'+c.id)
        : elencoGerado(c.id, c.niv, L.seed);
    }
    const cl=L.clubs.find(x=>x.id===c.id);
    // caixa europeu proporcional ao tamanho do clube: o City compra o que quiser,
    // o Heidenheim não. Em euro, na prática — vale mais que o nosso.
    cl.caixa = Math.round(Math.pow(Math.max(4, c.niv-66), 2) * 1200000);
    cl.tetoFolha = Math.round((L.squads[c.id]||[]).reduce((s,p)=>s+p.salario,0)*1.35);
  });
}

let _poolCache={};

function _pool(r, campo){
  const k=r+campo;
  if(!_poolCache[k]) _poolCache[k]=POOL_NOMES[r][campo].split(' ').filter(Boolean);
  return _poolCache[k];
}

function nomeRegional(uf){
  const r=REGIAO_UF[uf];
  if(!r) return nomeAleatorio();                 // clube brasileiro: banco daqui
  const n=_pool(r,'n'), s=_pool(r,'s');
  const x=rnd();
  if(r==='hi' && x<0.16) return pick(n)+' '+pick(s)+' '+pick(s);
  if(r==='pt' && x<0.12) return pick(n)+' '+pick(s)+' '+pick(s);
  return pick(n)+' '+pick(s);
}

// teto do jogador inventado: acima disso, só gente real
const OVR_MAX_INVENTADO = 86;

/* O teto de 86 valia só na hora de criar o jogador. A evolução não sabia dele:
   o potencial de um inventado ia até 91, então depois de uma temporada já havia
   89 jogadores de 87+ que não existem, e na quinta temporada 268 — era o
   "vários jogadores que não existem" que o Rafael viu.
   Agora o teto vale sempre, e quem é real é descoberto pelo nome nos elencos de
   verdade. Assim vale também pra carreira que já estava salva, sem migração. */
let _NOMES_REAIS = null;
function ehJogadorReal(nome){
  if(!nome) return false;
  if(_NOMES_REAIS === null){
    _NOMES_REAIS = Object.create(null);
    const junta = o => { if(!o) return;
      Object.keys(o).forEach(k=>{
        String(o[k]||'').split(';').forEach(linha=>{
          const n = linha.split('|')[0].trim();
          if(n) _NOMES_REAIS[n] = 1;
        });
      });
    };
    try{ junta(typeof ELENCOS_REAIS!=='undefined' ? ELENCOS_REAIS : null); }catch(e){}
    try{ junta(typeof ELENCOS_EUROPA!=='undefined' ? ELENCOS_EUROPA : null); }catch(e){}
  }
  return !!_NOMES_REAIS[String(nome).trim()];
}

// até onde este jogador pode chegar de força
function tetoDeForca(p){
  if(!p) return OVR_MAX_INVENTADO;
  if(p.real === undefined) p.real = ehJogadorReal(p.nome) ? 1 : 0;
  return p.real ? 92 : OVR_MAX_INVENTADO;
}

function elencoGerado(clubId, niv, seed){
  const r0 = R.r; R.r = rng(seed+'-'+clubId);
  const c = (typeof CLUBE_POR_ID!=='undefined') ? CLUBE_POR_ID[clubId] : null;
  const uf = c ? c.uf : '';
  const usados = {};
  const arr = ELENCO_BASE.map(pos=>{
    const idade = clamp(Math.round(gauss(25.8,4.3)),17,38);
    /* Jogador inventado não passa de 86. Antes ia até 90 e o mercado ficava
       cheio de "Harvey Johnson, 90" ao lado do Haaland — o topo do mundo tem
       que pertencer a quem existe de verdade. */
    let ovr = clamp(Math.round(gauss(niv, 4.0)), 42, Math.min(OVR_MAX_INVENTADO, niv+7));
    if(idade<21) ovr = clamp(ovr-ri(2,7), 42, 84);
    if(idade>34) ovr = clamp(ovr-ri(0,3), 42, OVR_MAX_INVENTADO);
    let nome = nomeRegional(uf); let g=0;
    while(usados[nome] && g++<12) nome = nomeRegional(uf);
    usados[nome]=1;
    const pot = clamp(ovr + (idade<20?ri(8,20):idade<22?ri(6,15):idade<25?ri(3,9):idade<28?ri(0,4):0), ovr, OVR_MAX_INVENTADO);
    return {id:'p'+(_pid++), nome, pos, idade, ovr, pot, ovrF:ovr,
      forma:ri(45,72), moral:ri(55,80), energia:100,
      salario:salarioDe(ovr,idade), valor:valorDeMercado(ovr,idade),
      contrato:ri(2,5), gols:0,assist:0,jogos:0,ca:0,cv:0,notaSoma:0,lesao:0,aVenda:false};
  });
  const d = pick(arr.filter(p=>p.pos!=='GOL'));
  if(d){ d.ovr = clamp(d.ovr+ri(3,7), 45, Math.min(OVR_MAX_INVENTADO, niv+10)); d.ovrF=d.ovr; d.pot=Math.max(d.pot,d.ovr);
         d.valor=valorDeMercado(d.ovr,d.idade); d.salario=salarioDe(d.ovr,d.idade); }
  R.r = r0;
  return arr;
}
